planation":"群众路线是党的生命线和根本工作路线，内容是一切为了群众、一切依靠群众，从群众中来、到群众中去。","pitfall":"人民立场是根本政治立场，群众路线是把这一立场落实到工作中的路线。题目出现“生命线、工作路线”应对应群众路线。","originalAnswer":["A"]},{"number":3,"answer":["B"],"stem":"（ ）是新时代坚持和发展中国特色社会主义的根本立场，是贯穿党治国理政全部活动的一条红线。","options":[{"key":"A","text":"把马克思主义基本原理与中国实际相结合"},{"key":"B","text":"坚持以人民为中心"},{"key":"C","text":"坚持和发展中国特色社会主义"},{"key":"D","text":"“五位一体”总体布局"}],"id":"chapter4-single-03","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"以人民为中心的根本立场","explanation":"坚持以人民为中心是新时代坚持和发展中国特色社会主义的根本立场，贯穿治国理政活动，体现发展的目的和价值判断。","pitfall":"“两个结合”属于理论创新路径，“五位一体”属于总体布局，坚持和发展中国特色社会主义是鲜明主题，不能与根本立场混用。","originalAnswer":["B"]},{"number":4,"answer":["B"],"stem":"中国共产党区别于其他政党的显著标志是（ ）。","options":[{"key":"A","text":"深化改革"},{"key":"B","text":"人民立场"},{"key":"C","text":"促进高质量发展"},{"key":"D","text":"实事求是"}],"id":"chapter4-single-04","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"人民立场这一显著标志","explanation":"人民立场是中国共产党的根本政治立场，是马克思主义政党区别于其他政党的显著标志，体现党与人民利益的一致性。","pitfall":"深化改革、推动高质量发展属于实践任务，实事求是属于思想路线的重要内容，都不能直接替代题干所问的根本政治立场。","originalAnswer":["B"]},{"number":5,"answer":["D"],"stem":"（ ）是党执政的最大底气，也是党执政最深厚的根基。","options":[{"key":"A","text":"实现共产主义理想"},{"key":"B","text":"物质基础雄厚"},{"key":"C","text":"有丰富经验"},{"key":"D","text":"人民"}],"id":"chapter4-single-05","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"执政根基与人民","explanation":"人民是党执政的最大底气和最深厚根基。党的力量来自人民，党的执政基础建立在人民的支持和拥护之上。","pitfall":"物质基础、历史经验和理想信念都重要，但题干强调执政力量的根源，应把答案落实到人民，而非单一物质或经验条件。","originalAnswer":["D"]},{"number":6,"answer":["B"],"stem":"（ ）是党的工作的最高裁决者和最终评判者。","options":[{"key":"A","text":"实践"},{"key":"B","text":"人民"},{"key":"C","text":"国务院"},{"key":"D","text":"党中央"}],"id":"chapter4-single-06","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"工作的最终评判者","explanation":"党的工作是否符合人民利益，要由人民的感受、评价和实际受益来检验，因此人民是最高裁决者和最终评判者。","pitfall":"实践是检验真理的唯一标准，人民是党的工作成效的最终评判者。两个命题的对象不同，不能见到“检验”就一律选实践。","originalAnswer":["B"]},{"number":7,"answer":["B"],"stem":"（ ）是贯彻群众路线的有效途径。","options":[{"key":"A","text":"以人民为中心"},{"key":"B","text":"调查研究"},{"key":"C","text":"把人民对美好生活作为奋斗目标"},{"key":"D","text":"构建新发展格局"}],"id":"chapter4-single-07","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"调查研究与群众路线","explanation":"调查研究能够了解群众真实需求和实际情况，把群众意见转化为科学决策，是贯彻群众路线、密切联系群众的有效途径。","pitfall":"以人民为中心是根本立场，调查研究是工作方法。题干问“有效途径”，应选择能够直接落实群众路线的实践方法。","originalAnswer":["B"]},{"number":8,"answer":["B"],"stem":"我们党讲宗旨，讲了很多话，但说到底还是（ ）这句话。","options":[{"key":"A","text":"以人民为中心"},{"key":"B","text":"为人民服务"},{"key":"C","text":"坚持人民主体地位"},{"key":"D","text":"群众路线是根本工作路线"}],"id":"chapter4-single-08","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"为人民服务的宗旨","explanation":"全心全意为人民服务是党的根本宗旨，相关论述以“为人民服务”概括宗旨的核心内容，指向党一切工作的价值归宿。","pitfall":"以人民为中心、坚持人民主体地位和群众路线相互联系，但题目要求补全宗旨论述的原句，应选择最直接对应的规范用语。","originalAnswer":["B"]},{"number":9,"answer":["A"],"stem":"新时代要坚持以人民为中心，在推动社会全面进步中促进（ ）的全面发展。","options":[{"key":"A","text":"人"},{"key":"B","text":"经济"},{"key":"C","text":"政治"},{"key":"D","text":"文化"}],"id":"chapter4-single-09","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"人的全面发展","explanation":"坚持以人民为中心，既要推动社会整体进步，也要促进人的全面发展，使人的能力、权利、生活条件和精神世界得到发展。","pitfall":"经济、政治、文化发展是促进人的发展的条件和方面，题干强调的是最终主体，不能把手段或领域代替“人”。","originalAnswer":["A"]},{"number":10,"answer":["A"],"stem":"（ ）是社会主义的本质要求，是中国式现代化的重要特征。","options":[{"key":"A","text":"共同富裕"},{"key":"B","text":"社会和谐"},{"key":"C","text":"人民主体地位"},{"key":"D","text":"解决社会主要矛盾"}],"id":"chapter4-single-10","topicId":"chapter4","type":"single","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"single","point":"共同富裕","explanation":"共同富裕是社会主义的本质要求，也是中国式现代化的重要特征，强调全体人民共同享有发展成果并防止两极分化。","p ":"D","text":"发展成果由人民共享"}],"id":"chapter4-multiple-16","topicId":"chapter4","type":"multiple","source":"习思想教材配套练习题 第四章 坚持以人民为中心(1).doc","sourceType":"multiple","point":"发展的为了依靠共享","explanation":"发展为了人民、发展依靠人民、发展成果由人民共享，分别回答发展的目的、动力和成果归属，构成人民立场的完整要求。","pitfall":"“发展幸福人民”不是教材这组三项规范表述。多选题要把相关意思与准确概括区分开，防止近义表达干扰。","originalAnswer":["A","C","D"]},{"number":1,"answer":["B"],"stem":"习近平强调：“（ ）是决定当代中国命运的关键一招，也是决定实现’两个一百年’奋斗目标、实现中华民族伟大复兴的关键一招。”","options":[{"key":"A","text":"高质量发展"},{"key":"B","text":"改革开放"},{"key":"C","text":"全面依法治国"},{"key":"D","text":"文化自信"}],"id":"chapter5-single-01","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"改革开放关键一招","explanation":"改革开放深刻改变了中国的发展面貌，是决定当代中国命运、实现奋斗目标和民族复兴的关键一招，提供持续发展的动力。","pitfall":"高质量发展、依法治国、文化自信都重要，但题目考查“关键一招”的特定论断，不能用其他战略任务替代改革开放。","originalAnswer":["B"]},{"number":2,"answer":["B"],"stem":"全面深化改革的总目标是（ ）。","options":[{"key":"A","text":"推进国家治理体系和治理能力现代化"},{"key":"B","text":"完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化"},{"key":"C","text":"进一步解放思想、发展社会生产力"},{"key":"D","text":"赋予社会主义新的生机活力，推进国家治理体系和治理能力现代化"}],"id":"chapter5-single-02","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"全面深化改革总目标","explanation":"总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化，体现制度方向与治理能力提升的有机统一。","pitfall":"只答治理现代化不完整，解放发展生产力是重要目的但不是这一总目标的完整表述。此题应抓住“两方面缺一不可”。","originalAnswer":["B"]},{"number":3,"answer":["A"],"stem":"中国坚持对外开放的基本国策，坚定奉行（ ）的开放战略。","options":[{"key":"A","text":"互利共赢"},{"key":"B","text":"不结盟"},{"key":"C","text":"“一带一路”倡议"},{"key":"D","text":"构建人类命运共同体"}],"id":"chapter5-single-03","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"互利共赢开放战略","explanation":"中国坚持对外开放，奉行互利共赢的开放战略，强调通过合作实现自身发展与共同发展，分享机遇和成果。","pitfall":"不结盟属于外交关系政策范畴，“一带一路”是合作倡议，人类命运共同体是理念和目标，不能直接替代开放战略名称。","originalAnswer":["A"]},{"number":4,"answer":["B"],"stem":"“一带一路”建设，坚持（ ）原则，机会和成果属于全世界。","options":[{"key":"A","text":"互利共赢"},{"key":"B","text":"共商共建共享"},{"key":"C","text":"共商共建"},{"key":"D","text":"平等互惠"}],"id":"chapter5-single-04","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"共商共建共享","explanation":"共商共建共享是共建“一带一路”的重要原则：共同商量规则和方向，共同参与建设，共同分享发展成果。","pitfall":"“互利共赢”是开放战略和合作追求，“平等互惠”是相关要求，但题干问特定原则，应选完整的“共商共建共享”。","originalAnswer":["B"]},{"number":5,"answer":["B"],"stem":"（ ）是新时代全面深化改革开放的思想前提。","options":[{"key":"A","text":"实事求是"},{"key":"B","text":"解放思想"},{"key":"C","text":"开拓创新"},{"key":"D","text":"贯彻新发展理念"}],"id":"chapter5-single-05","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"解放思想","explanation":"解放思想有助于突破不合时宜的观念束缚，深化对改革规律的认识，是推进新时代全面深化改革开放的思想前提。","pitfall":"实事求是与解放思想相统一，但题目使用“思想前提”的明确定位。开拓创新、新发展理念也不能替代这项固定表述。","originalAnswer":["B"]},{"number":6,"answer":["A"],"stem":"党的十九大提出，到（ ）“各方面制度更加完善，国家治理体系和治理能力现代化基本实现”。","options":[{"key":"A","text":"2035年"},{"key":"B","text":"2030年"},{"key":"C","text":"2025年"},{"key":"D","text":"2020年"}],"id":"chapter5-single-06","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"2035年治理现代化","explanation":"党的十九大提出，到2035年各方面制度更加完善，国家治理体系和治理能力现代化基本实现，这是基本现代化的重要内容。","pitfall":"本题对应2035年而非2020、2025或2030年。要同时记住年份和“基本实现”的限定，避免与本世纪中叶目标混淆。","originalAnswer":["A"]},{"number":7,"answer":["C"],"stem":"中国特色社会主义制度和国家治理体系是以（ ）为指导、植根中国大地、具有深厚中华文化根基、深得人民拥护的制度和治理体系。","options":[{"key":"A","text":"社会主义"},{"key":"B","text":"中国特色社会主义"},{"key":"C","text":"马克思主义"},{"key":"D","text":"毛泽东思想"}],"id":"chapter5-single-07","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"制度体系的指导思想","explanation":"中国特色社会主义制度和国家治理体系以马克思主义为指导，植根中国实际，具有深厚中华文化根基，并在实践中不断发展。","pitfall":"社会主义是社会性质层面的概念，中国特色社会主义是道路理论制度文化的整体概括，不能取代本题所问的理论指导名称。","originalAnswer":["C"]},{"number":8,"answer":["D"],"stem":"坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化，不仅要建立完善的制度体系，还要在不断提高（ ）上狠下功夫。","options":[{"key":"A","text":"民主与法治"},{"key":"B","text":"制度创新和社会和谐"},{"key":"C","text":"社会发展和经济增速"},{"key":"D","text":"制度执行力和治理能力"}],"id":"chapter5-single-08","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"制度执行与治理能力","explanation":"完善制度还必须提高制度执行力和治理能力，使制度安排转化为实际治理效能；制度的生命力在于有效实施。","pitfall":"民主法治、社会和谐和经济增长都重要，但题干强调“建立制度之后如何发挥作用”，因此应选执行力与治理能力。","originalAnswer":["D"]},{"number":9,"answer":["B"],"stem":"（ ）作出了全面深化改革的决定。","options":[{"key":"A","text":"党的十八大"},{"key":"B","text":"党的十八届三中全会"},{"key":"C","text":"党的十九大"},{"key":"D","text":"党的十九届六中全会"}],"id":"chapter5-single-09","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"十八届三中全会","explanation":"2013年党的十八届三中全会通过全面深化改革的重要决定，对改革目标、任务和重大举措作出系统部署。","pitfall":"注意十八大与十八届三中全会的区别：前者是党的全国代表大会，后者是对全面深化改革作出集中部署的重要中央全会。","originalAnswer":["B"]},{"number":10,"answer":["B"],"stem":"全面深化改革能否顺利推进，关键取决于党，取决于（ ）。","options":[{"key":"A","text":"全体人民的共同参与"},{"key":"B","text":"党的集中统一领导"},{"key":"C","text":"全方位对外开放"},{"key":"D","text":"社会主义的发展方向"}],"id":"chapter5-single-10","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"改革中的集中统一领导","explanation":"全面深化改革涉及深层利益调整和复杂系统协调，必须坚持党对改革的集中统一领导，以保证方向、统筹部署和落实。","pitfall":"人民参与和扩大开放是重要条件，但题干问改革顺利推进的“关键取决于”，应把握集中统一领导这一根本政治保证。","originalAnswer":["B"]},{"number":11,"answer":["A"],"stem":"（ ）是运用国家制度管理国家各方面事务的能力。","options":[{"key":"A","text":"治理能力"},{"key":"B","text":"治理体系"},{"key":"C","text":"管理能力"},{"key":"D","text":"协调能力"}],"id":"chapter5-single-11","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"国家治理能力","explanation":"国家治理能力是运用国家制度管理各方面事务的能力，体现制度执行、公共管理和解决实际问题的水平。","pitfall":"治理体系主要是制度体系和运行安排，治理能力主要是运用制度的本领。体系与能力相联系，但题干定义直接对应能力。","originalAnswer":["A"]},{"number":12,"answer":["C"],"stem":"（ ），习近平先后提出共建“丝绸之路经济带”和“21世纪海上丝绸之路”的重大倡议。","options":[{"key":"A","text":"2015年9月和10月"},{"key":"B","text":"2014年9月和10月"},{"key":"C","text":"2013年9月和10月"},{"key":"D","text":"2012年9月和10月"}],"id":"chapter5-single-12","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"一带一路倡议时间","explanation":"2013年9月和10月，习近平先后提出共建丝绸之路经济带和21世纪海上丝绸之路倡议，陆海相联构成“一带一路”。","pitfall":"本题既考年份也考月份，正确对应2013年9月、10月，不要与后来合作论坛召开或项目落地的时间混淆。","originalAnswer":["C"]},{"number":13,"answer":["C"],"stem":"中阿新闻交流中心、中阿电子图书馆门户网站正式落地；“汉语热”在阿拉伯国家持续升温，沙特、阿联酋、埃及宣布将中文教学纳入国民教育体系。上述现象主要说明（ ）","options":[{"key":"A","text":"各国之间经济互联互通"},{"key":"B","text":"形成了“一带一路”产业化集群"},{"key":"C","text":"“一带一路”促进人文交流更加深入"},{"key":"D","text":"中华文化成为人类文明的中心"}],"id":"chapter5-single-13","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"一带一路人文交流","explanation":"新闻交流、电子图书馆与中文教育都属于文化和人员交流领域，直接说明“一带一路”合作促进人文交流深入发展。","pitfall":"材料没有提供产业集群或经济互联互通的直接证据；“中华文化成为文明中心”也不是平等交流互鉴的规范立场。","originalAnswer":["C"]},{"number":14,"answer":["A"],"stem":"推进改革的目的是要不断推进我国社会主义制度（ ），赋予社会主义新的生机活力。","options":[{"key":"A","text":"自我完善和发展"},{"key":"B","text":"现实性和实效性"},{"key":"C","text":"人民性和整体性"},{"key":"D","text":"整体推进和全面发展"}],"id":"chapter5-single-14","topicId":"chapter5","type":"single","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"single","point":"社会主义制度自我完善","explanation":"改革是社会主义制度的自我完善和发展，通过改进体制机制解决发展问题，增强制度活力，而不是改变社会主义根本方向。","pitfall":"现实性、实效性、整体性等可用于描述政策效果，但题干考查改革目的的固定概括，应把握“自我完善和发展”。","originalAnswer":["A"]},{"number":1,"answer":["A","B","C","D"],"stem":"改革开放是（ ）。","options":[{"key":"A","text":"决定当代中国命运的关键一招"},{"key":"B","text":"坚持和发展中国特色社会主义的必由之路"},{"key":"C","text":"党和人民大踏步赶上时代的重要法宝"},{"key":"D","text":"完成新时代目标任务的必然要求"}],"id":"chapter5-multiple-01","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"改革开放的历史地位","explanation":"改革开放是决定中国命运的关键一招，是坚持和发展中国特色社会主义的必由之路，也是党和人民赶上时代、完成新任务的重要动力。","pitfall":"四项从历史作用、道路选择、实践成效和未来要求展开，均正确。不能把改革开放看成某一阶段完成后即可终止的临时政策。","originalAnswer":["A","B","C","D"]},{"number":2,"answer":["A","B","C","D"],"stem":"改革开放是坚持和发展中国特色社会主义的必由之路，因为（ ）。","options":[{"key":"A","text":"改革开放为中国特色社会主义开创、发展和完善提供了实践基础"},{"key":"B","text":"改革开放深化了对社会主义建设规律的认识，为坚持和发展中国特色社会主义提供了有力支撑"},{"key":"C","text":"谱写新时代中国特色社会主义的新篇章，依然需要全面深化改革、不断扩大对外开放"},{"key":"D","text":"以上都正确"}],"id":"chapter5-multiple-02","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"必由之路的依据","explanation":"改革开放提供实践基础，深化对社会主义建设规律的认识；新时代继续发展中国特色社会主义仍需要改革开放作为动力和条件。","pitfall":"三项分别对应实践、理论与未来发展要求，均成立，因此“以上都正确”也正确。作答时注意包含性选项与前项的逻辑。","originalAnswer":["A","B","C","D"]},{"number":3,"answer":["A","B"],"stem":"党的十一届三中全会来，我国创造了（ ）两大奇迹,极大地改变了中国的面貌。","options":[{"key":"A","text":"经济快速发展"},{"key":"B","text":"社会长期稳定"},{"key":"C","text":"民族团结"},{"key":"D","text":"“新四大发明”"}],"id":"chapter5-multiple-03","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"两大奇迹","explanation":"改革开放以来，中国创造了经济快速发展和社会长期稳定两大奇迹，体现发展与稳定相互支撑的实践成果。","pitfall":"民族团结是重要成就，“新四大发明”是社会流行说法，但二者都不是“两大奇迹”这一固定概括的组成部分。","originalAnswer":["A","B"]},{"number":4,"answer":["A","B","C","D","E"],"stem":"当前，之所以要全面深化改革开放 ，是因为（ ）。","options":[{"key":"A","text":"发展中不平衡、不协调、不可持续问题依然突出"},{"key":"B","text":"科技创新能力不强"},{"key":"C","text":"产业结构不合理，发展方式依然粗放"},{"key":"D","text":"城乡区域发展差距和居民收入分配差距依然较大"},{"key":"E","text":"形式主义、官僚主义、享乐主义和奢靡之风问题突出"}],"id":"chapter5-multiple-04","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"深化改革的现实必要性","explanation":"发展不平衡不协调、科技创新和产业结构短板、城乡收入差距及作风问题，都反映需要通过改革破解的体制机制与治理问题。","pitfall":"题目沿用资料对改革现实背景的列举，五项均在所列问题之内。不要因为某问题不属于经济领域，就把它排除在全面改革之外。","originalAnswer":["A","B","C","D","E"]},{"number":5,"answer":["A","B","D"],"stem":"全面深化改革开放，必须（ ）。","options":[{"key":"A","text":"勇于破除一切不合时宜的观念，深入贯彻新理念新思想新战略"},{"key":"B","text":"勇于打破部门利益、行业利益、本位思想，服从国家整体利益"},{"key":"C","text":"勇于破除根本制度、基本制度障碍，构建系统完备、科学规范、运行有效的制度体系"},{"key":"D","text":"勇于破解我国开放型经济体制建设中的突出问题，积极适应经济全球化新趋势。"}],"id":"chapter5-multiple-05","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"改革的方向和边界","explanation":"深化改革要突破过时观念和部门利益束缚，解决开放中的突出问题，并完善科学规范的制度体系，为发展增添活力。","pitfall":"错误项把根本制度、基本制度本身说成需要破除的障碍，混淆制度自我完善与否定根本制度。改革有明确方向和原则。","originalAnswer":["A","B","D"]},{"number":6,"answer":["A","B","C","D","E"],"stem":"全面深化改革开放，是一场全面、系统、整体的制度创新，要着眼于建立一整套更完备、更稳定、更管用的制度体系，包括（ ）。","options":[{"key":"A","text":"坚持和完善人民当家作主制度体系"},{"key":"B","text":"完善涉外经济法律和规则体系"},{"key":"C","text":"坚持和完善繁荣发展社会主义先进文化的制度"},{"key":"D","text":"坚持和完善统筹城乡的民生保障制度和共建共治共享的社会治理制度"},{"key":"E","text":"坚持和完善生态文明制度体系"}],"id":"chapter5-multiple-06","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"全面系统整体的制度创新","explanation":"改革覆盖政治、经济、文化、社会、生态等领域，要求相关制度衔接配套，形成更加完备稳定、运行有效的制度体系。","pitfall":"题中五项分别落在不同领域，均属于全面改革的制度建设任务。不能将全面深化改革仅理解为经济体制改革。","originalAnswer":["A","B","C","D","E"]},{"number":7,"answer":["B","C"],"stem":"改革开放要坚守政治原则和底线，不是改弦易张。这里面最核心的是（ ）、（ ），偏离了这一条，那就南辕北辙了。","options":[{"key":"A","text":"坚持和改善人民代表大会制度"},{"key":"B","text":"坚持和改善党的领导"},{"key":"C","text":"坚持和完善中国特色社会主义制度"},{"key":"D","text":"建成社会主义现代化国家"}],"id":"chapter5-multiple-07","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"改革的政治原则","explanation":"改革必须坚持和改善党的领导、坚持和完善中国特色社会主义制度，以保证改革沿着正确政治方向推进。","pitfall":"人民代表大会制度和现代化国家建设都重要，但题干问改革最核心的政治原则和底线，答案应聚焦党的领导与社会主义制度。","originalAnswer":["B","C"]},{"number":8,"answer":["A","B","C","D"],"stem":"改革开放是有方向、有立场、有原则的，必须（ ）。","options":[{"key":"A","text":"有利于进一步解放思想、进一步解放和发展社会生产力"},{"key":"B","text":"坚持以人民为中心，促进社会公平正义、增进人民福祉"},{"key":"C","text":"坚持和改善党的全面领导、坚持和完善中国特色社会主义制度"},{"key":"D","text":"推进我国社会主义制度自我完善和发展，赋予社会主义新的生机活力"}],"id":"chapter5-multiple-08","topicId":"chapter5","type":"multiple","source":"习思想教材配套练习题 第五章 全面深化改革(1).doc","sourceType":"multiple","point":"有方向有原则的改革","explanatio nswer":["C"],"stem":"（ ）是习近平新时代中国特色社会主义思想的核心要义。","options":[{"key":"A","text":"坚持党的领导"},{"key":"B","text":"坚持马克思主义"},{"key":"C","text":"坚持和发展中国特色社会主义"},{"key":"D","text":"坚持人民民主专政"}],"id":"supplement1-single-06","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"思想的核心要义","explanation":"坚持和发展中国特色社会主义是习近平新时代中国特色社会主义思想的核心要义，贯穿其重大理论问题和实践要求。","pitfall":"党的领导、马克思主义和人民民主专政都属于重要内容，但题目考查核心要义的完整表述，不能用其中一个方面替代整体主题。","originalAnswer":["C"]},{"number":7,"answer":["D"],"stem":"党的十八大以来，我们党的全部理论和实践探索都是围绕（ ）这个主题来展开、深化和拓展的。","options":[{"key":"A","text":"什么是社会主义，怎样建设社会主义"},{"key":"B","text":"建设一个什么样的党，怎样建设党"},{"key":"C","text":"实现什么样发展，怎样发展"},{"key":"D","text":"坚持和发展中国特色社会主义"}],"id":"supplement1-single-07","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"理论和实践的鲜明主题","explanation":"改革开放以来，党的理论创新和实践探索始终围绕坚持和发展中国特色社会主义展开。改革开放、经济建设和发展理念都服务于这一主题。","pitfall":"题目问“全部理论和实践的鲜明主题”，范围比某一项政策或中心工作更广，不能只答改革开放或以经济建设为中心。","originalAnswer":["D"]},{"number":8,"answer":["C"],"stem":"中国特色社会主义的战略布局是（ ）。","options":[{"key":"A","text":"“八个明确”"},{"key":"B","text":"“十四个坚持”"},{"key":"C","text":"“四个全面”"},{"key":"D","text":"“五位一体”"}],"id":"supplement1-single-08","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"四个全面战略布局","explanation":"“四个全面”指全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党，是目标与举措相互支撑的战略布局。","pitfall":"总体布局是“五位一体”，战略布局是“四个全面”。“十个明确”“十四个坚持”属于思想内容和基本方略的概括，不能混用。","originalAnswer":["C"]},{"number":9,"answer":["D"],"stem":"习近平新时代中国特色社会主义思想中最重要、最核心的内容是（ ）。","options":[{"key":"A","text":"党的十八大报告概括的“五位一体”"},{"key":"B","text":"党的十九大报告概括的“五位一体”"},{"key":"C","text":"党的十八大报告概括的“八个明确”"},{"key":"D","text":"党的十九大报告概括的“八个明确”"}],"id":"supplement1-single-09","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"八个明确的历史语境","explanation":"党的十九大报告以“八个明确”概括这一思想的核心内容。此后党的十九届六中全会在这一基础上进一步概括为“十个明确”。","pitfall":"本题选项与答案沿用十九大时期表述，需按题目历史语境选择。不要把“八个明确”当作当前所有教材中都不变的概括。","note":"历史表述题：原文采用十九大报告的“八个明确”。十九届六中全会进一步概括为“十个明确”，请结合题目语境区分。","originalAnswer":["D"]},{"number":10,"answer":["C"],"stem":"中国特色社会主义的总体布局是（ ）。","options":[{"key":"A","text":"“三位一体”"},{"key":"B","text":"“四位一体”"},{"key":"C","text":"“五位一体”"},{"key":"D","text":"“六位一体”"}],"id":"supplement1-single-10","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"五位一体总体布局","explanation":"经济建设、政治建设、文化建设、社会建设、生态文明建设构成“五位一体”总体布局，强调各方面建设协调推进。","pitfall":"题目考查的是建设领域的整体安排，不是“四个全面”的战略举措；“三位一体”“四位一体”不是本题要求的完整概括。","originalAnswer":["C"]},{"number":11,"answer":["C"],"stem":"中国特色社会主义最本质的特征是（ ）。.","options":[{"key":"A","text":"人民共同富裕"},{"key":"B","text":"人民当家作主"},{"key":"C","text":"中国共产党领导"},{"key":"D","text":"社会主义现代化"}],"id":"supplement1-single-11","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"最本质的特征","explanation":"中国共产党领导是中国特色社会主义最本质的特征，也是中国特色社会主义制度的最大优势，决定事业发展的根本方向和政治保证。","pitfall":"人民当家作主是社会主义民主政治的本质特征；共同富裕是社会主义的本质要求。注意不同命题与关键词的固定对应。","originalAnswer":["C"]},{"number":12,"answer":["C"],"stem":"坚持和发展中国特色社会主义，总任务是（ ）。","options":[{"key":"A","text":"完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化"},{"key":"B","text":"建设中国特色社会主义法治体系、建设社会主义法治国家"},{"key":"C","text":"实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国"},{"key":"D","text":"建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队"}],"id":"supplement1-single-12","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"坚持和发展的总任务","explanation":"总任务是实现社会主义现代化和中华民族伟大复兴，并在全面建成小康社会基础上分两步建成社会主义现代化强国。它回答事业最终要实现什么。","pitfall":"完善制度、推进治理现代化对应全面深化改革总目标；法治体系与法治国家对应全面依法治国总目标；强军目标也不能替代总任务。","originalAnswer":["C"]},{"number":13,"answer":["B"],"stem":"全面深化改革的总目标是（ ）。","options":[{"key":"A","text":"坚定道路自信、理论自信、制度自信、文化自信"},{"key":"B","text":"完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化"},{"key":"C","text":"建设中国特色社会主义法治体系、建设社会主义法治国家"},{"key":"D","text":"坚持和发展中国特色社会主义"}],"id":"supplement1-single-13","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"全面深化改革总目标","explanation":"全面深化改革总目标包含两个相互联系的方面：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。前者确定方向，后者体现实现路径与治理成效。","pitfall":"答题要完整把握两个方面。道路、理论、制度、文化自信不是改革总目标，建设法治体系和法治国家是依法治国的总目标。","originalAnswer":["B"]},{"number":14,"answer":["C"],"stem":"（ ）是贯彻习近平新时代中国特色社会主义思想的一根红线。","options":[{"key":"A","text":"人民立场"},{"key":"B","text":"人民主体"},{"key":"C","text":"人民至上"},{"key":"D","text":"人民幸福"}],"id":"supplement1-single-14","topicId":"supplement1","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"人民至上","explanation":"坚持人民至上，要求把人民利益放在首位，将满足人民对美好生活的向往作为奋斗目标，贯穿理论和实践各方面。","pitfall":"人民立场、主体、幸福与之相关，但本题按原文考查“一根红线”的对应表述，应准确记忆“人民至上”，不以近似词替换。","originalAnswer":["C"]},{"number":1,"answer":["A","B","C","D"],"stem":"我国社会主要矛盾的变化（ ）。","options":[{"key":"A","text":"没有改变我们对我国社会主义所处历史阶段的判断"},{"key":"B","text":"我国仍处于并将长期处于社会主义初级阶段的基本国情没有变"},{"key":"C","text":"我国是世界最大发展中国家的国际地位没有变"},{"key":"D","text":"以上都正确"}],"id":"supplement1-multiple-01","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"主要矛盾变化与两个没有变","explanation":"社会主要矛盾变化并未改变社会主义初级阶段的判断；基本国情和世界最大发展中国家的国际地位也没有变。","pitfall":"要把“变化”与“没有变”统一理解，不能因进入新时代就推断已经跨越初级阶段。本题“以上都正确”也涵盖前述正确判断。","originalAnswer":["A","B","C","D"]},{"number":2,"answer":["A","B","C","D"],"stem":"四大危险是指（ ）。","options":[{"key":"A","text":"精神懈怠危险"},{"key":"B","text":"能力不足危险"},{"key":"C","text":"脱离群众危险"},{"key":"D","text":"消极腐败危险"}],"id":"supplement1-multiple-02","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"四大危险","explanation":"精神懈怠、能力不足、脱离群众、消极腐败是“四大危险”，分别涉及精神状态、执政本领、群众基础和廉洁状况。","pitfall":"四项共同构成固定概括，不可漏选。注意与执政考验、改革开放考验、市场经济考验、外部环境考验等“四大考验”区分。","originalAnswer":["A","B","C","D"]},{"number":3,"answer":["A","B","C","D"],"stem":"中国特色社会主义新时代，（ ）。","options":[{"key":"A","text":"是承前启后、继往开来，在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代。"},{"key":"B","text":"是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代。"},{"key":"C","text":"是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代."},{"key":"D","text":"全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代。"}],"id":"supplement1-multiple-03","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"新时代的内涵","explanation":"新时代连接历史与未来，包含继续夺取中国特色社会主义胜利、建设现代化强国、创造美好生活和实现民族复兴等丰富内涵。","pitfall":"四项描述的对象和角度不同，但都属于新时代的内涵，不可把新时代仅理解为某个年份变化或一项单独政策变化。","originalAnswer":["A","B","C","D"]},{"number":4,"answer":["A","B","C","D"],"stem":"中国特色社会主义是（ ）。","options":[{"key":"A","text":"既坚持科学社会主义基本原则，又具有鲜明实践特色、理论特色、民族特色、时代特色的社会主义"},{"key":"B","text":"是中国特色社会主义道路、理论、制度、文化四位一体的社会主义"},{"key":"C","text":"是统揽伟大斗争、伟大工程、伟大事业、伟大梦想的社会主义"},{"key":"D","text":"是根植于中国大地、反映中国人民意愿、适应中国和时代发展进步要求的社会主义"}],"id":"supplement1-multiple-04","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"中国特色社会主义的整体内涵","explanation":"中国特色社会主义坚持科学社会主义原则，统一道路、理论、制度、文化，并立足中国实际、人民意愿和时代发展要求。","pitfall":"四项从原则特色、组成内容、事业实践和国情基础进行说明，均符合资料口径。不要把中国特色社会主义理解为单一经济制度。","originalAnswer":["A","B","C","D"]},{"number":5,"answer":["A","B"],"stem":"（ ）是中国共产党不可战胜的强大精神力量。","options":[{"key":"A","text":"敢于斗争"},{"key":"B","text":"敢于胜利"},{"key":"C","text":"敢于纠错"},{"key":"D","text":"敢于挑战"}],"id":"supplement1-multiple-05","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"敢于斗争敢于胜利","explanation":"敢于斗争、敢于胜利是中国共产党不可战胜的强大精神力量，体现直面矛盾、克服困难和争取胜利的精神状态。","pitfall":"敢于纠错和面对挑战也有积极意义，但本题考查固定成对表述，不可把一般正确态度都当作原命题的组成部分。","originalAnswer":["A","B"]},{"number":6,"answer":["A","B","C","D"],"stem":"中国特色社会主义事业总体布局是“五位一体”、战略布局是“四个全面”，强调坚定（ ）。","options":[{"key":"A","text":"道路自信"},{"key":"B","text":"理论自信"},{"key":"C","text":"制度自信"},{"key":"D","text":"文化自信"}],"id":"supplement1-multiple-06","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"四个自信","explanation":"道路自信、理论自信、制度自信、文化自信构成“四个自信”，分别涉及发展道路、理论指导、制度保障和精神文化根基。","pitfall":"四个方面相互联系，不能只重制度或道路而遗漏文化。“五位一体”“四个全面”分别是总体布局和战略布局，不是自信的数量来源。","originalAnswer":["A","B","C","D"]},{"number":7,"answer":["A","B","C"],"stem":"社会主义政治发展的必然要求是坚持（ ）的有机统一。","options":[{"key":"A","text":"党的领导"},{"key":"B","text":"人民当家作主"},{"key":"C","text":"依法治国"},{"key":"D","text":"人民民主专政"}],"id":"supplement1-multiple-07","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"党的领导人民当家作主依法治国","explanation":"发展社会主义民主政治，要坚持党的领导、人民当家作主、依法治国有机统一，统一领导保证、民主本质与治理方式。","pitfall":"人民民主专政是我国国体，虽与民主政治相关，却不是此处“三者有机统一”的第四项，不能混同概念层次。","originalAnswer":["A","B","C"]},{"number":8,"answer":["A","B","D"],"stem":"习近平新时代中国特色社会主义思想坚持以社会主义现代化建设进程中的实际问题、以我们正在做的事情为中心，着眼统揽（ ），大智慧谋划大格局，大手笔续写大文章，是实践探索、经验总结、理论升华凝结而成的思想结晶。","options":[{"key":"A","text":"伟大斗争"},{"key":"B","text":"伟大工程"},{"key":"C","text":"伟大使命"},{"key":"D","text":"伟大梦想"}],"id":"supplement1-multiple-08","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"四个伟大","explanation":"“四个伟大”是伟大斗争、伟大工程、伟大事业、伟大梦想，体现新时代推进事业的总体实践要求及其相互联系。","pitfall":"原文干扰项写成“伟大使命”，并非“伟大事业”，因此只能选题目实际列出的斗争、工程、梦想三项，不能按印象凑齐四项。","originalAnswer":["A","B","D"]},{"number":9,"answer":["A","B","C","D"],"stem":"发展是解决我国一切问题的基础和关键，发展必须是科学发展，必须坚定不移贯彻创新（ ）、的发展理念。","options":[{"key":"A","text":"协调"},{"key":"B","text":"绿色"},{"key":"C","text":"开放"},{"key":"D","text":"共享"}],"id":"supplement1-multiple-09","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"新发展理念","explanation":"新发展理念完整表述为创新、协调、绿色、开放、共享。题干已给“创新”，空缺部分应补齐其余四项，体现发展的整体要求。","pitfall":"创新解决动力，协调解决不平衡，绿色重可持续，开放重内外联动，共享重公平正义。不能因为创新未列为选项就少选其中一项。","originalAnswer":["A","B","C","D"]},{"number":10,"answer":["A","B","C"],"stem":"建设一支（ ），的人民军队，是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。","options":[{"key":"A","text":"听党指挥"},{"key":"B","text":"能打胜仗"},{"key":"C","text":"作风优良"},{"key":"D","text":"全心全意为人民服务"}],"id":"supplement1-multiple-10","topicId":"supplement1","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"新时代强军目标","explanation":"建设听党指挥、能打胜仗、作风优良的人民军队，是新时代强军目标的重要表述，分别对应政治方向、核心能力和优良作风。","pitfall":"全心全意为人民服务是人民军队的宗旨，但不是这组三项强军目标的组成词。多选题应按题干考查的固定组合判断。","originalAnswer":["A","B","C"]},{"number":1,"answer":["D"],"stem":"2012年11月29日，习近平在参观《复兴之路》展览时首次提出中国梦，并引用三句诗诠释了近代以来中国人民寻梦、追梦、圆梦的历史进程。中华民族的明天，“（ ）”。","options":[{"key":"A","text":"人间正道是沧桑"},{"key":"B","text":"雄关漫道真如铁"},{"key":"C","text":"敢叫日月换新天"},{"key":"D","text":"长风破浪会有时"}],"id":"supplement2-single-01","topicId":"supplement2","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"中国梦与三句诗","explanation":"“雄关漫道真如铁”对应中华民族的昨天，“人间正道是沧桑”对应今天，“长风破浪会有时”寄托对明天的展望。","pitfall":"题目指定“明天”，应选表达未来信心的诗句。不能只记住三句都曾引用，而忽略昨天、今天、明天的具体对应。","originalAnswer":["D"]},{"number":2,"answer":["B"],"stem":"中国梦归根到底是（ ），必须紧紧依靠人民来实现，必须不断为人民造福。","options":[{"key":"A","text":"国家的梦"},{"key":"B","text":"人民的梦"},{"key":"C","text":"民族的梦"},{"key":"D","text":"世界的梦"}],"id":"supplement2-single-02","topicId":"supplement2","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"中国梦的人民性","explanation":"中国梦归根到底是人民的梦，体现人民的利益和愿望，必须依靠人民实现，并不断为人民造福，人民既是主体又是受益者。","pitfall":"国家的梦、民族的梦与中国梦有联系，但题干“归根到底”强调最终价值归宿，答案应落在人民，而不是停留在国家或民族层面。","originalAnswer":["B"]},{"number":3,"answer":["A"],"stem":"中华民族伟大复兴的中国梦是（ ）相统一的梦。","options":[{"key":"A","text":"国家情怀、民族情怀、人民情怀"},{"key":"B","text":"国家情怀、民族情怀、社会情怀"},{"key":"C","text":"民族情怀、世界情怀、人民情怀"},{"key":"D","text":"国家情怀、家庭情怀、人民情怀"}],"id":"supplement2-single-03","topicId":"supplement2","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"中国梦的情怀统一","explanation":"中国梦把国家前途、民族命运和人民幸福联系起来，是国家情怀、民族情怀、人民情怀相统一的梦。","pitfall":"家庭、社会和世界等词各有意义，但不是这里的固定三项表述。作答要注意“人民情怀”不可被其他概念替代。","originalAnswer":["A"]},{"number":4,"answer":["C"],"stem":"“得其大者可以兼其小。”说的是（ ）","options":[{"key":"A","text":"中国梦是世界梦"},{"key":"B","text":"每个人都有追逐梦想的机会"},{"key":"C","text":"个人前途命运与国家和民族前途命运紧密相连"},{"key":"D","text":"梦想成真必须实干"}],"id":"supplement2-single-04","topicId":"supplement2","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"个人梦想与国家民族","explanation":"“得其大者可以兼其小”说明个人前途命运与国家、民族前途命运紧密相连，国家和民族发展为个人实现梦想创造条件。","pitfall":"这句话着重大小、整体 x","sourceType":"single","point":"新发展阶段","explanation":"全面建设社会主义现代化国家、向第二个百年奋斗目标进军，标志着进入新发展阶段，体现社会主义初级阶段中新的阶段性特征。","pitfall":"新发展理念回答怎样发展，新发展格局着重经济循环关系，新发展阶段回答处在什么阶段。方位、时期不是这里的规范答案。","originalAnswer":["C"]},{"number":17,"answer":["A"],"stem":"习近平指出：“全面建设社会主义现代化国家、基本实现社会主义现代化，既是（ ）我国发展的要求，也是我国社会主义从初级阶段向更高阶段迈进的要求。","options":[{"key":"A","text":"社会主义初级阶段"},{"key":"B","text":"社会主义历史时期"},{"key":"C","text":"社会主义新时代"},{"key":"D","text":"社会主义实践探索"}],"id":"supplement2-single-17","topicId":"supplement2","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"新阶段与初级阶段","explanation":"进入新发展阶段是社会主义初级阶段中发展到一定水平的新阶段，既服务于初级阶段的发展，也为向更高阶段迈进创造条件。","pitfall":"新发展阶段没有改变仍处于社会主义初级阶段的基本判断。题干第一空应补初级阶段，而非泛称历史时期或新时代。","originalAnswer":["A"]},{"number":18,"answer":["A"],"stem":"（ ）是发展行动的先导。","options":[{"key":"A","text":"发展理念"},{"key":"B","text":"发展格局"},{"key":"C","text":"发展方向"},{"key":"D","text":"发展策略"}],"id":"supplement2-single-18","topicId":"supplement2","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"发展理念的先导作用","explanation":"发展理念决定发展方向、思路和着力点，因此是发展行动的先导。科学理念有助于回应发展中面临的新问题。","pitfall":"发展格局是经济循环布局，发展策略属于具体行动安排。题目强调认识先于并指导行动，应准确对应“发展理念”。","originalAnswer":["A"]},{"number":19,"answer":["D"],"stem":"（ ）的发展理念，相互贯通、相互促进，是具有内在联系的集合体，要统一贯彻，不能顾此失彼，也不能相互替代。","options":[{"key":"A","text":"改革、和谐、绿色、开放、共享"},{"key":"B","text":"创新、协调、和谐、开放、共赢"},{"key":"C","text":"创新、和谐、绿色、开放、发展"},{"key":"D","text":"创新、协调、绿色、开放、共享"}],"id":"supplement2-single-19","topicId":"supplement2","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"新发展理念的完整内容","explanation":"创新、协调、绿色、开放、共享是相互贯通、相互促进的整体，分别回应动力、不平衡、可持续、内外联动和公平正义等问题。","pitfall":"“和谐”“共赢”等词与发展相关，但不能替换五大理念中的协调或共享。答题应逐词核对完整组合。","originalAnswer":["D"]},{"number":20,"answer":["B"],"stem":"（ ）是根据我国发展阶段、环境、条件变化提出来的，是重塑我国国际合作和竞争新优势的战略抉择，是把握未来发展主动权的战略性布局和先手棋。","options":[{"key":"A","text":"新发展理念"},{"key":"B","text":"新发展格局"},{"key":"C","text":"新发展阶段"},{"key":"D","text":"新发展时期"}],"id":"supplement2-single-20","topicId":"supplem gle","point":"经济工作与中心工作","explanation":"经济建设是全党工作的中心，经济工作是党治国理政的中心工作，为改善民生、增强国力和推动社会发展提供物质基础。","pitfall":"文化、政治、外交工作各有重要作用，但题干问“中心工作”，应把握经济工作这一专门定位，不能将各领域重要性等同于中心地位。","originalAnswer":["D"]},{"number":2,"answer":["C"],"stem":"推进供给侧结构性改革，关键在于理解（ ）。","options":[{"key":"A","text":"供给性"},{"key":"B","text":"倾向性"},{"key":"C","text":"结构性"},{"key":"D","text":"周期性"}],"id":"supplement3-single-02","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"供给侧改革的结构性","explanation":"供给侧结构性改革关键在“结构性”，通过优化供给结构、提升供给质量，更好适应需求变化，解决供需之间的结构性矛盾。","pitfall":"不是简单增加供给总量，也不是仅应对短期周期波动。“结构性”强调产业、产品和要素配置等方面的调整优化。","originalAnswer":["C"]},{"number":3,"answer":["D"],"stem":"实现经济高速发展，必须坚持质量第一、（ ）优先。","options":[{"key":"A","text":"利益"},{"key":"B","text":"速度"},{"key":"C","text":"人才"},{"key":"D","text":"效益"}],"id":"supplement3-single-03","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"质量第一效益优先","explanation":"质量第一、效益优先要求把提高发展质量和效率放在突出位置，转变发展方式，推动质量、效率和动力变革。","pitfall":"原题写“经济高速发展”，而规范论述主要针对高质量发展。无论如何，此处固定搭配均为效益优先，不是速度、利益或人才优先。","note":"原文写“经济高速发展”；“质量第一、效益优先”通常用于高质量发展论述。本站保留题目和D答案，在解析中提示。","originalAnswer":["D"]},{"number":4,"answer":["A"],"stem":"（ ）是化解我国经济发展面临困难和矛盾的重大举措。","options":[{"key":"A","text":"供给侧结构性改革"},{"key":"B","text":"健全民主法制"},{"key":"C","text":"社会公平正义"},{"key":"D","text":"人民主体地位"}],"id":"supplement3-single-04","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"供给侧结构性改革的作用","explanation":"推进供给侧结构性改革，从生产供给端改善结构和质量，提升供给体系对需求变化的适应性，是解决经济发展困难矛盾的重要举措。","pitfall":"法治、社会公平、人民主体地位也重要，但题干针对经济结构性问题，应选直接对应的改革举措，而非一般政治或价值原则。","originalAnswer":["A"]},{"number":5,"answer":["D"],"stem":"建设使市场在资源配置中起决定性作用，同时更好发挥（ ）的经济体制。","options":[{"key":"A","text":"金融作用"},{"key":"B","text":"服务业动能"},{"key":"C","text":"社会作用"},{"key":"D","text":"政府作用"}],"id":"supplement3-single-05","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"有效市场与有为政府","explanation":"社会主义市场经济要使市场在资源配置中起决定性作用，同时更好发挥政府作用，形成市场机制有效、政府调控有度的体制。","pitfall":"市场与政府不是简单二选一。金融、服务业和社会作用都不能替代题干与市场相对应的宏观治理主体“政府”。","originalAnswer":["D"]},{"number":6,"answer":["D"],"stem":"经济改革的方向是要让（ ）在资源配置中发挥决定性作用。","options":[{"key":"A","text":"科技"},{"key":"B","text":"创新"},{"key":"C","text":"政府"},{"key":"D","text":"市场"}],"id":"supplement3-single-06","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"市场配置资源的作用","explanation":"经济体制改革的重要方向是使市场在资源配置中起决定性作用，通过价格、竞争、供求等机制提高资源配置效率。","pitfall":"决定性作用不意味着政府不作为；政府仍需依法调控、提供公共服务和维护公平竞争。科技创新是动力，不是资源配置机制本身。","originalAnswer":["D"]},{"number":7,"answer":["B"],"stem":"中国特色社会主义最本质的特征是（ ）。","options":[{"key":"A","text":"共同富裕"},{"key":"B","text":"中国共产党的领导"},{"key":"C","text":"社会主义市场经济"},{"key":"D","text":"现代化建设"}],"id":"supplement3-single-07","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"最本质的特征","explanation":"中国共产党领导是中国特色社会主义最本质的特征，也是中国特色社会主义制度的最大优势，决定事业发展的根本方向和政治保证。","pitfall":"人民当家作主是社会主义民主政治的本质特征；共同富裕是社会主义的本质要求。注意不同命题与关键词的固定对应。","originalAnswer":["B"]},{"number":8,"answer":["B"],"stem":"（ ）是社会主义民主政治的本质特征。","options":[{"key":"A","text":"依法治国"},{"key":"B","text":"人民当家作主"},{"key":"C","text":"共同富裕"},{"key":"D","text":"平等公正"}],"id":"supplement3-single-08","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"人民当家作主","explanation":"人民当家作主是社会主义民主政治的本质特征，体现人民在国家政治生活中的主体地位和参与管理国家社会事务的权利。","pitfall":"中国共产党领导是中国特色社会主义最本质的特征，依法治国是党领导人民治理国家的基本方式。题干对象不同，答案也不同。","originalAnswer":["B"]},{"number":9,"answer":["C"],"stem":"（ ）是中国社会主义民主政治中独特的、独有的、独到的民主形式。","options":[{"key":"A","text":"人民民主"},{"key":"B","text":"全过程民主"},{"key":"C","text":"协商民主"},{"key":"D","text":"社会民主"}],"id":"supplement3-single-09","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"协商民主","explanation":"社会主义协商民主是我国社会主义民主政治中特有的重要民主形式，通过广泛协商汇聚共识，促进科学民主决策。","pitfall":"人民民主属于更广泛的概念，全过程人民民主强调民主的完整链条和实践形态。本题“独特、独有、独到的民主形式”对应协商民主。","originalAnswer":["C"]},{"number":10,"answer":["B"],"stem":"十八大进一步把（ ）纳入到现代化建设布局里，形成了“五位一体”的建设布局。","options":[{"key":"A","text":"社会和谐"},{"key":"B","text":"生态文明"},{"key":"C","text":"政治"},{"key":"D","text":"文化"}],"id":"supplement3-single-10","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"生态文明纳入总体布局","explanation":"党的十八大把生态文明建设纳入中国特色社会主义事业总体布局，使经济、政治、文化、社会、生态文明建设形成“五位一体”。","pitfall":"此前已包含经济、政治、文化、社会建设，新增的方面是生态文明。不要把社会和谐等价值目标当作新增的建设领域名称。","originalAnswer":["B"]},{"number":11,"answer":["D"],"stem":"深化民族团结进步教育，筑牢（ ）","options":[{"key":"A","text":"中华民族大家庭意识"},{"key":"B","text":"中华民族大团结意识"},{"key":"C","text":"人类命运共同体意识"},{"key":"D","text":"中华民族共同体意识"}],"id":"supplement3-single-11","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"中华民族共同体意识","explanation":"铸牢中华民族共同体意识，是增进各民族对中华民族共同体认同、促进民族团结的重要要求，强调中华民族整体归属。","pitfall":"大家庭、大团结等说法具有相关含义，但题目考规范表述，应选“中华民族共同体意识”，不能以近似词替代。","originalAnswer":["D"]},{"number":12,"answer":["C"],"stem":"（ ）是最大的民生工程。","options":[{"key":"A","text":"卫生"},{"key":"B","text":"教育"},{"key":"C","text":"就业"},{"key":"D","text":"三农问题"}],"id":"supplement3-single-12","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"就业与民生","explanation":"就业是最大的民生工程，关系收入来源、生活保障和社会稳定，是保障和改善民生的重要基础。","pitfall":"教育、卫生和“三农”工作都关系民生，但“最大的民生工程”这一特定定位对应就业，答题不能只凭重要程度主观比较。","originalAnswer":["C"]},{"number":13,"answer":["C"],"stem":"意识形态关乎旗帜、关乎道路、关乎国家安全，党的十九届四中全会着眼新时代党和国家事业全局，明确把（ ）确立为根本制度。","options":[{"key":"A","text":"坚持中国特色社会主义文化"},{"key":"B","text":"坚持中国特色社会主义理论体系"},{"key":"C","text":"坚持马克思主义在意识形态领域的指导地位"},{"key":"D","text":"坚持中国传统道德"}],"id":"supplement3-single-13","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"马克思主义指导地位的根本制度","explanation":"坚持马克思主义在意识形态领域指导地位的根本制度，确立思想文化建设的指导原则，关系旗帜、道路与国家安全。","pitfall":"文化、理论体系和传统道德有各自内涵，但不能替代这一制度名称的完整内容。应将“马克思主义、意识形态、指导地位”一并掌握。","originalAnswer":["C"]},{"number":14,"answer":["D"],"stem":"构建国家空间开发保护制度，完善主题功能区配套政策，建立以（ ）为主题的自然保护地体系。","options":[{"key":"A","text":"森林公园"},{"key":"B","text":"湿地公园"},{"key":"C","text":"主题公园"},{"key":"D","text":"国家公园"}],"id":"supplement3-single-14","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"国家公园为主体","explanation":"我国推进建立以国家公园为主体的自然保护地体系，强化重要生态系统的整体保护，为生物多样性与生态安全提供保障。","pitfall":"森林公园、湿地公园属于相关保护类型，但不是“为主体”的答案。原文“主题功能区”“为主题”有错字，应理解为“主体”。","note":"原文“主题功能区”“为主题”疑为“主体功能区”“为主体”，本站保留原题，作答按国家公园为主体理解。","originalAnswer":["D"]},{"number":15,"answer":["C"],"stem":"提高就业质量和人民收入水平。要坚持就业优先战略和，建立健全有利于（ ）的就业机制。","options":[{"key":"A","text":"更高水平和更充分"},{"key":"B","text":"更高水平和更平衡"},{"key":"C","text":"更充分和更高质量"},{"key":"D","text":"更高质量和更平衡"}],"id":"supplement3-single-15","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"更充分更高质量就业","explanation":"就业政策既要扩大就业机会、促进更充分就业，也要改善就业稳定性、保障和发展空间，实现更高质量就业。","pitfall":"固定表述为“更充分、更高质量”，不是“更高水平、更平衡”等近似组合。数量与质量相统一，不能偏重其中一方面。","originalAnswer":["C"]},{"number":16,"answer":["B"],"stem":"（ ）是党和政府联系群众的“最后一公里”","options":[{"key":"A","text":"街道办事处"},{"key":"B","text":"城乡社区"},{"key":"C","text":"城乡居委会"},{"key":"D","text":"村民自治单位"}],"id":"supplement3-single-16","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"城乡社区与基层治理","explanation":"城乡社区是基层社会治理的重要单元，直接联系居民生活和公共服务，是党和政府联系服务群众的“最后一公里”。","pitfall":"街道办事处、居委会和村民自治单位是相关组织或机构，但题干概括城乡共同的生活治理单元，应选择城乡社区。","originalAnswer":["B"]},{"number":17,"answer":["A"],"stem":"（ ）是我国根本政治制度。","options":[{"key":"A","text":"人民代表大会制度"},{"key":"B","text":"政治协商制度"},{"key":"C","text":"民族区域自治制度"},{"key":"D","text":"基层民主制度"}],"id":"supplement3-single-17","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"人民代表大会制度","explanation":"人民代表大会制度是我国的根本政治制度，体现人民当家作主，规定国家权力机关的组织及其相互关系。","pitfall":"多党合作和政治协商、民族区域自治、基层群众自治属于基本政治制度。根本政治制度与基本政治制度是此题的核心区分。","originalAnswer":["A"]},{"number":18,"answer":["B"],"stem":"要树立尊重自然、顺应自然、保护自然的生态文明理念，增强（ ）的意识。","options":[{"key":"A","text":"金山银山不如绿水青山"},{"key":"B","text":"绿水青山就是金山银山"},{"key":"C","text":"金山银山就是绿水青山"},{"key":"D","text":"绿水青山胜过金山银山"}],"id":"supplement3-single-18","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"绿水青山就是金山银山","explanation":"这一理念说明良好生态环境本身具有经济社会价值，保护生态与发展经济能够相互促进，必须走绿色发展道路。","pitfall":"“不如”“胜过”容易把生态保护与发展简单对立，“金山银山就是绿水青山”又颠倒命题方向。需准确记住“就是”的表述。","originalAnswer":["B"]},{"number":19,"answer":["D"],"stem":"加快构建生态文明体系，确保到（ ）美丽中国目标基本实现。","options":[{"key":"A","text":"2020年"},{"key":"B","text":"2025年"},{"key":"C","text":"2030年"},{"key":"D","text":"2035年"}],"id":"supplement3-single-19","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"2035年美丽中国目标","explanation":"到2035年，美丽中国目标基本实现，是我国基本实现社会主义现代化远景目标中生态文明建设的重要要求。","pitfall":"题目有“基本实现”的阶段限定，时间应对应2035年。不要与2020年全面小康或2030年前碳达峰等其他目标混淆。","originalAnswer":["D"]},{"number":20,"answer":["B"],"stem":"中国特色社会主义事业总体布局是（ ）。","options":[{"key":"A","text":"四位一体"},{"key":"B","text":"五位一体"},{"key":"C","text":"三位一体"},{"key":"D","text":"六位一体"}],"id":"supplement3-single-20","topicId":"supplement3","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"五位一体总体布局","explanation":"经济建设、政治建设、文化建设、社会建设、生态文明建设构成“五位一体”总体布局，强调各方面建设协调推进。","pitfall":"题目考查的是建设领域的整体安排，不是“四个全面”的战略举措；“三位一体”“四位一体”不是本题要求的完整概括。","originalAnswer":["B"]},{"number":1,"answer":["A","B","D"],"stem":"我国经济发展处于（ ）阶段，我国发展进入新常态。","options":[{"key":"A","text":"增长速度换挡期"},{"key":"B","text":"结构调整阵痛期"},{"key":"C","text":"质量转型提升期"},{"key":"D","text":"前期刺激政策消化期"}],"id":"supplement3-multiple-01","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"经济新常态的三期叠加","explanation":"原文用增长速度换挡期、结构调整阵痛期、前期刺激政策消化期概括经济发展中的“三期叠加”，反映调整转型的阶段性背景。","pitfall":"质量提升是发展要求，但“质量转型提升期”不是本题固定三期之一。本题属于历史阶段表述，不应当作每个时期都相同的判断。","note":"本题为经济新常态“三期叠加”的历史表述，按配套资料语境作答。","originalAnswer":["A","B","D"]},{"number":2,"answer":["A","B"],"stem":"把处理好（ ）的关系作为经济体制改革的关键","options":[{"key":"A","text":"政府"},{"key":"B","text":"市场"},{"key":"C","text":"人民"},{"key":"D","text":"发展"}],"id":"supplement3-multiple-02","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"政府和市场的关系","explanation":"处理好政府和市场的关系是经济体制改革的关键，既发挥市场配置资源的决定性作用，也更好发挥政府作用。","pitfall":"人民与发展是重要主体和目标，但不是这里相互配对的两个资源配置与治理机制。答题应围绕市场机制与政府职责判断。","originalAnswer":["A","B"]},{"number":3,"answer":["A","B","C","D"],"stem":"要推进供给侧结构性改革作为经济发展的主线，坚持（ ）方针","options":[{"key":"A","text":"巩固"},{"key":"B","text":"增强"},{"key":"C","text":"提升"},{"key":"D","text":"畅通"}],"id":"supplement3-multiple-03","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"巩固增强提升畅通","explanation":"深化供给侧结构性改革采用“巩固、增强、提升、畅通”方针，强调巩固已有成果、增强主体活力、提升产业链水平、畅通经济循环。","pitfall":"四项共同构成完整方针，不能因为词语抽象而漏选。理解时可把它们对应改革成果、市场主体、产业链和国民经济循环。","originalAnswer":["A","B","C","D"]},{"number":4,"answer":["C","D"],"stem":"走中国特色社会主义政治发展道路，必须坚持（ ）有机统一。","options":[{"key":"A","text":"推进国家治理体系和治理能力现代化"},{"key":"B","text":"巩固和发展最广泛的爱国统一战线"},{"key":"C","text":"党的领导"},{"key":"D","text":"人民当家作主 ，依法治国"}],"id":"supplement3-multiple-04","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"三者有机统一","explanation":"走中国特色社会主义政治发展道路，必须坚持党的领导、人民当家作主、依法治国有机统一，统一政治保证、民主本质与法治方式。","pitfall":"题目把人民当家作主和依法治国合在同一选项中，因此两项选择已涵盖三方面。治理现代化和统一战线不是该固定三项的替代词。","originalAnswer":["C","D"]},{"number":5,"answer":["A","B","C","D"],"stem":"巩固和发展爱国统一战线，应该着手做好以下工作：（ ）","options":[{"key":"A","text":"坚持长期共存、互相监督、肝胆相照、荣辱与共的中国共产党领导的政治协商制度"},{"key":"B","text":"深化民族团结进步教育"},{"key":"C","text":"全面贯彻党的宗教工作基本方针"},{"key":"D","text":"牢牢把握大团结大联合的主题，做好统战工作"}],"id":"supplement3-multiple-05","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"爱国统一战线工作","explanation":"巩固发展爱国统一战线，要完善多党合作和政治协商，推进民族团结，贯彻宗教工作基本方针，并围绕大团结大联合做好统战工作。","pitfall":"四项覆盖政党、民族、宗教和整体工作要求，均符合原文答案。首项制度规范全称应为“中国共产党领导的多党合作和政治协商制度”。","note":"原文A项制度名称有缺漏，规范全称是“中国共产党领导的多党合作和政治协商制度”，按原文答案作答。","originalAnswer":["A","B","C","D"]},{"number":6,"answer":["A","B","C"],"stem":"坚持社会主义办学方向，落实立德树人的根本任务，建立（ ）育人体制机制","options":[{"key":"A","text":"全员"},{"key":"B","text":"全程"},{"key":"C","text":"全方位"},{"key":"D","text":"全社会"}],"id":"supplement3-multiple-06","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"三全育人","explanation":"落实立德树人，构建全员、全程、全方位育人体制机制，使教育参与主体、教育过程和教育环节形成合力。","pitfall":"“全社会”强调外部支持，但不是“三全育人”的第三项规范表述。记忆时分别对应人员、时间过程与空间环节三个维度。","originalAnswer":["A","B","C"]},{"number":7,"answer":["A","C","D"],"stem":"社会主义核心价值观涉及国家、社会、公民三个层面的价值要求，具体表达为（）","options":[{"key":"A","text":"富强、民主、文明、和谐"},{"key":"B","text":"自由、民族、公正、法治"},{"key":"C","text":"爱国、敬业、诚信、友善"},{"key":"D","text":"自由、平等、公正、法治"}],"id":"supplement3-multiple-07","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"社会主义核心价值观","explanation":"国家层面是富强、民主、文明、和谐；社会层面是自由、平等、公正、法治；公民层面是爱国、敬业、诚信、友善。","pitfall":"干扰项将社会层面的“平等”改为“民族”，改变规范内容。多选时要逐词核对，不能因大部分词相同就认为整项正确。","originalAnswer":["A","C","D"]},{"number":8,"answer":["A","B","C","D"],"stem":"社会主义核心价值体系的主要内容为（）","options":[{"key":"A","text":"马克思主义指导思想"},{"key":"B","text":"以爱国主义为核心的民族精神和以改革创新为核心的时代精神"},{"key":"C","text":"社会主义荣辱观"},{"key":"D","text":"中国特色社会主义共同理想"}],"id":"supplement3-multiple-08","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"社会主义核心价值体系","explanation":"马克思主义指导思想、中国特色社会主义共同理想、民族精神和时代精神、社会主义荣辱观，构成核心价值体系的主要内容。","pitfall":"核心价值体系与二十四字核心价值观相关但不相同。本题四项分别列出体系要素，均正确，不能直接用三个价值层面替代。","originalAnswer":["A","B","C","D"]},{"number":9,"answer":["A","B","C","D"],"stem":"建设社会主义文化强国，必须做到（）","options":[{"key":"A","text":"培养高度的文化自信"},{"key":"B","text":"提升公共文化服务水平"},{"key":"C","text":"健全现代文化产业体系"},{"key":"D","text":"提高国家文化软实力"}],"id":"supplement3-multiple-09","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"文化强国建设","explanation":"建设文化强国，需要坚定文化自信，提高公共文化服务和文化产业发展水平，增强国家文化软实力，使社会效益与经济效益相统一。","pitfall":"四项分别涉及精神基础、公共服务、产业体系和综合影响力，均属于文化建设任务。不能只看市场产业而忽略公共文化服务。","originalAnswer":["A","B","C","D"]},{"number":10,"answer":["A","B","C","D"],"stem":"提高保障和改善民生水平，应该做到（ ）","options":[{"key":"A","text":"建设高质量教育体系"},{"key":"B","text":"实施就业优先战略"},{"key":"C","text":"优化收入分配结构"},{"key":"D","text":"健全多层次社会保障体系"}],"id":"supplement3-multiple-10","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"保障和改善民生","explanation":"教育、就业、收入分配、社会保障直接影响群众生活，建设高质量教育体系、促进就业、优化分配和健全保障都是民生重点。","pitfall":"四项形成相互支撑的民生政策体系，并非只能选择某一领域。改善民生应与发展相协调，也要回应不同群体的实际需要。","originalAnswer":["A","B","C","D"]},{"number":11,"answer":["A","B","C","D"],"stem":"加强和创新社会治理，需要做到（）。","options":[{"key":"A","text":"创新社会治理体制"},{"key":"B","text":"完善正确处理新形势下人民内部矛盾有效机制"},{"key":"C","text":"完善社会治安防控体系"},{"key":"D","text":"构建基层社会治理新格局"}],"id":"supplement3-multiple-11","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"加强和创新社会治理","explanation":"完善治理体制、有效处理人民内部矛盾、健全治安防控体系、构建基层治理格局，分别从制度、矛盾、治安和基础单元提升治理能力。","pitfall":"四项均属于社会治理任务。不能把社会治理缩小为治安管理，也不能忽视基层参与、矛盾预防与公共服务的作用。","originalAnswer":["A","B","C","D"]},{"number":12,"answer":["A","C","D"],"stem":"在整个发展过程中，我们都要坚持（）的方针，要像保护眼睛一样保护生态环境","options":[{"key":"A","text":"节约优先"},{"key":"B","text":"发展为主"},{"key":"C","text":"保护优先"},{"key":"D","text":"自然恢复为主"}],"id":"supplement3-multiple-12","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"生态文明建设方针","explanation":"生态文明建设坚持节约优先、保护优先、自然恢复为主，强调源头节约、系统保护和尊重生态系统自身规律。","pitfall":"“发展为主”不是这一组三项方针中的内容，更不能理解为发展可以压倒保护。正确把握发展和保护的统一，应坚持绿色发展。","originalAnswer":["A","C","D"]},{"number":13,"answer":["B","C"],"stem":"绿水青山就是金山银山，阐述了（ ）之间的关系","options":[{"key":"A","text":"社会和谐"},{"key":"B","text":"经济发展"},{"key":"C","text":"生态环境保护"},{"key":"D","text":"人类生存"}],"id":"supplement3-multiple-13","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"发展与保护的关系","explanation":"“绿水青山就是金山银山”主要阐明经济发展与生态环境保护的关系，说明生态优势可以转化为发展优势，保护生态也是保护生产力。","pitfall":"社会和谐、人类生存与生态有关，但本题所问的直接关系是一对明确概念，不能把广泛关联的其他目标一并选入。","originalAnswer":["B","C"]},{"number":14,"answer":["A","C"],"stem":"建设生态文明是关系（ ）、关乎（ ）的千年大计","options":[{"key":"A","text":"人民福祉"},{"key":"B","text":"国家发展"},{"key":"C","text":"中华民族永续发展"},{"key":"D","text":"社会长治久安"}],"id":"supplement3-multiple-14","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"生态文明的长远意义","explanation":"建设生态文明关系人民福祉，关乎中华民族永续发展，既指向当代人民生活质量，也关乎子孙后代和民族未来。","pitfall":"国家发展、社会长治久安也有相关性，但题目考查“关系—关乎”的固定表述，准确对应人民福祉与民族永续发展。","originalAnswer":["A","C"]},{"number":15,"answer":["A","B","D"],"stem":"加快形成绿色生活方式，包括增强全民（），培养生态道德和行为习惯","options":[{"key":"A","text":"节约意识"},{"key":"B","text":"环保意识"},{"key":"C","text":"发展意识"},{"key":"D","text":"生态意识"}],"id":"supplement3-multiple-15","topicId":"supplement3","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"绿色生活方式","explanation":"绿色生活要求增强节约意识、环保意识、生态意识，将节约资源、保护环境和尊重自然落实到日常消费与行为习惯。","pitfall":"发展意识并非错误理念，但不是这组绿色生活意识的规范三项。作答要以题目具体列举的意识类型为准。","originalAnswer":["A","B","D"]},{"number":1,"answer":["C"],"stem":"党的（ ）提出了到2020年全面建成小康社会的奋斗目标","options":[{"key":"A","text":"党的十六大"},{"key":"B","text":"党的十七大"},{"key":"C","text":"党的十八大"},{"key":"D","text":"党的十九大"}],"id":"supplement4-single-01","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"全面建成小康社会的提出","explanation":"党的十八大提出到2020年全面建成小康社会的奋斗目标，标志目标从全面建设向全面建成进一步推进。","pitfall":"党的十六大提出全面建设小康社会，十八大明确全面建成。此类题目的关键在“建设”与“建成”，不能只记大会名称。","originalAnswer":["C"]},{"number":2,"answer":["A"],"stem":"全面建成小康社会，更重要、更难做到的是“全面”，“全面”讲的是：（ ）","options":[{"key":"A","text":"发展的平衡性、协调性、可持续性"},{"key":"B","text":"发展的平衡性"},{"key":"C","text":"发展的协调性"},{"key":"D","text":"发展的可持续性"}],"id":"supplement4-single-02","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"全面小康的全面性","explanation":"“全面”强调发展平衡性、协调性、可持续性，要求发展成果覆盖领域、人口和区域，补齐突出短板。","pitfall":"单独强调平衡、协调或可持续，都遗漏其他维度。题目问完整内涵，应选同时包含三者的概括性选项。","originalAnswer":["A"]},{"number":3,"answer":["B"],"stem":"（ ），是全面建成小康社会的最艰巨最繁重的任务","options":[{"key":"A","text":"增加城乡居民收入"},{"key":"B","text":"打赢脱贫攻坚战"},{"key":"C","text":"提升国内生产总值"},{"key":"D","text":"增加城乡居民人均收入"}],"id":"supplement4-single-03","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"脱贫攻坚与全面小康","explanation":"打赢脱贫攻坚战是全面建成小康社会最艰巨最繁重的任务，关系全面小康能否覆盖贫困地区和贫困人口。","pitfall":"增加收入和经济总量是重要任务，但题干“最艰巨最繁重”对应脱贫攻坚这一历史任务，不能用一般发展指标替代。","originalAnswer":["B"]},{"number":4,"answer":["C"],"stem":"（ ）作出“全面建成小康社会胜利在望”的重要判断，将“全面建成小康社会”目标提升为“全面建设社会主义现代化国家”，确立全面建设社会主义现代化国家在“四个全面”战略布局中的引领地位。","options":[{"key":"A","text":"党的十九届三中全会"},{"key":"B","text":"党的十九届四中全会"},{"key":"C","text":"党的十九届五中全会"},{"key":"D","text":"党的十九届六中全会"}],"id":"supplement4-single-04","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"战略布局引领目标的变化","explanation":"党的十九届五中全会部署“十四五”和2035年远景，将全面建设社会主义现代化国家置于“四个全面”战略布局的引领位置。","pitfall":"十九届三中、四中、六中全会各有重点。题目涉及全面小康衔接现代化建设及“十四五”部署，应对应五中全会。","originalAnswer":["C"]},{"number":5,"answer":["A"],"stem":"2021年7月1日，习近平在天安门城楼上庄严宣告，经过全党全国各族人民持续奋斗，我们实现了（ ）。","options":[{"key":"A","text":"第一个百年奋斗目标"},{"key":"B","text":"社会主义现代化国家"},{"key":"C","text":"社会主义现代化强国"},{"key":"D","text":"中华民族伟大复兴"}],"id":"supplement4-single-05","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"第一个百年奋斗目标","explanation":"2021年7月1日庄严宣告实现第一个百年奋斗目标，全面建成小康社会。这是迈向第二个百年奋斗目标的重要基础。","pitfall":"建成现代化强国、实现民族复兴属于继续奋斗的目标，不能把全面建成小康社会直接等同于这些更高阶段目标已经全部实现。","originalAnswer":["A"]},{"number":6,"answer":["D"],"stem":"与西方国家现代化有根本不同，我国的现代化是社会主义现代化，（ ）是本质要求。","options":[{"key":"A","text":"民族复兴"},{"key":"B","text":"人民幸福"},{"key":"C","text":"社会和谐"},{"key":"D","text":"共同富裕"}],"id":"supplement4-single-06","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"共同富裕","explanation":"共同富裕是社会主义的本质要求，也是中国式现代化的重要特征，强调全体人民共同享有发展成果并防止两极分化。","pitfall":"共同富裕不是整齐划一的同时富裕，也不是仅指物质收入平均。人民主体地位和社会和谐与之相关，但不是题干的固定答案。","originalAnswer":["D"]},{"number":7,"answer":["B"],"stem":"要破解发展中面临的难题，化解来自各方面的风险挑战，推动经济社会持续健康发展，必须依靠（ ）。","options":[{"key":"A","text":"全面建成小康社会"},{"key":"B","text":"全面深化改革"},{"key":"C","text":"全面依法治国"},{"key":"D","text":"全面从严治"}],"id":"supplement4-single-07","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"改革破解发展难题","explanation":"全面深化改革通过破除体制机制障碍、释放发展活力，为应对发展难题和风险挑战提供动力，推动经济社会持续健康发展。","pitfall":"依法治国、从严治党也发挥重要保障作用，但题干突出“破解发展难题”的动力来源，在本组答案中应选全面深化改革。","originalAnswer":["B"]},{"number":8,"answer":["A"],"stem":"党的十九大提出，到（ ）“各方面制度更加完善，国家治理体系和治理能力现代化基本实现”。","options":[{"key":"A","text":"2035年"},{"key":"B","text":"2030年"},{"key":"C","text":"2025年"},{"key":"D","text":"2020年"}],"id":"supplement4-single-08","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"2035年治理现代化","explanation":"党的十九大提出，到2035年各方面制度更加完善，国家治理体系和治理能力现代化基本实现，这是基本现代化的重要内容。","pitfall":"本题对应2035年而非2020、2025或2030年。要同时记住年份和“基本实现”的限定，避免与本世纪中叶目标混淆。","originalAnswer":["A"]},{"number":9,"answer":["C"],"stem":"中国特色社会主义制度和国家治理体系是以（ ）为指导、植根中国大地、具有深厚中华文化根基、深得人民拥护的制度和治理体系。","options":[{"key":"A","text":"社会主义"},{"key":"B","text":"中国特色社会主义"},{"key":"C","text":"马克思主义"},{"key":"D","text":"毛泽东思想"}],"id":"supplement4-single-09","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"制度体系的指导思想","explanation":"中国特色社会主义制度和国家治理体系以马克思主义为指导，植根中国实际，具有深厚中华文化根基，并在实践中不断发展。","pitfall":"社会主义是社会性质层面的概念，中国特色社会主义是道路理论制度文化的整体概括，不能取代本题所问的理论指导名称。","originalAnswer":["C"]},{"number":10,"answer":["D"],"stem":"坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化，不仅要建立完善的制度体系，还要在不断提高（ ）上狠下功夫。","options":[{"key":"A","text":"民主与法治"},{"key":"B","text":"制度创新和社会和谐"},{"key":"C","text":"社会发展和经济增速"},{"key":"D","text":"制度执行力和治理能力"}],"id":"supplement4-single-10","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"制度执行与治理能力","explanation":"完善制度还必须提高制度执行力和治理能力，使制度安排转化为实际治理效能；制度的生命力在于有效实施。","pitfall":"民主法治、社会和谐和经济增长都重要，但题干强调“建立制度之后如何发挥作用”，因此应选执行力与治理能力。","originalAnswer":["D"]},{"number":11,"answer":["B"],"stem":"（ ）是中国特色社会主义的本质要求和重要保障。","options":[{"key":"A","text":"全面建设社会主义现代化国家"},{"key":"B","text":"全面依法治国"},{"key":"C","text":"全面深化改革"},{"key":"D","text":"全面从严治党"}],"id":"supplement4-single-11","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"全面依法治国的地位","explanation":"全面依法治国是中国特色社会主义的本质要求和重要保障，要求把国家各项工作纳入法治轨道，以法治保障事业发展。","pitfall":"现代化建设是总体目标，深化改革提供动力，从严治党提供政治保证，四者各有定位，不可因都重要而混淆本题的专门表述。","originalAnswer":["B"]},{"number":12,"answer":["A"],"stem":"（ ）是推进全面依法治国的根本保证。","options":[{"key":"A","text":"党的领导"},{"key":"B","text":"人民当家作主"},{"key":"C","text":"社会和谐稳定"},{"key":"D","text":"经济社会发展"}],"id":"supplement4-single-12","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"党的领导是法治根本保证","explanation":"党的领导是推进全面依法治国的根本保证，要求把党的领导贯彻到依法治国全过程和各方面，保证社会主义法治方向。","pitfall":"人民当家作主体现民主本质，社会稳定和经济发展提供条件，但题干问“根本保证”，应与党的领导这一定位对应。","originalAnswer":["A"]},{"number":13,"answer":["C"],"stem":"全面依法治国最广泛、最深厚的基础是（ ）","options":[{"key":"A","text":"党的领导"},{"key":"B","text":"社会稳定"},{"key":"C","text":"人民"},{"key":"D","text":"社会主义民主"}],"id":"supplement4-single-13","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"法治的人民基础","explanation":"人民是全面依法治国最广泛、最深厚的基础。法治为了人民、依靠人民，保障人民权益，并需要人民共同参与和遵守。","pitfall":"党的领导是根本保证，人民是最广泛最深厚基础。两个命题具有不同的限定，不能见到依法治国就统一选党的领导。","originalAnswer":["C"]},{"number":14,"answer":["B"],"stem":"全面依法治国，总目标是：","options":[{"key":"A","text":"建设中国特色社会主义法治体系"},{"key":"B","text":"建设中国特色社会主义法治体系，建设社会主义法治国家"},{"key":"C","text":"建设社会主义法治国家"},{"key":"D","text":"有法可依、有法必依、违法必究、执法必严"}],"id":"supplement4-single-14","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"依法治国总目标","explanation":"全面依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家，统一制度体系建设与法治国家目标。","pitfall":"单选只写其中一方面都不完整；“有法可依”等属于此前法制建设的基本要求，也不是这里的完整总目标。","originalAnswer":["B"]},{"number":15,"answer":["A"],"stem":"（ ）是国家治理体系和治理能力的重要依托。","options":[{"key":"A","text":"法治"},{"key":"B","text":"民主"},{"key":"C","text":"人民"},{"key":"D","text":"党的领导"}],"id":"supplement4-single-15","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"法治与国家治理","explanation":"法治为制度运行、权力行使和社会秩序提供规范依据，是国家治理体系和治理能力的重要依托，有利于增强治理稳定性和可预期性。","pitfall":"民主、人民和党的领导均有根本作用，但题目所考“重要依托”的特定表述对应法治，应分清不同概念的定位。","originalAnswer":["A"]},{"number":16,"answer":["B"],"stem":"（ ）是推进全面依法治国的总抓手。","options":[{"key":"A","text":"中国特色社会主义法治国家"},{"key":"B","text":"中国特色社会主义法治体系"},{"key":"C","text":"中国特色社会主义法治道路"},{"key":"D","text":"中国特色社会主义法治制度"}],"id":"supplement4-single-16","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"法治体系这一总抓手","explanation":"建设中国特色社会主义法治体系是推进全面依法治国的总抓手，统筹法律规范、法治实施、监督、保障和党内法规等体系建设。","pitfall":"法治国家是总目标的一方面，法治道路体现方向选择，不能与操作统筹意义上的“总抓手”混同，答案应为法治体系。","originalAnswer":["B"]},{"number":17,"answer":["A"],"stem":"（ ）是司法的灵魂和生命。","options":[{"key":"A","text":"公平正义"},{"key":"B","text":"民主法治"},{"key":"C","text":"诚信友善"},{"key":"D","text":"社会和谐"}],"id":"supplement4-single-17","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"司法的灵魂和生命","explanation":"公平正义是司法的灵魂和生命，司法活动必须维护社会公平正义，使人民群众在具体案件中感受到公正。","pitfall":"民主法治、诚信友善、社会和谐分别有其他价值内涵，但本题专门问司法最核心的价值要求，应选择公平正义。","originalAnswer":["A"]},{"number":18,"answer":["B"],"stem":"（ ）是新时代党的建设的根本方针。","options":[{"key":"A","text":"坚持党要管党"},{"key":"B","text":"坚持党要管党、全面从严治党"},{"key":"C","text":"全面从严治党"},{"key":"D","text":"加强党的长期执政能力建设"}],"id":"supplement4-single-18","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"新时代党的建设根本方针","explanation":"坚持党要管党、全面从严治党，是新时代党的建设的根本方针，要求全面落实管党治党责任，坚持严的要求。","pitfall":"“党要管党”和“全面从严治党”须作为完整方针掌握，单独一项都不完整；长期执政能力建设则是建设主线的重要内容。","originalAnswer":["B"]},{"number":19,"answer":["C"],"stem":"全面从严治党以其丰富内涵诠释了()的内在要 求。","options":[{"key":"A","text":"自我发展"},{"key":"B","text":"自我创新"},{"key":"C","text":"自我革命"},{"key":"D","text":"自我改革"}],"id":"supplement4-single-19","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"自我革命","explanation":"全面从严治党体现党勇于自我革命的要求，通过正视问题、纠治问题，清除损害先进性纯洁性的因素，保持党的生机活力。","pitfall":"自我发展、自我创新、自我改革与其有联系，但不是题干“内在要求”的规范概括。应准确对应“自我革命”。","originalAnswer":["C"]},{"number":20,"answer":["A"],"stem":"()是党的政治建设的首要任务。","options":[{"key":"A","text":"保证全党服从中央，坚持党中央权威和集中统一领导"},{"key":"B","text":"保证全党服从中央"},{"key":"C","text":"坚持党中央权威和集中统一领导"},{"key":"D","text":"保证全党的高度团结统一"}],"id":"supplement4-single-20","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"政治建设首要任务","explanation":"保证全党服从中央、坚持党中央权威和集中统一领导，是党的政治建设的首要任务，关系全党方向统一与行动一致。","pitfall":"只写全党服从中央或只写维护权威都不完整，“高度团结统一”更侧重结果，应选择包含两个方面的完整表述。","originalAnswer":["A"]},{"number":21,"answer":["B"],"stem":"坚持党要管党、全面从严治党的方针的关键是:","options":[{"key":"A","text":"全面"},{"key":"B","text":"严"},{"key":"C","text":"管"},{"key":"D","text":"治"}],"id":"supplement4-single-21","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"从严治党的关键","explanation":"全面从严治党，基础在全面，关键在严，要害在治。“严”要求把严格标准、严格措施贯穿管党治党全过程。","pitfall":"本题问“关键”，不能把基础、关键、要害混淆。可成组记忆“全面—基础、严—关键、治—要害”，以题干限定判断。","originalAnswer":["B"]},{"number":22,"answer":["A"],"stem":"党的十九大指出，党的建设要把党的（ ）摆在首位。","options":[{"key":"A","text":"政治建设"},{"key":"B","text":"思想建设"},{"key":"C","text":"组织建设"},{"key":"D","text":"作风建设"}],"id":"supplement4-single-22","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"政治建设摆在首位","explanation":"党的政治建设是根本性建设，决定党的建设方向和效果，因此要摆在首位，以政治建设统领党的建设各项工作。","pitfall":"思想建设是基础性建设，组织和作风建设也重要，但本题问“摆在首位”，对应政治建设，注意与下一类“基础性”问题区分。","originalAnswer":["A"]},{"number":23,"answer":["A"],"stem":"（ ）是党的基础性建设。","options":[{"key":"A","text":"思想建设"},{"key":"B","text":"组织建设"},{"key":"C","text":"政治建设"},{"key":"D","text":"作风建设"}],"id":"supplement4-single-23","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"思想建设是基础性建设","explanation":"思想建设通过坚定理想信念、加强理论武装，为党的建设提供思想基础，是党的基础性建设。","pitfall":"政治建设是根本性建设并摆在首位，不能将“基础性”与“根本性”视为可互换词。组织和作风建设也不是此处的答案。","originalAnswer":["A"]},{"number":24,"answer":["D"],"stem":"党的作风建设的核心是：","options":[{"key":"A","text":"党风问题"},{"key":"B","text":"纪律严明"},{"key":"C","text":"不能让享乐主义和奢靡之风卷土重来"},{"key":"D","text":"保持党同人民群众的血肉联系"}],"id":"supplement4-single-24","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"作风建设的核心","explanation":"党的作风建设核心是保持党同人民群众的血肉联系，反对一切脱离群众、损害群众利益的作风问题。","pitfall":"党风、纪律和反对享乐奢靡都与作风建设有关，但题目问核心所在，应从党群关系和群众基础作答，选择最根本的内容。","originalAnswer":["D"]},{"number":25,"answer":["C"],"stem":"我们党的最大政治优势是：","options":[{"key":"A","text":"思想建设"},{"key":"B","text":"政治建设"},{"key":"C","text":"密切联系群众"},{"key":"D","text":"不浮躁、不浮夸"}],"id":"supplement4-single-25","topicId":"supplement4","type":"single","source":"四套补充选择.docx","sourceType":"single","point":"最大政治优势","explanation":"密切联系群众是党的最大政治优势，体现人民立场和群众路线，能够把人民支持转化为事业发展的力量。","pitfall":"可与“执政后最大危险是脱离群众”成对记忆。党的领导、发展道路和人口数量不等于本题专门所指的政治优势。","originalAnswer":["C"]},{"number":1,"answer":["A","B","C","D"],"stem":"全面小康有更高的标准、更丰富的内涵、更全面的要求，即：（ ）","options":[{"key":"A","text":"经济高质量发展"},{"key":"B","text":"各方面制度更加成熟"},{"key":"C","text":"生态环境质量总体改善"},{"key":"D","text":"人民生活更加殷实"}],"id":"supplement4-multiple-01","topicId":"supplement4","type":"multiple","source":"四套补充选择.docx","sourceType":"multiple","point":"全面小康的丰富内涵","explanation":"全面小康要求经济发展质量提高、制度完善、生态环境改善和人民生活更加殷实，体现经济社会各领域全面进步。","pitfall":"四项分别对应发展、制度、生态和民生，均符合原文。不能把小康只理解为收入达标，更不能忽略生态和制度条件。","originalAnswer":["A","B","C","D"]},{"number":2,"answer":["A","B","C"],"stem":"全面小康：（ ）","options":[{"key":"A","text":"覆盖的人口要全面，是惠及全体人民的小康。"},{"key":"B","text":"覆盖的区域要全面，是城乡区域共同发展的小康。"},{"key":"C","text":"覆盖的       else out.mistakes[id] = { ...(r.lastWrongAt>prev.lastWrongAt?r:prev), wrongCount: Math.max(prev.wrongCount,r.wrongCount), firstWrongAt: Math.min(prev.firstWrongAt,r.firstWrongAt) };
    }
    for (const [id,draft] of Object.entries(b.drafts)) if (!out.drafts[id] && !out.answers[id]) out.drafts[id]=draft;
    for (const [id,s] of Object.entries(b.sessions)) if (!out.sessions[id]) out.sessions[id] = s;
    return out;
  }
  return { fresh, same, shuffle, idsFor, session, assess, addWrong, resetTopic, stats, normalise, merge, validSelection };
});

  function wrongIds() {
    return bank.questions.filter(q=>state.mistakes[q.id] && (ui.wrongTopic==='all'||q.topicId===ui.wrongTopic) && (ui.wrongType==='all'||q.type===ui.wrongType)).map(q=>q.id);
  }
  function mistakes() {
    const ids=wrongIds();
    const total=Object.keys(state.mistakes).length;
    return `<div class="practice-heading"><div><p class="kicker">温故知新</p><h1>我的错题库<span>把薄弱之处，变成下一次的进步。</span></h1></div><span class="wrong-total">${total}<small>道错题</small></span></div><section class="wrong-intro"><div>${icon('bookmark')}<p>错题独立保存，重做本题、重置专题都不会清空。<br><small>掌握后可手动移出；复习答对不会自动删除。</small></p></div><button class="button primary" data-act="begin-review" ${ids.length?'':'disabled'}>复习筛选的 ${ids.length} 题${icon('arrow')}</button></section><div class="wrong-filters"><label>专题<select id="wrong-topic"><option value="all">全部专题</option>${bank.topics.map(t=>`<option value="${t.id}" ${ui.wrongTopic===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><label>题型<select id="wrong-type">${[['all','全部题型'],['single','单选题'],['multiple','多选题']].map(([v,t])=>`<option value="${v}" ${ui.wrongType===v?'selected':''}>${t}</option>`).join('')}</select></label><label>复习顺序<select id="wrong-order"><option value="normal" ${ui.wrongOrder==='normal'?'selected':''}>文档顺序</option><option value="random" ${ui.wrongOrder==='random'?'selected':''}>题目乱序</option></select></label><span>当前筛选 ${ids.length} 题</span></div>${ids.length?`<div class="mistake-list">${ids.map(id=>{const q=qMap.get(id);const m=state.mistakes[id];return `<article class="mistake-item"><div><span class="type-badge">${typeName(q.type)}</span><span class="source-badge">${tMap.get(q.topicId).name} · 原文${q.sourceType==='single'?'单选':'多选'}第 ${q.number} 题</span><span class="wrong-times">错过 ${m.wrongCount} 次</span></div><h2>${esc(q.stem)}</h2><div class="mistake-item-bottom"><small>上次错选 ${m.lastSelected.join('、')||'未记录'}</small><div><button class="text-link muted" data-act="remove-mistake" data-question="${id}">移出错题库</button><button class="text-link" data-act="review-one" data-question="${id}">重做这道题${icon('arrow')}</button></div></div></article>`;}).join('')}</div>`:`<section class="empty page-empty">${icon('bookmark')}<h2>${total?'当前筛选没有错题':'还没有收集错题'}</h2><p>${total?'试试切换专题或题型。':'答错后可自动加入，也可以在解析中手动收集。'}</p><a href="#home" class="button primary">回到题库开始练习${icon('arrow')}</a></section>`}`;
  }
  function openDialog(title,body,footer='') {
    returnFocus=document.activeElement;
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-heading"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-act="close-dialog" aria-label="关闭对话框">${icon('cross')}</button></div>${body}${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;
    document.body.classList.add('dialog-open');
    setTimeout(()=>$('#modal-root button, #modal-root input, #modal-root select')?.focus(),0);
  }
  function closeDialog() {$('#modal-root').innerHTML='';document.body.classList.remove('dialog-open');returnFocus?.focus?.({preventScroll:true});}
  function openSetup(tid) {
    const t=tMap.get(tid), s=state.sessions[tid]||{type:'all',order:'normal'};
    openDialog(`${t.name} · 练习设置`,`<p class="modal-subtitle">${esc(t.title)}</p><form id="setup-form" data-topic="${tid}"><fieldset class="mode-fieldset"><legend>选择题型</legend><div class="choice-row">${[['all','全部题型',t.total],['single','仅单选',t.single],['multiple','仅多选',t.multiple]].map(([v,label,n])=>`<label class="mode-choice"><input type="radio" name="type" value="${v}" ${s.type===v?'checked':''}><span><b>${label}</b><small>${n} 题</small></span></label>`).join('')}</div></fieldset><fieldset class="mode-fieldset"><legend>选择题目顺序</legend><div class="choice-row order-choices">${[['normal','文档顺序','按原文排列，逐题学习','list'],['random','题目乱序','打乱题目，检验掌握程度','shuffle']].map(([v,label,desc,ic])=>`<label class="mode-choice"><input type="radio" name="order" value="${v}" ${s.order===v?'checked':''}><span>${icon(ic)}<b>${label}</b><small>${desc}</small></span></label>`).join('')}</div></fieldset><p class="mode-note">切换题型或顺序会保留已提交答案；选项顺序保持原文。随机顺序会自动保存，刷新可继续。</p><button class="button primary full-width" type="submit">开始 / 继续练习${icon('arrow')}</button></form>`);
  }
  function beginSession(tid,type,order) {
    const existing=state.sessions[tid];
    if(!existing || existing.type!==type || existing.order!==order) {
      const s=C.session(bank,tid,type,order);
      const first=s.ids.findIndex(id=>!state.answers[id]);
      s.cursor=Math.max(0,first);state.sessions[tid]=s;
    }
    state.lastTopic=tid;save();closeDialog();
    if(location.hash===`#topic/${tid}`)render();else location.hash=`topic/${tid}`;
  }
  function beginReview(ids=wrongIds()) {
    if(!ids.length)return toast('当前筛选没有可复习的错题');
    state.review={ids:ui.wrongOrder==='random'?C.shuffle(ids):[...ids],cursor:0,answers:{},drafts:{},order:ui.wrongOrder,type:ui.wrongType,topicId:ui.wrongTopic};
    save();closeDialog();if(location.hash==='#review')render();else location.hash='review';
  }
  function showSummary() {
    const ctx=context();if(!ctx)return;
    const {s,answers,review,topic}=ctx;
    const done=s.ids.filter(id=>answers[id]).length;
    const correct=s.ids.filter(id=>answers[id]?.correct).length;
    openDialog('本轮练习结果',`<div class="summary-content"><div class="summary-score"><strong>${done?Math.round(correct/done*100):0}<small>%</small></strong><span>已答题目正确率</span></div><div class="summary-numbers"><div><strong>${correct}</strong><small>答对</small></div><div><strong>${done-correct}</strong><small>答错</small></div><div><strong>${s.ids.length-done}</strong><small>未答</small></div></div><p>${review?'复习结束后，错题库内容继续保留。':'重新开始会清除本专题作答记录，错题库内容继续保留。'}</p></div>`,`<button class="button secondary" data-act="close-dialog">继续查看解析</button><button class="button primary" data-act="${review?'restart-review':'reset-topic'}" ${!review?`data-topic="${topic.id}"`:''}>${review?'重新复习本轮':'重新开始本专题'}</button>`);
  }
  function askReset(tid) {
    const t=tMap.get(tid),n=C.stats(bank,state,tid).done;
    openDialog(`重新开始${t.name}？`,`<p class="reset-description">将清除${t.name}的 <b>${n}</b> 条已提交记录、待提交选择及当前题目位置，然后开始新一轮练习。</p><div class="retain-notice">${icon('shield')}错题库中的所有内容继续保留，其他专题不受影响。</div>`,`<button class="button secondary" data-act="close-dialog">取消</button><button class="button primary" data-act="confirm-reset" data-topic="${tid}">确认重新开始</button>`);
  }
  function showData() {
    openDialog('记录与备份',`<div class="data-description">${icon('shield')}<div><h3>${saveOK?'记录保存在当前浏览器':'当前浏览器保存暂不可用'}</h3><p>提交的答案、待提交选择、错题和练习位置都会自动保存在本机。不同设备、不同浏览器的记录分别保存。</p></div></div><p class="backup-note">清理浏览器数据、更换设备或更换网站网址前，请先导出备份。可在另一设备导入，合并作答与错题记录。导入不会覆盖更新的作答记录。</p><div class="backup-actions"><button class="button primary" data-act="export">${icon('download')}导出记录备份</button><button class="button secondary" data-act="import">${icon('upload')}导入并合并记录</button></div><label class="data-toggle"><input id="data-auto-wrong" type="checkbox" ${state.preferences.autoWrong?'checked':''}>答错自动加入错题库</label><p class="data-version">题库：${bank.version} · ${bank.questions.length} 题 · 记录格式 v1</p>`);
  }
  function submit() {
    const ctx=context();if(!ctx)return;
    const q=qMap.get(ctx.s.ids[ctx.s.cursor]);if(ctx.answers[q.id])return;
    const selected=ctx.drafts[q.id]||[];
    if(!selected.length)return toast('请先选择答案');
    const r=C.assess(q,selected);
    ctx.answers[q.id]=r;delete ctx.drafts[q.id];
    if(!r.correct && state.preferences.autoWrong)C.addWrong(state,q,r.selected,r.timestamp);
    save();render();
    $('#answer-result')?.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function navigateQuestion(index) {
    const ctx=context();if(!ctx)return;
    ctx.s.cursor=Math.max(0,Math.min(index,ctx.s.ids.length-1));save();render();
    $('#question-heading')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
  }
  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-act]');if(!btn)return;
    const act=btn.dataset.act,tid=btn.dataset.topic;
    if(btn.disabled)return;
    if(act==='menu'){ui.menu=!ui.menu;return render();}
    if(act==='close-menu'){ui.menu=false;return render();}
    if(act==='group'){ui.group=btn.dataset.value;return render();}
    if(act==='setup')return openSetup(tid);
    if(act==='data')return showData();
    if(act==='close-dialog')return closeDialog();
    if(act==='submit')return submit();
    if(act==='begin-review')return beginReview();
    if(act==='review-one')return beginReview([btn.dataset.question]);
    if(act==='remove-mistake'){delete state.mistakes[btn.dataset.question];save();render();return toast('已移出错题库');}
    if(act==='review-settings'){location.hash='mistakes';return;}
    if(act==='summary')return showSummary();
    if(act==='reset-topic')return askReset(tid);
    if(act==='confirm-reset'){
      const previous=state.sessions[tid]||{type:'all',order:'normal'};
      C.resetTopic(state,bank,tid);state.sessions[tid]=C.session(bank,tid,previous.type,previous.order);
      state.lastTopic=tid;save();closeDialog();
      if(location.hash===`#topic/${tid}`)render();else location.hash=`topic/${tid}`;
      return toast('本专题已重新开始，错题库内容已保留');
    }
    if(act==='export'){
      const data=JSON.stringify({app:'xigai-midterm',exportedAt:new Date().toISOString(),bankVersion:bank.version,state},null,2);
      const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
      const a=document.createElement('a');a.href=url;a.download=`习概复习记录-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);return toast('备份已生成，请保存下载的文件');
    }
    if(act==='import'){$('#import-file').value='';$('#import-file').click();return;}
    const ctx=context();if(!ctx)return;
    const q=qMap.get(ctx.s.ids[ctx.s.cursor]);
    if(act==='prev')return navigateQuestion(ctx.s.cursor-1);
    if(act==='jump')return navigateQuestion(Number(btn.dataset.index));
    if(act==='next'){
      if(ctx.s.cursor<ctx.s.ids.length-1)return navigateQuestion(ctx.s.cursor+1);
      const first=ctx.s.ids.findIndex(id=>!ctx.answers[id]);
      return first<0?showSummary():navigateQuestion(first);
    }
    if(act==='retry'){
      delete ctx.answers[q.id];delete ctx.drafts[q.id];save();render();
      $('#choice-A')?.focus({preventScroll:true});return toast('已清除本题作答，错题库记录保留');
    }
    if(act==='toggle-mistake'){
      if(state.mistakes[q.id]){delete state.mistakes[q.id];toast('已移出错题库');}
      else{C.addWrong(state,q,ctx.answers[q.id].selected);toast('已加入错题库');}
      save();return render();
    }
    if(act==='reshuffle'){
      ctx.s.ids=C.shuffle(ctx.s.ids);ctx.s.cursor=0;save();render();return toast('题目已重新打乱，作答记录保留');
    }
    if(act==='restart-review'){
      state.review={...ctx.s,cursor:0,ids:ctx.s.order==='random'?C.shuffle(ctx.s.ids):[...ctx.s.ids],answers:{},drafts:{}};
      save();closeDialog();render();return toast('本轮错题已重新开始，错题库保留');
    }
  });
  document.addEventListener('submit',e=>{
    if(e.target.id!=='setup-form')return;e.preventDefault();
    const data=new FormData(e.target);beginSession(e.target.dataset.topic,data.get('type'),data.get('order'));
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='topic-search'&&!e.isComposing){ui.query=e.target.value;render();}
  });
  document.addEventListener('compositionend',e=>{
    if(e.target.id==='topic-search'){ui.query=e.target.value;render();}
  });
  document.querySelector('.skip').addEventListener('click',e=>{
    e.preventDefault();$('#main-content').focus();
  });
  document.addEventListener('change',async e=>{
    const el=e.target;
    if(el.name==='answer'){
      const ctx=context();if(!ctx)return;const q=qMap.get(ctx.s.ids[ctx.s.cursor]);
      if(ctx.answers[q.id])return;
      let selected=ctx.drafts[q.id]||[];
      selected=q.type==='single'?[el.value]:el.checked?[...selected,el.value]:selected.filter(v=>v!==el.value);
      ctx.drafts[q.id]=C.validSelection(q,selected);save();return render();
    }
    if(el.id==='auto-wrong'||el.id==='data-auto-wrong'){state.preferences.autoWrong=el.checked;save();return;}
    if(el.id==='wrong-topic'){ui.wrongTopic=el.value;return render();}
    if(el.id==='wrong-type'){ui.wrongType=el.value;return render();}
    if(el.id==='wrong-order'){ui.wrongOrder=el.value;return;}
    if(el.id==='import-file'){
      const file=el.files?.[0];if(!file)return;
      try {
        if(file.size>5*1024*1024)throw new Error('备份文件超过5MB，请选择本题库导出的记录文件');
        const raw=JSON.parse(await file.text());
        if(raw.app!=='xigai-midterm')throw new Error('请选择本题库导出的JSON备份文件');
        state=C.merge(state,raw.state,bank);save();closeDialog();render();toast('记录已合并，错题库与更新的作答均已保留');
      } catch(err){toast('导入失败：'+(err.message||'文件格式有误'));}
    }
  });
  document.addEventListener('keydown',e=>{
    const modal=$('#modal-root .modal');
    if(!modal)return;
    if(e.key==='Escape'){e.preventDefault();closeDialog();return;}
    if(e.key==='Tab'){
      const elements=[...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select, a[href]')];
      const first=elements[0],last=elements[elements.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
    }
  });
  window.addEventListener('hashchange',()=>{ui.menu=false;closeDialog();render();window.scrollTo(0,0);});
  window.addEventListener('storage',e=>{
    if(e.key!==KEY||!e.newValue)return;
    try {state=C.normalise(JSON.parse(e.newValue),bank);render();}catch(err){toast('另一标签页的记录格式异常，当前记录已保留');}
  });
  render();
})();

</script>
</body>
</html>
