强调中央权威和统一领导。","analysis":"民主集中制是根本组织原则和领导制度；群众路线是根本工作路线；实事求是联系思想路线。都是重要概念，但对应考点不同。","tip":"最高原则＝集中统一领导；根本组织原则＝民主集中制。"},"topicId":"supp-4"},{"id":"s4-single-3","type":"single","number":3,"originalNumber":"3","stem":"维护党中央权威和集中统一领导，最关键的是（ ）。","options":["坚决维护习近平同志党中央的核心、全党的核心地位","实行民主集中制","修改党章，加强党中央权力","严明政治纪律"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选3","explanation":{"topic":"维护党中央权威的关键","reason":"按原题，维护党中央集中统一领导首先要体现维护核心地位，A对应这一最关键的政治要求，并同维护党中央权威相统一。","analysis":"民主集中制与政治纪律是相关制度和行为要求，B、D不能代替题干中的核心政治要求；C也不是教材采用的关键表述。","tip":"两个维护将核心地位与党中央权威、集中统一领导相联系。"},"topicId":"supp-4"},{"id":"s4-single-4","type":"single","number":4,"originalNumber":"4","stem":"中国共产党是以（ ）为根本组织原则和领导制度。","options":["群众路线","民主集中制","党章","政治纪律"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选4","explanation":{"topic":"民主集中制","reason":"民主集中制将民主基础上的集中与集中指导下的民主结合，是党的根本组织原则和领导制度，因此B与题干准确对应。","analysis":"群众路线回答怎样联系和依靠群众；党章是根本党内法规；政治纪律规范政治行为。三者不能代替组织原则这一概念。","tip":"民主与集中相结合，既不是各自为政，也不是取消民主。"},"topicId":"supp-4"},{"id":"s4-single-5","type":"single","number":5,"originalNumber":"5","stem":"党的领导制度是我国的（ ）制度","options":["根本制度","重要制度","基本制度","政策策略"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选5","explanation":{"topic":"党的领导制度的层级","reason":"党的领导制度规定事业的领导主体、领导方式和组织保证，在制度体系中具有根本性地位，按原题应选A。","analysis":"基本制度、重要制度与根本制度属于不同层次。党的领导具有统领作用，不能把它理解为某一领域的一般政策或具体机制。","tip":"根本制度中的党的领导制度，对各领域发挥统领作用。"},"topicId":"supp-4"},{"id":"s4-single-6","type":"single","number":6,"originalNumber":"6","stem":"坚持党总揽全局、协调各方的领导核心地位，（ ）形象地说，这就像“众星捧月”，这个“月”就是中国共产党。","options":["习近平","邓小平","毛泽东","江泽民"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选6","explanation":{"topic":"总揽全局协调各方","reason":"原题引述习近平关于领导核心作用的形象比喻，用“众星捧月”说明不同方面围绕共同领导核心协调运行，因此选A。","analysis":"题目问引文归属，B、C、D不是原题所列引文作者。理解比喻时，应看到组织协调和领导核心，而不是将相关机构的职责取消。","tip":"“总揽全局、协调各方”强调领导核心与各方作用相统一。"},"topicId":"supp-4"},{"id":"s4-single-7","type":"single","number":7,"originalNumber":"7","stem":"中国共产党的性质决定了党的宗旨是（ ）。","options":["立党为公、执政为民","以人为本、执政为民","全心全意为人民服务","为实现共产主义而奋斗"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选7","explanation":{"topic":"党的根本宗旨","reason":"党的根本宗旨是全心全意为人民服务，C对应党章中的宗旨要求。宗旨说明政党为什么人、为谁的利益开展工作。","analysis":"立党为公、执政为民属于执政理念和价值要求；实现共产主义是最高理想与最终目标。宗旨、理念、目标有关联，但不是同一概念。","tip":"宗旨记全心全意为人民服务；最高理想和最终目标记共产主义。"},"topicId":"supp-4"},{"id":"s4-single-8","type":"single","number":8,"originalNumber":"8","stem":"（ ）是我国的根本领导制度，居于统领地位。","options":["党的组织原则","党的政治原则","党的领导制度","党的性质宗旨"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选8","explanation":{"topic":"根本领导制度","reason":"题干强调在制度体系中的领导与统领作用，具体对应党的领导制度，C是制度名称，能够涵盖领导体系与运行机制。","analysis":"A、B分别是原则层面，D是性质宗旨层面，均不能直接代替一个制度体系名称。不要将政治概念的相关性视为可互换性。","tip":"问根本领导制度，选党的领导制度。"},"topicId":"supp-4"},{"id":"s4-single-9","type":"single","number":9,"originalNumber":"9","stem":"历史和现实证明，（ ）就没有中国特色社会主义的产生与发展。","options":["没有中国共产党的指导","没有中国共产党的组织","没有中国共产党的领导","没有中国共产党的监督"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选9","explanation":{"topic":"党的领导与事业发展","reason":"本题要求补入中国特色社会主义产生和发展的政治前提，规范表述是中国共产党的领导，C涵盖方向、组织和统筹作用。","analysis":"指导、组织、监督可以是领导活动的具体方面，但单个词不能代替整体领导。题目既考固定表述，也考整体与部分的关系。","tip":"领导是整体概念，不能缩为指导、组织或监督其中一项。"},"topicId":"supp-4"},{"id":"s4-single-10","type":"single","number":10,"originalNumber":"10","stem":"（ ）将党的领导制度明确为我国根本领导制度。","options":["党的十九大","党的十九届三中全会","党的十九届四中全会","党的十九届五中全会"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选10","explanation":{"topic":"十九届四中全会","reason":"2019年十九届四中全会系统部署制度建设与治理现代化，明确党的领导制度在我国制度体系中的根本领导地位，故C对应题干。","analysis":"十九届三中全会重点涉及党和国家机构改革，五中全会部署发展规划；十九大作全面战略部署。会议主题与时间应结合记忆。","tip":"四中全会看制度与治理；三中全会看当时的机构改革部署。"},"topicId":"supp-4"},{"id":"s4-single-11","type":"single","number":11,"originalNumber":"11","stem":"《中国共产党党章》明确规定，中国共产党是中国工人阶级的先锋队，同时是（ ）。","options":["中国人民的先锋队","中华民族的先锋队","中国人民和中华民族的先锋队","中国新阶层的先锋队"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选11","explanation":{"topic":"党的性质中的两个先锋队","reason":"党章同时规定中国共产党是中国工人阶级先锋队、中国人民和中华民族先锋队，C完整体现第二层规定。","analysis":"A、B各只包含一部分，D则换成特定社会群体，不能体现党章中的整体表述。性质判断需要完整准确，不宜拆开漏记。","tip":"两个先锋队：工人阶级；中国人民和中华民族。"},"topicId":"supp-4"},{"id":"s4-single-12","type":"single","number":12,"originalNumber":"12","stem":"（ ）是中国特色社会主义最本质的特征。","options":["以经济建设为中心","以人为本","“五位一体总体布局”","中国共产党的领导"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选12","explanation":{"topic":"最本质的特征","reason":"本题同党的领导核心作用相联系，D中国共产党领导是中国特色社会主义最本质特征，体现其政治方向与组织保证。","analysis":"经济建设中心是基本路线的重要内容，“五位一体”是总体布局，“以人为本”是发展价值相关概念，均不能代替最本质特征。","tip":"最本质特征与制度最大优势对应党的领导。"},"topicId":"supp-4"},{"id":"s4-single-13","type":"single","number":13,"originalNumber":"13","stem":"面对新时代新挑战新要求，（ ）就是战胜艰难险阻，不断取得胜利的制胜法宝。","options":["改进完善党的领导","坚持和加强党的领导","全面推进党的改革","增加党员人数"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选13","explanation":{"topic":"应对挑战的政治保证","reason":"坚持和加强党的领导为统筹资源、确定方向、凝聚力量提供政治保证，题目将其概括为战胜艰难险阻的制胜法宝，B符合要求。","analysis":"增加党员数量不等于提高领导能力；“全面推进党的改革”不是此处规范概括。A也只强调改进完善，未准确对应题干的完整表述。","tip":"面对挑战，既要坚持领导，也要加强领导能力与制度落实。"},"topicId":"supp-4"},{"id":"s4-single-14","type":"single","number":14,"originalNumber":"14","stem":"中国共产党的领导是中国特色社会主义最本质的特征，这是（ ）以来习近平提出的一个重要论断。","options":["党的十八大","党的十五大","党的十九大","党的十七大"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选14","explanation":{"topic":"重要论断的时代背景","reason":"题目所问论断在党的十八大以来的新时代理论与实践中被鲜明提出，A对应这个时期的起点。","analysis":"十九大进一步系统阐述并总结，不等于此前没有形成论断。题干用的是“以来”，应识别历史时期，而不是只找报告明确表述的大会。","tip":"区分十八大以来的时期与十九大集中阐述的会议。"},"topicId":"supp-4"},{"id":"s4-multiple-1","type":"multiple","number":15,"originalNumber":"1","stem":"中国共产党领导是中国特色社会主义最本质的特征，（ ）。","options":["这是在近代以来中国历史发展中形成的","这是由中国最广大人民根本利益决定的","这是实现中华民族伟大复兴历史任务决定的","这决定了中国特色社会主义其他特点和特征"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选1","explanation":{"topic":"党的领导为何具有本质性","reason":"A从历史形成解释，B从人民根本利益解释，C从民族复兴任务解释，D从统领其他特征解释，四项共同说明领导地位的根本性。","analysis":"不能把这一特征只理解成某一时点的选择，而应结合历史过程、利益代表与现实任务。四项之间是互相补充的论证。","tip":"历史、人民利益、复兴任务、统领作用四条线理解。"},"topicId":"supp-4"},{"id":"s4-multiple-2","type":"multiple","number":16,"originalNumber":"2","stem":"中国特色社会主义之所以是社会主义，究其根本就在于（ ）。","options":["坚持科学社会主义基本原则","坚持中国共产党的领导","坚持按劳分配","坚持社会主义市场经济体制"],"answer":["A","B"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选2","explanation":{"topic":"社会主义性质的根本依据","reason":"本题追问根本性质，A科学社会主义基本原则与B党的领导是教材在这一语境下强调的根本依据，因此选择AB。","analysis":"按劳分配、社会主义市场经济属于具体经济制度安排，能够体现社会主义实践，但不能直接替换题干所问的根本性质依据。","tip":"根本性质层面与具体制度形式层面要区分。"},"topicId":"supp-4"},{"id":"s4-multiple-3","type":"multiple","number":17,"originalNumber":"3","stem":"全面加强党的领导，（ ）。","options":["使我们有效应对严峻复杂的国际形势和接踵而至的巨大风险挑战","有力推进了党和国家各项事业的顺利发展","胜利实现了全面建成小康社会的战略目标","开启了全面建设社会主义现代化国家新征程。","在反腐败、脱贫攻坚等重大斗争中，党的全面领导的优势得到充分彰显"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选3","explanation":{"topic":"加强全面领导的实践作用","reason":"五项分别谈应对风险、推进事业、全面小康、新征程及重大斗争，均是原题总结的实践作用，体现领导优势的不同领域。","analysis":"选项不是相互排斥的成果，而是不同层面的历史实践说明。作答时应核对题目所指历史阶段，不能认为某一成果会排除其他成果。","tip":"党的领导作用既看方向统筹，也看具体实践成果。"},"topicId":"supp-4"},{"id":"s4-multiple-4","type":"multiple","number":18,"originalNumber":"4","stem":"健全党的全面领导制度，必须（ ）。","options":["必须完善党在各种组织中发挥领导作用的制度","必须完善党协调各方的机制","必须完善党领导各项事业的具体制度","必须完善人民代表大会制度"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选4","explanation":{"topic":"全面领导制度的具体完善","reason":"原题按领导制度的专门构成，强调在组织中发挥领导作用、协调各方、领导各项事业的具体制度，A、B、C分别对应。","analysis":"人民代表大会制度属于根本政治制度，同党的领导有密切联系，但D不是本题所列三项专门完善要求的直接表述。","tip":"识别组织中的领导、协调机制、各项事业领导制度三方面。"},"topicId":"supp-4"},{"id":"s4-multiple-5","type":"multiple","number":19,"originalNumber":"5","stem":"党的领导是做好党和国家各项工作的根本保证，是我国（ ）的根本点，绝对不能有丝毫动摇。","options":["民族团结","社会稳定","政治稳定","经济发展"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选5","explanation":{"topic":"领导与各领域发展的联系","reason":"民族团结、社会稳定、政治稳定、经济发展互相联系，党的领导对这些领域发挥整体方向与协调保证作用，原文四项均成立。","analysis":"题目不是让你选择最重要的一个领域。领导作用涉及整体事业，因此不能因其中某一方面更突出而漏选其他方面。","tip":"整体领导联系政治、经济、社会与民族关系多个领域。"},"topicId":"supp-4"},{"id":"s4-multiple-6","type":"multiple","number":20,"originalNumber":"6","stem":"确保党始终总揽全局、协调各方，必须增强政治意识（ ），自觉维护党中央权威和集中统一领导，自觉在思想上政治上行动上同党中央保持高度一致。","options":["大局意识","核心意识","中心意识","看齐意识"],"answer":["A","B","D"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选6","explanation":{"topic":"四个意识","reason":"四个意识是政治意识、大局意识、核心意识、看齐意识。题干已给出政治意识，因此需补入A、B、D三个选项。","analysis":"C“中心意识”不是固定概括中的项目。遇到补全概念题，要同时看题干已经提供了什么，避免以近义词替换规范名称。","tip":"政治、大局、核心、看齐四个词准确记忆。"},"topicId":"supp-4"},{"id":"s4-multiple-7","type":"multiple","number":21,"originalNumber":"7","stem":"党是最高政治领导力量，这是由我国（ ）和（ ）所决定的。","options":["国家性质","国体政体","经济基础","经济制度"],"answer":["A","B"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选7","explanation":{"topic":"最高政治领导力量的制度依据","reason":"本题从国家性质和国体政体两个方面说明党的政治领导地位，A、B对应这一制度政治层面的概括。","analysis":"经济基础、经济制度与政治关系密切，但C、D不是题干采用的两个直接依据。这里不是说经济与政治无联系，而是考特定层次。","tip":"国家性质与国体政体，对应此题的政治制度依据。"},"topicId":"supp-4"},{"id":"s4-multiple-8","type":"multiple","number":22,"originalNumber":"8","stem":"坚持和完善党的领导，是（ ）。","options":["党和国家的根本所在、命脉所在","全国各族人民的利益所在、幸福所在","中国特色社会主义最本质的特征","中国特色社会主义制度的最大优势"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选8","explanation":{"topic":"坚持完善党的领导的意义","reason":"A、B说明领导同党和国家、人民利益的关系；C、D分别指出本质特征与制度优势。四项虽角度不同，都说明领导的重要地位。","analysis":"不要将“最本质特征”和“最大优势”理解成只能选其中一项。一个概念可以从性质、制度效能和人民利益不同层面展开。","tip":"本质特征、最大优势、根本所在、人民利益彼此联系。"},"topicId":"supp-4"},{"id":"s4-multiple-9","type":"multiple","number":23,"originalNumber":"9","stem":"中国共产党是中国特色社会主义事业的（ ）。","options":["开创造","推动者","引领者","发动者"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选9","explanation":{"topic":"中国特色社会主义事业的领导主体","reason":"党在事业中承担开创、推动、引领的作用，原题A意为“开创者”，与B、C共同构成教材采用的三种角色概括。","analysis":"“发动者”属于一般行动描述，D不是此处三角色的固定表述。本题需要记住整体事业层面的角色，而非任意扩展近义词。","tip":"开创者、推动者、引领者三者准确对应。"},"topicId":"supp-4"},{"id":"s4-multiple-10","type":"multiple","number":24,"originalNumber":"10","stem":"党章规定的民主集中制要求（ ）。","options":["党员个人服从党的组织","少数服从多数","下级组织服从上级组织","全党各个组织和全体党员服从党的全国代表大会和中央委员会"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选10","explanation":{"topic":"民主集中制的四个服从","reason":"个人服从组织、少数服从多数、下级服从上级、全党服从党的全国代表大会和中央委员会，构成党章规定的四个服从。","analysis":"四项同时说明组织内部不同层级的关系，不能只选个人与组织、遗漏全党与中央的关系。它们在民主集中制原则下共同运行。","tip":"个人—组织、少数—多数、下级—上级、全党—全国代表大会和中央委员会。"},"topicId":"supp-4"},{"id":"s4-multiple-11","type":"multiple","number":25,"originalNumber":"11","stem":"坚持和加强党的全面领导，使党的（ ）显著增强.","options":["政治领导力","思想引领力","群众组织力","社会号召力"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 多选11","explanation":{"topic":"党的四种能力","reason":"政治领导力、思想引领力、群众组织力、社会号召力分别涉及政治方向、思想指导、组织群众与凝聚社会，四项共同构成能力概括。","analysis":"能力建设并非只看组织数量或经济指标。这四种能力相互配合，能够帮助理解领导作用如何转化为实际凝聚与行动能力。","tip":"四种能力分别记政治、思想、群众、社会。"},"topicId":"supp-4"}]},{"id":"supp-5","label":"补充5","chapter":4,"title":"坚持以人民为中心","kind":"supp","source":"习思想教材配套练习题 第四章 坚持以人民为中心(2).docx","questions":[{"id":"s5-single-1","type":"single","number":1,"originalNumber":"1","stem":"（ ）是立党为公、执政为民的本质要求。","options":["贯彻新发展理念","实现高质量发展","为民造福","政治立场"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选1","explanation":{"topic":"立党为公执政为民的本质要求","reason":"为民造福把人民立场落实到实际利益和生活改善中，是立党为公、执政为民的本质要求，因此C符合题意。","analysis":"新发展理念和高质量发展属于实现发展目标的理念与路径；政治立场是较宽泛层面。题干问本质要求，应抓住执政行为的人民利益指向。","tip":"立党为公、执政为民最终落实到为民造福。"},"topicId":"supp-5"},{"id":"s5-single-2","type":"single","number":2,"originalNumber":"2","stem":"（ ）始终是党的生命线和根本工作路线，是我们党永葆青春活力和战斗力的重要传家宝。","options":["群众路线","经济路线","人民立场","政治立场"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选2","explanation":{"topic":"党的群众路线","reason":"群众路线使党坚持为了群众、依靠群众并联系群众实践，被概括为生命线和根本工作路线，A是规范对应。","analysis":"人民立场属于根本立场，政治立场较为宽泛，“经济路线”不是这组固定表述。工作路线与政治立场相关，但概念层次不同。","tip":"生命线与根本工作路线，均对应群众路线。"},"topicId":"supp-5"},{"id":"s5-single-3","type":"single","number":3,"originalNumber":"3","stem":"（ ）是新时代坚持和发展中国特色社会主义的根本立场，是贯穿党治国理政全部活动的一条红线。","options":["把马克思主义基本原理与中国实际相结合","坚持以人民为中心","坚持和发展中国特色社会主义","“五位一体”总体布局"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选3","explanation":{"topic":"以人民为中心的根本立场","reason":"以人民为中心回答治国理政为了谁、依靠谁、成果由谁共享，贯穿各领域工作，因此B符合根本立场与红线的要求。","analysis":"A是理论创新路径，C是总体主题，D是总体布局。不能用主题、方法或布局替代人民利益这一价值立场。","tip":"根本立场看人民，基本布局看五位一体。"},"topicId":"supp-5"},{"id":"s5-single-4","type":"single","number":4,"originalNumber":"4","stem":"中国共产党区别于其他政党的显著标志是（ ）。","options":["深化改革","人民立场","促进高质量发展","实事求是"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选4","explanation":{"topic":"人民立场的政党特征","reason":"教材强调人民立场体现马克思主义政党的政治属性，说明党同人民利益的关系，是题干所问区别于其他政党的显著标志。","analysis":"深化改革、高质量发展是重要任务，实事求是是思想路线的相关要求。题干在人民中心章节中问政治立场，B对应这一层次。","tip":"人民立场回答代表谁、服务谁的根本问题。"},"topicId":"supp-5"},{"id":"s5-single-5","type":"single","number":5,"originalNumber":"5","stem":"（ ）是党执政的最大底气，也是党执政最深厚的根基。","options":["实现共产主义理想","物质基础雄厚","有丰富经验","人民"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选5","explanation":{"topic":"执政的社会根基","reason":"党的力量来自人民的支持和参与，人民构成执政最深厚的根基与最大底气，因此D正确。","analysis":"理想、物质基础和工作经验均有作用，但不能代替人民这一主体。没有人民的支持，单凭资源或经验无法说明深厚执政根基。","tip":"力量和根基来自人民，不能只从物质条件理解。"},"topicId":"supp-5"},{"id":"s5-single-6","type":"single","number":6,"originalNumber":"6","stem":"（ ）是党的工作的最高裁决者和最终评判者。","options":["实践","人民","国务院","党中央"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选6","explanation":{"topic":"人民对工作的评判","reason":"工作成效要落实为人民生活改善与利益维护，因此人民是最高裁决者和最终评判者，B直接对应题干的评判主体。","analysis":"实践检验认识的真理性，与本题问人民对党工作的最终评价不是同一命题。国务院、党中央也不是此处“最终评判者”的答案。","tip":"真理标准看实践；工作最终评判主体看人民。"},"topicId":"supp-5"},{"id":"s5-single-7","type":"single","number":7,"originalNumber":"7","stem":"（ ）是贯彻群众路线的有效途径。","options":["以人民为中心","调查研究","把人民对美好生活作为奋斗目标","构建新发展格局"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选7","explanation":{"topic":"调查研究与群众路线","reason":"调查研究使工作者了解真实民情、群众需求与实际困难，并把群众经验转化为政策和行动，是贯彻群众路线的有效途径。","analysis":"以人民为中心是立场，人民美好生活是目标，新发展格局是发展战略。题干问具体工作途径，应选调查研究这一方法。","tip":"群众路线落到工作中，重要方法是深入实际开展调查研究。"},"topicId":"supp-5"},{"id":"s5-single-8","type":"single","number":8,"originalNumber":"8","stem":"我们党讲宗旨，讲了很多话，但说到底还是（ ）这句话。","options":["以人民为中心","为人民服务","坚持人民主体地位","群众路线是根本工作路线"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选8","explanation":{"topic":"为人民服务的宗旨","reason":"党的宗旨归结为服务人民，B准确对应题干所引述的核心意思，强调一切工作应指向人民利益。","analysis":"以人民为中心、人民主体地位、群众路线都与宗旨相关，但题干问“说到底这句话”，应还原为人民服务这一直接表述。","tip":"宗旨是为人民服务，群众路线是落实宗旨的工作路线。"},"topicId":"supp-5"},{"id":"s5-single-9","type":"single","number":9,"originalNumber":"9","stem":"新时代要坚持以人民为中心，在推动社会全面进步中促进（ ）的全面发展。","options":["人","经济","政治","文化"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选9","explanation":{"topic":"人的全面发展","reason":"社会进步最终要促进人的能力、素质、权益和生活等方面全面发展，因此题干“全面发展”的对象是人，选A。","analysis":"经济、政治、文化是社会发展的领域，能够创造人的全面发展的条件，但不是此处需要填写的主体对象。","tip":"以人民为中心，发展最终落脚到人。"},"topicId":"supp-5"},{"id":"s5-single-10","type":"single","number":10,"originalNumber":"10","stem":"（ ）是社会主义的本质要求，是中国式现代化的重要特征。","options":["共同富裕","社会和谐","人民主体地位","解决社会主要矛盾"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选10","explanation":{"topic":"共同富裕的地位","reason":"共同富裕体现社会主义的价值要求，也是中国式现代化区别于贫富严重分化模式的重要特征，A同时符合题干两个判断。","analysis":"社会和谐、人民主体地位、主要矛盾解决分别属于相关领域，不能替换题干这组固定的性质与特征表述。","tip":"共同富裕既是本质要求，也是中国式现代化的重要特征。"},"topicId":"supp-5"},{"id":"s5-single-11","type":"single","number":11,"originalNumber":"11","stem":"实现全体人民共同富裕的宏伟目标，最终靠的是（ ）。","options":["人","奋斗","实干","发展"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选11","explanation":{"topic":"共同富裕的物质基础","reason":"共同富裕需要持续增加社会财富并提升发展质量，最终以发展提供物质基础，因此D切合题干。分配制度在这一基础上促进共享。","analysis":"奋斗、实干和人的作用都重要，但题目追问总体物质基础，不能只用工作态度代替发展。也不能理解成仅靠分配存量即可实现共同富裕。","tip":"发展做大财富基础，合理分配促进成果共享。"},"topicId":"supp-5"},{"id":"s5-single-12","type":"single","number":12,"originalNumber":"12","stem":"党执政后的最大危险是（ ）。","options":["消极腐败","改革出问题","没有坚持公有制的主体地位","脱离群众"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选12","explanation":{"topic":"脱离群众的危险","reason":"执政后若丧失同人民的联系，就会失去支持、难以了解实际需求，因此党章强调最大危险是脱离群众，D符合原文。","analysis":"腐败等问题可能伤害群众利益，也可能造成脱离群众，但不是这句固定论断中的答案。要区分具体风险与根本社会联系的风险。","tip":"最大危险是脱离群众，最大政治优势是密切联系群众。"},"topicId":"supp-5"},{"id":"s5-single-13","type":"single","number":13,"originalNumber":"13","stem":"我们党的最大政治优势是（ ）。","options":["党领导一切","走中国特色社会主义道路","人多力量大","密切联系群众"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 单选13","explanation":{"topic":"密切联系群众的政治优势","reason":"密切联系群众使党能够了解人民需求、汇集群众经验并凝聚行动力量，因此D是题干所指最大政治优势。","analysis":"数量多不自动转化为政治优势；道路选择与党的领导同题意相关，但不能替代与群众联系这一特定判断。","tip":"联系群众的优势与脱离群众的危险成对记忆。"},"topicId":"supp-5"},{"id":"s5-multiple-1","type":"multiple","number":14,"originalNumber":"1","stem":"对“江山就是人民、人民就是江山”的理解是（ ）。","options":["闪耀着历史唯物主义的真理光芒","充分说明我国国体政体的人民性","人民是我们党的生命之根、执政之基、力量之源","这是由我们党的性质、宗旨决定的"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选1","explanation":{"topic":"江山与人民的关系","reason":"四项从历史创造主体、国家制度人民性、执政力量来源及党性质宗旨说明人民的根本地位，均符合“江山就是人民”的教材阐释。","analysis":"这里的“江山”应从国家政权、国家发展与人民利益理解，不能只当作地理山河。人民既创造历史，也构成国家发展的价值主体。","tip":"理解这句话要抓住人民是历史主体和国家发展的根本目的。"},"topicId":"supp-5"},{"id":"s5-multiple-2","type":"multiple","number":15,"originalNumber":"2","stem":"坚持人民立场，就要做到（ ）。","options":["与人民风雨同舟、生死与共","始终牢记党的初心和使命","始终保持党同人民群众的血肉联系","坚持以人民为中心的执政理念"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选2","explanation":{"topic":"坚持人民立场的要求","reason":"与人民共同奋斗、牢记初心使命、保持血肉联系、坚持人民中心理念，分别体现情感联系、价值目标、工作关系与执政要求，四项均应选。","analysis":"人民立场不能只停留在口号，需要体现在决策、行动和日常联系中。四项是落实同一立场的不同方面，不应只选择抽象理念。","tip":"立场、情怀、联系与实践共同体现坚持人民立场。"},"topicId":"supp-5"},{"id":"s5-multiple-3","type":"multiple","number":16,"originalNumber":"3","stem":"党依靠人民创造历史伟业，就要做到（ ）。","options":["尊重人民主体地位","尊重人民首创精神","激发人民群众的创新创造活力","总结、概括人民群众实践中形成的新鲜经验"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选3","explanation":{"topic":"依靠人民创造历史","reason":"尊重主体地位说明人民的历史作用；尊重首创精神、激发创造活力、总结实践经验，说明如何把群众作用转化为创新与发展动力。","analysis":"不能把依靠人民理解成仅让群众执行既定安排，也要重视群众经验与创造。四项从主体认识到实践方法形成完整链条。","tip":"尊重主体、鼓励创造、总结经验，是依靠人民的重要落实方式。"},"topicId":"supp-5"},{"id":"s5-multiple-4","type":"multiple","number":17,"originalNumber":"4","stem":"领导干部要树立这样的政绩观（ ）。","options":["以人民满意不满意作为检验工作的最终评判标准","把为民办事、为民造福作为最重要的政绩","把为老百姓办了多少好事实事作为检验政绩的重要标准","以国内生产总值增长率论英雄","大搞劳民伤财的形象工程和政绩工程"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选4","explanation":{"topic":"正确政绩观","reason":"A、B、C以人民满意、实际利益和好事实事评价工作，符合为民造福的政绩观。工作成绩要经得起实践、人民和历史检验。","analysis":"D只看GDP增长，容易忽略质量、民生与长期影响；E浪费资源、损害群众利益，违背正确政绩观。不能用数字或表面形象替代真实成效。","tip":"评价政绩看人民实际受益，避免唯GDP与形象工程。"},"topicId":"supp-5"},{"id":"s5-multiple-5","type":"multiple","number":18,"originalNumber":"5","stem":"坚持以人民为中心的发展思想，要（ ）。","options":["坚持和贯彻党的群众路线","把以人民为中心的发展思想切实贯穿到党和国家事业各方面","推动全体人民共同富裕取得更为明显的实质性进展。","总结、概括人民群众实践中形成的新鲜经验"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选5","explanation":{"topic":"人民中心思想的实践要求","reason":"群众路线、贯彻事业各方面、促进共同富裕、总结群众经验，分别涉及工作方法、落实范围、发展目标与创新来源，四项均符合要求。","analysis":"以人民为中心是贯穿性要求，不只是社会保障或某一项民生工作。党和国家各领域工作都需要考虑人民利益与参与。","tip":"人民中心要落实到各领域、各环节和具体成效。"},"topicId":"supp-5"},{"id":"s5-multiple-6","type":"multiple","number":19,"originalNumber":"6","stem":"对党的群众路线的理解，（ ）。","options":["其内容是一切为了群众，一切依靠群众，从群众中来，到群众中去","它是唯物史观关于人民群众是历史创造者的原理在党的工作中的运用","它充分体现了以人民为中心的根本政治立场","它是我们党永葆青春活力和战斗力的重要传家宝"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选6","explanation":{"topic":"群众路线的内容与依据","reason":"A是群众路线的四项内容；B说明其唯物史观依据；C说明政治立场；D说明实践作用。四项从定义、理论、价值与效能展开，均成立。","analysis":"一切为了群众与一切依靠群众分别强调目的和主体，从群众中来到群众中去强调形成与落实工作意见的过程，不能漏掉其中一端。","tip":"四句话分别看目的、主体、认识来源和实践归宿。"},"topicId":"supp-5"},{"id":"s5-multiple-7","type":"multiple","number":20,"originalNumber":"7","stem":"实现共同富裕 ，（ ）。","options":["这是中国特色社会主义的本质要求","这是中国式现代化的重要特征","这不仅是经济问题，而且是关系党的执政基础的重大政治问题","这是解决我国发展不平衡不充分问题的现实需要","要处理好先富和共富的关系"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选7","explanation":{"topic":"共同富裕的多方面意义","reason":"共同富裕关联社会主义性质、现代化特征、执政基础与发展问题，A至D分别说明这些意义；E强调先富带后富的实践关系。","analysis":"共同富裕既不是单纯收入统计，也不意味着所有人在同一时间同一水平富裕。它包括逐步缩小不合理差距与增强公平发展的条件。","tip":"共同富裕不是平均主义，需要处理先富与共富的关系。"},"topicId":"supp-5"},{"id":"s5-multiple-8","type":"multiple","number":21,"originalNumber":"8","stem":"扎实推进共同富裕，要把握好（ ）的原则。","options":["鼓励勤劳创新致富","坚持基本经济制度","量力而行","坚持循序渐进","整齐划一"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选8","explanation":{"topic":"促进共同富裕的原则","reason":"勤劳创新创造财富，基本经济制度提供制度基础，量力而行对应实际条件，循序渐进对应过程安排，因此A、B、C、D都成立。","analysis":"E“整齐划一”把共同富裕误解为同等收入或同步达到同一水平，忽视地区、行业和个体的合理差异，也不符合逐步推进的要求。","tip":"共同富裕强调共同受益，不等于平均分配或整齐划一。"},"topicId":"supp-5"},{"id":"s5-multiple-9","type":"multiple","number":22,"originalNumber":"9","stem":"邓小平指出：“社会主义最大的优越性就是（ ），这是体现社会主义本质的一个东西。”","options":["党的领导","共同富裕","办事效率高","走和平发展道路"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选9","explanation":{"topic":"共同富裕与社会主义优越性","reason":"这句论述强调共同富裕体现社会主义的本质与发展目的，B是唯一对应项，不能把其他重要概念放入原句。","analysis":"党的领导、效率和和平发展分别属于其他相关命题。原题虽然列在多选题部分，但此题参考答案只有B，选择一个选项即可提交。","tip":"多选题分类不保证每题至少两个正确选项，本题按原文只选B。","note":"原文题型为多选，答案为B；程序保留原文分类及答案，并允许只勾选B提交。"},"topicId":"supp-5"},{"id":"s5-multiple-10","type":"multiple","number":23,"originalNumber":"10","stem":"党依靠人民，从小到大、从弱到强，打败了强大的内外敌人，取得了新民主主义革命胜利，实现了（ ），建立了中华人民共和国。","options":["人民幸福","民族独立","人民解放","国家富强"],"answer":["B","C"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选10","explanation":{"topic":"新民主主义革命的成果","reason":"新民主主义革命胜利实现民族独立、人民解放，并建立新中国，B、C准确对应这一历史阶段的主要成果。","analysis":"人民幸福、国家富强是长期发展的目标，不能把它们理解为新中国成立时已经全面实现。应区分革命成果与后续建设任务。","tip":"革命胜利重点记民族独立与人民解放。"},"topicId":"supp-5"},{"id":"s5-multiple-11","type":"multiple","number":24,"originalNumber":"11","stem":"党依靠人民，推进（ ）走出一条中国特色社会主义道路。","options":["改革开放","社会主义现代化建设","全面建成小康社会","社会主义现代化国家"],"answer":["A","B"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选11","explanation":{"topic":"改革开放与现代化建设","reason":"题目对应改革开放和社会主义现代化建设新时期，A、B是这一历史进程中的主要实践内容，并在探索中形成中国特色社会主义道路。","analysis":"全面建成小康社会是之后实现的重要目标成果；D“社会主义现代化国家”是目标对象，不能直接同“推进”构成此处完整历史表述。","tip":"这段历史重点看改革开放与社会主义现代化建设。"},"topicId":"supp-5"},{"id":"s5-multiple-12","type":"multiple","number":25,"originalNumber":"12","stem":"党依靠人民，推动党和国家事业（ ），推动中国特色社会主义进入新时代。","options":["经济社会发展","人民生活更加富裕","发生历史性变革","取得历史性成就"],"answer":["C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选12","explanation":{"topic":"新时代的历史成就与变革","reason":"取得历史性成就、发生历史性变革，是对新时代党和国家事业变化的成对概括，D、C分别对应这两项。","analysis":"A、B涉及相关进展，但不是原题所要求的这组整体概括。题干考固定搭配时，需结合前后文语法与概念，而非把所有积极描述都纳入。","tip":"成就是取得的，变革是发生的，二者成对记。"},"topicId":"supp-5"},{"id":"s5-multiple-13","type":"multiple","number":26,"originalNumber":"13","stem":"以人民为中心是我们党（ ）的生动体现，是全心全意为人民服务的时代彰显。","options":["立党为公","落实群众路线","坚持宗旨原则","执政为民"],"answer":["A","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选13","explanation":{"topic":"立党为公执政为民","reason":"原题采用“以人民为中心是立党为公、执政为民的生动体现”这一表述，A、D分别补入两端，故按原文选择AD。","analysis":"群众路线与宗旨原则也有内在联系，但B、C不是此句中所需的成对概括。此题考原文表述，不是判断相关概念是否具有人民性。","tip":"人民中心与立党为公、执政为民对应。"},"topicId":"supp-5"},{"id":"s5-multiple-14","type":"multiple","number":27,"originalNumber":"14","stem":"以人民为中心的发展思想，不是高高在上的宣传口号，绝对不能只停留在口头上，要全方位贯穿于经济社会发展的各个环节，体现在人民群众（ ）的扎实提升上。","options":["使命感","获得感","幸福感","安全感"],"answer":["B","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选14","explanation":{"topic":"人民生活改善的三个感受","reason":"获得感强调实际受益，幸福感强调生活质量与体验，安全感强调权益、生活和环境保障，B、C、D体现人民中心思想的实践成效。","analysis":"使命感强调责任意识，不属于这里衡量人民生活改善的三项感受。不能用一般积极情感替代民生效果的规范指标。","tip":"人民生活效果看获得感、幸福感、安全感。"},"topicId":"supp-5"},{"id":"s5-multiple-15","type":"multiple","number":28,"originalNumber":"15","stem":"（ ）与（ ）相统一，既是马克思主义的价值追求，也是社会主义的本质要求，更是中国共产党人的奋斗目标。","options":["促进人的全面发展","促进社会稳定","促进共同富裕","促进经济发展"],"answer":["A","C"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选15","explanation":{"topic":"人的发展与共同富裕","reason":"人的全面发展与共同富裕相统一，既关注个体能力、权利与生活，也关注全体人民共享发展成果，因此A、C符合题干。","analysis":"社会稳定、经济发展是重要条件和工作领域，但不是本题中的两项统一关系。不能把实现条件与最终价值追求混为一谈。","tip":"人的全面发展与全体人民共同富裕需要共同推进。"},"topicId":"supp-5"},{"id":"s5-multiple-16","type":"multiple","number":29,"originalNumber":"16","stem":"坚持以人民为中心的发展思想，就要在高质量发展中促进共同富裕，做到（ ）","options":["发展为了人民","发展幸福人民","发展依靠人民","发展成果由人民共享"],"answer":["A","C","D"],"note":"","origin":"习思想教材配套练习题 第四章 坚持以人民为中心 · 多选16","explanation":{"topic":"发展的目的主体与成果","reason":"为了人民说明目的，依靠人民说明主体，由人民共享说明成果归属，A、C、D组成以人民为中心的发展要求。","analysis":"B“发展幸福人民”不是这组三项规范表达。它语义积极，却不能替代发展为了人民、依靠人民与成果共享的概念结构。","tip":"为了谁、依靠谁、成果归谁，分别对应三个要求。"},"topicId":"supp-5"}]},{"id":"supp-6","label":"补充6","chapter":5,"title":"全面深化改革开放","kind":"supp","source":"习思想教材配套练习题 第五章 全面深化改革(2).docx","questions":[{"id":"s6-single-1","type":"single","number":1,"originalNumber":"1","stem":"习近平强调：“（ ）是决定当代中国命运的关键一招，也是决定实现’两个一百年’奋斗目标、实现中华民族伟大复兴的关键一招。”","options":["高质量发展","改革开放","全面依法治国","文化自信"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选1","explanation":{"topic":"改革开放的关键作用","reason":"改革开放为制度完善、生产力发展和对外交流提供持续动力，题干“决定命运的关键一招”对应B改革开放。","analysis":"高质量发展是发展主题，依法治国是治理的重要方式，文化自信是精神层面要求。三者有作用，但不对应此句关键一招的固定表述。","tip":"关键一招对应改革开放，既看改革也看开放。"},"topicId":"supp-6"},{"id":"s6-single-2","type":"single","number":2,"originalNumber":"2","stem":"全面深化改革的总目标是（ ）。","options":["推进国家治理体系和治理能力现代化","完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化","进一步解放思想、发展社会生产力","赋予社会主义新的生机活力，推进国家治理体系和治理能力现代化"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选2","explanation":{"topic":"改革总目标的完整性","reason":"B同时包括完善和发展制度、推进治理体系和能力现代化，构成改革总目标的完整概括，不能缺少任何一端。","analysis":"A仅给出治理现代化，C着眼生产力，D没有准确表达制度方向。单选题应选择范围与关键词都完整的答案，而不是只选其中一部分。","tip":"制度方向与治理效能共同构成改革总目标。"},"topicId":"supp-6"},{"id":"s6-single-3","type":"single","number":3,"originalNumber":"3","stem":"中国坚持对外开放的基本国策，坚定奉行（ ）的开放战略。","options":["互利共赢","不结盟","“一带一路”倡议","构建人类命运共同体"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选3","explanation":{"topic":"互利共赢的开放战略","reason":"对外开放强调同其他国家通过合作实现共同受益，原题所问的开放战略是互利共赢，因此A正确。","analysis":"不结盟属于外交关系的一类原则，“一带一路”是合作倡议，人类命运共同体是国际关系和全球发展理念，不能代替开放战略名称。","tip":"开放战略记互利共赢，共建原则另记共商共建共享。"},"topicId":"supp-6"},{"id":"s6-single-4","type":"single","number":4,"originalNumber":"4","stem":"“一带一路”建设，坚持（ ）原则，机会和成果属于全世界。","options":["互利共赢","共商共建共享","共商共建","平等互惠"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选4","explanation":{"topic":"一带一路共建原则","reason":"共商重在协商参与，共建重在共同投入和实施，共享重在合作成果受益，三者构成共商共建共享原则，因此B最完整。","analysis":"C遗漏共享，A与D属于相关合作价值，但不是题干所问的完整共建原则。尤其题干说“机会和成果”，提示不能缺少共享这一端。","tip":"共商、共建、共享分别看决策、实施、成果。"},"topicId":"supp-6"},{"id":"s6-single-5","type":"single","number":5,"originalNumber":"5","stem":"（ ）是新时代全面深化改革开放的思想前提。","options":["实事求是","解放思想","开拓创新","贯彻新发展理念"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选5","explanation":{"topic":"解放思想的前提作用","reason":"改革要突破不合时宜的观念与思维定式，才能发现问题、探索新的制度和实践办法，B解放思想对应思想前提。","analysis":"实事求是要求从实际出发，创新与新发展理念也很重要，但题干问解除思想束缚的前提作用，而不是全部改革思想原则。","tip":"改革思想前提记解放思想，同时以实事求是检验方案。"},"topicId":"supp-6"},{"id":"s6-single-6","type":"single","number":6,"originalNumber":"6","stem":"党的十九大提出，到（ ）“各方面制度更加完善，国家治理体系和治理能力现代化基本实现”。","options":["2035年","2030年","2025年","2020年"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选6","explanation":{"topic":"2035年治理目标","reason":"题干引用十九大关于基本实现现代化阶段的治理目标，2035年是该目标对应的时间，因此选择A。","analysis":"不能将改革文件中不同阶段的2020年任务或其他规划时间与十九大的2035年目标混用。报告、时间节点和目标表述需要一起记。","tip":"十九大这条治理现代化目标，对应2035年。"},"topicId":"supp-6"},{"id":"s6-single-7","type":"single","number":7,"originalNumber":"7","stem":"中国特色社会主义制度和国家治理体系是以（ ）为指导、植根中国大地、具有深厚中华文化根基、深得人民拥护的制度和治理体系。","options":["社会主义","中国特色社会主义","马克思主义","毛泽东思想"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选7","explanation":{"topic":"制度治理体系的理论指导","reason":"我国制度与治理体系以马克思主义为理论指导，并在中国实践和文化基础上发展，C对应题干的指导思想层面。","analysis":"中国特色社会主义可以指事业、道路或制度，社会主义是社会性质层面；毛泽东思想是马克思主义中国化的重要成果，但不足以替代题干的总体理论指导名称。","tip":"理论指导看马克思主义，实践基础看中国实际。"},"topicId":"supp-6"},{"id":"s6-single-8","type":"single","number":8,"originalNumber":"8","stem":"坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化，不仅要建立完善的制度体系，还要在不断提高（ ）上狠下功夫。","options":["民主与法治","制度创新和社会和谐","社会发展和经济增速","制度执行力和治理能力"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选8","explanation":{"topic":"制度执行与治理能力","reason":"制度建设不仅要有规则，还要将规则有效执行并转化为治理效果，D制度执行力和治理能力对应从制度设计到实际运行的要求。","analysis":"其他选项涉及相关目标，却没有准确回答“有制度之后怎样落实”。不能把制度文本完善直接等同于治理能力已经提升。","tip":"制度优势需要通过有效执行转化为治理效能。"},"topicId":"supp-6"},{"id":"s6-single-9","type":"single","number":9,"originalNumber":"9","stem":"（ ）作出了全面深化改革的决定。","options":["党的十八大","党的十八届三中全会","党的十九大","党的十九届六中全会"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选9","explanation":{"topic":"十八届三中全会与全面改革","reason":"2013年十八届三中全会通过全面深化改革的重要决定，对改革目标、方向和多个领域任务作出部署，因此B准确。","analysis":"十八大部署总体任务，十九大与十九届六中全会处于之后阶段。此题考改革决定的通过会议，不能只选任意重要党代会。","tip":"2013年十八届三中全会，对应全面深化改革决定。"},"topicId":"supp-6"},{"id":"s6-single-10","type":"single","number":10,"originalNumber":"10","stem":"全面深化改革能否顺利推进，关键取决于党，取决于（ ）。","options":["全体人民的共同参与","党的集中统一领导","全方位对外开放","社会主义的发展方向"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选10","explanation":{"topic":"改革的集中统一领导","reason":"全面改革涉及部门、地区与利益协调，需要统一方向和统筹安排，因此题干将党的集中统一领导作为关键，B正确。","analysis":"人民参与和对外开放重要，但不能代替全局领导与组织协调。改革方向也是要求，而题目直接问顺利推进的领导关键。","tip":"全面改革具有系统性，必须在集中统一领导下推进。"},"topicId":"supp-6"},{"id":"s6-single-11","type":"single","number":11,"originalNumber":"11","stem":"（ ）是运用国家制度管理国家各方面事务的能力。","options":["治理能力","治理体系","管理能力","协调能力"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选11","explanation":{"topic":"治理体系与治理能力","reason":"治理能力指运用制度管理社会和国家事务的实际本领，A对应“能力”的定义；治理体系则指制度和组织运行的系统安排。","analysis":"体系回答用什么制度与机制，能力回答能否有效运用。一般管理能力、协调能力只覆盖部分治理活动，不能代替整体概念。","tip":"体系是制度安排，能力是运用制度的实际本领。"},"topicId":"supp-6"},{"id":"s6-single-12","type":"single","number":12,"originalNumber":"12","stem":"（ ），习近平先后提出共建“丝绸之路经济带”和“21世纪海上丝绸之路”的重大倡议。","options":["2015年9月和10月","2014年9月和10月","2013年9月和10月","2012年9月和10月"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选12","explanation":{"topic":"一带一路倡议的提出时间","reason":"2013年9月提出丝绸之路经济带倡议，10月提出21世纪海上丝绸之路倡议，两个时间均在2013年，故C正确。","analysis":"各选项月份相同，区别在年份。不能因为后来发布实施文件，就把文件发布时间误认为倡议首次提出时间。","tip":"2013年，9月陆上经济带、10月海上丝绸之路。"},"topicId":"supp-6"},{"id":"s6-single-13","type":"single","number":13,"originalNumber":"13","stem":"中阿新闻交流中心、中阿电子图书馆门户网站正式落地；“汉语热”在阿拉伯国家持续升温，沙特、阿联酋、埃及宣布将中文教学纳入国民教育体系。上述现象主要说明（ ）","options":["各国之间经济互联互通","形成了“一带一路”产业化集群","“一带一路”促进人文交流更加深入","中华文化成为人类文明的中心"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选13","explanation":{"topic":"材料中的人文交流","reason":"新闻交流、电子图书馆与中文教育都属于文化和民间交流，材料直接支持C“一带一路”促进人文交流这一判断。","analysis":"A与B属于经济产业层面，材料没有提供直接证明；D将文化交流上升为“文明中心”，缺乏依据且作了不当扩大。","tip":"材料题优先选择与材料主体和证据直接对应的结论。"},"topicId":"supp-6"},{"id":"s6-single-14","type":"single","number":14,"originalNumber":"14","stem":"推进改革的目的是要不断推进我国社会主义制度（ ），赋予社会主义新的生机活力。","options":["自我完善和发展","现实性和实效性","人民性和整体性","整体推进和全面发展"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 单选14","explanation":{"topic":"改革的社会主义方向","reason":"改革是社会主义制度的自我完善和发展，通过调整机制与制度安排释放活力、解决矛盾，因此A对应题干目的。","analysis":"其他选项使用一般属性或工作方式组合，没有准确表达改革与基本制度性质的关系。改革不是抛弃社会主义制度。","tip":"改革是自我完善和发展，不是改变制度根本性质。"},"topicId":"supp-6"},{"id":"s6-multiple-1","type":"multiple","number":15,"originalNumber":"1","stem":"改革开放是（ ）。","options":["决定当代中国命运的关键一招","坚持和发展中国特色社会主义的必由之路","党和人民大踏步赶上时代的重要法宝","完成新时代目标任务的必然要求"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选1","explanation":{"topic":"改革开放的历史地位","reason":"关键一招、必由之路、赶上时代的法宝和完成新任务的要求，分别从历史转折、事业发展、时代适应与未来任务说明改革开放作用，四项均成立。","analysis":"这些概括不是选择其一的替代关系。改革开放的意义既看过去成果，也看制度与发展中仍需解决的新问题。","tip":"改革开放同时联系历史成就与新时代持续发展。"},"topicId":"supp-6"},{"id":"s6-multiple-2","type":"multiple","number":16,"originalNumber":"2","stem":"改革开放是坚持和发展中国特色社会主义的必由之路，因为（ ）。","options":["改革开放为中国特色社会主义开创、发展和完善提供了实践基础","改革开放深化了对社会主义建设规律的认识，为坚持和发展中国特色社会主义提供了有力支撑","谱写新时代中国特色社会主义的新篇章，依然需要全面深化改革、不断扩大对外开放","以上都正确"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选2","explanation":{"topic":"改革开放为何是必由之路","reason":"A讲实践基础，B讲规律认识，C讲继续发展的需要，三项共同说明改革开放对中国特色社会主义的持续支撑；D概括前三项。","analysis":"原文是多选并给出ABCD，包含“以上都正确”选项。不能把固定历史作用理解成改革任务已经结束，新情况仍要求继续推进改革开放。","tip":"实践基础、理论认识、继续发展三个理由共同成立。"},"topicId":"supp-6"},{"id":"s6-multiple-3","type":"multiple","number":17,"originalNumber":"3","stem":"党的十一届三中全会来，我国创造了（ ）两大奇迹,极大地改变了中国的面貌。","options":["经济快速发展","社会长期稳定","民族团结","“新四大发明”"],"answer":["A","B"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选3","explanation":{"topic":"两大奇迹","reason":"经济快速发展与社会长期稳定，是原题对改革开放以来突出成就的成对概括，A、B准确对应。","analysis":"民族团结是重要社会发展方面；“新四大发明”是社会传播中的概称，都不是这组“两大奇迹”的规范项目。","tip":"两大奇迹：经济快速发展、社会长期稳定。"},"topicId":"supp-6"},{"id":"s6-multiple-4","type":"multiple","number":18,"originalNumber":"4","stem":"当前，之所以要全面深化改革开放 ，是因为（ ）。","options":["发展中不平衡、不协调、不可持续问题依然突出","科技创新能力不强","产业结构不合理，发展方式依然粗放","城乡区域发展差距和居民收入分配差距依然较大","形式主义、官僚主义、享乐主义和奢靡之风问题突出"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选4","explanation":{"topic":"全面改革的问题导向","reason":"发展质量、科技创新、产业结构、收入与区域差距、作风等问题涉及多个领域，原题五项说明改革要回应的不同矛盾。","analysis":"题目从教材所处背景总结改革必要性，不能只考虑经济增长问题而忽略社会公平、治理与作风问题。问题涉及的领域越广，越需要系统改革。","tip":"改革必要性要联系经济、社会、治理等多领域问题。"},"topicId":"supp-6"},{"id":"s6-multiple-5","type":"multiple","number":19,"originalNumber":"5","stem":"全面深化改革开放，必须（ ）。","options":["勇于破除一切不合时宜的观念，深入贯彻新理念新思想新战略","勇于打破部门利益、行业利益、本位思想，服从国家整体利益","勇于破除根本制度、基本制度障碍，构建系统完备、科学规范、运行有效的制度体系","勇于破解我国开放型经济体制建设中的突出问题，积极适应经济全球化新趋势。"],"answer":["A","B","D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选5","explanation":{"topic":"破除障碍与坚持制度方向","reason":"A破除陈旧观念，B突破局部利益，D解决开放体制问题，均符合改革方向。改革针对不适应发展的体制机制与具体障碍。","analysis":"C直接说破除根本制度、基本制度，把改革对象和坚持方向颠倒。改革要求完善发展这些制度，而不是把它们视作应整体取消的障碍。","tip":"破除体制机制弊端，同时坚持完善根本制度和基本制度。"},"topicId":"supp-6"},{"id":"s6-multiple-6","type":"multiple","number":20,"originalNumber":"6","stem":"全面深化改革开放，是一场全面、系统、整体的制度创新，要着眼于建立一整套更完备、更稳定、更管用的制度体系，包括（ ）。","options":["坚持和完善人民当家作主制度体系","完善涉外经济法律和规则体系","坚持和完善繁荣发展社会主义先进文化的制度","坚持和完善统筹城乡的民生保障制度和共建共治共享的社会治理制度","坚持和完善生态文明制度体系"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选6","explanation":{"topic":"全面改革的制度范围","reason":"民主政治、涉外规则、文化、民生与社会治理、生态制度分别属于不同领域，五项共同体现全面、系统、整体的制度创新范围。","analysis":"全面深化改革不能缩小为经济体制改革一项。经济改革有牵引作用，但仍需要各领域制度协同完善，题中五项均应选择。","tip":"全面改革覆盖制度体系多个领域，不能只看经济。"},"topicId":"supp-6"},{"id":"s6-multiple-7","type":"multiple","number":21,"originalNumber":"7","stem":"改革开放要坚守政治原则和底线，不是改弦易张。这里面最核心的是（ ）、（ ），偏离了这一条，那就南辕北辙了。","options":["坚持和改善人民代表大会制度","坚持和改善党的领导","坚持和完善中国特色社会主义制度","建成社会主义现代化国家"],"answer":["B","C"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选7","explanation":{"topic":"改革的政治原则与底线","reason":"坚持改善党的领导、坚持完善中国特色社会主义制度，构成原题强调的核心政治原则，B、C准确补入两项。","analysis":"人民代表大会制度重要，但A不能代替整个制度方向与党的领导的组合；现代化国家是发展目标，D也不是此处两项政治底线表述。","tip":"改革核心政治原则记党的领导与中国特色社会主义制度。"},"topicId":"supp-6"},{"id":"s6-multiple-8","type":"multiple","number":22,"originalNumber":"8","stem":"改革开放是有方向、有立场、有原则的，必须（ ）。","options":["有利于进一步解放思想、进一步解放和发展社会生产力","坚持以人民为中心，促进社会公平正义、增进人民福祉","坚持和改善党的全面领导、坚持和完善中国特色社会主义制度","推进我国社会主义制度自我完善和发展，赋予社会主义新的生机活力"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选8","explanation":{"topic":"改革方向与人民立场","reason":"解放思想与生产力、人民福祉、党的领导与制度方向、制度自我完善发展，四项分别讲目的、立场、政治原则与性质，均符合题意。","analysis":"改革并非为改变而改变，也不能单凭短期经济指标判断。应同时看发展作用、人民利益和正确制度方向，四项相互补充。","tip":"改革方向、人民利益、发展效果需要统一考虑。"},"topicId":"supp-6"},{"id":"s6-multiple-9","type":"multiple","number":23,"originalNumber":"9","stem":"推进国家治理体系和治理能力现代化，（ ）。","options":["这是一个国家现代化的重要标志","必须坚定中国特色社会主义制度自信","必须更好发挥中国特色社会主义制度优势","必须把中国特色社会主义制度优势转化为国家治理效能"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选9","explanation":{"topic":"制度优势转化为治理效能","reason":"治理现代化是国家现代化的重要方面，要求制度自信、发挥优势并有效运用制度，A至D从目标到实践条件均成立。","analysis":"制度自信不能替代制度完善与有效执行。只有把优势落实到解决问题、管理事务和公共服务的效果，才能体现治理现代化。","tip":"从制度设计到制度执行，再到实际治理成效。"},"topicId":"supp-6"},{"id":"s6-multiple-10","type":"multiple","number":24,"originalNumber":"10","stem":"下面哪些是全面深化改革开放必须坚持的正确方法。（ ）","options":["增强全面深化改革的系统性、整体性、协同性","加强顶层设计和摸着石头过河相结合","统筹改革发展稳定","胆子要大，步子要稳","凡属重大改革都要于法有据"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选10","explanation":{"topic":"改革的方法论","reason":"系统协同保证整体推进，设计与探索结合完善方案，统筹发展稳定维护条件，胆大步稳兼顾创新审慎，依法改革保证规范，五项均正确。","analysis":"这些方法不是互相排斥的选项。摸着石头过河不否定顶层设计，胆子大也不等于盲目冒进，依法改革也不等于停止创新。","tip":"既要探索创新，也要系统协调、依法推进与稳定实施。"},"topicId":"supp-6"},{"id":"s6-multiple-11","type":"multiple","number":25,"originalNumber":"11","stem":"改革开放只有进行时、没有完成时，因为（ ）。","options":["这是社会基本矛盾运动规律的深刻反映","这是总结世界社会主义实践经验得出的重要结论","这是推进党和人民事业发展的必然要求","全面建设社会主义现代化国家新，根本动力仍然是改革开放。"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选11","explanation":{"topic":"改革开放的持续性","reason":"社会基本矛盾持续发展，实践中不断产生新问题；历史经验和事业发展都要求持续改革，因此A、B、C、D从规律、经验与任务说明其长期性。","analysis":"只有进行时并不表示所有具体政策永远不变，而是改革任务随发展阶段与实际问题调整。要区分改革的持续性与某项措施的期限。","tip":"改革持续，是因为社会发展与新问题持续。"},"topicId":"supp-6"},{"id":"s6-multiple-12","type":"multiple","number":26,"originalNumber":"12","stem":"全面深化改革要在哪些领域发力。（ ）","options":["要深化社会主义市场经济体制改革","深化人民当家作主制度体系改革","深化文化体制改革","健全加强党的全面领导、全面从严治党制度","深化社会体制改革"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选12","explanation":{"topic":"改革的重点领域","reason":"经济、政治、文化、党的领导及从严治党、社会体制，分别是全面改革需要协调推进的重要领域，A至E均属于原题范围。","analysis":"选项列出部分领域，不意味着其他领域不需改革。判断正确项应看它是否属于全面改革范围，不要把“列举不全”误作“所列项目错误”。","tip":"经济改革发挥牵引作用，各领域改革协同推进。"},"topicId":"supp-6"},{"id":"s6-multiple-13","type":"multiple","number":27,"originalNumber":"13","stem":"对外开放面临的新形势是（ ）。","options":["当今世界正在经历百年未有之大变局，新一轮科技革命和产业变革深入发展","逆全球化思潮抬头，单边主义、保护主义明显上升","局部冲突和动荡频发，全球性问题加剧","我国经济发展进入新常态，资源约束日益趋紧，环境承载能力接近上限","我国人力资源丰富，市场规模庞大，基础设施比较完善、产业配套齐全"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选13","explanation":{"topic":"开放面临的内外条件","reason":"A、B、C讲国际科技、全球化和安全环境变化，D、E讲国内约束与优势；五项共同构成教材对开放条件的分析。","analysis":"风险与优势同时存在。不能只选外部困难，也不能因为E描述优势就排除它；市场、人才与产业配套同样影响开放的条件和选择。","tip":"开放形势既看国际变化，也看国内优势与约束。"},"topicId":"supp-6"},{"id":"s6-multiple-14","type":"multiple","number":28,"originalNumber":"14","stem":"党的十八大以来，我国全面开放新举措是（ ）。","options":["推进“一带一路”建设","推进贸易强国建设","积极营造国际一流营商环境","优化区域开放布局","统筹多双边和区域开放合作"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选14","explanation":{"topic":"全面开放的主要举措","reason":"合作倡议、贸易建设、营商环境、区域布局、多边与双边合作，分别对应对外开放的不同渠道与制度环境，五项均符合原题。","analysis":"全面开放不是只提高出口规模，也包括投资规则、地区布局、合作机制与服务环境。五项体现开放范围与质量的共同提升。","tip":"开放举措从合作、贸易、环境、区域、机制五层理解。"},"topicId":"supp-6"},{"id":"s6-multiple-15","type":"multiple","number":29,"originalNumber":"15","stem":"构建更高水平开放型经济新体制，必须（ ）。","options":["依托我国超大规模市场优势，以国内大循环吸引全球资源要素，提升贸易投资合作质量和水平。","深化贸易投资领域体制机制改革，稳步扩大规则、规制、管理、标准等制度型开放。","推动货物贸易优化升级，创新服务贸易发展机制，发展数字贸易，加快建设贸易强国。","推动共建“一带一路”高质量发展。","优化区域开放布局，实施自由贸易试验区提升战略，"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选15","explanation":{"topic":"更高水平开放型经济体制","reason":"国内市场吸引力、制度型开放、贸易升级、共建合作、区域布局与自贸试验区，均是提升开放质量的组成方面，题中五项均成立。","analysis":"以国内大循环为主体不是拒绝国际资源；制度型开放也不只是放宽商品数量。应理解市场、规则与国际合作之间的联动。","tip":"制度型开放重点涉及规则、规制、管理、标准。"},"topicId":"supp-6"},{"id":"s6-multiple-16","type":"multiple","number":30,"originalNumber":"16","stem":"在全面深化改革中，要增强改革的（ ）。","options":["系统性","整体性","协同性","同一性"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选16","explanation":{"topic":"改革的三个性质要求","reason":"系统性强调联系，整体性强调统筹，协同性强调相互配合，A、B、C是全面改革的规范要求。","analysis":"D同一性可能被理解为各地各领域采取完全相同办法，这不符合因地制宜与分类推进的实际要求，也不是本题的固定概括。","tip":"系统、整体、协同重在配合，不等于一切做法相同。"},"topicId":"supp-6"},{"id":"s6-multiple-17","type":"multiple","number":31,"originalNumber":"17","stem":"全面深化改革的总目标是（ ）。","options":["实现两个百年目标","实现中国梦","完善和发展中国特色社会主义制度","推进国家治理体系和治理能力现代化"],"answer":["C","D"],"note":"","origin":"习思想教材配套练习题 第五章 全面深化改革 · 多选17","explanation":{"topic":"改革总目标的两个方面","reason":"C说明制度完善发展的方向，D说明治理体系与能力现代化的要求，二者共同构成全面深化改革总目标。","analysis":"两个百年目标、中国梦是更宏观的奋斗目标，改革为它们提供动力与制度支撑，但A、B不能直接替代改革自身总目标的表述。","tip":"改革总目标是制度完善发展与治理现代化两端。"},"topicId":"supp-6"}]},{"id":"supp-7","label":"补充7","chapter":17,"title":"全面从严治党","kind":"supp","source":"习思想教材配套练习题 第十七章.docx","questions":[{"id":"s7-single-1","type":"single","number":1,"originalNumber":"1","stem":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党，关键在（ ）。","options":["党中央","高质量发展","全面从严治党","维护党中央权威"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选1","explanation":{"topic":"关键在全面从严治党","reason":"现代化建设和民族复兴关键在党，关键在全面从严治党。加强党的自身建设，才能确保党始终成为坚强领导核心。A、D只涉及部分要求，B属于发展任务。","tip":"关键在党，关键在全面从严治党。"},"topicId":"supp-7"},{"id":"s7-single-2","type":"single","number":2,"originalNumber":"2","stem":"坚持党要管党、全面从严治党，以党的（ ）为统领。","options":["政治建设","思想建设","组织建设","作风建设"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选2","explanation":{"topic":"政治建设的统领地位","reason":"党的政治建设决定党的建设方向和效果，必须统领思想、组织、作风、纪律等建设；思想建设是基础性建设，不能与政治建设的统领地位混淆。","tip":"政治统领，思想筑基。"},"topicId":"supp-7"},{"id":"s7-single-3","type":"single","number":3,"originalNumber":"3","stem":"党的十九大强调，党的（ ）是党的根本性建设，要摆在首位。","options":["政治建设","思想建设","组织建设","作风建设"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选3","explanation":{"topic":"党的根本性建设","reason":"政治建设是党的根本性建设。先明确政治方向和政治立场，其他建设才能发挥应有作用。B、C、D都是重要建设内容，但不是此处的根本性建设。","tip":"根本性建设＝政治建设。"},"topicId":"supp-7"},{"id":"s7-single-4","type":"single","number":4,"originalNumber":"4","stem":"经过不懈努力，党找到了（ ）这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、不变味。","options":["新发展理念","自我革命","自我完善","总体国家安全观"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选4","explanation":{"topic":"历史周期率的第二个答案","reason":"跳出历史周期率的两个答案是人民监督和自我革命。自我革命通过自我净化、自我完善、自我革新、自我提高防止党变质变色变味。","tip":"外靠人民监督，内靠自我革命。"},"topicId":"supp-7"},{"id":"s7-single-5","type":"single","number":5,"originalNumber":"5","stem":"（ ）是我们党区别于其他政党的显著标志","options":["勇于自我革命","勇于创新","勇于挑战","勇于突破"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选5","explanation":{"topic":"勇于自我革命","reason":"勇于自我革命是我们党区别于其他政党的显著标志，也是最大的优势。创新、挑战、突破是一般能力或行为表述，不是本题的规范概括。","tip":"自我革命：刀刃向内、修正错误。"},"topicId":"supp-7"},{"id":"s7-single-6","type":"single","number":6,"originalNumber":"6","stem":"（ ）是党的建设的一贯要求和根本方针。","options":["勇于自我革命","党要管党、从严治党","与时俱进","“四个意识”和“两个维护”"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选6","explanation":{"topic":"管党治党的方针","reason":"党要管党、从严治党是党的建设的一贯要求和根本方针。自我革命是重要政治品格；与时俱进是理论品质；四个意识、两个维护是具体政治要求。","tip":"方针：党要管党、从严治党。"},"topicId":"supp-7"},{"id":"s7-single-7","type":"single","number":7,"originalNumber":"7","stem":"（ ）是党的政治建设的首要任务。","options":["增强“四个意识”","贯彻“四个全面”","学习贯彻习近平新时代中国特色社会主义思想","保证全党服从中央，维护党中央权威和集中统一领导"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选7","explanation":{"topic":"政治建设的首要任务","reason":"保证全党服从中央，维护党中央权威和集中统一领导，是政治建设的首要任务。增强四个意识与理论学习是落实要求的重要方面，不代替首要任务。","tip":"首要任务：维护党中央权威和集中统一领导。"},"topicId":"supp-7"},{"id":"s7-single-8","type":"single","number":8,"originalNumber":"8","stem":"（ ）是党的基础性建设。","options":["政治建设","思想建设","制度建设","作风建设"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选8","explanation":{"topic":"思想建设的基础作用","reason":"思想建设是党的基础性建设。坚定理想信念、加强理论武装，为党员干部提供思想基础。政治建设强调根本性和统领性，制度建设贯穿各项建设。","tip":"思想建设＝基础性建设。"},"topicId":"supp-7"},{"id":"s7-single-9","type":"single","number":9,"originalNumber":"9","stem":"中国共产党人提出跳出治乱兴衰历史周期率的两个答案是（ ）。","options":["自力更生；艰苦奋斗","让人民来监督政府；自我革命","实现四个现代化和实现中华民族伟大复兴","以经济建设为中心；改革开放"],"answer":["B"],"note":"原文“新中国成立以来”不严谨：人民监督这一回答提出于1945年；已修正时间表述。","origin":"习思想教材配套练习题 第十七章 · 单选9","explanation":{"topic":"跳出历史周期率","reason":"两个答案分别从外部监督和内部自我约束发力：人民监督政府、自我革命。题干“新中国成立以来”时间表述不严谨，人民监督这一回答提出于1945年。","tip":"1945人民监督；新时代自我革命。"},"topicId":"supp-7"},{"id":"s7-single-10","type":"single","number":10,"originalNumber":"10","stem":"坚持和加强党的全面领导，坚持党要管党、全面从严治党，以（ ）为主线。","options":["加强党的长期执政能力建设、先进性和纯洁性建设","党的政治建设","坚定理想信念宗旨","调动全党积极性、主动性、创造性"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选10","explanation":{"topic":"新时代党的建设主线","reason":"主线是长期执政能力建设、先进性和纯洁性建设。政治建设为统领，理想信念宗旨为根基，调动积极性主动性创造性为着力点，四组要分清。","tip":"主线：执政能力＋先进性＋纯洁性。"},"topicId":"supp-7"},{"id":"s7-single-11","type":"single","number":11,"originalNumber":"11","stem":"( )就是要坚定理想信念宗旨，自觉抵御各种腐朽思想侵蚀，提高政治免疫力，清除一切侵蚀党的健康肌体的病毒。","options":["自我净化","自我完善","自我革新","自我提高"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第十七章 · 单选11","explanation":{"topic":"自我净化","reason":"清除侵蚀健康肌体的病毒、抵御腐朽思想，重在清除问题和杂质，对应自我净化。自我完善重补短板，革新重破旧立新，提高重增强本领。","tip":"净化除杂，完善补短，革新求变，提高增能。"},"topicId":"supp-7"},{"id":"s7-multiple-1","type":"multiple","number":12,"originalNumber":"1","stem":"习近平关于党的建设的重要思想，包括（ ）。","options":["坚持和加强党的全面领导；坚持以党的自我革命引领社会革命","坚持以党的政治建设统领党的建设各项工作；坚持江山就是人民、人民就是江山","坚持思想建党、理论强党；坚持严密党的组织体系","坚持造就忠诚干净担当的高素质干部队伍；坚持聚天下英才而用之","坚持持之以恒正风肃纪；坚持一体推进不敢腐、不能腐、不想腐"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选1","explanation":{"topic":"党建思想内容","reason":"五项分别涉及领导与自我革命、政治与人民立场、思想与组织、干部与人才、作风纪律与反腐，均属于习近平关于党的建设的重要思想。该题列的是其中部分内容，不代表完整清单。","tip":"党建思想从领导、人民、组织、干部、作风反腐等方面把握。"},"topicId":"supp-7"},{"id":"s7-multiple-2","type":"multiple","number":13,"originalNumber":"2","stem":"新形势下党执政面临的“四大考验”包括长期执政考验、（ ）","options":["改革开放考验","市场经济考验","外部环境考验","管党治党考验"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选2","explanation":{"topic":"四大考验","reason":"四大考验是执政考验、改革开放考验、市场经济考验、外部环境考验。题干已给执政考验，故补选ABC；“管党治党考验”不属于这组固定概括。","tip":"执政、改革、市场、外部。"},"topicId":"supp-7"},{"id":"s7-multiple-3","type":"multiple","number":14,"originalNumber":"3","stem":"新形势下党执政面临的“四大危险”包括精神懈怠危险、（ ）","options":["能力不足危险","脱离群众危险","消极腐败危险","动力不足考验"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选3","explanation":{"topic":"四种危险","reason":"四种危险是精神懈怠、能力不足、脱离群众、消极腐败。题干已有精神懈怠，故选ABC。D使用“考验”且不在这组概括中。","tip":"懈怠、无能、脱群、腐败。"},"topicId":"supp-7"},{"id":"s7-multiple-4","type":"multiple","number":15,"originalNumber":"4","stem":"加强党的自身建设是（ ）。","options":["把党锻造成为坚强有力的马克思主义执政党的迫切需要","新形势下推进伟大事业的必然要求","新形势下推进进行伟大斗争的必然要求","新形势下推进实现伟大梦想的必然要求"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选4","explanation":{"topic":"加强自身建设的必要性","reason":"自身建设既关系党的先进性和执政能力，也关系伟大斗争、伟大工程、伟大事业、伟大梦想的推进。A讲自身，BCD讲所承担的历史任务，均成立。","tip":"自身强，事业才能强。"},"topicId":"supp-7"},{"id":"s7-multiple-5","type":"multiple","number":16,"originalNumber":"5","stem":"全面从严治党，关键在严，“关键在严”，就是（ ）。","options":["坚持严字当头，把严的要求贯穿党的建设全过程","做到真管真严、敢管敢严、长管长严","敢于动真格，不降标准，不图形式，不走过场","让一切违纪违规的言行无处遁形"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选5","explanation":{"topic":"全面从严治党关键在严","reason":"严的要求贯穿全过程，落实为真管真严、敢管敢严、长管长严；既不降低标准，也不走形式、留死角。四项共同说明严的尺度与执行。","tip":"严标准、真执行、常坚持。"},"topicId":"supp-7"},{"id":"s7-multiple-6","type":"multiple","number":17,"originalNumber":"6","stem":"全面从严治党，“要害在治”，就是（ ）。","options":["要真正解决问题、切实担起责任","从党中央到地方各级党委都要担负起主体责任","各级纪委要担负起监督责任","敢于瞪眼黑脸，勇于执纪问责","坚持标本兼治，拔“烂树”、治“病树”、正“歪树”"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选6","explanation":{"topic":"全面从严治党要害在治","reason":"治重在解决问题和落实责任。党委承担主体责任，纪委承担监督责任，以问责和标本兼治推动责任落实；五项是相互配合的治理要求。","tip":"主体责任＋监督责任＋问题治理。"},"topicId":"supp-7"},{"id":"s7-multiple-7","type":"multiple","number":18,"originalNumber":"7","stem":"全面从严治党是一项管党治党的系统工程，要（ ）。","options":["坚持内容上全涵盖，党的建设推进到哪里，全面从严治党体系就要构建到哪里","坚持对象上全覆盖，面向党的各级组织和全体党员","坚持责任上全链条,让每名党员、干部行使应有权利、履行应尽责任","坚持制度上全贯通，把制度建设要求体现到全面从严治党全过程"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选7","explanation":{"topic":"全面从严治党体系","reason":"内容全涵盖、对象全覆盖、责任全链条、制度全贯通，从工作内容、管党对象、责任落实、制度运行四个维度构建体系，四项均选。","tip":"内容、对象、责任、制度四个全。"},"topicId":"supp-7"},{"id":"s7-multiple-8","type":"multiple","number":19,"originalNumber":"8","stem":"新时代党的建设总要求,包括（ ）。","options":["坚持和加强党的全面领导，坚持党要管党、全面从严治党","以加强党的长期执政能力建设、先进性和纯洁性建设为主线","以党的政治建设为统领，以坚定理想信念宗旨为根基，全面推进党的各项建设","把制度建设贯穿其中，深入推进反腐败斗争","把党建设成为人民衷心拥护、勇于自我革命的马克思主义执政党"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选8","explanation":{"topic":"新时代党的建设总要求","reason":"总要求涵盖领导、方针、主线、统领、根基、着力点、布局和目标。A至E均涉及规范内容；完整总目标还包括始终走在时代前列、经得起风浪考验、朝气蓬勃等要求。","tip":"主线、统领、根基、贯穿、目标分层记。"},"topicId":"supp-7"},{"id":"s7-multiple-9","type":"multiple","number":20,"originalNumber":"9","stem":"加强作风建设，必须（ ）。","options":["紧紧围绕保持党同人民群众的血肉联系，增强群众观念和群众感情","要锲而不舍落实中央八项规定精神，持续深化纠治“四风”","要弘扬党的光荣传统和优良作风","促进党员干部特别是领导干部带头深入调查研究","要推进作风建设常态化长效化"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选9","explanation":{"topic":"作风建设","reason":"作风建设核心是保持党同人民群众的血肉联系。落实八项规定、纠治四风、调查研究、弘扬优良作风、形成长效机制，都是落实这一核心的措施。","tip":"核心在联系群众，抓手是八项规定和纠四风。"},"topicId":"supp-7"},{"id":"s7-multiple-10","type":"multiple","number":21,"originalNumber":"10","stem":"我们党之所以勇于自我革命，是因为（ ）。","options":["我们党除了国家、民族、人民的利益，没有任何自己的特殊利益","我们党有高度的自信，勇于坚持真理、修正错误","我们党立志于中华民族千秋伟业，始终坚守初心使命","以上都正确"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第十七章 · 多选10","explanation":{"topic":"自我革命的底气","reason":"党没有自己的特殊利益，因而能直面问题 <script>const ReviewCore = (() => {
  const VERSION = 1;
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function same(a,b) { return a.length===b.length && [...a].sort().join('')===[...b].sort().join(''); }
  function shuffle(items,rng=Math.random) { const a=[...items]; for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }
  function empty(){return {version:VERSION,answers:{},wrong:{},learned:{},thoughtLearned:{},session:null,lastTopic:'topic-1',preferences:{type:'all',random:false}};}
  function validChoice(q,chosen){return Array.isArray(chosen)&&chosen.length>0&&new Set(chosen).size===chosen.length&&chosen.every(x=>typeof x==='string'&&letters.indexOf(x)>=0&&letters.indexOf(x)<q.options.length)&&(q.type!=='single'||chosen.length===1);}
  function submit(state,q,chosen,now=Date.now()){
    if(!validChoice(q,chosen))throw new Error('请先选择有效答案');
    const answer={chosen:[...chosen].sort(),correct:same(chosen,q.answer),at:now};
    state.answers[q.id]=answer;
    if(!answer.correct){const prior=state.wrong[q.id];state.wrong[q.id]={count:(prior?.count||0)+1,firstAt:prior?.firstAt||now,lastAt:now,mastered:false};}
    else if(state.wrong[q.id]){state.wrong[q.id].mastered=true;state.wrong[q.id].lastAt=now;}
    return answer;
  }
  function resetTopic(state,topic){for(const q of topic.questions)delete state.answers[q.id];if(state.session?.topicId===topic.id||state.session?.wrong)state.session=null;return state;}
  function sanitize(input,map){
    if(!input||input.version!==VERSION||typeof input.answers!=='object'||!input.answers||typeof input.wrong!=='object'||!input.wrong)throw new Error('备份格式不正确');
    const result=empty();
    for(const [id,r] of Object.entries(input.answers)){const q=map.get(id);if(q&&r&&validChoice(q,r.chosen))result.answers[id]={chosen:[...r.chosen],correct:same(r.chosen,q.answer),at:Number.isFinite(r.at)?r.at:0};}
    for(const [id,r] of Object.entries(input.wrong)){if(map.has(id)&&r&&typeof r==='object')result.wrong[id]={count:Math.max(1,Math.min(100000,Number(r.count)||1)),firstAt:Number(r.firstAt)||0,lastAt:Number(r.lastAt)||0,mastered:r.mastered===true};}
    for(const key of ['learned','thoughtLearned'])if(input[key]&&typeof input[key]==='object')for(const [id,v] of Object.entries(input[key]))if(v===true)result[key][id]=true;
    result.lastTopic=typeof input.lastTopic==='string'?input.lastTopic:'topic-1';
    result.preferences={type:['all','single','multiple'].includes(input.preferences?.type)?input.preferences.type:'all',random:input.preferences?.random===true};
    const s=input.session;
    if(s&&Array.isArray(s.queue)){
      const queue=[...new Set(s.queue.filter(id=>map.has(id)))];
      if(queue.length){result.session={topicId:typeof s.topicId==='string'?s.topicId:'topic-1',pool:Array.isArray(s.pool)?[...new Set(s.pool.filter(id=>map.has(id)))]:queue,queue,index:Math.max(0,Math.min(queue.length-1,Number(s.index)||0)),type:['all','single','multiple'].includes(s.type)?s.type:'all',random:s.random===true,wrong:s.wrong===true,attempts:{},drafts:{},completed:s.completed===true};
        for(const id of queue){const r=s.attempts?.[id];if(r&&validChoice(map.get(id),r.chosen))result.session.attempts[id]={chosen:[...r.chosen],correct:same(r.chosen,map.get(id).answer),at:Number(r.at)||0};const d=s.drafts?.[id];if(Array.isArray(d)&&d.length&&validChoice(map.get(id),d))result.session.drafts[id]=[...d];}
      }
    }
    return result;
  }
  function merge(a,b){for(const [id,r] of Object.entries(b.answers))if(!a.answers[id]||r.at>=a.answers[id].at)a.answers[id]=r;for(const [id,r] of Object.entries(b.wrong)){const p=a.wrong[id];if(!p)a.wrong[id]=r;else a.wrong[id]={count:Math.max(p.count,r.count),firstAt:Math.min(p.firstAt,r.firstAt),lastAt:Math.max(p.lastAt,r.lastAt),mastered:r.lastAt>p.lastAt?r.mastered:p.mastered};}Object.assign(a.learned,b.learned);Object.assign(a.thoughtLearned,b.thoughtLearned);return a;}
  return {same,shuffle,empty,validChoice,submit,resetTopic,sanitize,merge};
})();
if(typeof module!=='undefined')module.exports=ReviewCore;
</script>

 return `<section class="hero"><div class="hero-copy"><p class="eyebrow">习近平新时代中国特色社会主义思想概论</p><h1>把六章学透，把每一题做懂。</h1><p>第1—5章、第17章，按章精练、错题巩固，再用精简知识点与课后思考串起整本教材的重点。</p><div class="btn-row"><button class="btn" data-action="continue">${icon('book')}${state.session?'继续上次练习':'开始专题练习'}</button><button class="btn" data-action="all-random">${icon('shuffle')}全部题目乱序练习</button></div></div><div class="hero-side"><div class="hero-stat"><strong>${TOTAL}</strong><span>道选择题</span></div><div class="hero-stat"><strong>6 + 7</strong><span>专题与补充</span></div><div class="hero-stat"><strong>${NOTES.length}</strong><span>组知识速记</span></div><div class="hero-stat"><strong>24</strong><span>道课后思考</span></div></div></section>
 <section class="stats" aria-label="学习概况">${[[icon('book'),totalDone,`累计已答 / ${TOTAL}`],[icon('check'),totalDone?Math.round(correct/totalDone*100)+'%':'—','已答题目正确率'],[icon('flag'),pending,'待巩固错题'],[icon('star'),Object.values(state.learned).filter(Boolean).length,'已记住知识点']].map(([i,v,l])=>`<div class="stat"><div class="stat-icon">${i}</div><div><strong>${v}</strong><span class="label">${l}</span></div></div>`).join('')}</section>
 <section aria-labelledby="mainTopics"><div class="section-head"><div><span class="section-kicker">CHAPTER PRACTICE</span><h2 id="mainTopics">六个专题，逐章突破</h2><p>来自指定网站的习思想课程，按第1—5章、第17章排列</p></div><span class="pill">269 道题</span></div><div class="topic-grid">${cards('main')}</div></section>
 <section aria-labelledby="suppTopics"><div class="section-head"><div><span class="section-kicker">EXTRA PRACTICE</span><h2 id="suppTopics">七组补充，查漏补缺</h2><p>你的七份练习材料逐题保留，分别练习、分别记录</p></div><span class="pill neutral">${SUPPCOUNT} 道题</span></div><div class="topic-grid supp-grid">${cards('supp')}</div></section>
 <section class="quick-panel"><div><span class="section-kicker">READ · RECALL · REMEMBER</span><h2>做完选择题，把知识连起来。</h2><p>${NOTES.length}组教材知识点支持关键词检索；24道课后思考题已整理为分点速记。</p></div><div class="btn-row"><button class="btn secondary" data-action="nav" data-view="knowledge">${icon('search')}查知识点</button><button class="btn ghost" data-action="nav" data-view="thoughts">课后思考 ${icon('arrow')}</button></div></section>`;
}
function makeSession(topicId,opts={}){const prior=state.session;
 const type=opts.type||state.preferences.type,random=opts.random??state.preferences.random;
 let qs=opts.ids?opts.ids.map(id=>map.get(id)).filter(Boolean):topicId==='all'?questions:topicMap.get(topicId)?.questions||[];
 const pool=qs.map(q=>q.id);if(type!=='all')qs=qs.filter(q=>q.type===type);
 let queue=qs.map(q=>q.id);if(random)queue=ReviewCore.shuffle(queue);
 state.session={topicId,pool,queue,index:0,type,random,wrong:!!opts.wrong,attempts:{},drafts:{},completed:false};
 if(topicMap.has(topicId))state.lastTopic=topicId;
 state.preferences={type,random};save();go('practice');
}
function openTopic(id){if(state.session?.topicId===id&&!state.session.wrong){go('practice');return;}makeSession(id);}
function side(){return `<aside class="side" aria-label="练习专题"><p class="side-title">六个专题</p>${TOPICS.filter(t=>t.kind==='main').map(sideItem).join('')}<div class="side-divider"></div><p class="side-title">七组补充</p>${TOPICS.filter(t=>t.kind==='supp').map(sideItem).join('')}<div class="side-divider"></div><button class="side-item" data-action="nav" data-view="home">${icon('back')}<strong>回到复习首页</strong></button></aside>`;}
function sideItem(t){return `<button data-action="topic" data-id="${t.id}" class="side-item ${state.session?.topicId===t.id&&!state.session.wrong?'active':''}"><span>${t.label.replace('专题','0').replace('补充','补')}</span><span><strong>${esc(t.title)}</strong><small>${t.label} · ${chapterLabel(t.chapter)} · ${done(t)} / ${t.questions.length}</small></span></button>`;}
function practice(){const s=state.session;if(!s)return `<div class="empty">${icon('book')}<h2>选择一个专题开始练习</h2><button class="btn" data-action="nav" data-view="home">查看全部专题</button></div>`;
 const t=topicMap.get(s.topicId),title=s.wrong?'错题专项练习':t?.title||'全部题目综合练习';
 return `<button class="back-link" data-action="nav" data-view="${s.wrong?'wrong':'home'}">${icon('back')}${s.wrong?'返回错题库':'返回全部专题'}</button><div class="practice-layout">${side()}<div class="practice-main"><div class="mobile-topic"><label class="small muted" for="practiceTopic">切换练习专题</label><select id="practiceTopic"><option value="" ${!t?'selected':''}>${s.wrong?'错题专项练习':'全部题目综合练习'}</option>${TOPICS.map(x=>`<option value="${x.id}" ${!s.wrong&&x.id===s.topicId?'selected':''}>${x.label} · ${chapterLabel(x.chapter)} · ${esc(x.title)}</option>`).join('')}</select></div><div class="page-heading"><div><p class="eyebrow">${s.wrong?'WRONG QUESTION REVIEW':esc(t?.label||'综合练习')} ${t?'/ '+chapterLabel(t.chapter):''}</p><h1>${esc(title)}</h1><p>${s.wrong?'答对后标记为已巩固，题目仍保留在错题库。':'先选择，再提交；提交后查看答案与详细解析。'}</p></div>${t&&!s.wrong?`<span class="pill">${t.questions.length} 道题</span>`:''}</div>
 <div class="toolbar"><div class="segmented" aria-label="题型筛选">${[['all','全部题型'],['single','单选题'],['multiple','多选题']].map(([v,l])=>`<button data-action="type" data-value="${v}" class="${s.type===v?'active':''}" aria-pressed="${s.type===v}">${l}</button>`).join('')}</div><div class="toolbar-actions"><button class="toggle ${s.random?'active':''}" data-action="random" aria-pressed="${s.random}">${icon('shuffle')}${s.random?'乱序作答':'顺序作答'}</button><button class="toggle" data-action="reset-round">${icon('refresh')}${s.wrong||!t?'重做本轮':'重做专题'}</button></div></div>
 ${s.queue.length?(s.completed?completion():question()):`<div class="empty">${icon('book')}<h2>当前筛选下没有题目</h2><p>换一个题型或专题继续练习。</p></div>`}
 ${s.queue.length?palette():''}
 <section class="quick-panel in-practice-library"><div><h2>选择题之后，回到知识点。</h2><p>输入关键词查找教材中的精简要点。</p></div><form id="inlineSearch" class="search-bar" role="search">${icon('search')}<input id="inlineQuery" aria-label="查找知识点" placeholder="试试：四个全面、共同富裕…"><button type="submit" class="btn tiny">查找</button></form></section></div></div>`;
}
function question(){const s=state.session,q=map.get(s.queue[s.index]);if(!q)return '';
 const attempt=s.attempts[q.id],selected=attempt?.chosen||s.drafts[q.id]||[];
 const opts=q.options.map((text,i)=>{const key=String.fromCharCode(65+i),chosen=selected.includes(key);let cls=chosen?'selected':'';if(attempt){if(q.answer.includes(key))cls+=' correct';else if(chosen)cls+=' wrong';}
 return `<button class="option ${cls}" data-action="option" data-key="${key}" aria-pressed="${chosen}" ${attempt?'disabled':''}><span class="letter">${key}</span><span>${esc(text)}</span></button>`;}).join('');
 return `<section class="question-card" aria-labelledby="questionStem"><div class="q-top"><div class="btn-row"><span class="pill">${q.type==='single'?'单选题':'多选题'}</span><span class="small muted">${topicMap.get(q.topicId).label} · 原题 ${esc(q.originalNumber||q.number)}</span></div><span class="q-count"><strong>${s.index+1}</strong> / ${s.queue.length}</span></div><h2 class="q-stem" id="questionStem">${esc(q.stem)}</h2><div class="options" role="group" aria-label="选择答案">${opts}</div>
 ${attempt?feedback(q,attempt):`<p class="q-hint">${q.type==='single'?'请选择一项':'可选择多项，完整选对才计为正确'}，提交后解锁本题答案与解析。</p>`}
 <div class="q-actions"><button class="btn secondary" data-action="prev" ${s.index===0?'disabled':''}>${icon('back')}上一题</button><div class="btn-row">${attempt?`<button class="btn secondary" data-action="retry">重新作答</button><button class="btn" data-action="next">${s.index===s.queue.length-1?'本轮小结':'下一题'} ${icon('arrow')}</button>`:`<button class="btn" data-action="submit" id="submitAnswer" ${selected.length?'':'disabled'}>提交答案 ${icon('check')}</button>`}</div></div><p class="q-source">来源：${esc(q.origin)} · ${s.random?'本轮题目已乱序，选项顺序保留原文':'按材料题目顺序'}。</p></section>`;
}
function feedback(q,r){const e=q.explanation;let detail='';if(q.type==='multiple'&&!r.correct){const missing=q.answer.filter(x=>!r.chosen.includes(x)),extra=r.chosen.filter(x=>!q.answer.includes(x));detail=[missing.length?'漏选 '+missing.join('、'):'',extra.length?'误选 '+extra.join('、'):''].filter(Boolean).join('；');}
 return `<section class="feedback ${r.correct?'':'incorrect'}" aria-label="本题答案与解析"><div class="feedback-top" role="status"><strong>${icon(r.correct?'check':'wrong')} ${r.correct?'回答正确':'已收录错题库'}</strong><span>你的选择 ${r.chosen.join('、')} · 正确答案 <b>${q.answer.join('、')}</b></span></div><div class="feedback-body">${detail?`<p class="source-note">${esc(detail)}。多选题需与正确答案完全一致。</p>`:''}<h3>${esc(e.topic||'考点解析')}</h3><p>${esc(e.reason)}</p>${e.analysis?`<h3>选项辨析</h3><p>${esc(e.analysis)}</p>`:''}${e.tip?`<p class="tip">记忆要点：${esc(e.tip)}</p>`:''}${e.note?`<p class="source-note">原文说明：${esc(e.note)}</p>`:''}${q.note?`<p class="source-note">题目说明：${esc(q.note)}</p>`:''}<button class="btn ghost tiny" data-action="related" data-id="${q.id}">${icon('search')}查找本章知识点</button></div></section>`;
}
function palette(){const s=state.session;return `<section class="palette-card"><div class="palette-heading"><strong>本轮答题卡</strong><span>已答 ${Object.keys(s.attempts).length} / ${s.queue.length}</span></div><div class="palette" aria-label="跳转题目">${s.queue.map((id,i)=>`<button data-action="jump" data-index="${i}" class="${s.attempts[id]?(s.attempts[id].correct?'correct':'wrong'):''} ${i===s.index&&!s.completed?'current':''}" aria-label="第${i+1}题，${s.attempts[id]?(s.attempts[id].correct?'答对':'答错'):'未答'}" ${i===s.index&&!s.completed?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend"><span><i></i>未答</span><span><i class="correct"></i>答对</span><span><i class="wrong"></i>答错</span><span>点击题号自由跳转</span></div></section>`;}
function completion(){const s=state.session,answers=Object.values(s.attempts),correct=answers.filter(r=>r.correct).length,unanswered=s.queue.length-answers.length;return `<section class="question-card complete">${icon('star')}<p class="eyebrow">ROUND COMPLETE</p><h2>${unanswered?'已到本轮最后一题':'本轮练习完成'}</h2><p class="score">${correct}<small> / ${s.queue.length}</small></p><p class="muted small">${answers.length}道已答，${correct}道正确，${answers.length-correct}道错误${unanswered?'，还有'+unanswered+'道未答':''}。</p><p class="small muted">错题已保留，可在错题库继续专项巩固。</p><div class="btn-row">${unanswered?`<button class="btn" data-action="first-unanswered">继续未答题</button>`:''}<button class="btn ${unanswered?'secondary':''}" data-action="reset-round">重新练习本${s.wrong||s.topicId==='all'?'轮':'专题'}</button><button class="btn secondary" data-action="nav" data-view="wrong">查看错题库</button><button class="btn ghost" data-action="related-chapter">复习本章知识</button></div></section>`;}
function wrongFiltered(){let qs=questions.filter(q=>state.wrong[q.id]);if(ui.wrongTopic!=='all')qs=qs.filter(q=>q.topicId===ui.wrongTopic);if(ui.wrongStatus!=='all')qs=qs.filter(q=>state.wrong[q.id].mastered===(ui.wrongStatus==='mastered'));const query=ui.wrongQuery.trim().toLowerCase();if(query)qs=qs.filter(q=>(q.stem+q.options.join(' ')).toLowerCase().includes(query));return qs.sort((a,b)=>state.wrong[b.id].lastAt-state.wrong[a.id].lastAt);}
function wrongPage(){const all=Object.values(state.wrong),pending=all.filter(r=>!r.mastered).length;return `<div class="page-heading"><div><p class="eyebrow">REVIEW & CONSOLIDATE</p><h1>错题库</h1><p>累计 ${all.length} 道 · 待巩固 ${pending} 道 · 已巩固 ${all.length-pending} 道。重做专题会保留这里的题目。</p></div><button class="btn secondary" data-action="nav" data-view="home">返回专题</button></div><div class="filters"><label class="search-bar">${icon('search')}<input id="wrongSearch" aria-label="搜索错题" placeholder="搜索错题关键词…" value="${esc(ui.wrongQuery)}"></label><select id="wrongTopic" aria-label="错题专题"><option value="all">全部专题</option>${TOPICS.map(t=>`<option value="${t.id}" ${ui.wrongTopic===t.id?'selected':''}>${t.label} · ${chapterLabel(t.chapter)}</option>`).join('')}</select><select id="wrongStatus" aria-label="巩固状态">${[['all','全部错题'],['pending','待巩固'],['mastered','已巩固']].map(([v,l])=>`<option value="${v}" ${ui.wrongStatus===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn" data-action="wrong-practice">${icon('shuffle')}乱序专项练习</button></div><div id="wrongResults">${wrongResults()}</div>`;}
function wrongResults(){const qs=wrongFiltered();if(!qs.length)return `<div class="empty">${icon('flag')}<h2>${Object.keys(state.wrong).length?'没有符合筛选条件的错题':'还没有错题'}</h2><p>${Object.keys(state.wrong).length?'调整筛选条件，或继续新的专题。':'选择题答错后会自动收录到这里。'}</p><button class="btn" data-action="nav" data-view="home">去刷题</button></div>`;return `<p class="result-meta">当前筛选 ${qs.length} 道。专项练习时重新选择并提交，才会显示答案与解析。</p><div class="wrong-list">${qs.map(q=>{const w=state.wrong[q.id],t=topicMap.get(q.topicId);return `<article class="wrong-card"><div><div class="btn-row"><span class="pill">${t.label} · ${chapterLabel(t.chapter)}</span><span class="pill ${w.mastered?'mastered-tag':'neutral'}">${w.mastered?'已巩固':'待巩固'}</span><span class="small muted">${q.type==='single'?'单选':'多选'}</span></div><h3>${esc(q.stem)}</h3><p>累计答错 ${w.count} 次 · 最近练习 ${new Date(w.lastAt).toLocaleDateString('zh-CN')} · ${esc(t.title)}</p></div><div class="btn-row"><button class="btn ghost tiny" data-action="wrong-one" data-id="${q.id}">重新练习 ${icon('arrow')}</button><button class="btn secondary tiny" data-action="remove-wrong" data-id="${q.id}" aria-label="移出本题错题记录">移出</button></div></article>`;}).join('')}</div>`;}

function thoughtFiltered(){const q=ui.thoughtQuery.trim().toLowerCase();return THOUGHTS.filter(t=>(ui.thoughtChapter==='all'||String(t.chapter)===String(ui.thoughtChapter))&&(!q||(t.question+t.tip+t.parts.flatMap(p=>p.points).join(' ')).toLowerCase().includes(q)));}

function thoughtResults(){const ts=thoughtFiltered();return `<p class="result-meta">${ts.length} 道思考题 · 已掌握 ${Object.values(state.thoughtLearned).filter(Boolean).length} / 24 道。答案为学习提要，写论述题时可沿分点适当展开。</p>${ts.length?`<div class="thought-list">${ts.map(t=>`<details class="thought-card" ${ui.thoughtOpen?'open':''}><summary><span class="thought-no">${t.number}</span><span><span class="eyebrow">第${t.chapter}章 · 课后思考</span><br>${esc(t.question)}</span>${icon('chevron')}</summary><div class="thought-answer"><p class="thought-source">教材第${t.page}页 · PDF第${t.page+10}页</p>${t.parts.map(p=>`${p.heading?`<h3>${esc(p.heading)}</h3>`:''}<ol>${p.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`).join('')}<p class="note-tip">记忆线索：${esc(t.tip)}</p><div class="note-footer"><span>原创精简归纳 · 依据教材</span><button class="learn-btn ${state.thoughtLearned[t.id]?'learned':''}" data-action="learn-thought" data-id="${t.id}" aria-pressed="${!!state.thoughtLearned[t.id]}">${state.thoughtLearned[t.id]?'✓ 已掌握':'标记掌握'}</button></div></div></details>`).join('')}</div>`:`<div class="empty">${icon('search')}<h2>没有找到相应思考题</h2><p>尝试其他关键词。</p></div>`}`;}
function showDialog(content){const d=$('#modal');d.innerHTML=`<button class="close" data-action="close-modal" aria-label="关闭">${icon('close')}</button>${content}`;d.showModal();}
function backup(){showDialog(`<p class="eyebrow">SAVE YOUR PROGRESS</p><h2>备份与恢复学习记录</h2><p>保存已答题目、错题、当前轮次和知识点标记。备份可在你的另一台设备上导入。</p><div class="callout">当前记录：已答 ${Object.keys(state.answers).length} / ${TOTAL} 题；错题 ${Object.keys(state.wrong).length} 道。<br>同一设备、同一浏览器会自动保存。清除网站数据前可先导出备份。</div><div class="btn-row"><button class="btn" data-action="export">${icon('download')}导出学习备份</button><button class="btn secondary" data-action="import">导入并合并记录</button></div><p class="muted small" style="margin-top:18px">导入会保留双方错题，同题作答采用较新的记录，不清空现有内容。</p>`);}
function about(){showDialog(`<p class="eyebrow">SOURCES & EDITORIAL NOTES</p><h2>资料来源与题目说明</h2><p>主专题：指定网站“习思想”课程的第1—5章和第17章，共269道选择题。第17章对应本工具的专题6；原站第3章为党建题，知识点仍按教材第3章“坚持党的全面领导”整理。</p><p>补充材料：你的七份文档，按导论、第1、2、3、4、5、17章排列为补充1—7，共${SUPPCOUNT}道题。同考点在不同来源出现时保留，便于分别复习。</p><p>知识库：以你提供的《习近平新时代中国特色社会主义思想概论》（2023版）第1—5章、第17章为主，自行精简归纳${NOTES.length}组知识点；课后思考完整对应教材24道原题，给出分点记忆提要。</p><p>题目处理：补全空缺解析，修正明确错字、重复选项和明显错误答案；修订依据写在每题提交后的“题目说明”中。对仍有语义交叉的题，保留来源参考答案并注明疑点。补充7多选第16题原文缺答案，已补全。</p><p>教材口径：主要按2023版课程复习。旧题的历史阶段表述在题内说明，不把历史目标改写为已经完成的当前目标。记忆口诀帮助回忆，正式作答使用规范术语。</p><div class="link-row"><strong class="small">公开资料</strong><a href="https://maogai.szhopc.cn/" target="_blank" rel="noopener">原题库：毛概与习思想课程刷题工具 ↗</a><a href="https://www.12371.cn/2023/11/28/STUD1701138144512885.shtml" target="_blank" rel="noopener">共产党员网：习近平新时代中国特色社会主义思想的主要内容 ↗</a><a href="https://www.12371.cn/special/zgsxdh/" target="_blank" rel="noopener">共产党员网：中国式现代化专题 ↗</a><a href="https://news.12371.cn/2016/11/02/ARTI1478091665764299.shtml" target="_blank" rel="noopener">关于新形势下党内政治生活的若干准则（全文） ↗</a><a href="https://www.12371.cn/2023/05/02/ARTI1683014583437368.shtml" target="_blank" rel="noopener">二十大报告学习汇编：反腐败斗争 ↗</a></div>`);}
function resetRound(){const s=state.session;if(!s)return;
 const t=topicMap.get(s.topicId);
 if(t&&!s.wrong){confirmAction=()=>{ReviewCore.resetTopic(state,t);makeSession(t.id,{type:s.type,random:s.random});toast('专题作答已清除，错题库已保留。');};showDialog(`<h2>重新练习${esc(t.label)}？</h2><p>清除这个专题的作答记录，重新开始。错题库中的题目全部保留，其他专题不受影响。</p><div class="btn-row"><button class="btn" data-action="confirm">保留错题并重做</button><button class="btn secondary" data-action="close-modal">取消</button></div>`);}
 else{makeSession(s.topicId,{ids:s.pool||s.queue,type:s.type,random:s.random,wrong:s.wrong});toast('已开始新一轮练习。');}
}
function rerenderQuestion(){save();render();}
function changePosition(index){const s=state.session;s.index=Math.max(0,Math.min(s.queue.length-1,index));s.completed=false;rerenderQuestion();$('.question-card')?.scrollIntoView({block:'start',behavior:'instant'});}
function related(id){const q=map.get(id),t=topicMap.get(q?.topicId||state.session?.topicId);ui.knowledgeChapter=t&&t.chapter!==0?String(t.chapter):'all';ui.knowledgeQuery='';go('knowledge');}
function handleAction(button){const a=button.dataset.action,id=button.dataset.id,s=state.session;
 if(a==='nav'){go(button.dataset.view);return;}
 if(a==='topic'){openTopic(id);return;}
 if(a==='continue'){if(state.session?.queue.length)go('practice');else makeSession(state.lastTopic);return;}
 if(a==='all-random'){makeSession('all',{random:true,type:'all'});return;}
 if(a==='backup'){backup();return;}if(a==='about'){about();return;}
 if(a==='close-modal'){$('#modal').close();return;}
 if(a==='confirm'){$('#modal').close();confirmAction?.();confirmAction=null;return;}
 if(a==='export'){const blob=new Blob([JSON.stringify({app:'xigai-six-review',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='习概六章复习-学习记录-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已导出学习备份。');return;}
 if(a==='import'){$('#importFile').click();return;}
 if(a==='wrong-practice'){const qs=wrongFiltered();if(!qs.length){toast('当前筛选下没有错题。');return;}makeSession('wrong',{ids:qs.map(q=>q.id),type:'all',random:true,wrong:true});return;}
 if(a==='wrong-one'){makeSession('wrong',{ids:[id],type:'all',random:false,wrong:true});return;}
 if(a==='remove-wrong'){delete state.wrong[id];save();render();toast('已从错题库移出该题。');return;}
 if(a==='knowledge-chapter'){ui.knowledgeChapter=button.dataset.chapter;render();return;}
 if(a==='thought-chapter'){ui.thoughtChapter=button.dataset.chapter;render();return;}
 if(a==='notes-only'){ui.notesOnly=!ui.notesOnly;render();return;}
 if(a==='clear-knowledge'){ui.knowledgeQuery='';ui.knowledgeChapter='all';ui.notesOnly=false;render();return;}
 if(a==='learn-note'){state.learned[id]=!state.learned[id];save();$('#knowledgeResults').innerHTML=knowledgeResults();return;}
 if(a==='learn-thought'){state.thoughtLearned[id]=!state.thoughtLearned[id];save();button.classList.toggle('learned',!!state.thoughtLearned[id]);button.setAttribute('aria-pressed',!!state.thoughtLearned[id]);button.textContent=state.thoughtLearned[id]?'✓ 已掌握':'标记掌握';return;}
 if(a==='thoughts-open'){ui.thoughtOpen=!ui.thoughtOpen;render();return;}
 if(a==='related'){related(id);return;}if(a==='related-chapter'){related();return;}
 if(!s)return;
 const q=map.get(s.queue[s.index]);
 if(a==='option'){if(!q||s.attempts[q.id])return;let selected=s.drafts[q.id]||[];const key=button.dataset.key;if(q.type==='single')selected=[key];else selected=selected.includes(key)?selected.filter(x=>x!==key):[...selected,key];s.drafts[q.id]=selected;rerenderQuestion();document.querySelector(`[data-action="option"][data-key="${key}"]`)?.focus({preventScroll:true});return;}
 if(a==='submit'){const selected=s.drafts[q?.id]||[];if(!q||s.attempts[q.id]||!ReviewCore.validChoice(q,selected))return;const r=ReviewCore.submit(state,q,selected);s.attempts[q.id]=r;delete s.drafts[q.id];rerenderQuestion();$('.feedback')?.scrollIntoView({block:'nearest',behavior:'instant'});return;}
 if(a==='retry'){delete s.attempts[q.id];delete s.drafts[q.id];rerenderQuestion();return;}
 if(a==='next'){if(!q||!s.attempts[q.id])return;if(s.index===s.queue.length-1){s.completed=true;rerenderQuestion();$('.question-card')?.scrollIntoView({block:'start',behavior:'instant'});}else changePosition(s.index+1);return;}
 if(a==='prev'){changePosition(s.index-1);return;}if(a==='jump'){changePosition(Number(button.dataset.index));return;}
 if(a==='first-unanswered'){const n=s.queue.findIndex(id=>!s.attempts[id]);if(n>=0)changePosition(n);return;}
 if(a==='reset-round'){resetRound();return;}
 if(a==='random'||a==='type'){
  const type=a==='type'?button.dataset.value:s.type,random=a==='random'?!s.random:s.random;
  const ids=s.wrong?(s.pool||s.queue):undefined;makeSession(s.topicId,{type,random,wrong:s.wrong,ids});return;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)handleAction(b);});
document.addEventListener('input',e=>{if(e.target.id==='knowledgeSearch'){ui.knowledgeQuery=e.target.value;$('#knowledgeResults').innerHTML=knowledgeResults();}if(e.target.id==='wrongSearch'){ui.wrongQuery=e.target.value;$('#wrongResults').innerHTML=wrongResults();}if(e.target.id==='thoughtSearch'){ui.thoughtQuery=e.target.value;$('#thoughtResults').innerHTML=thoughtResults();}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='practiceTopic'&&el.value){openTopic(el.value);return;}if(el.id==='wrongTopic'){ui.wrongTopic=el.value;render();return;}if(el.id==='wrongStatus'){ui.wrongStatus=el.value;render();return;}if(el.id==='importFile'&&el.files[0]){try{if(el.files[0].size>10000000)throw new Error('备份文件过大');const raw=JSON.parse(await el.files[0].text());if(raw.app!=='xigai-six-review')throw new Error('请选择本网站导出的学习备份');const imported=ReviewCore.sanitize(raw.state,map);ReviewCore.merge(state,imported);save();$('#modal').close();render();toast('学习记录已合并，已有错题已保留。');}catch(error){toast(error.message||'无法读取这个备份。');}finally{el.value='';}}});
document.addEventListener('submit',e=>{if(e.target.id==='inlineSearch'){e.preventDefault();const value=$('#inlineQuery').value.trim();ui.knowledgeQuery=value;const t=topicMap.get(state.session?.topicId);ui.knowledgeChapter=t?.chapter?String(t.chapter):'all';go('knowledge');}});
document.addEventListener('keydown',e=>{if(ui.view!=='practice'||$('#modal').open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const s=state.session,q=map.get(s?.queue[s.index]);if(!q||s.completed)return;if(/^[1-5a-eA-E]$/.test(e.key)){e.preventDefault();const key=/^[1-5]$/.test(e.key)?String.fromCharCode(64+Number(e.key)):e.key.toUpperCase();document.querySelector(`[data-action="option"][data-key="${key}"]`)?.click();}else if(e.key==='Enter'&&e.target===document.body){e.preventDefault();document.querySelector(`[data-action="${s.attempts[q.id]?'next':'submit'}"]`)?.click();}});
window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);if(['home','practice','wrong','knowledge','thoughts'].includes(view)){ui.view=view;render();}});
const initial=location.hash.slice(1);if(['home','practice','wrong','knowledge','thoughts'].includes(initial))ui.view=initial;
render();
})();
</script>
</body>
</html>
