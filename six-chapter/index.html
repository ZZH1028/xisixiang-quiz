党的群众路线完整概括为一切为了群众、一切依靠群众，从群众中来、到群众中去。A项说明党的工作为了人民利益；B项说明工作力量来自群众参与和创造；C项要求调查研究、听取并集中群众意见；D项要求将形成的正确意见贯彻到群众实践并接受检验。四项既包含根本目的与依靠力量，也包含工作方法的连续过程，缺一不能完整表达群众路线。教材对应「群众路线的基本内容」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-03","type":"multiple","number":33,"originalNumber":"33","stem":"党的十九大报告指出，我国社会主要矛盾的变化，没有改变我们对我国社会主义所处历史阶段的判断。下列属于“没有改变”的内容有（ ）。","options":["我国仍处于并将长期处于社会主义初级阶段","我国是世界最大发展中国家的国际地位","我国社会主义民主政治的发展方向","我国经济总量位居世界第二的现状"],"answer":["A","B"],"explanation":{"reason":"党的十九大报告强调社会主要矛盾发生变化，但我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，世界最大发展中国家的国际地位没有变，故选A、B项。C项社会主义民主政治的发展方向是另一个政治建设问题，并非报告列举的“两个没有变”；D项经济总量位居世界第二是经济实力的事实描述，不能代替关于发展阶段和国际地位的两个判断。教材对应「主要矛盾变化与两个没有变」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-04","type":"multiple","number":34,"originalNumber":"34","stem":"马克思主义认为，人民群众是历史的创造者。这一原理在新时代的体现包括（ ）。","options":["人民是决定党和国家前途命运的根本力量","一切依靠群众，从群众中来，到群众中去","英雄人物决定历史发展方向，人民群众只是被动追随","尊重人民主体地位，发挥人民首创精神"],"answer":["A","B","D"],"explanation":{"reason":"人民群众是历史的创造者，新时代坚持这一原理必须尊重人民主体地位并依靠群众实践。A项指出人民对党和国家前途命运的根本作用；B项体现一切依靠群众、从群众中来、到群众中去的工作路线；D项要求尊重人民首创精神，发挥实践创造力。C项把英雄人物视为决定历史方向的唯一力量、把群众当作被动追随者，颠倒了群众和个人在历史创造中的关系。教材对应「历史唯物主义的人民群众观」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-05","type":"multiple","number":35,"originalNumber":"35","stem":"下列属于坚持以人民为中心的发展思想的具体体现的有（ ）。","options":["脱贫攻坚战取得全面胜利","全面建成小康社会","推进健康中国建设","实施乡村振兴战略"],"answer":["A","B","C","D"],"explanation":{"reason":"坚持以人民为中心要通过改善民生和促进共享把价值理念转化为实践成效。A项脱贫攻坚战取得全面胜利，体现保障困难群众基本生活；B项全面建成小康社会，体现发展成果惠及全体人民的重要阶段性成果；C项健康中国建设回应人民生命健康需要；D项乡村振兴着眼农业农村发展与农民福祉。四项分别从减贫、发展阶段、健康服务和农村发展体现人民中心。教材对应「以人民为中心的发展实践」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-06","type":"multiple","number":36,"originalNumber":"36","stem":"习近平总书记强调，党员干部要树立正确的政绩观。下列属于正确政绩观要求的有（ ）。","options":["坚持发展为了人民、发展依靠人民、发展成果由人民共享","追求“短平快”项目，以GDP增速论英雄","多做打基础、利长远的实事","把人民满意不满意、高兴不高兴、答应不答应作为衡量政绩的根本标准"],"answer":["A","C","D"],"explanation":{"reason":"正确政绩观要求从人民利益和长远发展出发检验工作成效。A项坚持发展为了人民、依靠人民、成果由人民共享，明确政绩的价值标准；C项多做打基础、利长远的实事，强调可持续的真实成效；D项把人民满意程度作为衡量政绩的重要标准，体现人民评价。B项只追求短期项目和GDP增速，可能忽视民生、质量及长期效益，属于片面政绩观。教材对应「树立和践行正确政绩观」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-07","type":"multiple","number":37,"originalNumber":"37","stem":"共同富裕是全体人民的富裕，是（ ）。","options":["物质生活和精神生活都富裕","消除两极分化的富裕","同步富裕","同等富裕"],"answer":["A","B"],"explanation":{"reason":"共同富裕是全体人民的富裕，既包括物质生活也包括精神生活，并要求逐步缩小过大的发展差距，因此选A、B项。A项说明富裕不能只看收入财富，还要关注文化与精神生活；B项消除两极分化体现共享与社会公平的价值方向；C项同步富裕要求所有人同一时间达到相同阶段，不符合发展差异；D项同等富裕把共同富裕误解为收入与生活水平整齐划一。教材对应「共同富裕的科学内涵」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-08","type":"multiple","number":38,"originalNumber":"38","stem":"发展为了人民、发展依靠人民、发展成果由人民共享，这体现了（ ）。","options":["发展的目的","发展的动力","发展的归宿","发展的路径"],"answer":["A","B","C"],"explanation":{"reason":"发展为了人民、发展依靠人民、发展成果由人民共享，分别回答发展的目的、力量来源和成果归宿，故选A、B、C项。A项“为了人民”明确发展要满足谁的需要；B项“依靠人民”说明发展动力来自人民的劳动和创造；C项“由人民共享”明确发展成果最终惠及谁。D项发展路径讨论实现目标的具体道路和政策安排，虽可能包含群众参与方式，但不是这三句表述直接对应的概念层次。教材对应「发展的目的动力与成果归宿」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-09","type":"multiple","number":39,"originalNumber":"39","stem":"习近平总书记强调，要“把人民拥护不拥护、赞成不赞成、高兴不高兴、答应不答应作为衡量一切工作得失的根本标准”。这体现了（ ）。","options":["人民是历史的创造者","人民是党的工作的最高裁决者","人民立场是党的根本政治立场","党的群众路线"],"answer":["A","B","C","D"],"explanation":{"reason":"把人民拥护、赞成、高兴、答应与否作为工作得失标准，体现人民主体地位和党接受人民检验的要求。A项人民创造历史，是人民拥有评价资格的历史唯物主义基础；B项人民是党的工作成效的最终评判者，直接对应衡量标准；C项人民立场是党的根本政治立场，说明评价标准的价值依据；D项群众路线要求听取意见、接受评判并改进工作。四项分别从历史依据、评价主体、政治立场和工作方法说明这一论述。教材对应「以人民为标准检验工作成效」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-10","type":"multiple","number":40,"originalNumber":"40","stem":"走好新时代群众路线，需要（ ）。","options":["深入基层调查研究","运用网络了解民意","畅通群众诉求表达渠道","解决群众急难愁盼问题"],"answer":["A","B","C","D"],"explanation":{"reason":"走好新时代群众路线，既要贴近群众又要创新沟通渠道，并以解决问题检验成效。A项深入基层调查研究，能够直接掌握群众需求；B项运用网络了解民意，拓展联系群众的渠道；C项畅通诉求表达渠道，使群众意见能被及时听到和处理；D项解决急难愁盼问题，把群众意见转化为实际成果。四项贯通调查、沟通、表达和办理环节，共同体现群众路线的实践要求。教材对应「新时代群众路线的工作方法」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-11","type":"multiple","number":41,"originalNumber":"41","stem":"在推动共同富裕过程中，要正确处理（ ）等重大关系。","options":["效率和公平","先富和共富","物质富裕和精神富足","城市和乡村"],"answer":["A","B","C","D"],"explanation":{"reason":"推进共同富裕是一项长期系统工程，需要统筹多组相互联系的关系。A项效率和公平要求既创造财富又合理分享成果；B项先富和共富强调先富带后富、帮后富；C项物质富裕和精神富足要求提升生活质量与精神文化水平；D项城市和乡村要求缩小城乡发展差距、推动基本公共服务均衡。四项分别涉及分配机制、发展次序、富裕内涵和城乡协调，均直接关系共同富裕。教材对应「共同富裕需要处理的重大关系」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-12","type":"multiple","number":42,"originalNumber":"42","stem":"坚持以人民为中心，要求我们在经济发展中（ ）。","options":["更加注重保障和改善民生","更加注重社会公平正义","更加注重生态环境保护","更加注重人的全面发展"],"answer":["A","B","C","D"],"explanation":{"reason":"以人民为中心的经济发展不仅追求经济指标，更要回应人民在收入、权利、生态和发展机会方面的需要。A项保障和改善民生，使发展成果转化为公共福祉；B项促进公平正义，推动成果共享；C项保护生态环境，保障人民享有良好生活环境的权益；D项促进人的全面发展，体现发展的最终价值归宿。四项分别涉及民生、公平、生态和人的发展，均属人民中心导向。教材对应「以人民为中心对经济发展的要求」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-13","type":"multiple","number":43,"originalNumber":"43","stem":"尊重人民首创精神，要求我们在改革发展中（ ）。","options":["鼓励基层大胆探索、先行先试","及时总结推广群众创造的鲜活经验","把顶层设计与问计于民统一起来","完全依靠专家决策，群众只需执行"],"answer":["A","B","C"],"explanation":{"reason":"尊重人民首创精神，要把群众创造的实践经验转化为推动改革发展的智慧。A项鼓励基层探索和先行先试，为群众创新提供空间；B项及时总结推广鲜活经验，使局部创新得到检验和应用；C项把顶层设计与问计于民结合，促进政策与实践衔接。D项完全依赖专家、让群众只执行，否认群众的实践主体地位；专业意见有价值，但不能代替群众参与。教材对应「尊重人民首创精神」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-14","type":"multiple","number":44,"originalNumber":"44","stem":"从“脱贫攻坚”到“乡村振兴”的战略衔接，体现了（ ）。","options":["党对“三农”工作的高度重视","坚持以人民为中心的发展思想","共同富裕的长期性和艰巨性","党的政策的连续性和稳定性"],"answer":["A","B","C","D"],"explanation":{"reason":"脱贫攻坚与乡村振兴有效衔接，体现对人民福祉和农业农村长期发展的持续重视。A项说明解决好“三农”问题始终是全党工作重要任务；B项体现以人民为中心、保障改善农民生活；C项说明共同富裕需要从解决绝对贫困进一步走向缩小发展差距，具有长期性；D项体现政策目标的连续推进和治理措施的衔接。四项分别从工作重点、价值立场、发展进程和政策连续性解释战略衔接。教材对应「脱贫攻坚与乡村振兴的有效衔接」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-15","type":"multiple","number":45,"originalNumber":"45","stem":"在抗击新冠疫情中，“人民至上、生命至上”的理念要求我们（ ）。","options":["不惜一切代价保护人民生命安全和身体健康","统筹疫情防控和经济社会发展","依靠人民打赢疫情防控阻击战","构建人类卫生健康共同体"],"answer":["A","B","C","D"],"explanation":{"reason":"人民至上、生命至上要求在重大公共卫生风险面前把人民生命健康放在重要位置，并形成社会协同治理。A项强调尽最大努力保护人民生命安全和身体健康；B项统筹疫情防控和经济社会发展，关注人民长期生活与社会运行；C项依靠人民参与公共卫生治理，发挥群众主体作用；D项推动人类卫生健康共同体，体现跨国公共卫生合作。四项分别从生命保护、统筹治理、群众参与和国际合作体现这一理念。教材对应「人民至上生命至上与公共卫生治理」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-16","type":"multiple","number":46,"originalNumber":"46","stem":"坚持人民主体地位，必须（ ）。","options":["保证人民依法实行民主选举","保证人民依法实行民主协商","保证人民依法实行民主决策","保证人民依法实行民主管理、民主监督"],"answer":["A","B","C","D"],"explanation":{"reason":"坚持人民主体地位，要依法保障人民在各环节行使民主权利。A项民主选举使人民依法选择代表和参与政治生活；B项民主协商强调公共事务中的讨论与凝聚共识；C项民主决策保障人民依法参与重要事项的决定过程；D项民主管理、民主监督分别使人民参与公共事务管理并监督公权力运行。四项覆盖选举、协商、决策、管理、监督等环节，共同体现全过程人民民主。教材对应「全过程人民民主的实现环节」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-17","type":"multiple","number":47,"originalNumber":"47","stem":"习近平总书记指出：“中国共产党根基在人民、血脉在人民、力量在人民。”这一论断深刻揭示了（ ）。","options":["党的根本性质","党的力量源泉","党的执政基础","党的奋斗目标"],"answer":["A","B","C","D"],"explanation":{"reason":"人民是历史的创造者，是党的力量源泉和执政根基。党的性质、宗旨和奋斗目标体现人民立场。因此，原题从党与人民关系的整体理解选择ABCD；其中B、C是“根基、力量”最直接的对应。"},"note":"原网站此题解析为空；按整体理解补全。","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-18","type":"multiple","number":48,"originalNumber":"48","stem":"坚持以人民为中心的发展思想，要求我们在推进中国式现代化过程中（ ）。","options":["实现全体人民共同富裕","促进人与自然和谐共生","推动物质文明和精神文明协调发展","走和平发展道路"],"answer":["A","B","C","D"],"explanation":{"reason":"以人民为中心推进中国式现代化，既关注全体人民的现实福祉，也追求长远可持续发展和和平环境。A项共同富裕强调现代化成果由全体人民共享；B项人与自然和谐共生维护人民长远生存发展条件；C项物质文明与精神文明协调发展回应人民多方面生活需要；D项和平发展道路有利于维护人民安宁与共同发展环境。四项均属于中国式现代化的中国特色，并从不同方面关联人民福祉。教材对应「中国式现代化与以人民为中心」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-19","type":"multiple","number":49,"originalNumber":"49","stem":"在新时代，践行以人民为中心的发展思想，需要（ ）。","options":["不断满足人民日益增长的美好生活需要","着力解决发展不平衡不充分问题","推动高质量发展","扎实推进共同富裕"],"answer":["A","B","C","D"],"explanation":{"reason":"新时代践行以人民为中心的发展思想，要围绕人民需求和发展中的突出矛盾持续改进政策。A项满足人民美好生活需要明确发展目标；B项解决不平衡不充分问题直面制约人民获得感的主要矛盾；C项推动高质量发展提供改善民生和提升供给质量的基础；D项扎实推进共同富裕推动发展成果更加公平共享。四项分别从目标、问题、路径和共享方向构成相互联系的实践要求。教材对应「新时代践行以人民为中心的发展思想」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-20","type":"multiple","number":50,"originalNumber":"50","stem":"从“全心全意为人民服务”到“以人民为中心”，体现了（ ）。","options":["党的根本宗旨的一脉相承","党对人民主体地位认识的深化","党对发展目的和发展动力的新认识","党的理论创新成果"],"answer":["A","B","C","D"],"explanation":{"reason":"全心全意为人民服务与以人民为中心在价值立场上一脉相承，同时体现党对发展与人民关系的不断深化。A项说明根本宗旨始终坚持服务人民；B项说明更加突出人民在历史创造和国家治理中的主体地位；C项从发展为了谁、依靠谁、成果由谁共享深化对发展目的和动力的认识；D项体现党的理论在实践基础上的丰富发展。四项分别从宗旨传承、主体认识、发展观念和理论创新概括这一关系。教材对应「党的为民宗旨与人民中心理念的传承发展」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"}]},{"id":"topic-5","label":"专题5","chapter":5,"title":"全面深化改革开放","kind":"main","source":"maogai.szhopc.cn · 习思想课程","questions":[{"id":"xx-ch5-single-01","type":"single","number":1,"originalNumber":"1","stem":"全面深化改革的总目标是什么？(  )","options":["完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化","建设社会主义市场经济体制","发展社会主义民主政治","推进全面依法治国"],"answer":["A"],"explanation":{"reason":"选A。全面深化改革的总目标由“完善和发展中国特色社会主义制度”与“推进国家治理体系和治理能力现代化”两部分组成；原选项A的“建设”按规范表述修订为“完善和发展”。B项只涉及市场经济体制，C项只涉及民主政治，D项只涉及依法治国，均非完整总目标。教材对应「全面深化改革的总目标」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-02","type":"single","number":2,"originalNumber":"2","stem":"统筹推进各领域各方面改革开放，必须以全面深化改革开放总目标为引领，以(  )为主线，以经济体制改革为重点。","options":["制度建设","组织建设","社会建设","现代化建设"],"answer":["A"],"explanation":{"reason":"统筹推进各领域改革要以制度建设为主线，完善根本制度、基本制度和重要制度，A项与要求直接对应。B项组织建设属于党的建设和组织体系完善，C项社会建设是改革涉及的重要领域，二者均不能替代统领各领域的制度主线；D项现代化建设是总体事业和目标方向，并非这里所问的改革主线。教材对应「全面深化改革的总体部署与制度建设」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-03","type":"single","number":3,"originalNumber":"3","stem":"全面深化改革的出发点和落脚点是（ ）。","options":["促进社会公平正义、增进人民福祉","完善社会主义市场经济体制","建设社会主义法治国家","实现中华民族伟大复兴"],"answer":["A"],"explanation":{"reason":"全面深化改革坚持以人民为中心，出发点和落脚点是促进社会公平正义、增进人民福祉，因此A项正确。B项完善社会主义市场经济体制是重要改革任务，C项建设社会主义法治国家属于法治建设目标，D项实现中华民族伟大复兴是国家发展的宏伟目标；这三项具有重要意义，但均不能代替题目所问的直接价值指向。教材对应「全面深化改革的人民立场」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-04","type":"single","number":4,"originalNumber":"4","stem":"关于全面深化改革，下列表述错误的是（ ）。","options":["改革是社会主义制度的自我完善和发展","改革是对原有体制的根本性变革","改革是中国的第二次革命","改革是一个阶级推翻另一个阶级的暴力革命"],"answer":["D"],"explanation":{"reason":"全面深化改革是社会主义制度的自我完善和发展，不是阶级间暴力夺权，故把改革说成阶级推翻阶级的暴力革命的D项错误。A项指出改革的社会主义性质；B项所说的体制深刻变革指不适应发展的具体体制机制调整，并不等于推翻社会主义基本制度；C项“第二次革命”强调改革的深刻历史作用，而非改变国家阶级性质。教材对应「改革的性质与历史作用」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-05","type":"single","number":5,"originalNumber":"5","stem":"全面深化改革，必须坚持正确处理改革发展稳定关系的方针。其中，（ ）是前提。","options":["改革","发展","稳定","创新"],"answer":["C"],"explanation":{"reason":"正确处理改革、发展、稳定的关系，要把稳定作为前提和基本保障，因此C项正确。A项改革是推动经济社会发展的动力，通过制度创新破除障碍；B项发展是目的，也是解决问题的重要基础；D项创新是推动发展的重要动力，但并非改革发展稳定三者关系中所说的前提。三者各有定位，不能把动力、目的与前提混同。教材对应「改革发展稳定的辩证关系」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-06","type":"single","number":6,"originalNumber":"6","stem":"全面深化改革的总目标中，完善和发展中国特色社会主义制度是（ ）。","options":["方向","路径","手段","目的"],"answer":["A"],"explanation":{"reason":"全面深化改革总目标包含两个紧密联系的方面：完善和发展中国特色社会主义制度规定根本方向，故A项正确。B项路径强调实现改革目标采取的具体路线和步骤，C项手段强调实施改革的工具与方式，D项目的是目标指向的概括；这些词均不能取代“完善和发展中国特色社会主义制度”在总目标中的方向性定位。教材对应「全面深化改革总目标的内涵」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-07","type":"single","number":7,"originalNumber":"7","stem":"我国改革开放的实践充分证明，（ ）是决定当代中国命运的关键一招。","options":["党的领导","改革开放","经济建设","科技创新"],"answer":["B"],"explanation":{"reason":"改革开放是决定当代中国命运的关键一招，深刻改变中国发展面貌，故B项正确。A项党的领导是中国特色社会主义最本质的特征和改革成功的根本保证；C项经济建设是党和国家工作的中心任务；D项科技创新是推动高质量发展的重要动力。后三项都不可或缺，但题干中的“关键一招”特指改革开放。教材对应「改革开放的历史地位」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-08","type":"single","number":8,"originalNumber":"8","stem":"推进全面深化改革，要把（ ）作为全面深化改革的出发点和落脚点。","options":["实现好、维护好、发展好最广大人民根本利益","完善和发展中国特色社会主义制度","推进国家治理体系和治理能力现代化","解放和发展社会生产力"],"answer":["A"],"explanation":{"reason":"全面深化改革以实现好、维护好、发展好最广大人民根本利益为价值归宿，因此A项正确。B项完善和发展中国特色社会主义制度是总目标中的根本方向，C项推进国家治理体系和治理能力现代化是总目标的另一组成部分，D项解放和发展社会生产力是改革的重要任务和效果；三者均服务人民利益，却不是题干直接询问的出发点和落脚点。教材对应「全面深化改革坚持以人民为中心」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-09","type":"single","number":9,"originalNumber":"9","stem":"关于全面深化改革，下列说法正确的是（ ）。","options":["改革是社会主义制度的根本变革","改革是中国的第三次革命","改革是社会主义制度的自我完善和发展","改革的目标是建立资本主义制度"],"answer":["C"],"explanation":{"reason":"我国改革的性质是社会主义制度的自我完善和发展，通过完善体制机制释放制度优势，C项正确。A项所谓社会主义制度的根本变革容易混淆具体体制改革与改变社会主义根本制度；B项把改革说成“第三次革命”不符合通常所说的“第二次革命”历史定位；D项把建立资本主义制度作为改革目标，更与中国特色社会主义改革方向相悖。教材对应「全面深化改革的性质与方向」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-10","type":"single","number":10,"originalNumber":"10","stem":"改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的（ ）。","options":["关键一步","关键一招","必由之路","根本动力"],"answer":["B"],"explanation":{"reason":"改革开放既是决定当代中国命运的关键一招，也是实现既定奋斗目标和民族复兴的关键一招，因此B项与题干引文相符。A项“关键一步”侧重某一阶段性行动，不能替代原来的总体判断；C项“必由之路”可用于概括实现目标所需的发展道路，但不是此处引用的对应词；D项“根本动力”属于动力机制层级，亦非题干要求补全的表述。教材对应「改革开放的战略意义」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-11","type":"single","number":11,"originalNumber":"11","stem":"全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力（ ）。","options":["科学化","民主化","现代化","法治化"],"answer":["C"],"explanation":{"reason":"全面深化改革的总目标明确提出推进国家治理体系和治理能力现代化，故C项正确。A项科学化强调治理决策和管理符合科学规律，B项民主化强调人民参与和民主原则，D项法治化强调依照宪法法律运行；这些都是治理现代化的重要要求或表现，但单独任何一项都不足以替代总目标中概括性的“现代化”。教材对应「国家治理体系和治理能力现代化」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-12","type":"single","number":12,"originalNumber":"12","stem":"坚持和发展中国特色社会主义，必须不断适应社会生产力发展调整生产关系，不断适应经济基础发展完善上层建筑。这体现了（ ）的基本原理。","options":["生产力决定生产关系","经济基础决定上层建筑","社会基本矛盾运动","人民群众是历史创造者"],"answer":["C"],"explanation":{"reason":"生产关系与生产力、上层建筑与经济基础之间的矛盾及其运动构成社会基本矛盾，题干同时涉及两组关系，所以C项正确。A项生产力决定生产关系解释了前一组关系的基础方向；B项经济基础决定上层建筑解释了后一组关系的基础方向，二者都只覆盖题干的一部分；D项人民群众是历史创造者属于历史主体观点，并非这里所问的两组结构关系。教材对应「社会基本矛盾运动与改革」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-13","type":"single","number":13,"originalNumber":"13","stem":"新时代全面深化改革，必须坚持（ ），这是全面深化改革的出发点和落脚点。","options":["以经济建设为中心","以人民为中心","以发展为第一要务","以党的领导为根本保证"],"answer":["B"],"explanation":{"reason":"新时代全面深化改革坚持以人民为中心，改革为了人民、依靠人民，成果由人民共享，B项正确。A项以经济建设为中心规定发展工作的中心任务；C项发展是解决我国一切问题的基础和关键，体现发展任务的重要性；D项党的领导是全面深化改革的根本政治保证。后三项属于不同层级的原则或条件，不能替代“以人民为中心”的价值立场。教材对应「全面深化改革的根本立场」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-14","type":"single","number":14,"originalNumber":"14","stem":"全面深化改革，必须坚持和加强党的（ ）。","options":["思想领导","组织领导","政治领导","全面领导"],"answer":["D"],"explanation":{"reason":"改革必须坚持和加强党的全面领导，把党的领导贯穿改革各方面全过程，因此D项正确。A项思想领导侧重理论武装和思想引领，B项组织领导侧重组织体系与干部队伍，C项政治领导侧重政治方向和政治原则；三者均是党的领导的重要体现，但仅取其中一方面不足以表达题干所要求的全面领导。教材对应「党对全面深化改革的领导」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-15","type":"single","number":15,"originalNumber":"15","stem":"改革、发展、稳定是我国社会主义现代化建设的三个重要支点，其中（ ）是解决一切经济社会问题的关键。","options":["改革","发展","稳定","创新"],"answer":["B"],"explanation":{"reason":"改革发展稳定三者中，发展是解决我国一切问题的基础和关键，所以B项正确。A项改革的定位是动力，通过变革体制机制促进发展；C项稳定是推进改革和发展的前提；D项创新是引领发展的重要动力之一，能为高质量发展提供支撑。题干强调的是解决经济社会问题的总体关键，不能用推动发展的方法或保障条件替代发展本身。教材对应「改革发展稳定的相互关系」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-16","type":"single","number":16,"originalNumber":"16","stem":"全面深化改革的重点是（ ）。","options":["政治体制改革","经济体制改革","文化体制改革","社会体制改革"],"answer":["B"],"explanation":{"reason":"全面深化改革以经济体制改革为重点，着力处理政府与市场关系并释放资源配置活力，B项正确。A项政治体制改革涉及政治制度运行和民主法治建设，C项文化体制改革关乎文化发展和文化治理，D项社会体制改革关乎民生与社会治理。三者都是全面深化改革的重要组成部分，但题目所问的“重点”有专门定位。教材对应「经济体制改革的重点地位」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-17","type":"single","number":17,"originalNumber":"17","stem":"国家治理体系是在党领导下管理国家的（ ），包括经济、政治、文化、社会、生态文明和党的建设等各领域体制机制、法律法规安排。","options":["制度体系","组织体系","法规体系","管理体系"],"answer":["A"],"explanation":{"reason":"国家治理体系是在党的领导下管理国家的一整套制度体系，包含各领域体制机制和法律法规，因此A项正确。B项组织体系只是治理制度运行的重要载体，C项法规体系仅涵盖法律规范层面，D项管理体系强调治理活动的组织和运行；这些都是组成部分或相近概念，却不能概括国家治理体系作为整体制度安排的内涵。教材对应「国家治理体系的基本概念」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-18","type":"single","number":18,"originalNumber":"18","stem":"国家治理能力是运用国家制度管理社会各方面事务的能力，包括（ ）等各个方面。","options":["改革发展稳定、内政外交国防、治党治国治军","经济建设、政治建设、文化建设、社会建设、生态文明建设","党的领导、人民当家作主、依法治国","决策、执行、监督"],"answer":["A"],"explanation":{"reason":"国家治理能力是运用国家制度处理各方面事务的能力，规范概括包括改革发展稳定、内政外交国防、治党治国治军，故A项正确。B项列举经济、政治、文化等建设领域，更多对应总体布局；C项党的领导、人民当家作主、依法治国强调政治发展原则；D项决策、执行、监督是治理运行环节，均不能替代题干要求的国家治理能力事务范围表述。教材对应「国家治理能力的内涵」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-19","type":"single","number":19,"originalNumber":"19","stem":"新时代坚持和发展中国特色社会主义，根本动力仍然是（ ）。","options":["科技创新","改革开放","对外开放","发展生产力"],"answer":["B"],"explanation":{"reason":"新时代坚持和发展中国特色社会主义，根本动力仍然是改革开放。改革着力破除体制机制障碍，开放促进内外联动；二者共同为发展注入动力。科技创新、生产力发展与此密切相关，但不能替代题干所考查的规范概括。"},"note":"原B仅写全面深化改革，已按教材的完整表述修订为改革开放。","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-20","type":"single","number":20,"originalNumber":"20","stem":"开放型世界经济的建设，要推动经济全球化朝着更加开放、包容、普惠、平衡、（ ）的方向发展。","options":["共赢","公平","可持续","创新"],"answer":["A"],"explanation":{"reason":"推动经济全球化朝着开放、包容、普惠、平衡、共赢的方向发展，强调各国共同受益与合作，故A项“共赢”正确。B项公平是治理所追求的重要价值，但不对应题干所列固定表述的末项；C项可持续是全球发展目标的重要要求，D项创新是经济增长的重要动力，二者均有积极意义，但均不能代替此处的“共赢”。教材对应「推动经济全球化与开放型世界经济」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-21","type":"single","number":21,"originalNumber":"21","stem":"全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。其中，后者的核心是（ ）。","options":["党的领导","依法治国","人民当家作主","制度现代化"],"answer":["D"],"explanation":{"reason":"正确答案为D。国家治理体系和治理能力体现为制度体系及其执行能力，因此推进国家治理现代化的核心落在制度现代化；A项党的领导、B项依法治国、C项人民当家作主都是国家治理的重要原则或制度内容，但不是题干所问的核心概括。教材对应「国家治理体系和治理能力现代化」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-22","type":"single","number":22,"originalNumber":"22","stem":"经济体制改革的核心问题是处理好（ ）的关系。","options":["政府和企业","计划和市场","政府和市场","宏观和微观"],"answer":["C"],"explanation":{"reason":"经济体制改革的核心问题是处理好政府和市场的关系，使市场在资源配置中起决定性作用，更好发挥政府作用，所以C项正确。A项政府与企业关系涉及政企职责划分，是核心问题中的一部分；B项计划和市场关系是认识经济运行机制的重要历史议题；D项宏观和微观关系是经济分析与政策协调层次，均不足以概括当前改革核心问题的完整定位。教材对应「政府和市场的关系」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-23","type":"single","number":23,"originalNumber":"23","stem":"（ ）是开启改革开放事业的思想前提，也是新时代全面深化改革开放的思想前提。","options":["解放思想","实事求是","开拓创新","求真务实"],"answer":["A"],"explanation":{"reason":"解放思想是开启改革开放事业的重要思想前提，能够打破旧观念束缚并推动理论和实践创新，因此A项正确。B项实事求是要求从客观实际出发，是思想路线的重要内容；C项开拓创新是改革实践需要具备的进取精神；D项求真务实强调坚持真理与务实作风。后三项与改革密切相关，但题干专门指向突破思想束缚的先导条件。教材对应「解放思想与改革开放」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-24","type":"single","number":24,"originalNumber":"24","stem":"改革开放的鲜明特征和首要任务是（ ）。","options":["经济改革","社会改革","解放和发展社会生产力","增强综合国力"],"answer":["C"],"explanation":{"reason":"解放和发展社会生产力是改革开放的重要任务。经济改革、社会改革是具体改革领域；增强综合国力是改革发展的重要结果，均不能代替题干中的任务表述。"},"note":"修正原题“和鲜明特征”和“社会生产”两处笔误。","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-25","type":"single","number":25,"originalNumber":"25","stem":"全面深化改革关键所在是（ ）。","options":["解放和增强社会活力","实现共同富裕","完善社会制度","深化经济体制改革"],"answer":["A"],"explanation":{"reason":"全面深化改革要进一步解放和增强社会活力，让生产要素和社会创造力充分涌流，A项契合题干所问的关键着力点。B项实现共同富裕是社会主义发展的重要目标，C项完善社会制度属于改革要推进的制度性工作，D项深化经济体制改革是全面深化改革的重点；三者与改革密切相关，但分别体现目标、制度任务和重点领域，不等同于释放社会活力这一动力要求。教材对应「全面深化改革与激发社会活力」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-26","type":"single","number":26,"originalNumber":"26","stem":"全面深化改革，要更加注重改革的（ ），增强改革的系统性、整体性、协同性。","options":["全面性","深刻性","创新性","系统性、整体性、协同性"],"answer":["D"],"explanation":{"reason":"全面深化改革是一项跨领域系统工程，必须增强改革的系统性、整体性、协同性，统筹政策衔接和部门配合，D项与题干明确列出的要求一致。A项全面性强调改革覆盖面，B项深刻性强调触及矛盾和体制机制的深度，C项创新性强调改革举措开拓新路径；这些也是改革的重要特征，但不是题干重复强调的三方面联动要求。教材对应「增强改革系统性整体性协同性」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-27","type":"single","number":27,"originalNumber":"27","stem":"开放带来进步，封闭必然落后。中国坚持（ ）的基本国策。","options":["互利共赢","对外开放","独立自主","和平发展"],"answer":["B"],"explanation":{"reason":"对外开放是我国长期坚持的基本国策，开放促合作、促发展，因此B项正确。A项互利共赢是我国开展对外合作的重要原则和目标，不是这一基本国策的正式名称；C项独立自主强调把国家发展立足点放在自身力量上，属于自主发展原则；D项和平发展是中国坚持的发展道路和对外关系取向，均不能替代“对外开放”。教材对应「坚持对外开放基本国策」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-28","type":"single","number":28,"originalNumber":"28","stem":"全面深化改革，必须坚持的出发点和落脚点是促进社会公平正义、（ ）。","options":["增进人民福祉","实现共同富裕","维护社会稳定","完善市场经济"],"answer":["A"],"explanation":{"reason":"全面深化改革的出发点和落脚点是促进社会公平正义、增进人民福祉，故A项直接补全这一表述。B项实现共同富裕是中国特色社会主义的重要目标，与人民福祉密切联系；C项维护社会稳定是改革发展得以持续的前提条件；D项完善市场经济是经济体制改革的重要任务。后三项各有所属，但不属于题干要求填入的固定并列内容。教材对应「全面深化改革的人民利益取向」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-29","type":"single","number":29,"originalNumber":"29","stem":"坚持和完善社会主义基本经济制度，要充分发挥市场在资源配置中的（ ）性作用。","options":["基础","决定","主导","辅助"],"answer":["B"],"explanation":{"reason":"社会主义市场经济体制要求市场在资源配置中起决定性作用，同时更好发挥政府作用，因此B项正确。A项“基础性作用”属于此前关于市场作用的历史表述，不能替代现行定位；C项“主导性作用”容易混淆市场配置与政府宏观调控的不同职能；D项“辅助性作用”低估了市场的资源配置作用。教材对应「市场在资源配置中的决定性作用」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-single-30","type":"single","number":30,"originalNumber":"30","stem":"治理国家，（ ）是起根本性、全局性、长远性作用的。","options":["方向","路径","制度","目的"],"answer":["C"],"explanation":{"reason":"制度具有根本性、全局性、稳定性和长期性，治理国家要依靠成熟定型的制度体系，所以C项正确。A项方向关系到治理的政治目标和道路选择，B项路径是实现治理目标的具体路线，D项目的体现治理要实现的价值与成果；三者都重要，但题干特指能够长期规范各领域治理活动的制度性保障。教材对应「制度在国家治理中的根本作用」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-01","type":"multiple","number":31,"originalNumber":"1","stem":"全面深化改革的总目标包括（ ）。","options":["完善和发展中国特色社会主义制度","推进国家治理体系和治理能力现代化","建设社会主义现代化强国","实现中华民族伟大复兴"],"answer":["A","B"],"explanation":{"reason":"全面深化改革总目标由两个不可分割的方面组成：A项完善和发展中国特色社会主义制度，明确改革坚持的根本方向；B项推进国家治理体系和治理能力现代化，明确制度完善和治理效能提升的指向。C项建设社会主义现代化强国是国家现代化建设的宏伟目标，D项民族复兴是国家发展的总体奋斗目标，都与改革相关，却不属于该总目标的两句直接组成内容。教材对应「全面深化改革的总目标」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-02","type":"multiple","number":32,"originalNumber":"2","stem":"全面深化改革必须坚持的正确方向包括（ ）。","options":["坚持社会主义市场经济改革方向","坚持中国特色社会主义政治发展道路","坚持党对改革的集中统一领导","坚持四项基本原则"],"answer":["A","B","C","D"],"explanation":{"reason":"全面深化改革必须沿着中国特色社会主义方向推进。A项坚持社会主义市场经济改革方向，保证经济改革目标；B项坚持中国特色社会主义政治发展道路，明确政治改革方向；C项坚持党对改革的集中统一领导，保证改革始终沿着正确政治方向；D项坚持四项基本原则，维护社会主义根本政治前提。四项分别从经济、政治、领导和基本原则层面保障改革方向。教材对应「全面深化改革的正确方向」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-03","type":"multiple","number":33,"originalNumber":"3","stem":"经济体制改革的核心问题是处理好政府和市场的关系，使市场在资源配置中起决定性作用和更好发挥政府作用。这要求（ ）。","options":["政府减少对微观经济活动的干预","政府加强宏观调控","政府主要发挥经济调节、市场监管、社会管理、公共服务、生态环境保护等职能","政府完全退出市场"],"answer":["A","B","C"],"explanation":{"reason":"处理政府和市场关系，要让市场有效配置资源并使政府更好履职。A项减少不必要的微观经济干预，有利于市场主体自主经营；B项加强科学宏观调控，有利于维护经济稳定；C项履行经济调节、市场监管、社会管理、公共服务、生态环境保护等职责，是政府应发挥的作用；D项要求政府完全退出市场，会忽视公共服务和市场失灵治理，因而不能成立。教材对应「经济体制改革中政府与市场的关系」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-04","type":"multiple","number":34,"originalNumber":"4","stem":"全面深化改革，要处理好（ ）的关系。","options":["解放思想和实事求是","整体推进和重点突破","顶层设计和摸着石头过河","改革发展稳定"],"answer":["A","B","C","D"],"explanation":{"reason":"全面深化改革需要运用辩证思维处理多组重要关系。A项协调解放思想与实事求是，做到勇于探索又立足实际；B项把整体推进与重点突破结合起来，提高改革效率；C项把顶层设计与摸着石头过河结合起来，兼顾总体谋划与基层实践；D项统筹改革发展稳定，在改革动力、发展目标与稳定前提之间把握平衡。四项均属于改革的重要方法论。教材对应「全面深化改革必须处理好的重大关系」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-05","type":"multiple","number":35,"originalNumber":"5","stem":"新时代全面深化改革具有哪些鲜明特点 （ ）。","options":["全面性","系统性","整体性","各领域改革必须完全同步"],"answer":["A","B","C"],"explanation":{"reason":"全面深化改革涉及多领域、多层次，是全面、系统、整体的制度创新。系统性、整体性、协同性要求各项改革相互配合，而非各领域进度完全相同。"},"note":"原D“协调性”与“协同性”含义接近，已改为明确错误选项，避免凭近义词机械判错。","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-06","type":"multiple","number":36,"originalNumber":"6","stem":"全面深化改革，必须坚持和完善我国社会主义基本经济制度，包括（ ）。","options":["公有制为主体、多种所有制经济共同发展","按劳分配为主体、多种分配方式并存","社会主义市场经济体制","政府宏观调控体系"],"answer":["A","B","C"],"explanation":{"reason":"我国社会主义基本经济制度包含三方面：A项公有制为主体、多种所有制经济共同发展，是所有制结构安排；B项按劳分配为主体、多种分配方式并存，是分配制度安排；C项社会主义市场经济体制，是经济运行体制安排。D项政府宏观调控体系是社会主义市场经济运行的重要配套机制，属于调控和治理制度，但不作为基本经济制度的上述三项并列组成部分。教材对应「社会主义基本经济制度的主要内容」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-07","type":"multiple","number":37,"originalNumber":"7","stem":"坚持全面深化改革，必须坚持和加强党的全面领导。这是因为（ ）。","options":["党的领导是中国特色社会主义最本质的特征","党是最高政治领导力量","改革任务越繁重，越要加强和改善党的领导","党的领导是改革开放成功的根本保证"],"answer":["A","B","C","D"],"explanation":{"reason":"坚持党的全面领导是全面深化改革的根本保证。A项指出党的领导是中国特色社会主义最本质的特征，奠定改革的政治方向；B项明确党是最高政治领导力量，保证统揽全局；C项说明改革越艰巨越需要加强和改善党的领导，保障改革协调推进；D项概括党的领导是改革开放成功的根本保证。四项共同阐明坚持党的全面领导的制度和实践依据。教材对应「党对全面深化改革的领导」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-08","type":"multiple","number":38,"originalNumber":"8","stem":"全面深化改革，必须坚持正确处理改革发展稳定关系的方针。其中（ ）。","options":["改革是动力","发展是目的","稳定是前提","稳定是目的"],"answer":["A","B","C"],"explanation":{"reason":"改革、发展、稳定相互促进又各有定位。A项改革是动力，通过破除体制机制障碍促进进步；B项发展是目的，改革最终要促进经济社会发展、增进人民福祉；C项稳定是前提，为改革发展提供必要社会环境。D项“稳定是目的”混淆了稳定的保障作用与发展的目标定位，稳定固然重要，但在题干所问三者关系中不能取代发展这一目的。教材对应「改革发展稳定的辩证关系」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-09","type":"multiple","number":39,"originalNumber":"9","stem":"我国改革开放的宝贵经验包括（ ）。","options":["必须坚持党对改革的集中统一领导","必须坚持和发展中国特色社会主义","必须坚持以人民为中心","必须坚持摸着石头过河和加强顶层设计相结合"],"answer":["A","B","C","D"],"explanation":{"reason":"改革开放的实践经验体现为坚持正确方向、人民立场和科学方法。A项坚持党对改革的集中统一领导，保证政治方向；B项坚持和发展中国特色社会主义，明确改革性质和道路；C项坚持以人民为中心，确保改革为了人民、依靠人民；D项把摸着石头过河与顶层设计相结合，兼顾基层探索和总体谋划。四项从领导、道路、价值和方法方面概括了重要经验。教材对应「改革开放的宝贵经验」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-10","type":"multiple","number":40,"originalNumber":"10","stem":"推动建设开放型世界经济，我国倡导的全球治理观是（ ）。","options":["共商","共建","共享","共赢"],"answer":["A","B","C"],"explanation":{"reason":"我国倡导共商共建共享的全球治理观。A项共商强调国际事务由各方平等协商，B项共建强调各方共同参与治理规则和机制建设，C项共享强调治理成果由各国人民共同受益。D项共赢是国际合作和经济全球化的重要价值取向，追求互利成果，但它不是“共商共建共享”这一全球治理观三词结构中的组成项。教材对应「共商共建共享的全球治理观」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-11","type":"multiple","number":41,"originalNumber":"11","stem":"全面深化改革，要坚持以（ ）的勇气和决心，坚决破除一切不合时宜的思想观念和体制机制弊端。","options":["自我革命","刮骨疗毒","壮士断腕","循序渐进"],"answer":["A","B","C"],"explanation":{"reason":"破除不合时宜的思想观念和体制机制弊端，需要勇于自我革命的改革精神。A项自我革命体现直面自身问题、主动纠偏的担当；B项刮骨疗毒突出敢于触及深层矛盾和既得利益；C项壮士断腕强调为推进改革敢于作出艰难取舍。D项循序渐进是稳步实施改革的重要方法，强调节奏和步骤，而不是题干所问攻坚克难的勇气与决心。教材对应「全面深化改革的攻坚精神」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-12","type":"multiple","number":42,"originalNumber":"12","stem":"全面深化改革要敢于啃硬骨头、涉险滩。当前改革进入攻坚期和深水区，面临的矛盾和问题包括（ ）。","options":["发展不平衡不充分问题依然突出","体制机制障碍尚未完全破除","利益固化藩篱需要打破","思想观念的束缚需要突破"],"answer":["A","B","C","D"],"explanation":{"reason":"全面深化改革进入攻坚期和深水区，需要破解多方面阻力。A项发展不平衡不充分表明发展质量和结构仍存在突出问题；B项体制机制障碍影响资源配置和制度效能，需要持续改革；C项利益固化藩篱会阻碍利益调整和改革成果共享；D项陈旧思想观念可能束缚创新和改革实践。四项分别从发展、制度、利益和思想层面揭示改革面对的难题。教材对应「全面深化改革的现实难题」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-13","type":"multiple","number":43,"originalNumber":"13","stem":"全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。以下关于该总目标的理解，正确的有（ ）。","options":["完善和发展中国特色社会主义制度规定根本方向","推进国家治理体系和治理能力现代化指明实现路径","两者是统一的整体，不可偏废","国家治理体系和治理能力是一个国家的制度和制度执行能力的集中体现"],"answer":["A","B","C","D"],"explanation":{"reason":"总目标两句话是统一整体：完善和发展中国特色社会主义制度规定根本方向；推进国家治理体系和治理能力现代化指明实现路径。治理体系和治理能力集中体现国家制度及其执行能力。四项相互联系、不可偏废。"},"note":"原B写目的和落脚点，已按教材与A对应的层次修订为实现路径。","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-14","type":"multiple","number":44,"originalNumber":"14","stem":"关于全面深化改革，下列表述正确的有（ ）。","options":["全面深化改革是“四个全面”战略布局的重要组成部分","全面深化改革是关系党和国家事业发展全局的重大战略部署","全面深化改革只有进行时，没有完成时","全面深化改革的任务已经完成"],"answer":["A","B","C"],"explanation":{"reason":"全面深化改革贯穿新时代治国理政全过程。A项说明全面深化改革属于“四个全面”战略布局的重要方面；B项指出改革是关系党和国家事业发展全局的战略部署；C项强调改革必须随着实践和社会基本矛盾变化持续推进，只有进行时、没有完成时。D项断言改革任务已经完成，忽视改革的长期性与新问题的持续出现，也与不断深化改革的部署不符。教材对应「全面深化改革的战略地位与长期性」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-15","type":"multiple","number":45,"originalNumber":"15","stem":"全面深化改革开放，需要把握哪些正确方向（）？","options":["必须坚持和改善党的全面领导","必须坚持以人民为中心","必须有利于进一步解放思想、解放和发展生产力、增强社会活力","必须照搬外国制度模式"],"answer":["A","B","C"],"explanation":{"reason":"改革必须坚持党的领导、人民立场，并推动思想解放、生产力发展和社会活力增强。借鉴有益经验不等于照搬外国制度，D错误。"},"note":"原A、D重复且均可成立，已将D改为明确错误项；修订后答案ABC。","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-16","type":"multiple","number":46,"originalNumber":"16","stem":"全面深化改革必须坚持正确的方法论。以下属于全面深化改革方法论的有（ ）。","options":["增强顶层设计和摸着石头过河相结合","统筹改革发展稳定","胆子要大步子要稳","坚持重大改革于法有据"],"answer":["A","B","C","D"],"explanation":{"reason":"选ABCD。全面深化改革要把顶层设计与摸着石头过河结合起来，统筹改革发展稳定，坚持胆子要大、步子要稳，并坚持重大改革于法有据。A、C、D分别体现改革方式、推进节奏与法治保障，B体现统筹处理改革发展稳定关系，四项均属于方法论。教材对应「全面深化改革的重要方法」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-17","type":"multiple","number":47,"originalNumber":"17","stem":"习总书记指出：“这三个进一步解放，既是改革的目的，又是改革的条件”，其中“三个进一步解放指的是（ ）？”","options":["进一步解放思想","进一步对外开放","进一步解放和发展生产力、","进一步增强社会活力"],"answer":["A","C","D"],"explanation":{"reason":"“三个进一步解放”包括思想、生产力和社会活力三个相互联系的方面。A项进一步解放思想是前提，也是突破观念束缚的总开关；C项进一步解放和发展生产力是改革的重要任务和成效；D项进一步增强社会活力，体现激发社会创造力和积极性。B项进一步对外开放是改革开放事业的重要组成部分，但不属于这组三个概念中的固定表述。教材对应「三个进一步解放的内涵」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-18","type":"multiple","number":48,"originalNumber":"18","stem":"全面深化改革开放必须坚持正确的方法论。其中，加强顶层设计和摸着石头相结，体现了（ ）。","options":["实践探索与理论指导的统一","渐进式改革与系统性改革的统一","尊重客观规律与发挥主观能动性的统一","局部突破与整体推进的统一"],"answer":["A","B","C","D"],"explanation":{"reason":"把加强顶层设计与摸着石头过河结合起来，体现改革总体规划和实践探索的辩证统一。A项强调实践探索与理论指导相互促进；B项强调渐进式试点与系统性改革统筹推进；C项体现既尊重改革的客观规律又发挥改革主体的主动性；D项体现通过局部试验形成经验并服务整体推进。四项从认识、节奏、主体与布局等角度说明同一改革方法。教材对应「顶层设计与基层探索相结合」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-19","type":"multiple","number":49,"originalNumber":"19","stem":"新时代全面深化改革，必须坚持以人民为中心。这是因为（ ）。","options":["人民是历史的创造者，是改革开放的主体","全面深化改革的出发点和落脚点是促进社会公平正义、增进人民福祉","改革成效最终要由人民来评判","必须尊重人民首创精神，鼓励基层探索"],"answer":["A","B","C","D"],"explanation":{"reason":"全面深化改革坚持以人民为中心。A项人民是历史创造者和改革实践主体，揭示改革的依靠力量；B项促进社会公平正义、增进人民福祉，说明改革的出发点和落脚点；C项改革成效由人民评判，明确评价标准；D项尊重人民首创精神和基层探索，强调改革智慧来自实践。四项分别从主体、目的、评价和实践方法方面体现人民立场。教材对应「全面深化改革的人民立场与群众首创精神」。"},"note":"","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"},{"id":"xx-ch5-multi-20","type":"multiple","number":50,"originalNumber":"20","stem":"国家治理能力是运用国家制度管理社会各方面事务的能力，包括（ ）等各个方面。","options":["改革发展稳定","内政外交国防","治党治国治军","经济发展与社会治理"],"answer":["A","B","C","D"],"explanation":{"reason":"国家治理能力涵盖管理国家和社会事务的多方面能力。A、B、C是教材的概括性列举，D所述经济发展与社会治理也属于管理事务，因此题干既然问“包括”，四项均应选。"},"note":"原网站仅选ABC，但其排除D的理由不足。本题按范围关系修订答案为ABCD。","origin":"原网站习思想题库 · 第5章","topicId":"topic-5"}]},{"id":"topic-6","label":"专题6","chapter":17,"title":"全面从严治党","kind":"main","source":"maogai.szhopc.cn · 习思想课程","questions":[{"id":"xx-ch17-single-01","type":"single","number":1,"originalNumber":null,"stem":"全面从严治党，核心是______。","options":["加强党的领导","加强党的建设","加强党的纪律","加强党的作风"],"answer":["A"],"explanation":{"reason":"全面从严治党的核心是加强党的领导，A项突出党对各方面工作的领导是管党治党的根本政治保证。B项加强党的建设是全面从严治党的总体任务范围，不能代替其核心定位；C项加强纪律属于纪律建设和监督执纪要求；D项加强作风属于纠治“四风”、密切联系群众等具体任务。各项相互关联，但题干问的是“核心”。教材对应「全面从严治党的核心要求」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-02","type":"single","number":2,"originalNumber":null,"stem":"党的______是党的根本性建设，决定党的建设方向和效果。","options":["思想建设","政治建设","组织建设","作风建设"],"answer":["B"],"explanation":{"reason":"党的政治建设是党的根本性建设，决定党的建设方向和效果，B项着眼维护党中央权威和集中统一领导等根本要求。A项思想建设是党的基础性建设，重在理想信念和理论武装；C项组织建设侧重组织体系和干部队伍；D项作风建设着重党群关系和工作作风。后三项都是党的建设重要组成部分，但不属于题干所问的根本性建设。教材对应「党的政治建设的根本性地位」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-03","type":"single","number":3,"originalNumber":null,"stem":"党的______是党的基础性建设。","options":["政治建设","思想建设","组织建设","纪律建设"],"answer":["B"],"explanation":{"reason":"党的思想建设是党的基础性建设，B项强调通过理论武装、理想信念教育巩固思想根基。A项政治建设是党的根本性建设，在党的建设中居于统领地位；C项组织建设解决组织体系和干部队伍建设问题；D项纪律建设通过纪律约束保障党的团结统一。四项属于党的建设不同方面，基础性建设这一定位对应思想建设。教材对应「思想建设的基础性地位」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-04","type":"single","number":4,"originalNumber":null,"stem":"全面从严治党，要害在______。","options":["严","治","全面","管"],"answer":["B"],"explanation":{"reason":"选B。全面从严治党“基础在全面、关键在严、要害在治、核心是加强党的领导”，题干问“要害”，因此选治。A项严对应“关键”，C项全面对应“基础”，D项管不是这组规范概括中的对应表述。教材对应「全面从严治党的基本要求」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-05","type":"single","number":5,"originalNumber":null,"stem":"党的作风建设的核心问题是______。","options":["保持党同人民群众的血肉联系","反对形式主义","反对官僚主义","厉行勤俭节约"],"answer":["A"],"explanation":{"reason":"党的作风建设核心问题是保持党同人民群众的血肉联系，A项突出党群关系和人民立场。B项反对形式主义侧重纠治重形式轻实效；C项反对官僚主义侧重纠治脱离群众和脱离实际；D项厉行勤俭节约是反对享乐主义和奢靡之风等作风要求的重要内容。后三项都是改进作风的措施或表现，而非核心问题的总体概括。教材对应「作风建设与密切联系群众」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-06","type":"single","number":6,"originalNumber":null,"stem":"______是党的生命，是党内政治生活积极健康的重要基础。","options":["党内民主","纪律","团结统一","政治生活"],"answer":["A"],"explanation":{"reason":"“党内民主是党的生命，是党内政治生活积极健康的重要基础。”民主集中制是党的根本组织原则，不能把二者的规范表述混用。"},"note":"原题缺少正确选项，已将A从“民主集中制”修订为“党内民主”，并修正题干。","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-07","type":"single","number":7,"originalNumber":null,"stem":"全面从严治党，基础在______。","options":["全面","严","治","管"],"answer":["A"],"explanation":{"reason":"全面从严治党基础在全面，A项要求管全党、治全党，覆盖各级党组织与党员，贯穿党的建设各领域。B项“严”对应关键在严，要求真管真严、敢管敢严；C项“治”对应要害在治，强调落实管党治党责任；D项“管”不是这套规范表述中用于概括基础的关键词。题干问“基础”，不能混淆全面、严和治的定位。教材对应「全面从严治党的内涵」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-08","type":"single","number":8,"originalNumber":null,"stem":"党的政治建设的首要任务是______。","options":["保证全党服从中央，坚持党中央权威和集中统一领导","坚定理想信念","严肃党内政治生活","严明党的政治纪律"],"answer":["A"],"explanation":{"reason":"保证全党服从中央，坚持党中央权威和集中统一领导，是党的政治建设首要任务，A项体现维护党的团结统一的根本要求。B项坚定理想信念是党的思想建设的首要任务；C项严肃党内政治生活是政治建设的重要内容；D项严明政治纪律为维护集中统一领导提供纪律保障。C、D同样重要，但不取代明确规定的首要任务。教材对应「党的政治建设的首要任务」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-09","type":"single","number":9,"originalNumber":null,"stem":"党的纪律建设摆在首位的是______。","options":["组织纪律","廉洁纪律","政治纪律","群众纪律"],"answer":["C"],"explanation":{"reason":"政治纪律是党最根本、最重要的纪律，在党的纪律建设中摆在首位，对应C项，直接关系党的政治方向和集中统一。A项组织纪律维护组织原则和组织秩序；B项廉洁纪律规范廉洁用权；D项群众纪律保障党员干部正确处理同人民群众的关系。后三类纪律都是党的纪律的重要方面，但首要地位属于政治纪律。教材对应「政治纪律在党的纪律体系中的地位」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-10","type":"single","number":10,"originalNumber":null,"stem":"新时代党的组织路线强调，要着力培养忠诚干净担当的______。","options":["高素质干部队伍","专业化干部队伍","年轻化干部队伍","知识型干部队伍"],"answer":["A"],"explanation":{"reason":"新时代党的组织路线强调着力培养忠诚干净担当的高素质干部队伍，A项完整表达干部队伍建设的总体质量要求。B项专业化强调履职知识和能力，C项年轻化涉及干部年龄结构，D项知识型突出知识储备。后三项可以是干部队伍建设的具体方面，却不能替代“高素质”这一覆盖政治、能力、作风等多维要求的总括表述。教材对应「新时代党的组织路线和干部队伍建设」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-11","type":"single","number":11,"originalNumber":null,"stem":"党的自我革命的重要内涵是______。","options":["自我净化、自我完善、自我革新、自我提高","自我批评、自我反省、自我约束、自我监督","自我学习、自我教育、自我改造、自我提升","自我加压、自我鞭策、自我激励、自我超越"],"answer":["A"],"explanation":{"reason":"自我净化、自我完善、自我革新、自我提高是党的自我革命的“四个自我”，A项完整概括自我革命持续解决自身问题、提高能力的内涵。B项侧重反省和监督方法，C项偏重学习教育及自我改造，D项强调激励和自我鞭策，都涉及自我改进的某些方式，但不是“四个自我”的规范表述及完整结构。教材对应「党的自我革命的四个自我」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-12","type":"single","number":12,"originalNumber":null,"stem":"党内监督的重点对象是______。","options":["党的领导机关和领导干部特别是主要领导干部","基层党员","普通干部","年轻党员"],"answer":["A"],"explanation":{"reason":"党内监督的重点对象是党的领导机关和领导干部特别是主要领导干部，A项体现抓住“关键少数”的监督要求。B项基层党员、C项普通干部、D项年轻党员也应受党内监督，但主要属于监督覆盖的不同群体，不能等同于监督重点。全面覆盖与突出领导机关、领导干部的重点监督是相互结合的两个要求。教材对应「党内监督重点对象」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-13","type":"single","number":13,"originalNumber":null,"stem":"一体推进不敢腐、不能腐、不想腐，既抓惩治震慑，又抓制度约束和思想教育。从治标与治本的关系看，这要求坚持______。","options":["标本兼治","惩防并举","综合治理","宽严相济"],"answer":["A"],"explanation":{"reason":"治标重在惩治震慑，治本重在制度约束和思想教育。把三者作为整体推进，体现标本兼治。惩防并举、综合治理也有相关意义，本题明确从治标与治本的关系设问。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-14","type":"single","number":14,"originalNumber":null,"stem":"党的思想建设的首要任务是______。","options":["坚定理想信念","加强理论武装","开展党性教育","强化宗旨意识"],"answer":["A"],"explanation":{"reason":"坚定理想信念是党的思想建设的首要任务，A项强调保持党员政治信仰和精神追求。B项加强理论武装是坚定理想信念的重要途径；C项开展党性教育有助于锤炼政治品格；D项强化宗旨意识要求牢记为人民服务的根本宗旨。后三项与思想建设联系紧密，但题目明确问的是首要任务的规范定位。教材对应「思想建设的首要任务」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-15","type":"single","number":15,"originalNumber":null,"stem":"新时代党的建设总要求中，贯穿其中的主线是______。","options":["加强党的长期执政能力建设、先进性和纯洁性建设","仅加强党的先进性建设","全面从严治党","加强党的全面领导"],"answer":["A"],"explanation":{"reason":"新时代党的建设主线是加强党的长期执政能力建设、先进性和纯洁性建设。政治建设是统领，理想信念宗旨是根基，制度建设贯穿其中；全面从严治党是鲜明主题。"},"note":"原网站答案C错误，且把完整主线拆成A、B。已合并A为完整主线，修订答案为A。","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-16","type":"single","number":16,"originalNumber":null,"stem":"党的自我革命与社会革命的关系是______。","options":["自我革命引领社会革命","社会革命决定自我革命","二者相互独立、互不相关","社会革命优先于自我革命"],"answer":["A"],"explanation":{"reason":"党的自我革命引领社会革命，A项强调通过解决党自身问题保持领导力量的先进性和战斗力，从而推动党和人民事业发展。B项把社会革命说成单向决定自我革命，忽略党的自我革命的引领作用；C项否认二者的紧密联系；D项把社会革命置于自我革命之前并作为固定优先次序，不能概括两者相互促进的关系。教材对应「自我革命与社会革命的关系」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-17","type":"single","number":17,"originalNumber":null,"stem":"全面从严治党向纵深发展，要求把______挺在前面。","options":["纪律","法律","道德","制度"],"answer":["A"],"explanation":{"reason":"把纪律挺在前面意味着坚持纪严于法、纪在法前，A项强调用党规党纪规范全体党员的行为。B项法律是国家治理的重要规范和底线，但不能替代党员应遵守的更严格党纪要求；C项道德提供价值引导，不具备纪律处分的同类约束机制；D项制度范围广泛，题干专门要求置于前端的是纪律约束。教材对应「把纪律挺在前面」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-18","type":"single","number":18,"originalNumber":null,"stem":"党的政治纪律是党最根本、最重要的纪律，其核心是______。","options":["坚持党的领导","坚持党的基本路线","维护党中央权威和集中统一领导","坚持民主集中制"],"answer":["C"],"explanation":{"reason":"维护党中央权威和集中统一领导是党的政治纪律的核心要求，C项强调党员在政治方向、政治原则和政治行动上保持统一。A项坚持党的领导是总体政治原则；B项坚持党的基本路线规定政治路线方向；D项民主集中制是党的根本组织原则。后三项与政治纪律密切相关，但不如C项准确对应题干限定的核心内容。教材对应「政治纪律与维护党中央集中统一领导」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-19","type":"single","number":19,"originalNumber":null,"stem":"新时代党的建设要以______为统领。","options":["党的政治建设","党的思想建设","党的组织建设","党的作风建设"],"answer":["A"],"explanation":{"reason":"新时代党的建设要以政治建设为统领，A项强调政治建设决定党的建设方向和效果，贯穿各方面建设。B项思想建设提供理想信念和理论基础；C项组织建设巩固组织体系并培养干部；D项作风建设着重改进党群关系和工作作风。三者都不可缺少，但党的建设总体布局明确由政治建设发挥统领作用。教材对应「以党的政治建设为统领」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-single-20","type":"single","number":20,"originalNumber":null,"stem":"从保持马克思主义政党性质的角度看，坚持全面从严治党严的基调，根本目的在于______。","options":["保持党的先进性和纯洁性","提高党的执政能力","巩固党的执政地位","增强党的创造力凝聚力战斗力"],"answer":["A"],"explanation":{"reason":"从党的自身建设的根本要求看，坚持严的基调，是为了保持党的先进性和纯洁性。提高执政能力、增强战斗力和巩固执政地位与此相联系，但不代替题干指定的性质要求。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-01","type":"multiple","number":21,"originalNumber":null,"stem":"全面从严治党的基本要求包括______。","options":["基础在全面","关键在严","要害在治","核心在加强党的领导"],"answer":["A","B","C","D"],"explanation":{"reason":"全面从严治党的基本要求概括为核心是加强党的领导、基础在全面、关键在严、要害在治，因此A、B、C、D分别对应这四个方面，均正确。教材对应「全面从严治党的基本内涵」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-02","type":"multiple","number":22,"originalNumber":null,"stem":"新时代党的建设总要求中，党的建设的总体布局包括______。","options":["政治建设","思想建设","组织建设","作风建设"],"answer":["A","B","C","D"],"explanation":{"reason":"新时代党的建设总体布局包括政治建设（A）、思想建设（B）、组织建设（C）和作风建设（D），分别保障政治方向、思想基础、组织力量与优良作风。完整布局还包括纪律建设，并把制度建设贯穿其中、深入推进反腐败斗争；题干只要求从列出的项目中选择属于总体布局的内容，因此A、B、C、D均应选，不代表总体布局只有这四项。教材对应「新时代党的建设总体布局」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-03","type":"multiple","number":23,"originalNumber":null,"stem":"党的自我革命的内涵包括______。","options":["自我净化","自我完善","自我革新","自我提高"],"answer":["A","B","C","D"],"explanation":{"reason":"党的自我革命强调自我净化（A），清除影响党的先进性纯洁性的消极因素；自我完善（B），修补制度和组织运行中的不足；自我革新（C），主动适应形势变化并推动改革；自我提高（D），增强领导能力与执政本领。“四个自我”从清除问题、弥补缺陷到改进提升相互衔接，四项均属于题干所问的内涵。教材对应「党的自我革命的四个自我」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-04","type":"multiple","number":24,"originalNumber":null,"stem":"党的纪律主要包括______。","options":["政治纪律","组织纪律","廉洁纪律","群众纪律"],"answer":["A","B","C","D"],"explanation":{"reason":"党的纪律体系包括政治纪律（A）、组织纪律（B）、廉洁纪律（C）和群众纪律（D）。政治纪律维护政治方向与统一，组织纪律规范组织关系，廉洁纪律规范权力行使，群众纪律维护群众利益。完整的六项纪律还包括工作纪律、生活纪律；题干问“主要包括”，所列四项均是真实纪律类别，因此应全选。教材对应「党的六项纪律及其作用」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-05","type":"multiple","number":25,"originalNumber":null,"stem":"党内政治生活的基本规范包括______。","options":["实事求是","理论联系实际","密切联系群众","批评和自我批评"],"answer":["A","B","C","D"],"explanation":{"reason":"党内政治生活要求实事求是（A），坚持从实际出发；理论联系实际（B），把理论要求落实到实际工作；密切联系群众（C），维护党的群众路线；批评和自我批评（D），通过党内监督与思想交流发现和改正问题。四项都是党的优良传统、作风与严肃党内政治生活的重要规范，并非互斥选项，应共同选择。教材对应「严肃党内政治生活的基本规范」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-06","type":"multiple","number":26,"originalNumber":null,"stem":"全面从严治党，必须坚持______。","options":["思想建党和制度治党同向发力","依规治党与以德治党相结合","严管与厚爱相结合","激励与约束并重"],"answer":["A","B","C","D"],"explanation":{"reason":"全面从严治党要求思想建党与制度治党同向发力（A），将思想教育和制度约束结合；依规治党与以德治党相结合（B），同时注重纪律规则和道德引导；严管与厚爱相结合（C），把严格监督同关心干部结合；激励与约束并重（D），促使党员干部担当作为。四项从思想、制度、教育和干部管理层面说明综合施策的要求。教材对应「全面从严治党的方法要求」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-07","type":"multiple","number":27,"originalNumber":null,"stem":"新时代党的组织路线强调，要建设______的干部队伍。","options":["忠诚","干净","担当","高学历"],"answer":["A","B","C"],"explanation":{"reason":"忠诚、干净、担当是新时代高素质干部队伍建设的重要要求。A项忠诚强调政治品格与信念坚定；B项干净强调廉洁自律和正确用权；C项担当强调敢于负责、积极作为。D项高学历可能是部分岗位的知识条件，但不能作为衡量所有干部政治品格、廉洁品质和担当精神的统一标准，不属于这组三项要求。教材对应「忠诚干净担当的干部队伍建设」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-08","type":"multiple","number":28,"originalNumber":null,"stem":"党的作风建设要重点纠治的“四风”问题包括______。","options":["形式主义","官僚主义","享乐主义","奢靡之风"],"answer":["A","B","C","D"],"explanation":{"reason":"党的作风建设所说的“四风”包括形式主义（A）、官僚主义（B）、享乐主义（C）和奢靡之风（D）。形式主义重形式轻实效，官僚主义表现为脱离实际和群众，享乐主义追求安逸并缺乏担当，奢靡之风体现铺张浪费等不良习气。四项是作风整治的完整分类，不应把其中任一项排除。教材对应「纠治四风与党的作风建设」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-09","type":"multiple","number":29,"originalNumber":null,"stem":"一体推进不敢腐、不能腐、不想腐，其中______。","options":["不敢腐侧重惩治和震慑","不能腐侧重制度和监督","不想腐侧重教育和自律","三者相互独立、互不关联"],"answer":["A","B","C"],"explanation":{"reason":"一体推进不敢腐、不能腐、不想腐，A项“不敢腐”通过惩治形成震慑，B项“不能腐”依靠制度约束和监督制约权力，C项“不想腐”通过思想教育与廉洁文化增强自觉。D项把三者说成相互独立，忽略惩治、制度和教育协同推进的关系。三者各有侧重但相互促进，缺少任何一环都难以形成持久的反腐效果。教材对应「一体推进不敢腐不能腐不想腐」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-10","type":"multiple","number":30,"originalNumber":null,"stem":"党内监督的主要形式包括______。","options":["党内巡视","民主生活会","组织生活会","述职述廉"],"answer":["A","B","C","D"],"explanation":{"reason":"党内监督可以通过巡视巡察（A）发现和推动纠治问题，通过民主生活会（B）进行领导班子内部监督，通过组织生活会（C）落实党支部和党员日常监督，通过述职述廉（D）公开报告履职与廉洁情况。四项具有不同的开展层级、程序和监督侧重点，但都是党内监督工作的重要方式，均属于题干所问范围。教材对应「党内监督的具体形式」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-11","type":"multiple","number":31,"originalNumber":null,"stem":"全面从严治党向纵深发展，需要正确处理的关系包括______。","options":["思想建党与制度治党的关系","依规治党与以德治党的关系","严管与厚爱的关系","自我革命与社会革命的关系"],"answer":["A","B","C","D"],"explanation":{"reason":"推动全面从严治党向纵深发展，应正确处理思想建党与制度治党的关系（A），把思想引导和制度约束贯通；依规治党与以德治党的关系（B），协同发挥规则和道德作用；严管与厚爱的关系（C），做到监督约束与关心激励并重；自我革命与社会革命的关系（D），以自我革命引领社会革命。四组关系分别对应治党方法、干部管理和党的使命实践。教材对应「全面从严治党需处理的重要关系」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-12","type":"multiple","number":32,"originalNumber":null,"stem":"新时代党的建设总要求中，党的建设的主线是______。","options":["加强党的长期执政能力建设","加强党的先进性和纯洁性建设","加强党的全面领导","全面从严治党"],"answer":["A","B"],"explanation":{"reason":"新时代党的建设总要求以加强党的长期执政能力建设、先进性和纯洁性建设为主线，因此A、B共同构成主线。C“加强党的全面领导”是总要求的政治方向，D“全面从严治党”是贯穿党的建设的主题，不是此处所指的主线。教材对应「新时代党的建设总要求」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-13","type":"multiple","number":33,"originalNumber":null,"stem":"党的政治建设摆在首位，其具体内容包括______。","options":["保证全党服从中央","严明政治纪律和政治规矩","严肃党内政治生活","发展党内民主"],"answer":["A","B","C","D"],"explanation":{"reason":"把党的政治建设摆在首位，要求保证全党服从中央（A），维护党中央权威和集中统一领导；严明政治纪律与政治规矩（B），规范政治行为；严肃党内政治生活（C），增强政治性、时代性、原则性和战斗性；发展党内民主（D），保障党员参与并落实民主集中制。四项均属于政治建设及健康党内政治生活的有关要求。教材对应「党的政治建设的主要任务」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-14","type":"multiple","number":34,"originalNumber":null,"stem":"关于党的自我革命，下列说法正确的有______。","options":["自我革命是党跳出历史周期率的第二个答案","自我革命是党永葆生机活力的强大支撑","自我革命与社会革命相互促进","自我革命是党独有的政治品格"],"answer":["A","B","C","D"],"explanation":{"reason":"党的自我革命是跳出历史周期率的第二个答案（A），强调依靠自身不断纠偏；是党保持生机活力的重要支撑（B），有助于克服长期执政考验；与社会革命相互促进（C），通过党的自身建设引领社会变革；体现党勇于刀刃向内的政治品格（D）。四项从历史意义、实践作用、社会革命关系和政治特征说明自我革命的重要性。教材对应「党的自我革命的意义与特点」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"},{"id":"xx-ch17-multi-15","type":"multiple","number":35,"originalNumber":null,"stem":"全面从严治党，必须坚持严的基调，具体体现在______。","options":["严明党的纪律","严格党内监督","严肃党内政治生活","严厉惩治腐败"],"answer":["A","B","C","D"],"explanation":{"reason":"坚持全面从严治党严的基调，体现在严明党的纪律（A），划清纪律底线；严格党内监督（B），及时发现纠正问题；严肃党内政治生活（C），增强组织生活的政治性和原则性；严厉惩治腐败（D），维护纪律法律权威。四项从纪律、监督、政治生活和反腐败实践不同方面落实严的要求，均属于题干范围。教材对应「全面从严治党的严的基调」。"},"note":"","origin":"原网站习思想题库 · 第17章","topicId":"topic-6"}]},{"id":"supp-1","label":"补充1","chapter":0,"title":"导论","kind":"supp","source":"习思想教材配套练习题 导论(2).docx","questions":[{"id":"s1-single-1","type":"single","number":1,"originalNumber":"1","stem":"( )通过了关于《中国共产党章程（修正案）》的决议，把习近平新时代中国特色社会主义思想写入党章。","options":["党的十七大","党的十八大","党的十九大","党的二十大"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 导论 · 单选1","explanation":{"topic":"思想写入党章的时间","reason":"本题考查理论成果确立指导地位的时间。2017年党的十九大修改党章，将习近平新时代中国特色社会主义思想列入党的指导思想，因此选C。","analysis":"十七大、十八大分别处于更早阶段；二十大继续完善党章，但不是这一思想首次写入党章的大会。题干的关键是“把……写入党章”。","tip":"十九大：写入党章；2018年宪法修正：写入宪法。"},"topicId":"supp-1"},{"id":"s1-single-2","type":"single","number":2,"originalNumber":"2","stem":"（ ）是改革开放以来我们党全部理论和实践的鲜明主题。","options":["贯彻新发展理念","坚持和发展中国特色社会主义","改革开放","以经济建设为中心"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 导论 · 单选2","explanation":{"topic":"改革开放以来的鲜明主题","reason":"“坚持和发展中国特色社会主义”统摄道路、理论、制度、文化及各领域实践，是改革开放以来理论探索和实践发展的共同主题。","analysis":"新发展理念回答怎样发展，改革开放强调动力，以经济建设为中心强调工作重心；三者都不能代替题干所问的总体主题。","tip":"看见“全部理论和实践的鲜明主题”，对应“坚持和发展中国特色社会主义”。"},"topicId":"supp-1"},{"id":"s1-single-3","type":"single","number":3,"originalNumber":"3","stem":"党的二十大提出了（ ）。","options":["“六个必须坚持”","“十个明确”","“十四个坚持”","“十三个方面成就”"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 导论 · 单选3","explanation":{"topic":"六个必须坚持","reason":"党的二十大系统阐述新时代中国特色社会主义思想的世界观和方法论，提出人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下六项要求。","analysis":"“十四个坚持”见于十九大基本方略；“十个明确”“十三个方面成就”在十九届六中全会相关总结中得到概括。二十大重申它们，但本题问新提出的方法论概括。","tip":"六个必须坚持重在立场观点方法，不要与内容概括和基本方略混淆。"},"topicId":"supp-1"},{"id":"s1-single-4","type":"single","number":4,"originalNumber":"4","stem":"中国特色社会主义最本质的特征是（ ）。.","options":["人民共同富裕","人民当家作主","中国共产党领导","社会主义现代化"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 导论 · 单选4","explanation":{"topic":"中国特色社会主义的最本质特征","reason":"本题对应中国共产党领导这一判断。党的领导确定事业方向、提供政治保证，并在制度安排和治理实践中发挥统领作用。","analysis":"人民当家作主是社会主义民主政治的本质特征；共同富裕是社会主义的本质要求；现代化是发展目标。三者有联系，但与“最本质的特征”不是同一表述。","tip":"最本质特征、制度最大优势，都对应中国共产党领导。"},"topicId":"supp-1"},{"id":"s1-single-5","type":"single","number":5,"originalNumber":"5","stem":"坚持和发展中国特色社会主义，总任务是（ ）。","options":["完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化","建设中国特色社会主义法治体系、建设社会主义法治国家","实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国","建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 导论 · 单选5","explanation":{"topic":"坚持和发展中国特色社会主义的总任务","reason":"总任务着眼整个事业的目标，即社会主义现代化与民族复兴，并通过两个阶段推进现代化强国建设。C同时包含总体目标和战略步骤。","analysis":"A是全面深化改革总目标；B是全面依法治国总目标；D是强军目标。它们属于不同领域，不能代替总体事业的总任务。","tip":"分清总任务、改革总目标、法治总目标、强军目标四组表述。"},"topicId":"supp-1"},{"id":"s1-single-6","type":"single","number":6,"originalNumber":"6","stem":"全面深化改革的总目标是（ ）。","options":["坚定道路自信、理论自信、制度自信、文化自信","完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化","建设中国特色社会主义法治体系、建设社会主义法治国家","坚持和发展中国特色社会主义"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 导论 · 单选6","explanation":{"topic":"全面深化改革的总目标","reason":"改革总目标有两个相联系的方面：制度的完善发展，以及治理体系和治理能力的现代化。前者确定方向，后者强调制度运行与治理效能。","analysis":"A是四个自信；C是全面依法治国总目标；D是总体主题。只记“治理现代化”也不完整，必须同时记住制度建设的方向。","tip":"改革总目标＝完善发展制度＋治理体系和能力现代化。"},"topicId":"supp-1"},{"id":"s1-single-7","type":"single","number":7,"originalNumber":"7","stem":"世界未有之大变局正在加速演变。（ ）仍然是时代主题，但是不稳定不确定性更加突出。","options":["发展与共享","和平与融合","和平与发展","开放与包容"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 导论 · 单选7","explanation":{"topic":"时代主题","reason":"题干采用教材关于国际形势的判断：和平与发展仍然是时代主题。和平提供发展的外部条件，发展有助于巩固和平。","analysis":"不稳定因素增多，不等于时代主题被选项中的其他词组替代。“共享”“融合”“包容”具有相关意义，但不是该判断中的固定组合。","tip":"时代主题记“和平与发展”，同时理解风险挑战增多的背景。"},"topicId":"supp-1"},{"id":"s1-single-8","type":"single","number":8,"originalNumber":"8","stem":"中国特色社会主义的战略布局是（ ）。","options":["“十个明确”","“十四个坚持”","“四个全面”","“五位一体”"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 导论 · 单选8","explanation":{"topic":"四个全面战略布局","reason":"战略布局强调推进事业的战略重点和举措，题目对应“四个全面”。现阶段包括全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。","analysis":"“五位一体”是总体布局；“十个明确”是理论核心内容的概括；“十四个坚持”是基本方略。不要只凭数字相近选答案。","tip":"总体布局看五位一体；战略布局看四个全面。"},"topicId":"supp-1"},{"id":"s1-single-9","type":"single","number":9,"originalNumber":"9","stem":"中国特色社会主义的总体布局是（ ）。","options":["“三位一体”","“四位一体”","“五位一体”","“六位一体”"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 导论 · 单选9","explanation":{"topic":"五位一体总体布局","reason":"总体布局描述中国特色社会主义事业的主要建设领域，包含经济、政治、文化、社会、生态文明建设，合为“五位一体”。","analysis":"其他数字组合不是本题所考查的完整总体布局。“生态文明建设”纳入布局后，不能继续用较早的四位一体表述代替。","tip":"五个建设领域：经济、政治、文化、社会、生态。"},"topicId":"supp-1"},{"id":"s1-single-10","type":"single","number":10,"originalNumber":"10","stem":"习近平新时代中国特色社会主义思想内容十分丰富，涵盖改革发展稳定、内政外交国防、治党治国治军等各个领域、各个方面，构成了一个系统完整、逻辑严密、相互贯通的思想理论体系。下面是指导思想层面的表述的是（ 。","options":["“四个全面“","“十四个坚持”","“十个明确”","“四个伟大”","“六个必须坚持“"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 导论 · 单选10","explanation":{"topic":"思想内容与基本方略的层次","reason":"按原题的层次区分，“十个明确”概括理论核心内容，主要回答基本理论判断和总体方向，故原文参考答案为C。","analysis":"“十四个坚持”侧重实践基本方略；“六个必须坚持”侧重世界观和方法论；“四个全面”是战略布局，“四个伟大”属于事业推进的重要概括。","tip":"十个明确看内容；十四个坚持看方略；六个必须坚持看方法。"},"topicId":"supp-1"},{"id":"s1-multiple-1","type":"multiple","number":11,"originalNumber":"1","stem":"习近平新时代中国特色社会主义思想创立的时代背景是（）","options":["世界百年未有之大变局加速演进","新时代中国正处于中华民族伟大复兴的关键时期","我国经济高速度发展","中国成为世界领导角色"],"answer":["A","B"],"note":"","origin":"习思想教材配套练习题 导论 · 多选1","explanation":{"topic":"思想创立的时代背景","reason":"理解理论创立背景，需要同时看国际与国内：国际格局深刻调整，国内民族复兴进入关键时期。A、B分别对应这两个主要背景。","analysis":"C把背景简化为单一高速增长，忽略发展阶段变化；D将中国说成“世界领导角色”，既非教材的背景概括，也不应把国家发展理解成领导整个世界。","tip":"时代背景从“世界大变局＋民族复兴关键期”两条线理解。"},"topicId":"supp-1"},{"id":"s1-multiple-2","type":"multiple","number":12,"originalNumber":"2","stem":"新时代中国正处于中华民族伟大复兴的关键时期，因为（）。","options":["我国发展站在了新的历史起点上","改革面临着许多前所未有的困难和挑战，处于攻坚克难的关键时期","新时代的中国发生新的历史性变革","中国式现代化全面推进拓展"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 导论 · 多选2","explanation":{"topic":"民族复兴的关键时期","reason":"关键时期既包含新的成就和机遇，也包含改革攻坚与复杂挑战。A讲新起点，B讲困难，C讲历史性变革，D讲现代化推进，四项共同构成判断依据。","analysis":"“关键时期”不只等于困难增加，也不只等于已经取得成就。把起点、任务、变化和道路推进结合起来，才能避免漏选。","tip":"关键期是成就、机遇与风险挑战交织的阶段。"},"topicId":"supp-1"},{"id":"s1-multiple-3","type":"multiple","number":13,"originalNumber":"3","stem":"习近平总书记为习近平新时代中国特色社会主义思想的创立发挥了决定性作用，（ ）","options":["坚定的政治信仰和朴素的人民情怀，为这一思想注入了强大精神基因","丰富的文化积淀和良好的哲学素养，为这一思想奠定了深厚的理论底蕴","艰苦磨练和扎实的从政历练，为这一思想积累了充分的实践养分","非凡的政治胆略和高超的政治智慧，为这一思想开辟了宽阔视野"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 导论 · 多选3","explanation":{"topic":"思想创立的理论与实践条件","reason":"原题从信仰情怀、文化哲学素养、实践历练、政治智慧四个方面说明主要创立者的作用。这些方面分别联系价值立场、理论基础、实践经验与思考视野。","analysis":"四个选项是互补说明，不是相互竞争的原因。理论创新不能只从书本知识理解，也需要时代问题、实际工作经验和对人民需求的把握。","tip":"按价值立场、理论底蕴、实践养分、思考视野四层理解。"},"topicId":"supp-1"},{"id":"s1-multiple-4","type":"multiple","number":14,"originalNumber":"4","stem":"习近平新时代中国特色社会主义思想回答了（ ）重大时代课题。","options":["新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义","建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国","建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党","建设什么美好的世界。怎样建设美好世界"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 导论 · 多选4","explanation":{"topic":"三个重大时代课题","reason":"教材概括的三大课题分别指向中国特色社会主义、社会主义现代化强国、长期执政的马克思主义政党，A、B、C分别对应这些对象。","analysis":"D涉及世界发展议题，但不是这组三个重大时代课题的规范表述。题目考查特定概括，不是问该思想是否涉及国际问题。","tip":"三个对象依次记：事业、强国、政党。"},"topicId":"supp-1"},{"id":"s1-multiple-5","type":"multiple","number":15,"originalNumber":"5","stem":"习近平新时代中国特色社会主义思想的主要内容包括（ ）。","options":["“六个必须坚持”","“十个明确”","“十四个坚持”","“十三个方面成就”"],"answer":["B","C","D"],"note":"","origin":"习思想教材配套练习题 导论 · 多选5","explanation":{"topic":"思想的主要内容概括","reason":"原题按“十个明确”“十四个坚持”“十三个方面成就”三组概括考查思想主要内容，因此选B、C、D。它们分别突出核心内容、基本方略和实践成就。","analysis":"A不是无关知识：“六个必须坚持”是世界观和方法论的重要概括。但在本题采用的分类口径中，它不列入这组三项“主要内容”概括。","tip":"内容、方略、成就与世界观方法论，要分层记忆。"},"topicId":"supp-1"},{"id":"s1-multiple-6","type":"multiple","number":16,"originalNumber":"6","stem":"“十四个坚持”的基本方略，（ ）","options":["涵盖坚持党的领导和“五位一体”总体布局、“四个全面”战略布局","涵盖国防和军队建设、维护国家安全、对外战略","是对党的治国理政重大方针政策的最新概括","是实现“两个一百年”奋斗目标、实现中华民族伟大复兴中国梦的“路线图”和“方法论”。"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 导论 · 多选6","explanation":{"topic":"十四个坚持的基本方略","reason":"基本方略把理论要求落实到治国理政实践，覆盖党的领导、发展布局、国家安全、国防、外交等领域，A、B体现范围，C、D体现其实践功能。","analysis":"“路线图”“方法论”在这里强调行动指导作用，不意味着这组基本方略与“六个必须坚持”的专门方法论概括完全同义。四项在题意中均成立。","tip":"基本方略解决如何把思想贯彻到各领域工作的问题。"},"topicId":"supp-1"},{"id":"s1-multiple-7","type":"multiple","number":17,"originalNumber":"7","stem":"习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是（ ）的时代精华，实现了马克思主义中国化新的飞跃。","options":["中华文化","中华品格","中国精神","中国力量"],"answer":["A","C"],"note":"","origin":"习思想教材配套练习题 导论 · 多选7","explanation":{"topic":"中华文化与中国精神的时代精华","reason":"规范表述强调这一思想同中华文化和中国精神的联系。A、C共同说明其文化底蕴与精神内涵，因此应同时选择。","analysis":"“中华品格”“中国力量”可以出现在其他论述中，但不能替换本题所考查的“中华文化和中国精神”这一固定组合。","tip":"时代精华对应“中华文化＋中国精神”。"},"topicId":"supp-1"},{"id":"s1-multiple-8","type":"multiple","number":18,"originalNumber":"8","stem":"坚持把马克思主义基本原理同（ ）相结合，用马克思主义观察时代、把握时代、引领时代，继续发展当代中国马克思主义、21世纪马克思主义。","options":["中国具体实际相结合","中华优秀传统文化","中国精神","民族特色"],"answer":["A","B"],"note":"","origin":"习思想教材配套练习题 导论 · 多选8","explanation":{"topic":"两个结合","reason":"理论创新需要把基本原理放到中国实际中运用，并同优秀传统文化贯通起来。A指实践与国情，B指文化根基，合起来构成“两个结合”。","analysis":"C、D具有较宽泛的文化含义，但不是“两个结合”的规范对象。注意第二个结合强调“优秀传统文化”，而非传统文化的所有内容。","tip":"中国具体实际、中华优秀传统文化，两项缺一不可。"},"topicId":"supp-1"},{"id":"s1-multiple-9","type":"multiple","number":19,"originalNumber":"9","stem":"中国特色社会主义事业总体布局是“五位一体”、战略布局是“四个全面”，强调坚定（ ）。","options":["道路自信","理论自信","制度自信","文化自信"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 导论 · 多选9","explanation":{"topic":"四个自信","reason":"道路、理论、制度、文化分别从实践途径、思想指导、制度保障和精神根基说明中国特色社会主义，形成相互支撑的“四个自信”。","analysis":"四个选项均属于这一固定概括，不能只选择道路与制度而漏掉理论、文化。文化自信与其他三项相联系，具有基础性的意义。","tip":"按道路、理论、制度、文化的顺序记四个自信。"},"topicId":"supp-1"},{"id":"s1-multiple-10","type":"multiple","number":20,"originalNumber":"10","stem":"发展是解决我国一切问题的基础和关键，发展必须是科学发展，必须坚定不移贯彻创新（ ）的发展理念。","options":["协调","绿色","开放","共享"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 导论 · 多选10","explanation":{"topic":"五大发展理念","reason":"题干已给出创新，空缺部分需要补齐协调、绿色、开放、共享。五项共同构成新发展理念，不能相互替代。","analysis":"创新关注动力，协调关注不平衡，绿色关注人与自然，开放关注内外联动，共享关注公平正义。题干已出现创新，不代表只需选择剩下某一项。","tip":"五大发展理念是一个整体，应完整准确全面贯彻。"},"topicId":"supp-1"},{"id":"s1-multiple-11","type":"multiple","number":21,"originalNumber":"11","stem":"建设一支（ ），的人民军队，是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。","options":["听党指挥","能打胜仗","作风优良","全心全意为人民服务"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 导论 · 多选11","explanation":{"topic":"新时代强军目标","reason":"强军目标的三项要求是听党指挥、能打胜仗、作风优良，分别联系政治方向、打赢能力和军队作风，A、B、C均属于目标表述。","analysis":"D是人民军队的宗旨，意义重要，但题目问的是强军目标的三项规范要求。不能因为选项本身正确，就把不同层次的概念合并。","tip":"强军目标记三项；为人民服务另属宗旨。"},"topicId":"supp-1"},{"id":"s1-multiple-12","type":"multiple","number":22,"originalNumber":"12","stem":"“两个确立”形成的依据是（ ）。","options":["“两个确立”是中国共产党基于唯物史观两个基本原理所作出的必然选择","“两个确立”是党的历史经验的总结运用","“两个确立”是新时代十年实践形成的智慧结晶","“两个确立”是战胜外部环境变化出现许多新的风险挑战、解决国内许多深层次矛盾和问题的需要"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 导论 · 多选12","explanation":{"topic":"两个确立的形成依据","reason":"本题从理论、历史、实践与现实需要四条线说明“两个确立”：既联系历史发展规律和领导作用，也联系党史经验、新时代实践及应对风险的要求。","analysis":"四项为不同角度的依据，不能只从个人因素或某一次会议理解。学习时还要分清“两个确立”的具体内容与“两个维护”的行动要求。","tip":"确立核心地位、确立思想指导地位，是两个确立的内容。"},"topicId":"supp-1"}]},{"id":"supp-2","label":"补充2","chapter":1,"title":"新时代坚持和发展中国特色社会主义","kind":"supp","source":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义(2).docx","questions":[{"id":"s2-single-1","type":"single","number":1,"originalNumber":"1","stem":"中国特色社会主义道路是（ ）。","options":["实现途径","行动指南","根本保障","精神力量，"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 单选1","explanation":{"topic":"道路理论制度文化的作用","reason":"中国特色社会主义道路指向发展和实现目标的实践途径，所以A符合题意。道路回答事业具体怎样推进的问题。","analysis":"理论体系承担思想指导作用，制度提供根本保障，文化提供精神力量。B、C、D不是完全错误的概念，而是与题干所问的“道路”不对应。","tip":"道路是途径，理论是指南，制度是保障，文化是力量。"},"topicId":"supp-2"},{"id":"s2-single-2","type":"single","number":2,"originalNumber":"2","stem":"（ ）宣布，中国特色社会主义进入了新时代，这是我国发展新的历史方位。","options":["党的十八大","党的二十大","党的十七大","党的十九大"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 单选2","explanation":{"topic":"进入新时代的宣布时间","reason":"2017年党的十九大对我国发展新的历史方位作出判断，宣布中国特色社会主义进入新时代，因此应选D。","analysis":"十八大是新时代历史进程的重要起点，与十九大作出进入新时代的明确判断不是同一个考点；二十大进一步部署新时代新征程任务。","tip":"十八大以来是历史进程；十九大是明确宣布的大会。"},"topicId":"supp-2"},{"id":"s2-single-3","type":"single","number":3,"originalNumber":"3","stem":"习近平总书记在十九大报告中指出，中国特色社会主义进入新时代，我国社会主要矛盾（ ）。","options":["已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","仍然是无产阶级同资产阶级之间的矛盾","官僚资本同民族资本之间的矛盾","是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 单选3","explanation":{"topic":"新时代社会主要矛盾","reason":"需求一端由较为基础的物质文化需要拓展为美好生活需要，供给一端的突出问题转向不平衡不充分，因此A体现新的社会主要矛盾。","analysis":"B、C对应不同历史语境；D是此前的主要矛盾表述。变化不意味着社会需求已经完全满足，也不意味着社会主义初级阶段结束。","tip":"抓住需求升级与发展不平衡不充分两个方面。"},"topicId":"supp-2"},{"id":"s2-single-4","type":"single","number":4,"originalNumber":"4","stem":"（ ）是坚持和发展中国特色社会主义的行动指南。","options":["党的基本路线","党的基本理论","党的基本方略","党的基本政策"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 单选4","explanation":{"topic":"党的基本理论的指导作用","reason":"党的基本理论提供认识问题、确定方向和指导实践的理论依据，故原题将行动指南对应B。基本路线、基本方略在理论指导下形成具体要求。","analysis":"基本路线强调一个中心、两个基本点等总体路线；基本方略强调实践原则；基本政策更具体。此题问指导行动的理论层面。","tip":"基本理论重思想指导，基本路线重总体路线，基本方略重实践遵循。"},"topicId":"supp-2"},{"id":"s2-single-5","type":"single","number":5,"originalNumber":"5","stem":"中国共产党为什么能，中国特色社会主义为什么好，归根到底是（）。","options":["马克思主义行，是中国化时代化的马克思主义行","中国共产党能","中国特色社会主义好","靠坚持四项基本原则，不犯错误"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 单选5","explanation":{"topic":"马克思主义与中国化时代化","reason":"题干追问党和事业成功的根本思想依据，强调马克思主义科学理论及其同中国实际、时代发展相结合的成果，因此A切题。","analysis":"B、C只是重复题干中的“能”“好”，没有解释其思想根源。D把成功归结为“不犯错误”，也不符合探索实践中不断纠正错误、总结经验的事实。","tip":"关键在科学理论及其中国化时代化，而非简单重复结果。"},"topicId":"supp-2"},{"id":"s2-single-6","type":"single","number":6,"originalNumber":"6","stem":"（）是当代中国发展进步的根本制度保障，具有明显制度优势。","options":["中国特色社会主义制度","中国特色社会主义经济制度","中国特色社会主义理论体系","中国特色社会主义道路"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 单选6","explanation":{"topic":"制度的根本保障作用","reason":"中国特色社会主义制度是整体制度体系，能够为各领域事业提供稳定运行与组织协调的保障，因此A符合“根本制度保障”的要求。","analysis":"B只涉及经济领域，范围不足；C是理论体系，D是实践道路。二者分别属于思想指导与实现途径，不能代替制度体系。","tip":"题干出现“制度保障”，先判断是否指整体制度体系。"},"topicId":"supp-2"},{"id":"s2-multiple-1","type":"multiple","number":7,"originalNumber":"1","stem":"中国特色社会主义是（ ）。","options":["在改革开放40多年的伟大实践中得来的","在新中国成立70多年的持续探索中得来的","在中国共产党领导人民进行伟大社会革命100多年的实践中得来的","在近代以来中华民族由衰到盛180多年的历史进程中得来的"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选1","explanation":{"topic":"中国特色社会主义的历史来源","reason":"道路形成于长期历史探索，既有改革开放实践、新中国建设、党的革命实践，也有近代民族复兴进程。四项描述不同时间尺度，均可成立。","analysis":"这些历史层次相互包含，不是四条互不相关的道路。不能只记改革开放以来的探索，而忽略更长历史中的实践、经验和文化背景。","tip":"从改革开放向前追溯：新中国、建党以来、近代以来。"},"topicId":"supp-2"},{"id":"s2-multiple-2","type":"multiple","number":8,"originalNumber":"2","stem":"中国特色社会主义坚持科学社会主义基本原则，并赋予其鲜明的中国特色,包括（ ）。","options":["坚持人民代表大会制度的根本政治制度","中国共产党领导的多党合作和政治协商制度","坚持公有制为主体多种所有制经济共同发展","坚持按劳分配为主体多种分配方式并存","坚持社会主义市场经济体制"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选2","explanation":{"topic":"科学社会主义原则与中国制度实践","reason":"A、B体现民主政治制度安排，C、D、E体现所有制、分配和经济运行体制。它们共同说明基本原则在中国实际中的具体实现。","analysis":"中国特色社会主义并非机械照搬某一种制度形式，而是在坚持基本性质的同时形成适合国情的制度组合。五项都属于本题给出的具体体现。","tip":"政治制度与基本经济制度可以共同说明中国特色社会主义。"},"topicId":"supp-2"},{"id":"s2-multiple-3","type":"multiple","number":9,"originalNumber":"3","stem":"改革开放以来，我们取得一切成绩和进步的根本原因，就是( ).","options":["开辟了中国特色社会主义道路","形成了中国特色社会主义理论体系","确立了中国特色社会主义制度","发展了中国特色社会主义文化。","建设社会主义生态文明"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选3","explanation":{"topic":"成绩和进步的根本原因","reason":"根本原因的规范概括包括道路开辟、理论形成、制度确立、文化发展，四者相互支持，因此选择A、B、C、D。","analysis":"生态文明建设是重要建设领域，也取得重大进展，但E不是这组“根本原因”固定概括中的第五项。题目考查特定归纳，不能扩大到所有重要工作。","tip":"根本原因对应道路、理论、制度、文化四方面。"},"topicId":"supp-2"},{"id":"s2-multiple-4","type":"multiple","number":10,"originalNumber":"4","stem":"中国特色社会主义制度的根本制度有（ ）。","options":["党的领导制度","人民代表大会制度","马克思主义指导制度","基层群众自治制度"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选4","explanation":{"topic":"根本制度与基本制度","reason":"党的领导制度、人民代表大会制度、马克思主义指导制度涉及领导、根本政治制度与思想文化指导，按本题制度层次属于根本层面的制度。","analysis":"D基层群众自治制度属于基本政治制度。根本与基本不是重要程度的随意排序，而是制度体系中的不同层级，故不能因其重要就选D。","tip":"人民代表大会制度是根本政治制度，基层群众自治是基本政治制度。"},"topicId":"supp-2"},{"id":"s2-multiple-5","type":"multiple","number":11,"originalNumber":"5","stem":"中国特色社会主义进入了新时代的判断，是（ ）。","options":["基于我国发展进入新阶段的伟大成就","基于社会主要矛盾发生新变化","基于党的新的奋斗目标","基于我国面临新的国际环境。"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选5","explanation":{"topic":"新时代判断的依据","reason":"发展成就、新的主要矛盾、新的奋斗目标和新的国际环境，共同说明历史方位的变化。A、B、C、D从内外条件和目标任务四方面给出依据。","analysis":"新时代判断不是单凭某个年份或某项经济指标作出的，也不等于社会基本制度发生性质变化。判断应联系整体事业的变化。","tip":"新时代依据从成就、矛盾、目标、环境四方面理解。"},"topicId":"supp-2"},{"id":"s2-multiple-6","type":"multiple","number":12,"originalNumber":"6","stem":"中国特色社会主义新时代，（ ）。","options":["是承前启后、继往开来，在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代。","是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代。","是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代.","全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代。"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选6","explanation":{"topic":"新时代的内涵","reason":"四项分别描述事业接续发展、现代化战略任务、人民生活与共同富裕、民族复兴进程，是十九大关于新时代内涵的重要方面。","analysis":"它们并不是已经全部实现的结果，而是新时代的历史定位与发展任务。尤其共同富裕和现代化强国建设，强调持续推进的过程。","tip":"区分时代内涵中的历史定位、奋斗任务与发展目标。"},"topicId":"supp-2"},{"id":"s2-multiple-7","type":"multiple","number":13,"originalNumber":"7","stem":"党的十九大概括中国特色社会主义进入新时代的重大意义,这就是：","options":["意味着中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了中华民族伟大复兴的光明前景。","意味着科学社会主义在中国焕发出强大生机活力，在世界上高高举起了中国特色社会主义伟大旗帜","意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家实现现代化的途径","意味着中国即将建成社会主义现代化强国，全体人民过上共同富裕的生活。"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选7","explanation":{"topic":"进入新时代的重大意义","reason":"A联系中华民族发展，B联系科学社会主义，C联系世界现代化道路，分别说明进入新时代的民族、社会主义和世界层面的意义。","analysis":"D把长期目标说成“即将”普遍实现，混淆历史进步与目标全部完成。现代化强国、全体人民共同富裕仍需要持续奋斗，故不选。","tip":"新时代的意义可按民族发展、科学社会主义、世界发展三层理解。"},"topicId":"supp-2"},{"id":"s2-multiple-8","type":"multiple","number":14,"originalNumber":"8","stem":"我国社会主要矛盾的变化（ ）。","options":["没有改变我们对我国社会主义所处历史阶段的判断","我国仍处于并将长期处于社会主义初级阶段的基本国情没有变","我国是世界最大发展中国家的国际地位没有变","以上都正确"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选8","explanation":{"topic":"主要矛盾变化与两个没有变","reason":"主要矛盾发生变化，并不改变社会主义初级阶段的总体判断，也不改变教材所述最大发展中国家的国际地位，A、B、C成立。","analysis":"D“以上都正确”概括前三项。原文将此题放在多选题并给出ABCD，本程序按原文判题；这属于包含汇总选项的题型。","tip":"变的是社会主要矛盾；不变的是初级阶段国情和教材所述国际地位。"},"topicId":"supp-2"},{"id":"s2-multiple-9","type":"multiple","number":15,"originalNumber":"9","stem":"中国特色社会主义制度，（）。","options":["坚持把根本制度、基本制度、重要制度以及各方面体制机制等具体制度有机结合起来","坚持把国家层面民主制度同基层民主制度有机结合起来","坚持把党的领导、人民当家作主、依法治国有机结合起来","既坚持了社会主义的根本性质，又借鉴了古今中外制度建设的有益成果。"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选9","explanation":{"topic":"中国特色社会主义制度的整体性","reason":"制度体系将不同层级制度、国家与基层民主、党的领导与人民当家作主及依法治国相结合，体现整体结构；D说明保持性质与吸收有益成果的统一。","analysis":"四项分别谈层级、民主层次、政治运行关系与文明借鉴，彼此不矛盾。学习制度优势时，既要记住基本性质，也要理解系统协调。","tip":"把制度看作相互配合的体系，而非单个制度的简单堆积。"},"topicId":"supp-2"},{"id":"s2-multiple-10","type":"multiple","number":16,"originalNumber":"10","stem":"中国特色社会主义文化，（）。","options":["是激励全党全国各族人民奋勇前进的强大精神力量","它源自于5000多年文明历史的中华优秀传统文化","熔铸于党领导人民在革命、建设、改革中创造的革命文化和社会主义先进文化","植根于中国特色社会主义伟大实践"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第一章  新时代坚持和发展中国特色社会主义 · 多选10","explanation":{"topic":"中国特色社会主义文化的来源与作用","reason":"文化提供精神动力，其形成有传统文化的根基、革命与建设改革实践中的积累，并立足中国特色社会主义当代实践。A讲作用，B、C、D讲来源。","analysis":"传统、革命与社会主义先进文化不是割裂的三部分。优秀传统文化需要创造性转化，现代实践又不断形成新的文化内容，四项均符合题意。","tip":"文化从哪里来与发挥什么作用，需要分别掌握。"},"topicId":"supp-2"}]},{"id":"supp-3","label":"补充3","chapter":2,"title":"以中国式现代化全面推进中华民族伟大复兴","kind":"supp","source":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴(2).docx","questions":[{"id":"s3-single-1","type":"single","number":1,"originalNumber":"1","stem":"一百年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题（ ）。","options":["建立新中国","追求共同富裕","实现中华民族伟大复兴","实现人民对美好生活的向往"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选1","explanation":{"topic":"百年奋斗的主题","reason":"题干问贯穿百年奋斗的总体主题，答案是民族复兴。革命、建设、改革和新时代各阶段任务不同，但都同这一总体目标相联系。","analysis":"建立新中国是特定阶段成果，共同富裕和美好生活体现重要价值目标；它们不能代替题干所问的贯穿百年奋斗的主题。","tip":"百年奋斗总体主题对应中华民族伟大复兴。"},"topicId":"supp-3"},{"id":"s3-single-2","type":"single","number":2,"originalNumber":"2","stem":"中国梦归根到底是（ ），必须紧紧依靠人民来实现，必须不断为人民造福。","options":["国家的梦","人民的梦","民族的梦","世界的梦"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选2","explanation":{"topic":"中国梦的人民属性","reason":"中国梦涉及国家与民族的发展，最终体现为人民生活改善、权益保障和全面发展。人民既是实现梦想的主体，也是成果的受益者，因此选B。","analysis":"国家的梦、民族的梦与人民的梦有联系，但“归根到底”追问最终归属和根本价值立场，不能只停留在国家或民族层面。","tip":"中国梦归根到底是人民的梦：依靠人民、为了人民。"},"topicId":"supp-3"},{"id":"s3-single-3","type":"single","number":3,"originalNumber":"3","stem":"中华民族伟大复兴的中国梦是（ ）相统一的梦。","options":["国家情怀、民族情怀、人民情怀","国家情怀、民族情怀、社会情怀","民族情怀、世界情怀、人民情怀","国家情怀、家庭情怀、人民情怀"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选3","explanation":{"topic":"中国梦的三种情怀","reason":"中国梦将国家建设、民族振兴与人民幸福统一起来，分别对应国家情怀、民族情怀、人民情怀，A构成完整组合。","analysis":"B缺人民情怀，C缺国家情怀，D将民族情怀换成家庭情怀。家庭幸福相关，但不是本题考查的三种情怀之一。","tip":"国家、民族、人民三者统一，关键落脚点是人民。"},"topicId":"supp-3"},{"id":"s3-single-4","type":"single","number":4,"originalNumber":"4","stem":"实现中国梦必须走中国道路，这就是（ ）。","options":["中华民族大团结之路","社会发展之路","人民民主专政之路","中国特色社会主义道路"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选4","explanation":{"topic":"中国梦的实现道路","reason":"实现中国梦需要从本国历史、国情和实践出发，走中国特色社会主义道路，D是题目要求的中国道路的具体名称。","analysis":"大团结强调力量凝聚，人民民主专政强调国体，“社会发展之路”过于宽泛。它们不能替换中国特色社会主义道路这一整体实践途径。","tip":"中国道路＝中国特色社会主义道路。"},"topicId":"supp-3"},{"id":"s3-single-5","type":"single","number":5,"originalNumber":"5","stem":"实现中国梦必须凝聚中国力量，这就是（ ）。","options":["各族人民大团结的力量","中国共产党的领导力量","中高速增长的经济力量。","保障有力的军事力量"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选5","explanation":{"topic":"中国力量的内涵","reason":"中国力量在本题中指各族人民团结奋斗的力量，体现人民群众的主体作用和民族共同奋斗的合力，因此A符合原文表述。","analysis":"党的领导、经济实力、军事力量都是重要因素，但题干问“中国力量”的特定内涵，不能把它缩小为某个组织或某个领域的力量。","tip":"中国道路、中国精神、中国力量，分别对应道路、精神支撑与人民团结合力。"},"topicId":"supp-3"},{"id":"s3-single-6","type":"single","number":6,"originalNumber":"6","stem":"( )首次把“小康”作为经济建设总的奋斗目标。","options":["党的十七大","党的十五大","党的十二大","党的十一届三中全会"],"answer":["C"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选6","explanation":{"topic":"小康目标首次提出的大会","reason":"1982年党的十二大把小康作为经济建设总的奋斗目标，明确到20世纪末人民物质文化生活达到小康水平，因此选C。","analysis":"十一届三中全会开启改革开放的新时期；十七大、十五大对后续发展作出部署，但不是该目标首次作为大会奋斗目标提出的时间。","tip":"十二大：小康目标；十六大：全面建设小康社会。"},"topicId":"supp-3"},{"id":"s3-single-7","type":"single","number":7,"originalNumber":"7","stem":"（ ）针对当时小康低水平、不全面、发展很不平衡的实际，提出全面建设小康社会目标","options":["党的十四大","党的十六大","党的十五大","党的十七大"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选7","explanation":{"topic":"全面建设小康社会的提出","reason":"2002年党的十六大针对总体小康水平较低、覆盖不全面、发展不平衡，提出全面建设小康社会，故B正确。","analysis":"十七大在十六大目标基础上提出新的更高要求；十四大、十五大对应其他阶段部署。要分清“提出目标”与“进一步提高目标要求”。","tip":"十六大提出全面建设，十七大作进一步部署。"},"topicId":"supp-3"},{"id":"s3-single-8","type":"single","number":8,"originalNumber":"8","stem":"从全面建设社会主义现代化国家进程的阶段安排看来，到2035年，我国将（ ）。","options":["全面建成小康社会","实现中华民族伟大复兴的中国梦","把我国建设成为富强美丽文明和谐的社会现代化强国。","基本实现社会主义现代化"],"answer":["D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选8","explanation":{"topic":"2035年的阶段目标","reason":"两步走战略的第一步是到2035年基本实现社会主义现代化，因此D符合时间节点。第二步着眼本世纪中叶现代化强国建设。","analysis":"全面建成小康社会对应第一个百年目标；全面建成现代化强国对应更后阶段。选项中的“基本实现”与“全面建成”是区分关键。","tip":"2035年：基本实现现代化；本世纪中叶：现代化强国。"},"topicId":"supp-3"},{"id":"s3-single-9","type":"single","number":9,"originalNumber":"9","stem":"党的十九大提出，到（ ）各方面制度更加完善，国家治理体系和治理能力现代化基本实现。","options":["2035年","2030年","2025年","2020年"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选9","explanation":{"topic":"治理现代化的阶段安排","reason":"十九大关于2035年基本实现现代化的目标，包含制度更加完善与治理体系、治理能力现代化基本实现，故选A。","analysis":"其他年份并不是这条十九大目标表述中的时间节点。题干明确限定十九大，作答应依据对应报告的历史语境，而非任意套用其他政策期限。","tip":"看到十九大与“治理现代化基本实现”，对应2035年。"},"topicId":"supp-3"},{"id":"s3-single-10","type":"single","number":10,"originalNumber":"10","stem":"2021年7月1日，习近平在天安门城楼上庄严宣告，经过全党全国各族人民持续奋斗，我们实现了（ ）。","options":["第一个百年奋斗目标","社会主义现代化国家","社会主义现代化强国","中华民族伟大复兴"],"answer":["A"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选10","explanation":{"topic":"第一个百年奋斗目标","reason":"2021年7月1日庆祝建党百年大会上，宣告实现第一个百年奋斗目标、全面建成小康社会，因此A符合题意。","analysis":"社会主义现代化强国属于第二个百年目标；民族复兴是长期总体目标。不能把全面小康与全面现代化强国视作同一发展层次。","tip":"建党百年对应全面小康，建国百年对应现代化强国。"},"topicId":"supp-3"},{"id":"s3-single-11","type":"single","number":11,"originalNumber":"11","stem":"全面建成社会主义现代化强国的战略安排，把基本实现社会主义现代化的时间提前了（ ）年。","options":["25年","15年","35年","10年"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 单选11","explanation":{"topic":"现代化战略目标的时间调整","reason":"原先基本实现现代化的安排面向本世纪中叶，新安排将这一目标提前至2035年。按2050年前后与2035年比较，提前约15年。","analysis":"本题计算的是“基本实现现代化”的时间差，不能将全面建成小康社会时间或全面建成现代化强国时间拿来相减。","tip":"同一目标比较时间：2050年前后减2035年，约15年。"},"topicId":"supp-3"},{"id":"s3-multiple-1","type":"multiple","number":12,"originalNumber":"1","stem":"党的二十大指出，新时代新征程中国共产党的中心任务，就是（ ）。","options":["团结带领全国各族人民全面建成社会主义现代化强国","实现第二个百年奋斗目标","以中国式现代化全面推进中华民族伟大复兴。","贯彻新发展理念，促进高质量发展"],"answer":["A","B","C"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选1","explanation":{"topic":"新时代新征程的中心任务","reason":"中心任务把现代化强国、第二个百年奋斗目标和以中国式现代化推进民族复兴连成一体，A、B、C对应这一完整任务表述。","analysis":"高质量发展是全面建设社会主义现代化国家的首要任务，D重要且相关，但不是题干所考查中心任务的三个组成表述。","tip":"中心任务与首要任务层次不同，后者重在高质量发展。"},"topicId":"supp-3"},{"id":"s3-multiple-2","type":"multiple","number":13,"originalNumber":"2","stem":"坚持和发展中国特色社会主义的总任务是（ ）。","options":["解放和发展社会生产力","现社会主义现代化和中华民族伟大复兴","实在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国","中国梦是中华民族伟大复兴的形象表达"],"answer":["B","C"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选2","explanation":{"topic":"总任务与战略步骤","reason":"B指总体目标，C指实现总体目标的阶段安排，二者合起来说明坚持和发展中国特色社会主义的总任务。原题B、C有排字问题，理解时应还原完整意思。","analysis":"解放和发展生产力是重要任务与基础，但A不是此处总任务的规范概括；D说明中国梦与民族复兴的关系，不是总任务和步骤的直接表述。","tip":"总任务看现代化与复兴，步骤看本世纪中叶分两步走。"},"topicId":"supp-3"},{"id":"s3-multiple-3","type":"multiple","number":14,"originalNumber":"3","stem":"中国梦的科学内涵是（ ）","options":["国家富强","社会和谐","民族振兴","人民幸福"],"answer":["A","C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选3","explanation":{"topic":"中国梦的科学内涵","reason":"国家富强、民族振兴、人民幸福，分别对应国家发展、民族复兴与人民生活三个相互联系的方面，A、C、D共同构成中国梦的科学内涵。","analysis":"社会和谐是重要发展要求，但不是这一组三项内涵中替代任意一项的用语。不能因为选项本身积极，就扩大固定概念的范围。","tip":"中国梦内涵记“国家富强、民族振兴、人民幸福”。"},"topicId":"supp-3"},{"id":"s3-multiple-4","type":"multiple","number":15,"originalNumber":"4","stem":"中国梦的实现途径是（ ）。","options":["坚持中国道路","维护世界和平","弘扬中国精神","凝聚中国力量"],"answer":["A","C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选4","explanation":{"topic":"中国梦的实现途径","reason":"实现中国梦需要道路选择、精神动力和团结合力，分别是坚持中国道路、弘扬中国精神、凝聚中国力量，A、C、D成立。","analysis":"维护世界和平有助于创造良好外部条件，但不是题干所考查的三项实现途径。题型重点是准确识别既定概括。","tip":"道路、精神、力量，三项是中国梦实现途径。"},"topicId":"supp-3"},{"id":"s3-multiple-5","type":"multiple","number":16,"originalNumber":"5","stem":"关于中国梦的内涵理解正确的是（）。","options":["核心内容时国家富强、民族振兴、人民幸福","中国梦是国家的梦、民族的梦、归根到底是人民的梦","国家富强、民族振兴是人民幸福的基础和保障","人民幸福是国家富强、民族振兴的根本出发点和落脚点"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选5","explanation":{"topic":"国家民族与人民的关系","reason":"A概括核心内涵，B说明人民归属，C、D分别说明国家民族发展对人民幸福的支撑与人民幸福对发展的目的意义，四项相互贯通。","analysis":"不要把国家富强与人民幸福理解为彼此独立的目标。国家、民族的发展需要落实到人民福祉，人民的奋斗又构成国家发展的主体力量。","tip":"基础保障与根本目的要区分，同时看到二者统一。"},"topicId":"supp-3"},{"id":"s3-multiple-6","type":"multiple","number":17,"originalNumber":"6","stem":"我们确立了“两个一百年”奋斗目标，就是（ ）。","options":["到2020年实现国内生产总值和城乡居民人均收入比2010年翻一番，全面建成小康社会","到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化国家，实现中华民族伟大复兴","到2035年，基本建成社会主义现代化国家","到2025年，实现工业强国目标"],"answer":["A","B"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选6","explanation":{"topic":"两个一百年奋斗目标","reason":"原题A对应第一个百年目标的历史部署，B对应第二个百年目标的长期指向，二者共同构成“两个一百年”的目标安排。","analysis":"C把2035年说成“基本建成社会主义现代化国家”，混淆基本实现现代化与国家建成的表述；D不是两个百年目标的时间节点。","tip":"两个百年分别联系建党百年、建国百年。"},"topicId":"supp-3"},{"id":"s3-multiple-7","type":"multiple","number":18,"originalNumber":"7","stem":"党的十九大报告中提出全面建设社会主义现代化国家的进程分两个阶段来安排( )。","options":["第一阶段，从2017年到2037年在全面建成小康社会的基础上，再奋斗15年，基本实现社会主义现代化","第二个阶段，从2037年到本世纪中叶在基本实现现代化的基础上，再奋斗15年，把我国建成富强民主文明和谐美丽的社会主义现代化强国","第一个阶段，从2020年到2035年，在全面建成小康社会的基础上，再奋斗15年，基本实现社会主义现代化","第二个阶段，从2035年到本世纪中叶，在基本实现现代化的基础上，再奋斗15年，把我国建成富强民主文明和谐美丽的社会主义现代化强国"],"answer":["C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选7","explanation":{"topic":"现代化两步走的时间段","reason":"十九大的两阶段安排是2020年至2035年基本实现现代化，2035年至本世纪中叶建设现代化强国，C、D与时间和任务均对应。","analysis":"A、B使用2017年至2037年等错误年份。判断时需同时核对起点、终点、目标内容，不能只看“15年”或“现代化”这些词。","tip":"两段分界在2035年，起点是2020年。"},"topicId":"supp-3"},{"id":"s3-multiple-8","type":"multiple","number":19,"originalNumber":"8","stem":"中国梦是（ ）的梦，与世界各国人民的美好梦想相通。","options":["和平","发展","合作","共赢"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选8","explanation":{"topic":"中国梦与世界发展的联系","reason":"中国梦强调和平发展与国际合作，其实现同其他国家人民的发展愿望相联系。和平、发展、合作、共赢四项共同说明这种外部联系。","analysis":"实现本国发展并不意味着排斥其他国家的发展。四项不是互斥目标，而是说明中国梦与各国人民美好愿望能够相通。","tip":"中国梦对外联系可从和平、发展、合作、共赢理解。"},"topicId":"supp-3"},{"id":"s3-multiple-9","type":"multiple","number":20,"originalNumber":"9","stem":"（ ），是我们党的初心和使命，是党领导现代化建设的出发点和落脚点，也是新发展理念的“根”和“魂。","options":["为人民谋幸福","为人民谋复兴","为民族谋复兴","为民族谋幸福"],"answer":["A","C"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选9","explanation":{"topic":"党的初心和使命","reason":"初心和使命的两个对象是中国人民与中华民族：为中国人民谋幸福，为中华民族谋复兴，因此选A、C。","analysis":"B把复兴的对象换成人民，D把幸福的对象换成民族，虽然语义相关，却没有准确对应这组规范表述。牢记动词和对象的搭配。","tip":"人民—幸福；民族—复兴。"},"topicId":"supp-3"},{"id":"s3-multiple-10","type":"multiple","number":21,"originalNumber":"10","stem":".从2020年到2035年，基本实现社会主义现代化的目标要求( )。","options":["在经济建设方面，我国经济实力、科技实力将大幅跃升，跻身创新型国家前列","在政治建设方面，人民平等参与、平等发展权利得到充分保障，法治国家、法治政府、法治社会基本建成，各方面制度更加完善，国家治理体系和治理能力现代化基本实现","在文化建设方面，社会文明程度达到新的高度，国家文化软实力显著增强，中华文化影响更加广泛深入","在生态文明建设方面，生态环境根本好转，美丽中国目标基本实现"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选10","explanation":{"topic":"2035年目标的多个领域","reason":"基本实现社会主义现代化并不只看经济指标，还包含政治法治、文化、生态等领域的进步。题目四项分别对应这些方面，按原文均应选。","analysis":"A讲经济科技，B讲制度和法治，C讲文化素质及影响，D讲生态环境。不能将经济目标误当成2035年目标的全部。","tip":"现代化目标从五位一体的多个建设领域理解。"},"topicId":"supp-3"},{"id":"s3-multiple-11","type":"multiple","number":22,"originalNumber":"11","stem":"从2035年到本世纪中叶，建成社会主义现代化强国的目标要求( )","options":["我国将拥有高度的物质文明，社会生产力水平大幅提高，核心竞争力名列世界前茅，经济总量和市场规模超越其他国家","我国将拥有高度的政治文明，形成又有集中又有民主、又有纪律又有自由、又有统一意志又有个人心情舒畅生动活泼的政治局面，依法治国和以德治国有机结合","我国将拥有高度的精神文明，践行社会主义核心价值观成为全社会自觉行动，国民素质显著提高，中国精神、中国价值、中国力量成为中国发展的重要影响力和推动力","我国将拥有高度的社会文明，城乡居民将普遍拥有较高的收入、富裕的生活、健全的基本公共服务"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选11","explanation":{"topic":"本世纪中叶现代化强国目标","reason":"本世纪中叶目标强调物质、政治、精神、社会、生态文明全面提升。原题A至D分别围绕前四个方面展开，原文参考答案为ABCD。","analysis":"B、C、D分别谈政治生活、精神文化与人民生活。A中物质文明和生产力发展方向与目标相关，但“经济总量和市场规模超越其他国家”表述过于绝对。","tip":"现代化强国是各方面综合提升，不能仅用经济总量排名定义。","note":"原文给出ABCD。十九大规范目标强调“综合国力和国际影响力领先的国家”，不能据此直接推出经济总量和市场规模必然超越所有国家；本程序保留原文答案并提示核对A的表述。"},"topicId":"supp-3"},{"id":"s3-multiple-12","type":"multiple","number":23,"originalNumber":"12","stem":"全面建成了小康社会的重大意义是（ ）。","options":["意味着中华民族实现千百年来的夙愿","表明我国发展和人民生活水平跃上新的大台阶","表明我国已经实现了由高速发展向高质量发展转变","是实现中华民族伟大复兴征程中的关键一步"],"answer":["A","B","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选12","explanation":{"topic":"全面建成小康社会的意义","reason":"全面小康实现历史性愿望，使发展与人民生活迈上新台阶，并为继续推进民族复兴奠定基础，A、B、D分别说明这些意义。","analysis":"C把小康建成与发展阶段由高速增长转向高质量发展简单等同。两者有联系，但不是同一历史判断，也不能用后者替换前者的主要意义。","tip":"全面小康是民族复兴关键一步，而非所有现代化目标已经完成。"},"topicId":"supp-3"},{"id":"s3-multiple-13","type":"multiple","number":24,"originalNumber":"13","stem":"中国式现代化的特征是（ ）。","options":["人口规模巨大的现代化","全体人民共同发展的现代化","物质文明和精神文明相协调的现代化",".人与自然和谐共生的现代化","走和平发展道路的现代化"],"answer":["A","C","D","E"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选13","explanation":{"topic":"中国式现代化的五个中国特色","reason":"五个特征是人口规模巨大、全体人民共同富裕、物质精神相协调、人与自然和谐共生、和平发展。A、C、D、E对应其中四项。","analysis":"B将“共同富裕”换成“共同发展”。一般发展表述不能替代强调分配、生活与公平目标的共同富裕，故B在本题不选。","tip":"现代化五特征中的关键词是“共同富裕”，不是“共同发展”。"},"topicId":"supp-3"},{"id":"s3-multiple-14","type":"multiple","number":25,"originalNumber":"14","stem":"中国式现代化（ ）。","options":["深深植根于中华优秀传统文化","体现科学社会主义的先进本质","借鉴吸收一切人类优秀文明成果","代表人类文明进步的发展方向","是一种全新的人类文明形态，但不可复制。"],"answer":["A","B","C","D"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选14","explanation":{"topic":"人类文明新形态","reason":"A、B、C、D分别从文化根基、社会性质、文明借鉴和发展方向说明中国式现代化开辟的新图景，四项均符合题意。","analysis":"E前半句相关，后半句“不可复制”作了绝对判断。道路需要适合本国国情，不能机械照搬，但不意味着经验完全不能学习借鉴。","tip":"区分“不能机械照搬”与“没有任何可借鉴价值”。"},"topicId":"supp-3"},{"id":"s3-multiple-15","type":"multiple","number":26,"originalNumber":"15","stem":"中国式现代化的本质要求是( )。","options":["坚持中国共产党领导","坚持中国特色社会主义","实现高质量发展","发展全过程人民民主，","实现全体人民共同富裕"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选15","explanation":{"topic":"中国式现代化的本质要求","reason":"党的领导、中国特色社会主义、高质量发展、全过程人民民主、共同富裕，都属于中国式现代化本质要求，题中五个选项均应选。","analysis":"本质要求还有人的精神世界、人与自然、国际共同发展等方面。选项列出的只是其中部分，不能因不完整而把已经正确的项目排除。","tip":"本质要求有九方面，本题给出的五项全部属于其中。"},"topicId":"supp-3"},{"id":"s3-multiple-16","type":"multiple","number":27,"originalNumber":"16","stem":"推进中国式现代化需要牢牢把握的重大原则是（）。","options":["坚持和加强党的全面领导","坚持中国特色社会主义道路","坚持以人民为中心的发展思想","坚持深化改革开放","坚持发扬斗争精神"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选16","explanation":{"topic":"推进现代化的重大原则","reason":"党的领导提供政治保证，中国特色社会主义道路明确方向，以人民为中心确定价值立场，改革开放提供动力，斗争精神支持应对挑战，五项均成立。","analysis":"这组原则既包括方向与价值，也包括动力与精神状态。只选政治方向、漏掉改革开放或斗争精神，会使原则理解不完整。","tip":"五项原则可按领导、道路、人民、改革、斗争记忆。"},"topicId":"supp-3"},{"id":"s3-multiple-17","type":"multiple","number":28,"originalNumber":"17","stem":"推进中国式现代化需要正确处理的重大关系是（）。","options":["正确处理顶层设计与实践探索的关系","正确处理战略与策略的关系","正确处理守正与创新的关系","正确处理效率与公平的关系","正确处理独立自主与对外开放的关系"],"answer":["A","B","C","D","E"],"note":"","origin":"习思想教材配套练习题 第二章 以中国式现代化全面推进中华民族伟大复兴 · 多选17","explanation":{"topic":"推进现代化的重大关系","reason":"顶层设计与实践探索、战略与策略、守正与创新、效率与公平、独立自主与开放，均是推进现代化需要处理的关系。题目五项都是正确关系。","analysis":"还应掌握活力与秩序这一关系。处理关系强调协调统一，不是只保留一端、否定另一端；不能把独立自主等同于闭关自守。","tip":"相关关系需要统筹，教材常概括为六组，本题列出五组。"},"topicId":"supp-3"}]},{"id":"supp-4","label":"补充4","chapter":3,"title":"坚持党的全面领导","kind":"supp","source":"习思想教材配套练习题 第三章 坚持党的全面领导(2).docx","questions":[{"id":"s4-single-1","type":"single","number":1,"originalNumber":"1","stem":"习近平指出：“一定要认清，中国最大的国情就是（ ）。什么是中国特色？这就是中国特色。”","options":["人口14亿","中国共产党的领导","人均GDP世界第二","吃饭是个山大的问题"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选1","explanation":{"topic":"党的领导与中国国情","reason":"本题所引用论述强调党的领导在中国政治制度和事业发展中的根本作用，B符合引文所表达的政治制度层面的国情。","analysis":"人口规模、经济统计和生活问题各涉及国情的一方面，但不是此句引文所指的最大国情。C“人均GDP世界第二”也不能当作事实学习。","tip":"引文题先识别论述主题，不能只凭某个常见国情数字。"},"topicId":"supp-4"},{"id":"s4-single-2","type":"single","number":2,"originalNumber":"2","stem":"（ ）是党的领导的最高原则，是党保持团结统一和强大战斗力的关键所在。","options":["民主集中制","党中央集中统一领导","群众路线","实事求是"],"answer":["B"],"note":"","origin":"习思想教材配套练习题 第三章 坚持党的全面领导 · 单选2","explanation":{"topic":"党的领导的最高原则","reason":"党中央集中统一领导保障全党方向一致、行动协调，是原题所问的最高原则，故选B。它
