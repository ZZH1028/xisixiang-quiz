<script id="study-data" type="application/json">{"version":1,"topics":[{"id":"topic-1","label":"专题1","chapter":1,"title":"新时代坚持和发展中国特色社会主义","kind":"main","source":"maogai.szhopc.cn · 习思想课程","questions":[{"id":"xx-ch1-single-01","type":"single","number":1,"originalNumber":"1","stem":"中国特色社会主义进入新时代，我国社会主要矛盾已经转化为：（ ）。","options":["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","生产关系和生产力、上层建筑和经济基础之间的矛盾","人民群众对美好生活的向往与各种风险挑战之间的矛盾"],"answer":["B"],"explanation":{"reason":"党的十九大报告将新时代我国社会主要矛盾概括为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，即B项。A项是此前对社会主要矛盾的表述，侧重物质文化需要与落后社会生产；C项讲的是生产关系与生产力、上层建筑与经济基础的社会基本矛盾，并非本题所问的社会主要矛盾；D项涉及发展中的风险挑战，但不是社会主要矛盾的规范表述。教材对应「新时代我国社会主要矛盾」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-02","type":"single","number":2,"originalNumber":"2","stem":"坚持和发展中国特色社会主义，总任务是：（ ）。","options":["全面建成小康社会","实现社会主义现代化和中华民族伟大复兴","全面深化改革","全面依法治国"],"answer":["B"],"explanation":{"reason":"坚持和发展中国特色社会主义的总任务是实现社会主义现代化和中华民族伟大复兴，B项概括了现代化建设与民族复兴的总体目标。A项全面建成小康社会是已经实现的阶段性奋斗目标，不等于长期总任务；C项全面深化改革是推进事业发展的重要动力；D项全面依法治国是国家治理的重要战略举措。后二者都服务于总任务，而不取代总任务。教材对应「新时代坚持和发展中国特色社会主义的总任务」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-03","type":"single","number":3,"originalNumber":"3","stem":"中国特色社会主义最本质的特征是：（ ）。","options":["人民民主专政","中国共产党领导","以经济建设为中心","改革开放"],"answer":["B"],"explanation":{"reason":"中国共产党领导是中国特色社会主义最本质的特征，也是中国特色社会主义制度的最大优势，故选B。A项人民民主专政强调我国的国体和国家政权性质，不是此处所问的最本质特征；C项以经济建设为中心是社会主义初级阶段基本路线的中心内容；D项改革开放是决定当代中国命运的关键一招。后三者具有重要地位，但归属层级与党的领导不同。教材对应「中国特色社会主义最本质的特征」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-04","type":"single","number":4,"originalNumber":"4","stem":"“四个全面”战略布局中，具有突破性和先导性的关键环节是：（ ）。","options":["全面建成小康社会","全面深化改革","全面依法治国","全面从严治党"],"answer":["B"],"explanation":{"reason":"全面深化改革着力破除影响发展的体制机制障碍，在“四个全面”战略布局中具有突破性和先导性作用，因此选B。A项全面建成小康社会属于“四个全面”早期表述中的战略目标，后来战略目标调整为全面建设社会主义现代化国家；C项全面依法治国为改革发展提供法治保障；D项全面从严治党提供政治保证。它们与改革相互支撑，但不承担题干强调的改革先导功能。教材对应「四个全面战略布局及全面深化改革」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-05","type":"single","number":5,"originalNumber":"5","stem":"“五位一体”总体布局中，起基础性作用的是（ ）。","options":["经济建设","政治建设","文化建设","社会建设"],"answer":["A"],"explanation":{"reason":"经济建设为政治、文化、社会和生态文明建设提供物质条件。“五位一体”强调五个领域相互联系、协同推进，不能因经济建设的基础作用而忽视其他建设。"},"note":"原网站此题解析为空，已补充。","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-06","type":"single","number":6,"originalNumber":"6","stem":"新时代坚持和发展中国特色社会主义的基本方略，党的十九大报告将其概括为（ ）。","options":["“八个明确”","“十四个坚持”","“五位一体”","“四个全面”"],"answer":["B"],"explanation":{"reason":"党的十九大报告把新时代坚持和发展中国特色社会主义的基本方略概括为“十四个坚持”，故选B。A项“八个明确”是十九大报告对新时代中国特色社会主义思想重要内容的概括，着重回答理论认识方面的问题，不是基本方略的名称；C项“五位一体”是中国特色社会主义事业的总体布局；D项“四个全面”是战略布局。基本方略与总体布局、战略布局相关，但不能相互替代。教材对应「十四个坚持的基本方略」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-07","type":"single","number":7,"originalNumber":"7","stem":"中国特色社会主义进入新时代，我国发展仍处于（ ）。","options":["重要战略机遇期","矛盾凸显期","改革攻坚期","风险多发期"],"answer":["A"],"explanation":{"reason":"新时代我国发展仍处于可以大有作为的重要战略机遇期，A项是对发展所处战略环境的总体判断。B项矛盾凸显、C项改革攻坚和D项风险多发分别反映发展过程中可能面临的矛盾、改革难题与风险特征，具有现实针对性，却不是题干所问的总体战略机遇判断。机遇与挑战并存并不意味着重要战略机遇期这一判断被其他阶段性描述替代。教材对应「新时代我国发展的战略机遇与挑战」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-08","type":"single","number":8,"originalNumber":"8","stem":"决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招是（ ）。","options":["党的领导","改革开放","科技创新","依法治国"],"answer":["B"],"explanation":{"reason":"改革开放是决定当代中国命运的关键一招，也是推进现代化建设和实现中华民族伟大复兴的关键一招，所以选B。A项党的领导是中国特色社会主义的最本质特征和根本政治保证，不是题干所用“关键一招”的特定指向；C项科技创新是推动高质量发展的重要动力；D项依法治国是党领导人民治理国家的基本方略。后三项的重要性并不改变这一论断对改革开放的专门定位。教材对应「改革开放的历史地位」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-09","type":"single","number":9,"originalNumber":"9","stem":"中国特色社会主义道路、理论、制度、文化，四者之间的关系是（ ）。","options":["相互独立、互不干涉","统一于中国特色社会主义伟大实践","理论决定道路，制度决定文化","文化是基础，制度是保障"],"answer":["B"],"explanation":{"reason":"中国特色社会主义道路、理论、制度、文化相互联系、相互促进，统一于中国特色社会主义伟大实践，因此选B。A项将四者割裂为互不干涉的部分，忽视了实践中的有机联系；C项把理论与道路、制度与文化解释成单向决定关系，过度简化了相互作用；D项虽然提到文化和制度的重要性，但用“文化是基础、制度是保障”来概括四者整体关系，既不完整也未回答统一于何处。教材对应「中国特色社会主义道路理论制度文化的统一」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-10","type":"single","number":10,"originalNumber":"10","stem":"新时代坚持和发展中国特色社会主义，必须坚持和完善的社会主义基本经济制度是（ ）。","options":["公有制为主体、多种所有制经济共同发展","按劳分配为主体、多种分配方式并存","社会主义市场经济体制","以上都是"],"answer":["D"],"explanation":{"reason":"社会主义基本经济制度包括公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，以及社会主义市场经济体制，三项均属于其内容，因此选D。A项规定所有制结构，B项规定分配制度，C项规定资源配置与经济运行的体制安排；三者各有侧重、共同构成完整的基本经济制度，不能只选择其中一项来替代全部。教材对应「社会主义基本经济制度」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-11","type":"single","number":11,"originalNumber":"11","stem":"以下关于“新时代”的理解，正确的是（ ）。","options":["新时代意味着我国已经跨越了社会主义初级阶段","新时代是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代","新时代的主要任务是解决人民日益增长的物质文化需要","新时代意味着我国社会主要矛盾已经消失"],"answer":["B"],"explanation":{"reason":"新时代是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代，B项符合党的十九大报告关于新时代内涵的表述。A项把进入新时代等同于跨越社会主义初级阶段，违背基本国情没有改变的判断；C项仍沿用此前以物质文化需要为重点的矛盾表述，不能概括新时代的全面任务；D项把社会主要矛盾的转化说成矛盾消失，混淆了矛盾变化与矛盾消除。教材对应「中国特色社会主义新时代的科学内涵」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-12","type":"single","number":12,"originalNumber":"12","stem":"“中国特色社会主义进入新时代，我国社会主要矛盾发生了变化，但这并没有改变我们对我国社会主义所处历史阶段的判断。”这一论断体现了（ ）。","options":["矛盾的普遍性与特殊性辩证关系原理","事物发展的渐进性与飞跃性统一","主要矛盾与次要矛盾在一定条件下相互转化","事物性质是由主要矛盾的主要方面决定的"],"answer":["A"],"explanation":{"reason":"新时代我国社会主要矛盾的具体内容发生变化，而我国长期处于社会主义初级阶段的基本国情没有变，体现了在把握共同的历史阶段规定性时分析不同阶段的具体特征，故选A。B项渐进性与飞跃性主要讨论发展变化的形式，并非这句话着重辨明的关系；C项涉及主要矛盾和次要矛盾的相互转化，题干没有比较两类矛盾；D项强调决定事物性质的矛盾主要方面，题干也未涉及其变化。教材对应「社会主要矛盾变化与基本国情不变的辩证关系」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-13","type":"single","number":13,"originalNumber":"13","stem":"党的二十大报告指出，新时代十年的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。其中，“我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事”不包括（ ）。","options":["迎来中国共产党成立一百周年","中国特色社会主义进入新时代","完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标","实现中华民族伟大复兴进入了不可逆转的历史进程"],"answer":["D"],"explanation":{"reason":"党的二十大报告概括的三件大事是迎来中国共产党成立一百周年、中国特色社会主义进入新时代，以及完成脱贫攻坚和全面建成小康社会的历史任务、实现第一个百年奋斗目标，分别对应A、B、C。D项中华民族伟大复兴进入不可逆转的历史进程，是对新时代历史性成就及其意义的判断，不是三件大事的列举项目。因此，按题干“不包括”的要求应选D。教材对应「新时代十年的三件大事」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-14","type":"single","number":14,"originalNumber":"14","stem":"“两个确立”的决定性意义在于，它是党在新时代取得的重大政治成果，是推动党和国家事业取得历史性成就、发生历史性变革的决定性因素。“两个确立”是指（ ）。","options":["确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位","确立全面建成小康社会目标，确立全面深化改革总目标","确立党在新时代的强军目标，确立构建人类命运共同体理念","确立“五位一体”总体布局，确立“四个全面”战略布局"],"answer":["A"],"explanation":{"reason":"“两个确立”指确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，A项完整对应这两个方面。B项将全面建成小康社会的奋斗目标与全面深化改革总目标并列，属于具体战略目标；C项说的是强军目标与外交理念；D项说的是“五位一体”总体布局和“四个全面”战略布局。这些内容虽与新时代事业发展相关，却都不是“两个确立”的定义。教材对应「两个确立的基本内涵与意义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-15","type":"single","number":15,"originalNumber":"15","stem":"党的二十大报告强调，中国式现代化是中国共产党领导的社会主义现代化。以下关于中国式现代化的特征，表述错误的是（ ）。","options":["人口规模巨大的现代化","全体人民共同富裕的现代化","物质文明和精神文明相协调的现代化","走殖民扩张道路的现代化"],"answer":["D"],"explanation":{"reason":"中国式现代化具有五个鲜明特征，包括人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。A项、B项、C项分别是前三个特征，均属于正确表述；D项“走殖民扩张道路”与走和平发展道路的特征相反，殖民扩张也不是中国式现代化的发展路径。题干要求选出表述错误的一项，因此选D。教材对应「中国式现代化的中国特色」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-16","type":"single","number":16,"originalNumber":"16","stem":"坚持和发展中国特色社会主义，必须一以贯之。这里的“一以贯之”强调的是（ ）。","options":["坚持党的基本路线不动摇","坚持改革开放不动摇","坚持走中国特色社会主义道路不动摇","以上都是"],"answer":["D"],"explanation":{"reason":"一以贯之坚持和发展中国特色社会主义，需要坚定正确政治方向，长期坚持党的基本路线，并在改革开放中不断发展中国特色社会主义。A项强调基本路线的根本遵循，B项强调以改革开放保持事业发展的生机活力，C项明确坚持中国特色社会主义道路的方向；三项分别从路线、动力和道路说明持续推进事业的要求。D项“以上都是”将A、B、C一并纳入，因而应选D。教材对应「一以贯之坚持和发展中国特色社会主义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-17","type":"single","number":17,"originalNumber":"17","stem":"新时代坚持和发展中国特色社会主义，必须统筹推进“五位一体”总体布局。其中，政治建设的核心目标是（ ）。","options":["建设社会主义文化强国","发展社会主义民主政治","提高保障和改善民生水平","建设美丽中国"],"answer":["B"],"explanation":{"reason":"在“五位一体”总体布局中，政治建设着重发展社会主义民主政治，坚持党的领导、人民当家作主、依法治国有机统一，故选B。A项建设社会主义文化强国属于文化建设的目标，着重增强文化软实力；C项提高保障和改善民生水平属于社会建设的重要任务；D项建设美丽中国属于生态文明建设的目标。各项都属于总体布局，但只有B直接对应政治建设。教材对应「五位一体总体布局中的政治建设」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-18","type":"single","number":18,"originalNumber":"18","stem":"协调推进“四个全面”战略布局，必须把“全面从严治党”作为（ ）。","options":["战略目标","根本保证","动力源泉","法治保障"],"answer":["B"],"explanation":{"reason":"全面从严治党是协调推进“四个全面”战略布局的根本保证，旨在坚持和加强党的全面领导、保持党的先进性和纯洁性，故选B。A项战略目标在现行布局中对应全面建设社会主义现代化国家；C项动力作用主要对应全面深化改革，不是全面从严治党的功能定位；D项法治保障对应全面依法治国。各项在布局中各司其职，不能混淆战略目标、发展动力、法治支撑与政治保证。教材对应「四个全面战略布局中全面从严治党的地位」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-19","type":"single","number":19,"originalNumber":"19","stem":"以下关于“新时代伟大变革的里程碑意义”的表述，不正确的是（ ）。","options":["意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃","意味着科学社会主义在二十一世纪的中国焕发出强大生机活力","意味着中国特色社会主义道路、理论、制度、文化彻底解决了中国所有问题","意味着中国特色社会主义拓展了发展中国家走向现代化的途径"],"answer":["C"],"explanation":{"reason":"新时代伟大变革的里程碑意义包括中华民族迎来从站起来、富起来到强起来的伟大飞跃，科学社会主义在二十一世纪中国焕发强大生机活力，以及中国式现代化拓展发展中国家现代化路径。A、B、D分别对应民族发展、社会主义发展和现代化道路的意义。C项“彻底解决了中国所有问题”把历史性成就绝对化，忽视发展中仍存在的矛盾和挑战，故按“不正确”选C。教材对应「新时代伟大变革的里程碑意义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-20","type":"single","number":20,"originalNumber":"20","stem":"习近平总书记强调，“全党必须牢记，坚持党的全面领导是坚持和发展中国特色社会主义的必由之路”。这一论断深刻揭示了（ ）。","options":["党的领导与中国特色社会主义的内在统一性","党的领导是中国特色社会主义的唯一特征","坚持党的领导就能解决一切问题","党的领导与依法治国是矛盾的"],"answer":["A"],"explanation":{"reason":"坚持党的全面领导是坚持和发展中国特色社会主义的必由之路，说明党的领导与中国特色社会主义的性质、方向和实践具有内在统一性，故选A。B项把“最本质的特征”夸大为“唯一特征”，忽视社会主义制度和发展实践的其他规定性；C项把党的领导当作无需具体实践就能解决一切问题的充分条件；D项将党的领导与依法治国对立起来，忽视二者相统一的政治与法治关系。教材对应「党的全面领导与中国特色社会主义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-21","type":"single","number":21,"originalNumber":"21","stem":"党的二十大报告指出：“新时代十年的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。”这一论断的深层逻辑在于，新时代十年（ ）。","options":["实现了中国从站起来到富起来的伟大飞跃","完成了中国历史上最广泛最深刻的社会变革","推动中华民族伟大复兴进入了不可逆转的历史进程","彻底解决了社会主义初级阶段的主要矛盾"],"answer":["C"],"explanation":{"reason":"新时代十年的伟大变革推动中华民族伟大复兴进入不可逆转的历史进程，为民族复兴积累了更坚实的物质基础、制度保证和精神力量，所以选C。A项从站起来到富起来主要是新中国成立以来尤其改革开放长期发展的历史进程，不能归为新时代十年独自完成；B项所说的最广泛最深刻的社会变革通常指社会主义制度的建立过程；D项认为社会主义初级阶段主要矛盾已经彻底解决，与现实不符。教材对应「新时代十年伟大变革的历史意义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-22","type":"single","number":22,"originalNumber":"22","stem":"习近平总书记指出：“中国特色社会主义不是从天上掉下来的，是党和人民历尽千辛万苦、付出巨大代价取得的根本成就。”这一论述旨在强调（ ）。","options":["中国特色社会主义具有深厚的历史渊源和广泛的现实基础","中国特色社会主义是唯一的正确道路，不存在其他选择","坚持中国特色社会主义必须付出巨大代价","中国特色社会主义已经完美无缺，无需发展"],"answer":["A"],"explanation":{"reason":"中国特色社会主义是党和人民长期探索、实践并付出艰辛努力取得的根本成就，体现了深厚历史渊源和现实基础，故选A。B项把特定国家历史条件下形成的正确道路表述为对一切情形的排他性判断，超出了引文含义；C项把历史上“付出巨大代价”的事实误写成未来必须主动付出代价的要求；D项否认中国特色社会主义需要与时俱进、不断完善发展，也与引文强调的实践探索不符。教材对应「中国特色社会主义的历史形成与实践基础」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-23","type":"single","number":23,"originalNumber":"23","stem":"党的二十大报告将“中国式现代化”作为核心概念进行系统阐述。从“四个全面”战略布局到“中国式现代化”的理论创新，体现了（ ）。","options":["党对社会主义建设规律认识的深化","我国社会主要矛盾的彻底解决","中国特色社会主义道路的根本转向","马克思主义基本原理与中国实际结合的第二次飞跃"],"answer":["A"],"explanation":{"reason":"从协调推进“四个全面”到系统阐述中国式现代化，反映了党对社会主义现代化建设目标、路径和规律认识的不断深化，故选A。B项将理论创新说成社会主要矛盾已被彻底解决，混淆了认识深化和现实问题消失；C项把理论发展说成中国特色社会主义道路发生根本转向，否定了道路的连续性；D项把这一新时代发展归为马克思主义中国化“第二次飞跃”，混淆了不同历史时期理论成果的归属。教材对应「中国式现代化与社会主义建设规律认识的深化」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-24","type":"single","number":24,"originalNumber":"24","stem":"坚持和发展中国特色社会主义，必须处理好“变”与“不变”的关系。以下体现这一辩证关系的是（ ）。","options":["我国社会主要矛盾发生了变化，但我国仍处于社会主义初级阶段的基本国情没有变","我国是世界最大发展中国家的国际地位没有变，但综合国力显著提升","党的基本路线没有变，但具体政策和策略需要与时俱进","以上都是"],"answer":["D"],"explanation":{"reason":"坚持和发展中国特色社会主义必须在保持基本方向和原则稳定的同时，根据实践变化调整工作重点和具体政策，因此选D。A项指出社会主要矛盾变化而社会主义初级阶段基本国情未变；B项说明综合国力持续提升与世界最大发展中国家的国际地位没有改变可以并存；C项指出党的基本路线需要长期坚持，而政策策略应随形势与时俱进。三个选项分别从国情、国际地位和路线政策层面体现“变”与“不变”的统一。教材对应「新时代变与不变的辩证关系」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-25","type":"single","number":25,"originalNumber":"25","stem":"新时代坚持和发展中国特色社会主义，必须坚持党的基本路线不动摇。党的基本路线的核心内容是“一个中心、两个基本点”。其中，“两个基本点”是（ ）。","options":["坚持四项基本原则和坚持改革开放","坚持党的领导与坚持人民民主专政","坚持社会主义道路与坚持依法治国","坚持以经济建设为中心与坚持共同富裕"],"answer":["A"],"explanation":{"reason":"社会主义初级阶段基本路线的“一个中心”是以经济建设为中心，“两个基本点”是坚持四项基本原则和坚持改革开放，所以选A。B项党的领导、人民民主专政是四项基本原则中的内容，不能替代完整的“两个基本点”；C项社会主义道路同样属于四项基本原则，依法治国则是治国基本方略；D项经济建设是“一个中心”，共同富裕是社会主义发展的重要目标，并非两个基本点的并列内容。教材对应「社会主义初级阶段党的基本路线」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-26","type":"single","number":26,"originalNumber":"26","stem":"习近平总书记指出：“全党要更加自觉地增强道路自信、理论自信、制度自信、文化自信，既不走封闭僵化的老路，也不走改旗易帜的邪路，保持政治定力，坚持实干兴邦，始终坚持和发展中国特色社会主义。”其中，“不走封闭僵化的老路”强调的是（ ）。","options":["必须坚持改革开放的基本国策","必须坚持四项基本原则","必须坚持党的基本路线","必须坚持独立自主"],"answer":["A"],"explanation":{"reason":"“不走封闭僵化的老路”强调不能固守脱离实践发展的僵化模式，必须以改革破除体制机制障碍、以开放增强发展活力，故选A。B项坚持四项基本原则着重保证社会主义政治方向，与“不走改旗易帜的邪路”联系更直接；C项坚持党的基本路线是涵盖经济建设、四项基本原则和改革开放的整体要求，范围更广；D项独立自主强调自主选择发展道路，不能单独概括反对封闭僵化的重点。教材对应「坚持中国特色社会主义道路与改革开放」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-27","type":"single","number":27,"originalNumber":"27","stem":"党的二十大报告强调，前进道路上必须牢牢把握“五项重大原则”，其中“坚持和加强党的全面领导”居于首位。这主要是因为（ ）。","options":["党的领导是中国特色社会主义最本质的特征和最大优势","党是最高政治领导力量，能够总揽全局、协调各方","只有坚持党的领导，才能确保中国式现代化的正确方向","以上都是"],"answer":["D"],"explanation":{"reason":"坚持和加强党的全面领导处于中国式现代化前进道路重大原则的首位，因为党的领导贯穿中国特色社会主义事业各方面，所以选D。A项从最本质特征和制度最大优势说明政治根据；B项从党总揽全局、协调各方的领导地位说明组织和治理能力；C项从保障中国式现代化正确方向说明实践要求。三项共同构成题干所问的原因，不能割裂。教材对应「坚持和加强党的全面领导」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-28","type":"single","number":28,"originalNumber":"28","stem":"以下关于“统筹推进‘五位一体’总体布局”与“协调推进‘四个全面’战略布局”关系的表述，最准确的是（ ）。","options":["“五位一体”是目标，“四个全面”是路径","“四个全面”是总体布局，“五位一体”是战略布局","二者相互促进、有机统一，共同构成新时代中国特色社会主义的顶层设计","“五位一体”侧重于国内发展，“四个全面”侧重于国际战略"],"answer":["C"],"explanation":{"reason":"“五位一体”总体布局与“四个全面”战略布局是有机统一、相互促进的战略安排，前者统筹事业发展的各领域，后者部署重点战略任务，故选C。A项以“目标”和“路径”简单对应两者，未准确体现总体布局与战略布局的差别；B项把二者的正式类别颠倒；D项把两者误分为国内发展与国际战略，而它们都服务于中国特色社会主义事业整体推进。教材对应「五位一体与四个全面的相互关系」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-29","type":"single","number":29,"originalNumber":"29","stem":"新时代伟大变革的里程碑意义，深刻体现在它证明了中国特色社会主义道路的正确性。从国际比较来看，这突出表现为（ ）。","options":["中国用几十年时间走完了发达国家几百年的工业化历程","中国式现代化为发展中国家走向现代化提供了全新选择","中国摆脱了“现代化=西方化”的迷思","以上都是"],"answer":["D"],"explanation":{"reason":"中国特色社会主义现代化建设的实践说明现代化道路具有多样性，国际比较可以从发展成就、道路选择和现代化观念三个方面理解，故选D。A项概括中国在长期发展中快速推进工业化的成就，是较长历史进程的比较；B项强调中国式现代化为发展中国家提供新选择；C项说明现代化不必等同于照搬西方道路。三项分别提供实践成就、国际影响和道路认识的依据，不能以其中一项取代其余两项。教材对应「中国式现代化的世界意义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-single-30","type":"single","number":30,"originalNumber":"30","stem":"习近平总书记强调：“中华民族伟大复兴绝不是轻轻松松、敲锣打鼓就能实现的。”这要求我们在新时代坚持和发展中国特色社会主义的过程中，必须（ ）。","options":["增强忧患意识，坚持底线思维，准备经受风高浪急甚至惊涛骇浪的重大考验","发扬斗争精神，提高斗争本领，依靠顽强斗争打开事业发展新天地","保持战略定力，坚持稳中求进工作总基调","以上都是"],"answer":["D"],"explanation":{"reason":"实现中华民族伟大复兴需要长期奋斗和应对复杂风险，必须统筹风险防范、斗争能力建设与保持战略定力，因此选D。A项强调增强忧患意识和底线思维，以防范重大风险；B项强调发扬斗争精神、提高斗争本领，以解决前进中的重大困难；C项强调坚持稳中求进工作总基调，保持政策连续性和战略主动。三者分别对应风险意识、行动能力和工作方法，都是引文所包含的实践要求。教材对应「实现中华民族伟大复兴的奋斗要求」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-01","type":"multiple","number":31,"originalNumber":"1","stem":"关于中国特色社会主义进入新时代，下列理解正确的有（ ）","options":["这是我国发展新的历史方位","意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃","意味着科学社会主义在二十一世纪的中国焕发出强大生机活力","意味着中国特色社会主义道路、理论、制度、文化不断发展，为解决人类问题贡献了中国智慧和中国方案"],"answer":["A","B","C","D"],"explanation":{"reason":"中国特色社会主义进入新时代，是我国发展新的历史方位，A项说明了这一历史定位；B项强调中华民族迎来从站起来、富起来到强起来的伟大飞跃；C项强调科学社会主义在二十一世纪中国展现强大生机活力；D项强调中国特色社会主义道路、理论、制度、文化的发展为解决人类问题贡献中国智慧和方案。后三项分别从民族复兴、社会主义发展和世界影响揭示新时代的重大意义，均属于题干范围。教材对应「中国特色社会主义进入新时代的重大意义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-02","type":"multiple","number":32,"originalNumber":"2","stem":"关于新时代我国社会主要矛盾，下列理解正确的有（ ）","options":["我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","我国社会主要矛盾的变化，没有改变我们对我国社会主义所处历史阶段的判断","我国社会主要矛盾的变化是关系全局的历史性变化，对党和国家工作提出了许多新要求","我国社会主要矛盾的转化，意味着我国已经跨越了社会主义初级阶段"],"answer":["A","B","C"],"explanation":{"reason":"党的十九大报告明确新时代我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，A项是规范表述；B项指出主要矛盾变化并未改变社会主义初级阶段的历史定位；C项强调这一关系全局的变化对党和国家工作提出新要求。D项把社会主要矛盾转化等同于跨越社会主义初级阶段，但我国仍处于并将长期处于这一阶段，不能据此推断历史阶段已结束。教材对应「新时代社会主要矛盾的转化」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-03","type":"multiple","number":33,"originalNumber":"3","stem":"下列属于党的基本路线核心内容的是（ ）","options":["以经济建设为中心","坚持四项基本原则","坚持改革开放","自力更生，艰苦创业"],"answer":["A","B","C"],"explanation":{"reason":"党在社会主义初级阶段基本路线的核心内容是“一个中心、两个基本点”，因此A项以经济建设为中心、B项坚持四项基本原则、C项坚持改革开放均应选。A项规定工作中心，B项确立基本政治原则，C项强调发展动力和开放方向，三者共同构成核心内容。D项自力更生、艰苦创业也是基本路线中的重要要求，但属于奋斗精神和实践方针，而非“一个中心、两个基本点”这一核心结构。教材对应「党的基本路线的核心内容」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-04","type":"multiple","number":34,"originalNumber":"4","stem":"关于“五位一体”各建设领域的相互支撑，下列理解正确的有（ ）。","options":["经济建设提供物质基础","政治建设提供政治保障","文化建设提供精神支撑","社会建设关系民生改善"],"answer":["A","B","C","D"],"explanation":{"reason":"经济建设提供物质基础，政治建设提供政治保障，文化建设提供精神支撑，社会建设关系民生改善。五个领域相互联系，生态文明建设也不可缺少。"},"note":"原网站答案AC与其解析矛盾。本题按教材改写选项，修订后答案为ABCD。","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-05","type":"multiple","number":35,"originalNumber":"5","stem":"协调推进“四个全面”战略布局，包括（ ）","options":["全面建设社会主义现代化国家","全面深化改革","全面依法治国","全面从严治党"],"answer":["A","B","C","D"],"explanation":{"reason":"现阶段“四个全面”是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。第一项是战略目标，后三项是战略举措。"},"note":"原网站A沿用“全面建成小康社会”，现依据2023版教材更新为“全面建设社会主义现代化国家”。","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-06","type":"multiple","number":36,"originalNumber":"6","stem":"中国特色社会主义进入新时代，意味着（ ）","options":["中华民族迎来了从站起来、富起来到强起来的伟大飞跃","科学社会主义在二十一世纪的中国焕发出强大生机活力","中国特色社会主义道路、理论、制度、文化不断发展，为解决人类问题贡献了中国智慧和中国方案","我国已经成为世界强国"],"answer":["A","B","C"],"explanation":{"reason":"中国特色社会主义进入新时代具有重要历史意义，A项着眼于中华民族从站起来、富起来到强起来的伟大飞跃，B项着眼于科学社会主义在二十一世纪中国焕发活力，C项着眼于中国特色社会主义道路、理论、制度、文化的发展及其世界贡献，三项分别对应新时代的重要历史意义。D项“我国已经成为世界强国”把奋斗目标当作已经实现的现实判断，与我国仍是世界最大发展中国家的定位不符。教材对应「新时代的历史意义与我国基本国情」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-07","type":"multiple","number":37,"originalNumber":"7","stem":"下列关于坚持和发展中国特色社会主义的说法，正确的有（ ）","options":["是改革开放以来党的全部理论和实践的主题","是当代中国发展进步的根本方向","只有坚持和发展中国特色社会主义才能实现中华民族伟大复兴","中国特色社会主义是社会主义，不是别的什么主义"],"answer":["A","B","C","D"],"explanation":{"reason":"坚持和发展中国特色社会主义是改革开放以来党的全部理论和实践的主题，A项说明其贯穿改革开放历史进程；B项指出它是当代中国发展进步的根本方向；C项说明实现中华民族伟大复兴必须沿着这一道路持续推进；D项强调中国特色社会主义坚持科学社会主义基本原则，具有社会主义性质。四项分别说明其历史主题、发展方向、民族复兴意义与性质定位，彼此补充，均符合题干。教材对应「坚持和发展中国特色社会主义的地位与性质」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-08","type":"multiple","number":38,"originalNumber":"8","stem":"关于新时代伟大变革的里程碑意义，下列说法正确的有（ ）","options":["在党史上，标志着我们党在政治上更加成熟、思想上更加统一、组织上更加巩固","在新中国史上，推动我国迈上全面建设社会主义现代化国家新征程","在改革开放史上，实现了改革开放新突破，开创了改革开放新局面","在社会主义发展史上，彰显了科学社会主义的强大生命力"],"answer":["A","B","C","D"],"explanation":{"reason":"新时代十年的伟大变革在多个历史维度具有里程碑意义。A项从党史角度强调党在政治、思想和组织上的发展；B项从新中国史角度指出全面建设社会主义现代化国家新征程的开启；C项从改革开放史角度强调改革开放的新突破与新局面；D项从社会主义发展史角度说明中国实践彰显科学社会主义的生命力。这四项分别体现不同历史维度，不能把其中某个维度等同于全部里程碑意义。教材对应「新时代十年伟大变革的里程碑意义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-09","type":"multiple","number":39,"originalNumber":"9","stem":"如何理解“一以贯之坚持和发展中国特色社会主义”？以下说法正确的有（ ）","options":["需要一代又一代人接续奋斗","必须坚持党的基本路线不动摇","要不断推进理论创新、实践创新、制度创新、文化创新","要在实践中不断丰富和发展中国特色社会主义"],"answer":["A","B","C","D"],"explanation":{"reason":"一以贯之坚持和发展中国特色社会主义，意味着长期坚守正确方向并在实践中持续发展。A项强调事业需要一代又一代人接续奋斗，体现任务的长期性；B项强调党的基本路线不动摇，明确根本政治与发展遵循；C项要求理论、实践、制度、文化等方面不断创新，以回应新问题；D项要求在实践中丰富和发展中国特色社会主义，体现守正与创新的统一。四项分别从历史接续、基本路线、创新方式和实践发展作出说明。教材对应「一以贯之坚持和发展中国特色社会主义」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-10","type":"multiple","number":40,"originalNumber":"10","stem":"下列关于党在社会主义初级阶段基本路线的认识，正确的有（ ）","options":["是党和国家的生命线、人民的幸福线","必须长期坚持，贯穿整个社会主义初级阶段","核心内容是“一个中心、两个基本点”","奋斗目标是把我国建设成为富强民主文明和谐美丽的社会主义现代化强国"],"answer":["A","B","C","D"],"explanation":{"reason":"党的社会主义初级阶段基本路线是党和国家的生命线、人民的幸福线，A项说明其根本地位；B项强调基本路线必须在整个社会主义初级阶段长期坚持；C项概括其核心为以经济建设为中心、坚持四项基本原则、坚持改革开放；D项指出建设富强民主文明和谐美丽的社会主义现代化强国这一奋斗目标。四项分别涉及地位、时限、核心内容和目标，其中D项属于党的十九大报告的表述，均与题干相符。教材对应「社会主义初级阶段党的基本路线」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-11","type":"multiple","number":41,"originalNumber":"11","stem":"关于“统筹推进‘五位一体’总体布局”和“协调推进‘四个全面’战略布局”的关系，下列理解正确的有（ ）","options":["“五位一体”是总体布局，“四个全面”是战略布局","“五位一体”是管全局、管长远的，“四个全面”是战略抓手、战略重点","两者相互促进、相互支撑，有机统一于坚持和发展中国特色社会主义的实践","“四个全面”是“五位一体”的具体化"],"answer":["A","B","C"],"explanation":{"reason":"“五位一体”是中国特色社会主义事业总体布局，“四个全面”是战略布局，A项明确两者的正式定位；B项指出总体布局着眼事业全局和长远安排，战略布局突出关键任务与抓手；C项说明两者相互支撑并统一于坚持和发展中国特色社会主义的实践。D项将“四个全面”简单说成“五位一体”的具体化，忽视两者分别从建设领域和重大战略任务展开，属于对关系的单向简化。教材对应「五位一体与四个全面的关系」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-12","type":"multiple","number":42,"originalNumber":"12","stem":"新时代我国社会主要矛盾的转化，意味着（ ）","options":["我国社会主义初级阶段已经结束","我国作为世界最大发展中国家的国际地位没有变","我国社会生产力水平总体上显著提高，但发展不平衡不充分问题突出","人民对美好生活的需要日益广泛，不仅对物质文化生活提出了更高要求，而且在民主、法治、公平、正义、安全、环境等方面的要求日益增长"],"answer":["B","C","D"],"explanation":{"reason":"新时代社会主要矛盾转化反映人民需要与社会生产发展的新特点，但不意味着社会主义初级阶段结束。B项强调我国作为世界最大发展中国家的国际地位没有改变；C项指出生产力总体水平提高的同时，不平衡不充分发展问题更加突出；D项说明人民对美好生活的需求由物质文化领域延伸至民主、法治、公平、正义、安全、环境等方面。A项将主要矛盾变化等同于初级阶段结束，混淆了阶段性特征和基本国情。教材对应「主要矛盾变化与基本国情不变」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-13","type":"multiple","number":43,"originalNumber":"13","stem":"中国特色社会主义道路、理论、制度、文化之间的关系是（ ）","options":["中国特色社会主义道路是实现途径","中国特色社会主义理论体系是行动指南","中国特色社会主义制度是根本保障","中国特色社会主义文化是精神力量"],"answer":["A","B","C","D"],"explanation":{"reason":"中国特色社会主义道路、理论、制度、文化各有功能又相互统一。A项道路是实现途径，规定事业发展的实践方向；B项理论体系是行动指南，为实践提供思想指引；C项制度是根本保障，为事业持续发展提供制度支撑；D项文化是精神力量，为事业发展提供价值认同和精神动力。四项对应了中国特色社会主义不同层面的功能定位，只有结合起来才能完整理解其相互作用。教材对应「中国特色社会主义道路理论制度文化的关系」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-14","type":"multiple","number":44,"originalNumber":"14","stem":"下列关于“新时代”的理解，正确的有（ ）","options":["是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代","是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代","是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代","是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代"],"answer":["A","B","C","D"],"explanation":{"reason":"党的十九大报告从多个角度概括新时代的内涵：A项强调承前启后、继往开来的历史承接与继续夺取伟大胜利；B项强调决胜全面建成小康社会并开启建设社会主义现代化强国的历史任务，属于十九大时期的阶段安排；C项强调全国人民创造美好生活和逐步实现共同富裕的人民立场；D项强调全体中华儿女为民族复兴共同奋斗的历史使命。四项均是十九大报告关于新时代内涵的表述。教材对应「中国特色社会主义新时代的丰富内涵」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-15","type":"multiple","number":45,"originalNumber":"15","stem":"中国特色社会主义进入新时代，对我国发展提出了新的要求。下列属于新时代新要求的有（ ）","options":["必须坚持以发展为第一要务，着力解决发展不平衡不充分问题","必须坚持和完善我国社会主义基本经济制度，推动经济高质量发展","必须坚持以人民为中心的发展思想，不断促进人的全面发展、全体人民共同富裕","必须坚持党对一切工作的领导，确保党始终总揽全局、协调各方"],"answer":["A","B","C","D"],"explanation":{"reason":"进入新时代，推进中国特色社会主义事业必须着力解决发展不平衡不充分的问题。A项从发展第一要务出发，强调提高发展质量和解决发展差距；B项从基本经济制度和高质量发展出发，强调完善经济发展的制度条件；C项强调以人民为中心，不断促进人的全面发展和共同富裕；D项强调党的全面领导，为各项事业统筹协调提供根本政治保证。四项分别涵盖发展任务、经济制度、人民立场和领导保证。教材对应「新时代坚持和发展中国特色社会主义的基本要求」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-16","type":"multiple","number":46,"originalNumber":"16","stem":"关于“一以贯之坚持和发展中国特色社会主义”的时代要求，下列分析正确的有（ ）","options":["必须保持政治定力，坚持实干兴邦，始终坚持和发展中国特色社会主义","必须推进国家治理体系和治理能力现代化，将制度优势转化为治理效能","必须发扬斗争精神，提高斗争本领，有效应对重大挑战、抵御重大风险、克服重大阻力、解决重大矛盾","必须不断推进党的自我革命，确保党在坚持和发展中国特色社会主义的历史进程中始终成为坚强领导核心"],"answer":["A","B","C","D"],"explanation":{"reason":"一以贯之坚持和发展中国特色社会主义需要把守住根本方向与解决时代课题结合起来。A项强调政治定力、实干兴邦，防止在重大原则上动摇；B项强调推进治理体系和治理能力现代化，使制度优势转化为治理效能；C项强调斗争精神和斗争本领，以应对风险挑战与重大矛盾；D项强调党的自我革命和自身建设，保证党的领导核心作用。四项分别从方向、治理、风险应对和党的建设说明持续推进事业的要求。教材对应「一以贯之坚持和发展中国特色社会主义的时代要求」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-17","type":"multiple","number":47,"originalNumber":"17","stem":"如何从“两个大局”的高度理解新时代坚持和发展中国特色社会主义的紧迫性与必要性？（ ）","options":["世界正经历百年未有之大变局，我国发展面临的外部环境深刻变化","中华民族伟大复兴进入关键时期，机遇与挑战并存","只有坚持和发展中国特色社会主义，才能在复杂多变的国际环境中保持战略主动","只有坚持和发展中国特色社会主义，才能凝聚起实现民族复兴的磅礴伟力"],"answer":["A","B","C","D"],"explanation":{"reason":"理解新时代坚持和发展中国特色社会主义，必须统筹中华民族伟大复兴战略全局和世界百年未有之大变局。A项说明国际格局深刻变化带来复杂外部环境；B项说明民族复兴处于关键时期、发展机遇和风险挑战交织；C项强调在国际变局中坚持中国特色社会主义道路，以保持战略定力与主动；D项强调通过坚持和发展中国特色社会主义凝聚实现民族复兴的力量。前两项说明“两个大局”的现实背景，后两项说明应对要求。教材对应「两个大局与新时代历史方位」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-18","type":"multiple","number":48,"originalNumber":"18","stem":"关于新时代伟大变革及其里程碑意义，以下说法体现了对“中华民族发展史”深刻影响的有（ ）","options":["推动我国迈上全面建设社会主义现代化国家新征程","为实现中华民族伟大复兴提供了更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量","彰显了科学社会主义的强大生命力","标志着中华民族迎来了从站起来、富起来到强起来的伟大飞跃"],"answer":["B","D"],"explanation":{"reason":"原站按不同历史维度选择BD：更完善的制度保证、更坚实的物质基础、更主动的精神力量，直接服务民族复兴；由站起来、富起来到强起来描述民族发展历程。C主要指向社会主义发展史。"},"note":"保留原网站BD参考答案。A也与民族复兴相关，历史维度并非完全排他，复习时把握整体意义，不要机械排斥A。","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-19","type":"multiple","number":49,"originalNumber":"19","stem":"在新时代，坚持和发展中国特色社会主义，必须统筹推进“五位一体”总体布局。下列举措中，直接服务于“社会建设”的有（ ）","options":["实施乡村振兴战略，促进城乡区域协调发展","健全基本公共服务体系，提高公共服务水平","完善社会治理体系，建设更高水平的平安中国","推动绿色低碳发展，促进人与自然和谐共生"],"answer":["B","C"],"explanation":{"reason":"“五位一体”总体布局中的社会建设重点涉及保障和改善民生、健全公共服务以及完善社会治理。B项提高基本公共服务水平直接回应人民群众教育、医疗、社会保障等需求；C项完善社会治理体系、建设平安中国直接服务社会秩序和民生安全。A项乡村振兴和城乡区域协调发展具有社会效应，但题干所列举措重点落在经济和区域发展；D项绿色低碳发展主要归属生态文明建设，不能混同于社会建设的直接任务。教材对应「五位一体总体布局中的社会建设」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"},{"id":"xx-ch1-multi-20","type":"multiple","number":50,"originalNumber":"20","stem":"关于“坚持党的基本路线不动摇”与“一以贯之坚持和发展中国特色社会主义”的关系，下列理解最深刻的有（ ）","options":["党的基本路线是中国特色社会主义的生命线，动摇基本路线就会动摇整个事业","坚持和发展中国特色社会主义，最根本的就是要坚持党的基本路线","党的基本路线规定了中国特色社会主义的奋斗目标、中心任务和基本原则，是长期坚持的根本遵循","坚持基本路线不动摇，是确保中国特色社会主义航船行稳致远的“定盘星”"],"answer":["A","B","C","D"],"explanation":{"reason":"党的基本路线是党和国家事业发展的根本遵循，坚持基本路线与一以贯之坚持和发展中国特色社会主义内在一致。A项强调基本路线关系事业方向和成败，B项指出坚持基本路线是坚持和发展中国特色社会主义的重要根本要求；C项从奋斗目标、工作中心及基本原则说明基本路线对实践的指导作用；D项以“定盘星”比喻其在长期发展中稳定方向的功能。四项从地位、要求、内容和实践作用四个角度展开，均符合题意。教材对应「坚持党的基本路线与中国特色社会主义事业发展」。"},"note":"","origin":"原网站习思想题库 · 第1章","topicId":"topic-1"}]},{"id":"topic-2","label":"专题2","chapter":2,"title":"以中国式现代化全面推进中华民族伟大复兴","kind":"main","source":"maogai.szhopc.cn · 习思想课程","questions":[{"id":"xx-ch2-single-01","type":"single","number":1,"originalNumber":"1","stem":"实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想。中国梦的本质是（ ）。","options":["国家富强、民族振兴、人民幸福","经济腾飞、政治清明、文化繁荣","全面建成小康社会","实现共产主义"],"answer":["A"],"explanation":{"reason":"中国梦的本质是国家富强、民族振兴、人民幸福，A项完整对应这三个相互联系的层面。B项的经济腾飞、政治清明、文化繁荣属于具体建设成效，不能替代中国梦的本质概括；C项全面建成小康社会是已实现的第一个百年奋斗目标，是民族复兴进程中的重要阶段；D项实现共产主义是党的最高理想和最终目标，不是此处中国梦本质的规范表述。教材对应「中国梦的本质」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-02","type":"single","number":2,"originalNumber":"2","stem":"“两个一百年”奋斗目标的第一个百年奋斗目标指的是（ ）。","options":["实现中华民族伟大复兴","全面建成小康社会","基本实现社会主义现代化","建成社会主义现代化强国"],"answer":["B"],"explanation":{"reason":"第一个百年奋斗目标是在中国共产党成立一百年时全面建成小康社会，对应B项。A项实现中华民族伟大复兴是贯穿更长历史进程的中国梦；C项基本实现社会主义现代化是2035年的阶段性目标，不是第一个百年目标；D项建成社会主义现代化强国对应第二个百年奋斗目标的远景安排。要区分已实现的全面小康目标与新征程中的现代化阶段目标。教材对应「两个一百年奋斗目标」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-03","type":"single","number":3,"originalNumber":"3","stem":"中国式现代化是人口规模巨大的现代化。我国14亿多人口整体迈进现代化社会，其规模超过现有发达国家人口的总和，这决定了我国现代化道路的（ ）。","options":["独特性与艰巨性","先进性与引领性","普遍性与规律性","开放性与包容性"],"answer":["A"],"explanation":{"reason":"十四亿多人口整体迈入现代化社会，在规模和发展条件上都具有独特性，涉及城乡区域差异及庞大的公共服务需求，因而符合A项所说的发展道路独特性与艰巨性。B项先进性与引领性属于对发展成效的评价，不能单由人口规模推得；C项普遍性与规律性强调各国现代化的共性，不能解释这一特定规模的挑战；D项开放性与包容性涉及发展理念，也不是人口规模直接决定的特点。教材对应「人口规模巨大的现代化」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-04","type":"single","number":4,"originalNumber":"4","stem":"中国式现代化是全体人民共同富裕的现代化。这是中国式现代化区别于西方现代化的（ ）。","options":["显著标志","重要前提","物质基础","制度保障"],"answer":["A"],"explanation":{"reason":"选A。共同富裕是中国式现代化区别于西方现代化的显著标志，原选项A“根本标志”按权威规范表述修订为“显著标志”。B项重要前提、C项物质基础、D项制度保障均不是该表述中的定位。教材对应「中国式现代化的中国特色」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-05","type":"single","number":5,"originalNumber":"5","stem":"推进中国式现代化，必须牢牢把握的重大原则中，居于首位的是（ ）。","options":["坚持中国特色社会主义","坚持和加强党的全面领导","坚持以人民为中心的发展思想","坚持深化改革开放"],"answer":["B"],"explanation":{"reason":"推进中国式现代化必须牢牢把握的五项重大原则中，坚持和加强党的全面领导列在首位，对应B项，强调党的领导这一根本保证。A项坚持中国特色社会主义道路同属重大原则，解决前进方向和道路选择问题；C项坚持以人民为中心的发展思想强调现代化的价值立场；D项坚持深化改革开放强调发展动力。后三项都重要，但在党的二十大列举的原则中并非第一项。教材对应「推进中国式现代化的重大原则」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-06","type":"single","number":6,"originalNumber":"6","stem":"全面建成小康社会，实现了中华民族千百年来的（ ）。","options":["大同梦","小康梦","强国梦","复兴梦"],"answer":["B"],"explanation":{"reason":"全面建成小康社会使中华民族长期追求的小康理想成为现实，故选B项小康梦。A项大同梦涉及中华传统文化中更高层次的理想社会追求，并非全面小康这一既定成果的名称；C项强国梦指向建设社会主义现代化强国的更长远任务；D项复兴梦涵盖国家富强、民族振兴、人民幸福的整体历史进程，范围大于全面建成小康社会这一阶段成就。教材对应「全面建成小康社会的历史意义」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-07","type":"single","number":7,"originalNumber":"7","stem":"中国梦归根到底是（ ）的梦，必须紧紧依靠人民来实现。","options":["国家","民族","人民","个人"],"answer":["C"],"explanation":{"reason":"中国梦归根到底是人民的梦，必须依靠人民实现并不断造福人民，选C项。A项国家的梦和B项民族的梦均是中国梦的重要维度，体现国家富强与民族振兴，但题干强调最终归属和实现主体；D项个人的梦反映每个中国人的愿望能够融入中国梦，却不能把共同的中国梦缩小为单独个人的梦想。国家、民族与个人的梦想相互联系，人民是创造者和享有者。教材对应「中国梦归根到底是人民的梦」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-08","type":"single","number":8,"originalNumber":"8","stem":"中国式现代化是物质文明和精神文明（ ）的现代化。","options":["先后发展","协调发展","重点发展","交替发展"],"answer":["B"],"explanation":{"reason":"中国式现代化要求物质文明和精神文明相协调，既追求物质富足，也追求精神富有，因此选B项协调发展。A项先后发展把二者机械分成先完成一个、再建设另一个的阶段；C项重点发展只突出其中某一方面，不能表达两手抓的要求；D项交替发展意味着两种文明轮流推进，也不符合相互促进、共同提升的关系。物质条件改善不能取代精神文明建设。教材对应「物质文明和精神文明相协调的现代化」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-09","type":"single","number":9,"originalNumber":"9","stem":"中国式现代化是人与自然和谐共生的现代化，这体现了（ ）的理念。","options":["人类中心主义","生态中心主义","绿水青山就是金山银山","先污染后治理"],"answer":["C"],"explanation":{"reason":"人与自然和谐共生要求把生态环境保护融入现代化建设，绿水青山就是金山银山揭示生态保护与经济发展的内在联系，故选C项。A项人类中心主义在这里容易把自然仅看作任人支配的工具，忽略生态约束；B项生态中心主义如果把生态价值同人的发展需要完全对立，也不能准确概括人与自然和谐共生；D项先污染后治理把生态代价留到发展之后，与绿色发展要求相背离。教材对应「人与自然和谐共生的现代化」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-10","type":"single","number":10,"originalNumber":"10","stem":"中国式现代化是走和平发展道路的现代化，这决定了中国式现代化（ ）。","options":["依附于现有国际体系","通过殖民扩张实现","主要依靠自身力量实现发展","追求全球霸权"],"answer":["C"],"explanation":{"reason":"走和平发展道路的中国式现代化强调独立自主、自力更生，把国家发展进步的命运掌握在自己手中，同时坚持互利合作，因而在给定选项中C项最符合。A项依附现有国际体系不等于在国际规则下开展平等合作，违背自主发展；B项殖民扩张是中国式现代化明确摒弃的道路；D项追求全球霸权与和平发展、合作共赢的目标相反。依靠自身力量不意味着拒绝对外开放。教材对应「走和平发展道路的现代化」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-11","type":"single","number":11,"originalNumber":"11","stem":"“中国梦是国家的、民族的，也是每一个中国人的。”这句话最能体现（ ）。","options":["国家梦与个人梦的辩证统一","个人利益高于国家利益","国家梦与个人梦互不相干","个人梦的实现依赖于国家梦的实现，反之则不成立"],"answer":["A"],"explanation":{"reason":"中国梦既关乎国家富强、民族振兴，也与每个人的奋斗和幸福相联系，体现国家梦与个人梦的辩证统一，选A项。B项个人利益高于国家利益把个人与国家置于片面对立的位置；C项互不相干否认国家发展为个人提供条件、个人奋斗汇聚国家力量的联系；D项只承认国家梦对个人梦的作用，却否认亿万人的劳动和创造对国家梦实现的推动作用。教材对应「中国梦与个人梦想的关系」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-12","type":"single","number":12,"originalNumber":"12","stem":"某大学生毕业后选择到西部偏远山区支教，他说：“虽然条件艰苦，但能帮助那里的孩子看到更广阔的世界，这就是我的中国梦。”这体现了个人理想与社会理想的关系是（ ）。","options":["社会理想是实现个人理想的基础","个人理想与社会理想完全一致","个人理想要以社会理想为指引，并在社会实践中实现","社会理想可以取代个人理想"],"answer":["C"],"explanation":{"reason":"大学生选择到西部支教，把自身职业选择与改善当地教育条件相结合，体现个人理想以社会理想为指引、通过具体实践实现，选C项。A项强调社会理想对个人理想的支撑，但没有准确概括事例中的主动融入和实践奉献；B项完全一致忽视个人理想与社会理想在内容和实现方式上的差异；D项以社会理想取代个人理想，否认个人追求的独立价值。教材对应「个人理想与社会理想的统一」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-13","type":"single","number":13,"originalNumber":"13","stem":"全面建成小康社会后，我国开启了（ ）的新征程。","options":["基本实现社会主义现代化","全面建成社会主义现代化强国","全面建设社会主义现代化国家","实现中华民族伟大复兴"],"answer":["C"],"explanation":{"reason":"完成全面建成小康社会的目标后，我国开启的是全面建设社会主义现代化国家的新征程，选C项。A项基本实现社会主义现代化是到2035年的阶段目标，而非新征程的完整名称；B项全面建成社会主义现代化强国是本世纪中叶的奋斗目标，不等于整个新征程的称谓；D项实现中华民族伟大复兴是更高层次的历史使命和总体目标，与具体的新征程名称有所区别。教材对应「全面建设社会主义现代化国家新征程」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-14","type":"single","number":14,"originalNumber":"14","stem":"从“全面建成小康社会”到“全面建设社会主义现代化国家”，这一转变的核心内涵是（ ）。","options":["从解决“有没有”转向解决“好不好”","从追求经济增长转向追求全面进步","从国内发展转向国际竞争","从政府主导转向市场主导"],"answer":["A"],"explanation":{"reason":"由全面建成小康社会迈向全面建设社会主义现代化国家，发展要求从解决基本生存发展需要进一步转向提高发展质量和生活品质，A项用从“有没有”到“好不好”概括这种重点变化。B项追求全面进步符合现代化建设要求，但把前一阶段概括为只追求经济增长并不准确；C项国际竞争与国内发展并非先后替代；D项市场与政府的关系需要协同发挥作用，并不是简单由一方取代另一方。教材对应「从全面小康到社会主义现代化国家」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-15","type":"single","number":15,"originalNumber":"15","stem":"中国式现代化坚持“以人民为中心”，而西方现代化以“资本为中心”。这两种发展逻辑的根本区别在于（ ）。","options":["发展速度的快慢","发展成果的分配方式","对生态环境的态度","对国际秩序的影响"],"answer":["B"],"explanation":{"reason":"以人民为中心强调发展为了人民、发展成果由人民共享，与以资本增值为主要导向的发展逻辑相比，最直接反映在发展成果为谁享有以及如何分配上，因此备选项中选B项。A项发展速度不能说明价值取向；C项对生态环境的态度也是重要差别，但不专门回答人民与资本的收益归属关系；D项对国际秩序的影响属于对外层面的结果，不能直接说明题干所述发展逻辑。教材对应「中国式现代化的人民立场与共同富裕」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-16","type":"single","number":16,"originalNumber":"16","stem":"推进中国式现代化，需要正确处理一系列重大关系。其中，“活力与秩序”的关系要求我们（ ）。","options":["为了秩序而牺牲活力","为了活力而放弃秩序","在保持社会秩序稳定的前提下，激发社会创造活力","先发展活力，再建立秩序"],"answer":["C"],"explanation":{"reason":"推进中国式现代化要求在良好秩序中激发社会活力，在活力发展中巩固稳定，实现二者有机统一，C项符合这一要求。A项为了秩序牺牲活力会削弱社会创新创造的动力；B项为了活力放弃秩序会损害安全稳定的基本条件；D项先有活力、再建立秩序把相互依存的两方面割裂成固定先后顺序。活而不乱、活跃有序才是处理这一关系的目标。教材对应「中国式现代化的活力与秩序关系」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-17","type":"single","number":17,"originalNumber":"17","stem":"中国式现代化的本质要求中，排在首位的是（ ）。","options":["坚持中国共产党领导","实现高质量发展","发展全过程人民民主","丰富人民精神世界"],"answer":["A"],"explanation":{"reason":"党的二十大概括中国式现代化的本质要求时，首项为坚持中国共产党领导，对应A项。B项实现高质量发展也是本质要求，但列在坚持中国共产党领导、坚持中国特色社会主义之后；C项发展全过程人民民主是其后的政治建设要求；D项丰富人民精神世界涉及精神文明建设，同样在本质要求之列。题干问的是列举顺序，不是后三项有无重要性。教材对应「中国式现代化的本质要求」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-18","type":"single","number":18,"originalNumber":"18","stem":"“共同富裕不是少数人的富裕，也不是整齐划一的平均主义。”这句话强调的是（ ）。","options":["共同富裕要消除一切差距","共同富裕是全体人民的富裕，但允许有合理差距","共同富裕就是同步富裕、同时富裕","共同富裕主要依靠政府救济"],"answer":["B"],"explanation":{"reason":"共同富裕面向全体人民，强调发展成果更加公平地惠及人民，同时承认地区、行业和个人之间存在合理差距，选B项。A项消除一切差距忽略劳动贡献、发展条件等客观差异；C项同步富裕、同时富裕把逐步实现的历史过程误解为所有人同一时点达到相同水平；D项政府救济是保障困难群体的措施之一，共同富裕还需要高质量发展、就业创业及合理分配制度。教材对应「共同富裕的科学内涵」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-19","type":"single","number":19,"originalNumber":"19","stem":"某企业在发展过程中，主动投资数亿元用于污水处理和厂区绿化，实现了经济效益与环境效益的双赢。这体现了中国式现代化（ ）的特征。","options":["人口规模巨大","全体人民共同富裕","人与自然和谐共生","走和平发展道路"],"answer":["C"],"explanation":{"reason":"企业投资污水处理和绿化，在追求经济效益的同时改善生态环境，体现人与自然和谐共生的现代化，选C项。A项人口规模巨大讲的是国家人口体量对现代化道路的影响；B项全体人民共同富裕强调发展的共享和分配目标；D项走和平发展道路主要指现代化进程中的国际关系与发展方式。案例直接呈现的是环境保护与经济发展相协调，而不是其他三种特征。教材对应「人与自然和谐共生的现代化」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-20","type":"single","number":20,"originalNumber":"20","stem":"中国提出“一带一路”倡议，致力于构建人类命运共同体，这体现了中国式现代化（ ）的特征。","options":["人口规模巨大","全体人民共同富裕","物质文明和精神文明相协调","走和平发展道路"],"answer":["D"],"explanation":{"reason":"共建“一带一路”和推动构建人类命运共同体强调国家间协商合作、互利共赢，直接体现中国式现代化走和平发展道路的特征，选D项。A项人口规模巨大说明中国现代化的规模及难度；B项全体人民共同富裕强调国内发展成果共享；C项物质文明和精神文明相协调强调国内物质生活与精神生活共同提升。这些特征各有内涵，但题干事例突出的是国际合作与和平发展。教材对应「中国式现代化的和平发展道路」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-21","type":"single","number":21,"originalNumber":"21","stem":"有观点认为，现代化就是“西方化”，中国要想实现现代化，必须全盘复制西方模式。运用中国式现代化的理论，以下驳斥最有力的是（ ）。","options":["西方现代化模式已经过时，不具有参考价值","中国传统文化与西方文化存在根本冲突，无法融合","现代化道路具有多样性，各国国情不同，应探索符合自身特点的现代化道路","中国人口规模巨大，无法复制西方高消费、高排放的现代化模式"],"answer":["C"],"explanation":{"reason":"现代化没有放之四海而皆准的唯一模式，不同国家应结合历史条件、制度选择和现实国情探索适合自己的道路，因此C项最能从根本上驳斥“现代化等于西方化”。A项否认西方经验的一切参考价值，与借鉴人类文明有益成果的要求不符；B项把不同文化看作无法交流融合也过于绝对；D项人口规模和生态约束是中国不能照搬某些发展方式的实际原因，但不足以说明现代化道路整体上具有多样性。教材对应「现代化道路的多样性」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-22","type":"single","number":22,"originalNumber":"22","stem":"实现中华民族伟大复兴，必须坚持“四个自信”。其中，中国式现代化道路的成功实践，最直接地增强了我们的（ ）。","options":["道路自信","理论自信","制度自信","文化自信"],"answer":["A"],"explanation":{"reason":"中国式现代化道路的实践成效直接说明中国特色社会主义道路具有现实可行性，因而最直接增强道路自信，选A项。B项理论自信着重于对中国特色社会主义理论体系及其指导作用的认同；C项制度自信着重于制度优势和治理效能；D项文化自信着重于中华文化和社会主义先进文化的价值根基。四个自信相互联系，但题干特意强调“道路的成功实践”。教材对应「中国式现代化道路与四个自信」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-23","type":"single","number":23,"originalNumber":"23","stem":"中国式现代化是“并联式”的发展过程，工业化、信息化、城镇化、农业现代化叠加发展；而西方现代化是“串联式”的过程，是依次发展的。这一区别决定了中国式现代化（ ）。","options":["发展速度必然慢于西方","面临的任务更加复杂艰巨，机遇与挑战并存","可以完全避免西方现代化过程中出现的问题","必须放弃农业现代化，优先发展信息化"],"answer":["B"],"explanation":{"reason":"工业化、信息化、城镇化、农业现代化在中国叠加推进，意味着多重转型任务同时展开，协调难度增加，也可发挥后发优势，故选B项。A项认为发展速度必然慢于西方，忽视并联发展可能带来的跨越式机遇；C项完全避免其他现代化道路出现的问题是不现实的；D项放弃农业现代化与城乡协调发展、农业农村现代化的要求相冲突。并联式推进强调统筹，而不是舍弃某个领域。教材对应「中国式现代化的并联式发展特点」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-24","type":"single","number":24,"originalNumber":"24","stem":"推进中国式现代化，需要正确处理顶层设计与实践探索的关系。这要求我们（ ）。","options":["只依靠中央的顶层设计，基层只需执行","鼓励各地大胆试、大胆闯，无需统一规划","既要加强宏观思考和战略谋划，也要鼓励基层大胆探索、先行先试","顶层设计一旦制定，就不能再根据实践进行调整"],"answer":["C"],"explanation":{"reason":"推进中国式现代化既需要顶层设计确定战略方向，又需要在实践中探索新情况、形成可推广的经验，C项概括了二者的结合。A项只强调中央规划，忽略地方和基层的创造性；B项只强调地方试验而否认统一谋划，容易导致方向和目标失衡；D项把顶层设计视为不可调整的固定方案，忽略实践检验与动态完善。顶层设计与实践探索是相互促进的关系。教材对应「顶层设计与实践探索的关系」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-25","type":"single","number":25,"originalNumber":"25","stem":"中国式现代化创造了人类文明新形态。这一“新”最根本的体现是（ ）。","options":["实现了对资本主义文明的彻底否定","坚持和发展了社会主义文明，并吸收了人类一切优秀文明成果","完全继承了中华传统文明","建立了一套全新的、取代所有其他文明的国际规则"],"answer":["B"],"explanation":{"reason":"中国式现代化创造的人类文明新形态，坚持社会主义方向，同时吸收借鉴人类文明优秀成果并结合中国实际创新发展，选B项。A项彻底否定资本主义文明忽视其历史发展中形成的有益成果；C项完全继承传统文明意味着不加辨别地照搬，不符合创造性转化和创新性发展；D项以一种文明的规则取代所有其他文明，否认文明多样性，也不符合交流互鉴的主张。教材对应「中国式现代化创造人类文明新形态」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-26","type":"single","number":26,"originalNumber":"26","stem":"某学者指出：“中国式现代化既要‘物的全面丰富’，也要‘人的全面发展’。”这一论断体现了（ ）。","options":["物质文明和精神文明相协调的现代化","人口规模巨大的现代化","全体人民共同富裕的现代化","人与自然和谐共生的现代化"],"answer":["A"],"explanation":{"reason":"“物的全面丰富”强调物质生活条件改善，“人的全面发展”同时要求精神文化素质及多方面能力提升，二者共同指向物质文明和精神文明协调发展，选A项。B项人口规模巨大的现代化强调发展对象的数量及复杂性；C项共同富裕突出成果分配与全体人民共享；D项人与自然和谐共生突出生态保护和绿色发展。题干并非否认后三者，而是直接讨论物质与人的精神文化发展。教材对应「物质文明和精神文明相协调的现代化」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-27","type":"single","number":27,"originalNumber":"27","stem":"在推进中国式现代化的过程中，必须坚持问题导向。当前，发展不平衡不充分问题仍然突出。要解决这一问题，最根本的途径是（ ）。","options":["加快城镇化进程","实施乡村振兴战略","坚持以推动高质量发展为主题","加大政府转移支付力度"],"answer":["C"],"explanation":{"reason":"解决发展不平衡不充分问题需要提高发展质量、优化结构和增强发展协调性，因而应坚持以推动高质量发展为主题，选C项。A项加快城镇化可以改善城乡结构，但不能单独解决各领域发展质量问题；B项乡村振兴侧重农业农村和城乡关系，是重要任务之一；D项政府转移支付有助于公共服务均衡和收入再分配，但不能替代发展方式与增长动力转变。教材对应「高质量发展与解决发展不平衡不充分问题」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-28","type":"single","number":28,"originalNumber":"28","stem":"“中国式现代化，是中国共产党领导的社会主义现代化。”这句话强调了（ ）。","options":["中国式现代化的领导力量和根本性质","中国式现代化的实现路径","中国式现代化的国际影响","中国式现代化的历史任务"],"answer":["A"],"explanation":{"reason":"“中国共产党领导的社会主义现代化”同时指出由谁领导和具有什么社会制度性质，A项准确概括了这一定义。B项实现路径着重具体怎样推进现代化，包括发展战略和实践方法，原句并未展开；C项国际影响涉及对世界现代化进程的意义，不是这句话直接说明的内容；D项历史任务主要回答要实现的强国建设和民族复兴目标，也不同于领导力量与根本性质的界定。教材对应「中国式现代化的领导力量与社会主义性质」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-29","type":"single","number":29,"originalNumber":"29","stem":"与中国式现代化相比，西方现代化过程中出现了严重的贫富分化、社会撕裂、生态危机等问题。这启示我们，中国式现代化要（ ）。","options":["完全避免与西方接触，独立发展","汲取西方现代化的教训，发挥后发优势，实现更高质量的发展","优先发展经济，再集中解决社会问题","否定市场经济，完全由政府配置资源"],"answer":["B"],"explanation":{"reason":"中国式现代化应借鉴其他国家现代化建设的有益经验，也应汲取贫富分化、社会失衡和环境破坏等教训，走高质量发展道路，选B项。A项完全避免与西方接触等于拒绝开放与文明互鉴；C项先发展经济再解决社会问题容易重现发展失衡；D项否定市场经济、完全依靠政府配置资源，不符合坚持和完善社会主义市场经济体制的要求。借鉴经验与保持自身道路特色并不矛盾。教材对应「中国式现代化对世界现代化经验的借鉴」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-single-30","type":"single","number":30,"originalNumber":"30","stem":"实现中华民族伟大复兴的中国梦，必须进行伟大斗争、建设伟大工程、推进伟大事业。其中，起决定性作用的是（ ）。","options":["伟大斗争","伟大工程","伟大事业","伟大梦想"],"answer":["B"],"explanation":{"reason":"伟大斗争、伟大工程、伟大事业、伟大梦想相互联系，其中党的建设新的伟大工程起决定性作用，选B项。A项伟大斗争指应对风险挑战和推进事业所需的奋斗实践；C项伟大事业是中国特色社会主义事业，提供实现目标的事业基础和实践道路；D项伟大梦想指实现中华民族伟大复兴，是奋斗目标。伟大工程之所以具有决定性作用，在于党的领导关系整体事业方向和成败。教材对应「四个伟大的内在关系」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-01","type":"multiple","number":31,"originalNumber":"1","stem":"关于中华民族伟大复兴的中国梦，以下表述正确的有（ ）。","options":["中国梦的本质是国家富强、民族振兴、人民幸福","中国梦是国家的梦、民族的梦，也是每一个中国人的梦","实现中国梦必须走中国道路、弘扬中国精神、凝聚中国力量","中国梦是虚无缥缈的宏大叙事，与个人生活没有直接关系"],"answer":["A","B","C"],"explanation":{"reason":"中国梦的本质是国家富强、民族振兴、人民幸福，A项正确；中国梦既属于国家和民族，也与每个中国人的生活和梦想相连，B项正确；实现中国梦必须坚持中国道路、弘扬中国精神、凝聚中国力量，C项说明实现途径。D项把中国梦说成与个人生活无关的空洞叙事，忽视人民是中国梦的主体、创造者和享有者，与中国梦的人民立场相反。教材对应「中国梦的本质与实现途径」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-02","type":"multiple","number":32,"originalNumber":"2","stem":"全面建成小康社会是中华民族伟大复兴征程上的一个重要里程碑。其重大意义体现在（ ）。","options":["实现了第一个百年奋斗目标","为开启全面建设社会主义现代化国家新征程奠定了坚实基础","标志着我国已经进入发达国家行列","是中国共产党和中国人民团结奋斗赢得的历史性胜利"],"answer":["A","B","D"],"explanation":{"reason":"全面建成小康社会完成了第一个百年奋斗目标，A项说明其阶段性成就；这一成果为全面建设社会主义现代化国家提供发展基础，B项说明其承前启后的作用；它凝结中国共产党和中国人民长期奋斗的成果，D项指出其历史意义。C项把全面小康等同于进入发达国家行列，混淆发展阶段和国际发展水平；全面小康建成后我国仍是发展中国家。教材对应「全面建成小康社会的重大意义」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-03","type":"multiple","number":33,"originalNumber":"3","stem":"中国式现代化是人口规模巨大的现代化。这一特征决定了（ ）。","options":["我国现代化的发展途径和推进方式必然具有自身的特点","必须始终保持历史耐心，坚持稳中求进、循序渐进","可以简单套用其他国家现代化的经验模式","需要付出更加艰巨的努力，任务极其艰巨繁重"],"answer":["A","B","D"],"explanation":{"reason":"人口规模巨大的现实决定中国式现代化的发展途径和推进方式必须符合自身国情，A项正确；庞大人口和明显的城乡区域差异要求保持历史耐心、循序渐进，B项正确；人口多、需求广使教育、就业、医疗等现代化任务极其复杂，D项正确。C项简单套用其他国家模式忽视人口规模、发展水平和制度条件差异，与探索适合中国实际的现代化道路相矛盾。教材对应「人口规模巨大的现代化」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-04","type":"multiple","number":34,"originalNumber":"4","stem":"中国式现代化的本质要求包括（ ）。","options":["坚持中国共产党领导","实现全体人民共同富裕","促进人与自然和谐共生","走西方资本主义现代化的老路"],"answer":["A","B","C"],"explanation":{"reason":"中国式现代化的本质要求首先包括坚持中国共产党领导，A项明确根本领导力量；B项实现全体人民共同富裕强调现代化发展成果应由全体人民共享；C项促进人与自然和谐共生强调生态保护与现代化建设相协调。上述三项都属于党的二十大概括的本质要求。D项走西方资本主义现代化老路与中国式现代化的社会主义性质和独立自主探索的道路相背离。教材对应「中国式现代化的本质要求」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-05","type":"multiple","number":35,"originalNumber":"5","stem":"推进中国式现代化需要牢牢把握的重大原则包括（ ）。","options":["坚持和加强党的全面领导","坚持中国特色社会主义道路","坚持以人民为中心的发展思想","坚持深化改革开放"],"answer":["A","B","C","D"],"explanation":{"reason":"推进中国式现代化的重大原则包括坚持和加强党的全面领导（A），为现代化提供根本保证；坚持中国特色社会主义道路（B），明确前进方向；坚持以人民为中心的发展思想（C），明确价值立场；坚持深化改革开放（D），激发现代化建设动力。四项均属党的二十大提出的重大原则，此外还包括坚持发扬斗争精神，以有效应对前进道路上的风险挑战。教材对应「推进中国式现代化的五项重大原则」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-06","type":"multiple","number":36,"originalNumber":"6","stem":"中国式现代化是走和平发展道路的现代化。这体现了（ ）。","options":["中华民族爱好和平的文化传统","中国共产党致力于构建人类命运共同体","中国式现代化不是通过殖民扩张实现的","中国将放弃维护自身国家利益的权利"],"answer":["A","B","C"],"explanation":{"reason":"走和平发展道路体现中华民族崇尚和合、反对侵略的文化传统，A项正确；中国共产党推动构建人类命运共同体，强调合作共赢，B项正确；不通过战争、殖民和掠夺实现现代化，C项指出与传统殖民扩张道路的区别。D项认为中国应放弃维护自身国家利益的权利，把和平发展误解为放弃正当权益；坚持和平发展与坚定维护国家主权、安全和发展利益并不矛盾。教材对应「中国式现代化的和平发展道路」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-07","type":"multiple","number":37,"originalNumber":"7","stem":"关于个人梦想与中国梦的关系，理解正确的有（ ）。","options":["中国梦为个人梦想的实现提供了广阔舞台","个人梦想的实现是国家富强、民族振兴的基础","只有把个人理想融入国家和民族的事业中，才能最终成就一番事业","个人梦想与中国梦是完全对立的"],"answer":["A","B","C"],"explanation":{"reason":"中国梦为个人追求和发展创造更广阔的社会条件，A项说明国家发展对个人的作用；个人的劳动、创造和奋斗汇聚为民族复兴的力量，B项强调个人对国家发展的贡献；C项强调将个人理想融入国家民族事业，使个人奋斗具有社会价值。D项把个人梦想与中国梦说成完全对立，忽略两者相互促进的关系。个人理想各具特点，但能够同社会发展目标相联系。教材对应「个人梦想与中国梦的关系」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-08","type":"multiple","number":38,"originalNumber":"8","stem":"全面建成小康社会后，我国开启了全面建设社会主义现代化国家的新征程。根据“两步走”战略安排，到2035年的目标是（ ）。","options":["基本实现社会主义现代化","全面实现中华民族伟大复兴","进入创新型国家前列","基本实现新型工业化、信息化、城镇化、农业现代化"],"answer":["A","C","D"],"explanation":{"reason":"按照全面建设社会主义现代化国家的战略安排，到2035年基本实现社会主义现代化，A项正确；进入创新型国家前列是这一阶段的发展要求，C项正确；基本实现新型工业化、信息化、城镇化、农业现代化也是2035年的目标内容，D项正确。B项全面实现中华民族伟大复兴指向更长远的历史任务，不能直接等同于2035年基本实现社会主义现代化的阶段目标。教材对应「到2035年基本实现社会主义现代化的目标」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-09","type":"multiple","number":39,"originalNumber":"9","stem":"中国式现代化是全体人民共同富裕的现代化。实现共同富裕，需要（ ）。","options":["坚持按劳分配为主体、多种分配方式并存","在做大“蛋糕”的同时分好“蛋糕”","平均主义，同步富裕","着力解决地区差距、城乡差距、收入差距问题"],"answer":["A","B","D"],"explanation":{"reason":"扎实推进全体人民共同富裕需要完善按劳分配为主体、多种分配方式并存的分配制度，A项正确；既通过高质量发展做大经济总量，又合理分配成果，B项正确；着力缩小地区、城乡和收入差距，使成果更加公平惠及人民，D项正确。C项平均主义和同步富裕忽视发展条件、劳动贡献及共同富裕的长期过程，把共同富裕误解为同一时点达到相同收入水平。教材对应「扎实推进全体人民共同富裕」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-10","type":"multiple","number":40,"originalNumber":"10","stem":"推进中国式现代化需要正确处理一系列重大关系，其中包括（ ）。","options":["顶层设计与实践探索的关系","战略与策略的关系","守正与创新的关系","效率与公平的关系"],"answer":["A","B","C","D"],"explanation":{"reason":"推进中国式现代化要正确处理一系列重大关系。A项顶层设计与实践探索要求战略谋划与基层创新相结合；B项战略与策略要求战略定力与策略灵活性相统一；C项守正与创新要求坚持根本方向并推进改革创新；D项效率与公平要求做大做好发展成果并让其合理共享。四项均属于明确提出的重大关系，同时还包括活力与秩序、自立自强与对外开放两组关系。教材对应「推进中国式现代化需要处理的重大关系」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-11","type":"multiple","number":41,"originalNumber":"11","stem":"中国式现代化创造了人类文明新形态。这一新形态体现在（ ）。","options":["物质文明、政治文明、精神文明、社会文明、生态文明协调发展","打破了“现代化=西方化”的迷思","为发展中国家实现现代化提供了全新选择","是放之四海而皆准的现代化标准模式"],"answer":["A","B","C"],"explanation":{"reason":"中国式现代化推动物质文明、政治文明、精神文明、社会文明、生态文明协调发展，A项体现文明形态的综合性；B项指出中国实践打破把现代化等同于西方化的单一路径认识；C项强调这种实践为其他发展中国家探索适合自身国情的道路提供新选择。D项把中国道路当作所有国家必须照搬的唯一标准，否认各国历史文化和发展条件的差异，与现代化道路多样性的认识不一致。教材对应「中国式现代化创造人类文明新形态」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-12","type":"multiple","number":42,"originalNumber":"12","stem":"青年学生要在中国式现代化建设中挺膺担当，需要做到（ ）。","options":["树立远大理想，将个人前途与国家命运紧密结合","练就过硬本领，掌握科学文化知识和专业技能","只关注个人学业，不关心国家大事","勇于创新创造，在科技攻关、乡村振兴等领域贡献力量"],"answer":["A","B","D"],"explanation":{"reason":"青年参与中国式现代化建设应树立远大理想，将自身发展同国家需要相联系，A项说明方向；掌握科学文化知识与专业技能、提高实践能力，B项说明能力基础；投身科技创新、乡村振兴等实践，D项说明担当的实现途径。C项只关注个人学业而完全不关心国家社会事务，把个人成长与社会责任割裂开来。学业积累是重要基础，但不能替代对社会需求的认识和行动。教材对应「青年在中国式现代化建设中的担当」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-13","type":"multiple","number":43,"originalNumber":"13","stem":"在推进中国式现代化的过程中，强调“敢于斗争、善于斗争”。这是因为（ ）。","options":["实现伟大梦想必然会遇到各种困难和挑战","发扬斗争精神是克服前进道路上风险考验的必然要求","斗争是目的，为了斗争而斗争","要在原则问题上寸步不让，在策略问题上灵活机动"],"answer":["A","B","D"],"explanation":{"reason":"推进中国式现代化会面对风险挑战和复杂矛盾，A项说明斗争的客观条件；敢于斗争、善于斗争有助于应对重大考验，B项说明精神和能力要求；D项强调在原则问题上坚定立场，在策略问题上灵活应对，符合斗争的原则性与策略性统一。C项为了斗争而斗争颠倒了目的与手段的关系，斗争的目的在于解决问题、维护正当利益并推动事业发展。教材对应「推进中国式现代化的斗争精神」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-14","type":"multiple","number":44,"originalNumber":"14","stem":"中国式现代化与西方现代化的本质区别在于（ ）。","options":["是否坚持中国共产党的领导","是否以人民为中心","是否实现全体人民共同富裕","是否以资本为中心"],"answer":["A","B","C","D"],"explanation":{"reason":"选ABCD。中国式现代化坚持中国共产党领导、以人民为中心、促进全体人民共同富裕；这与资本逻辑主导、少数人富裕的西方现代化形成区别。A项体现领导力量，B项体现价值立场，C项体现目标要求，D项指出资本中心与人民中心的差异，四项均切中题意。教材对应「中国式现代化与西方现代化的区别」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-15","type":"multiple","number":45,"originalNumber":"15","stem":"从“小康社会”到“中国式现代化”，中国共产党带领人民不断探索发展道路。这一历程深刻体现了（ ）。","options":["马克思主义基本原理同中国具体实际相结合","中国特色社会主义道路的连续性和阶段性统一","发展目标从解决温饱到追求全面高质量发展的跃升","对社会主义建设规律认识的不断深化"],"answer":["A","B","C","D"],"explanation":{"reason":"从小康建设走向中国式现代化，是党把马克思主义基本原理同中国具体实际结合、不断完善发展战略的过程，A项正确；不同阶段的目标相互衔接又逐步提升，体现连续性和阶段性统一，B项正确；从解决温饱到追求高质量发展与人的全面发展，C项说明目标层次提升；党在长期实践中深化对社会主义建设规律的认识，D项说明理论发展。四项分别从理论方法、道路进程、目标变化和规律认识概括这一历程。教材对应「中国式现代化道路的探索发展」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-16","type":"multiple","number":46,"originalNumber":"16","stem":"在推进中国式现代化进程中，必须坚持“绿水青山就是金山银山”的理念。这要求我们（ ）。","options":["坚定不移走生产发展、生活富裕、生态良好的文明发展道路","把生态效益放在首位，可以暂时牺牲经济效益","加快发展方式绿色转型，推动产业结构优化升级","坚持山水林田湖草沙一体化保护和系统治理"],"answer":["A","C","D"],"explanation":{"reason":"坚持绿水青山就是金山银山，要求走生产发展、生活富裕、生态良好的文明发展道路，A项正确；C项通过产业结构调整和绿色转型推动经济发展方式变革；D项把山水林田湖草沙作为相互联系的系统开展综合治理，体现生态保护的整体性。B项把生态效益与经济效益简单对立，主张可以普遍以牺牲经济效益解决问题，忽视绿色发展所追求的生态、经济和社会效益协同。教材对应「绿水青山就是金山银山与绿色转型」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-17","type":"multiple","number":47,"originalNumber":"17","stem":"中国式现代化强调“物质富足、精神富有”。这意味着（ ）。","options":["物质文明和精神文明要两手抓，两手都要硬","在满足人民物质需求的同时，要丰富人民精神世界","要弘扬中华优秀传统文化，培育和践行社会主义核心价值观","物质文明发展起来后，精神文明自然会提升"],"answer":["A","B","C"],"explanation":{"reason":"物质富足与精神富有共同构成社会主义现代化的重要要求。A项强调物质文明和精神文明同时重视、相互促进；B项强调改善物质生活的同时丰富人民的精神文化生活；C项通过弘扬中华优秀传统文化和践行社会主义核心价值观推进精神文明建设。D项认为物质文明发展后精神文明会自动提升，忽略文化教育、价值培育和公共文化服务等需要持续建设的领域。教材对应「物质文明和精神文明相协调」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-18","type":"multiple","number":48,"originalNumber":"18","stem":"分析“中国式现代化是走和平发展道路的现代化”与“构建人类命运共同体”之间的内在联系，以下理解正确的有（ ）。","options":["和平发展是构建人类命运共同体的实践路径","构建人类命运共同体是和平发展道路的目标指向","两者都体现了中国对全球治理体系变革的责任担当","两者都否定了国家间的竞争和冲突"],"answer":["A","B","C"],"explanation":{"reason":"和平发展通过平等交往、开放合作为构建人类命运共同体创造条件，A项说明实践路径；构建人类命运共同体体现和平发展的共同利益与长远方向，B项说明目标指向；两者都重视多边合作和全球治理，C项说明共同的责任担当。D项认为两者否定国家间竞争和冲突的客观存在，混淆倡导和平解决分歧、开展良性竞争与声称现实矛盾已不存在的区别。教材对应「和平发展道路与人类命运共同体」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-19","type":"multiple","number":49,"originalNumber":"19","stem":"如何理解“中国式现代化创造了人类文明新形态”？以下分析正确的有（ ）。","options":["它打破了西方现代化模式的唯一性，证明了现代化道路的多样性","它坚持人民至上，超越了西方以资本为中心的发展逻辑","它坚持人与自然和谐共生，超越了西方先污染后治理的老路","它坚持和平发展，超越了西方通过殖民扩张实现现代化的旧路"],"answer":["A","B","C","D"],"explanation":{"reason":"中国式现代化创造的人类文明新形态展现了区别于传统资本主导现代化道路的多方面特点。A项从实践上证明现代化道路具有多样性；B项强调以人民为中心、促进共同富裕的价值取向；C项强调生态保护与经济社会发展相协调；D项强调以和平合作而非殖民掠夺推进发展。四项从道路选择、发展目的、生态理念和对外关系说明其创新意义，讨论的是发展模式差异，并非否认其他国家也可能有积极实践。教材对应「中国式现代化创造人类文明新形态」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"},{"id":"xx-ch2-multi-20","type":"multiple","number":50,"originalNumber":"20","stem":"结合“两步走”战略安排，分析当前青年一代在实现第二个百年奋斗目标中的作用。以下表述准确的有（ ）。","options":["青年一代的人生黄金期与实现第二个百年奋斗目标的历史进程高度契合","青年是全面建成社会主义现代化强国的见证者、参与者和贡献者","青年只需专注于个人发展，国家发展是成年人的事","青年要勇担时代重任，将青春奋斗融入党和人民的事业"],"answer":["A","B","D"],"explanation":{"reason":"全面建设社会主义现代化强国的新征程与当代青年的成长成才阶段紧密交织，A项说明时代机遇；B项指出青年既能见证现代化进程，也要通过具体劳动和创造参与建设；D项强调将自身奋斗融入党和人民的事业，以实际行动承担社会责任。C项把国家发展排除在青年责任之外，只强调个人发展，忽视个人前途与国家社会条件的相互联系。教材对应「青年与第二个百年奋斗目标」。"},"note":"","origin":"原网站习思想题库 · 第2章","topicId":"topic-2"}]},{"id":"topic-3","label":"专题3","chapter":3,"title":"坚持党的全面领导","kind":"main","source":"maogai.szhopc.cn · 习思想课程","questions":[{"id":"xx-ch3-single-01","type":"single","number":1,"originalNumber":"1","stem":"习近平党建思想形成的时代背景是（ ）","options":["改革开放初期","中国特色社会主义进入新时代","新中国成立初期","社会主义革命和建设时期"],"answer":["B"],"explanation":{"reason":"习近平党建思想立足中国特色社会主义进入新时代这一历史方位，回应长期执政的马克思主义政党建设面临的新形势新任务，故选B项。A项改革开放初期是党探索改革与自身建设的重要时期，但不是该思想形成的新时代背景；C项新中国成立初期主要涉及执政党建设的初步探索；D项社会主义革命和建设时期同样属于此前的历史阶段。不能把思想的历史传承同其形成时的时代方位混为一谈。教材对应「习近平党建思想的时代背景」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-02","type":"single","number":2,"originalNumber":"2","stem":"习近平党建思想的核心要义中，强调党的建设的根本原则是（ ）","options":["坚持和加强党的全面领导","坚持党要管党、全面从严治党","坚持以人民为中心","坚持思想建党、理论强党"],"answer":["A"],"explanation":{"reason":"坚持和加强党的全面领导明确党的建设必须维护和巩固党的领导地位，是新时代党的建设总要求中的根本原则，对应A项。B项党要管党、全面从严治党侧重管党治党的指导方针；C项坚持以人民为中心体现党的根本立场和宗旨要求；D项思想建党、理论强党强调理论武装和思想建设的重要路径。后三项各有正确内涵，但与题目指定的“根本原则”层级不同。教材对应「新时代党的建设的根本原则」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-03","type":"single","number":3,"originalNumber":"3","stem":"习近平党建思想中，新时代党的建设的总要求是（ ）","options":["全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中","以党的政治建设为统领，以坚定理想信念宗旨为根基","不断提高党的建设质量","以上都是"],"answer":["D"],"explanation":{"reason":"新时代党的建设总要求涵盖各方面建设及其相互关系，D项“以上都是”可以统摄前三项。A项列出政治、思想、组织、作风、纪律五方面建设及贯穿其中的制度建设，属于总体布局；B项指出以政治建设为统领、以坚定理想信念宗旨为根基，属于建设方向和根基；C项不断提高党的建设质量，是总要求明确提出的任务。三项分别概括不同组成部分，并非互相排斥。教材对应「新时代党的建设总要求」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-04","type":"single","number":4,"originalNumber":"4","stem":"习近平指出，党的政治建设是党的根本性建设，决定党的建设方向和效果。这体现了（ ）","options":["政治建设在党的建设中的统领地位","思想建设的基础性作用","组织建设的保障作用","纪律建设的约束作用"],"answer":["A"],"explanation":{"reason":"党的政治建设是根本性建设，决定党的建设方向和效果，因此A项所说的统领地位直接对应题干。B项思想建设具有基础性作用，重在坚定理想信念和理论武装；C项组织建设为党的路线方针政策落实提供组织保证；D项纪律建设通过纪律约束和监督维护党的团结统一。三者都是党的建设的重要方面，但不能代替政治建设对整体方向的统领作用。教材对应「党的政治建设的统领地位」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-05","type":"single","number":5,"originalNumber":"5","stem":"习近平党建思想的理论渊源不包括（ ）","options":["马克思列宁主义建党学说","毛泽东思想建党理论","西方政党制度理论","中华优秀传统文化中的治国理政智慧"],"answer":["C"],"explanation":{"reason":"习近平党建思想以马克思主义政党建设理论及中国共产党长期党建实践经验为重要理论基础，也吸收中华优秀传统文化的有益智慧，因此“不包括”的是C项。A项马克思列宁主义建党学说提供基本理论根基；B项毛泽东思想中的建党理论是中国化马克思主义党建思想的重要来源；D项传统文化中的修身治国、选贤任能等智慧能够提供思想资源。C项西方政党制度理论不能与这些直接理论渊源并列。教材对应「习近平党建思想的理论渊源」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-06","type":"single","number":6,"originalNumber":"6","stem":"习近平强调，全面从严治党首先要从（ ）上看。","options":["思想","政治","组织","作风"],"answer":["B"],"explanation":{"reason":"全面从严治党首先要从政治上看，要求把党的政治方向、政治原则和党中央集中统一领导摆在突出位置，故选B项。A项思想层面着重理论武装与理想信念；C项组织层面涉及组织体系和干部队伍建设；D项作风层面着重密切联系群众和纠治不正之风。后三项都必须从严推进，但题干强调的是观察和把握全面从严治党的首要政治要求。教材对应「全面从严治党的政治要求」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-07","type":"single","number":7,"originalNumber":"7","stem":"习近平党建思想中，“不忘初心、牢记使命”主题教育活动的根本任务是（ ）","options":["深入学习贯彻习近平新时代中国特色社会主义思想","锤炼忠诚干净担当的政治品格","团结带领全国各族人民为实现伟大梦想共同奋斗","以上都是"],"answer":["D"],"explanation":{"reason":"“不忘初心、牢记使命”主题教育的根本任务包括深入学习贯彻党的创新理论、锤炼忠诚干净担当的政治品格，以及团结带领人民为实现伟大梦想奋斗，因此D项“以上都是”成立。A项强调理论学习的根本内容；B项强调党员干部政治品格的锻炼；C项强调把学习教育转化为履行使命的行动方向。三者共同构成主题教育根本任务，不能把其中某一环节当成全部。教材对应「不忘初心牢记使命主题教育的根本任务」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-08","type":"single","number":8,"originalNumber":"8","stem":"习近平指出，党的（ ）是党的基础性建设，是保持党的先进性和纯洁性的根本性工程。","options":["政治建设","思想建设","组织建设","作风建设"],"answer":["B"],"explanation":{"reason":"党的思想建设是党的基础性建设，重在用科学理论武装全党、坚定理想信念，因此应选B项。A项政治建设是根本性建设，决定党的建设方向和效果；C项组织建设通过严密组织体系和建设干部队伍提供组织保证；D项作风建设重点保持党同人民群众的血肉联系、纠治不正之风。四个方面相互联系，但“基础性建设”这一明确定位对应的是思想建设。教材对应「党的思想建设的基础性地位」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-09","type":"single","number":9,"originalNumber":"9","stem":"习近平强调，作风建设永远在路上。党的作风建设的核心问题是（ ）","options":["保持党同人民群众的血肉联系","反对形式主义、官僚主义","坚持艰苦奋斗","严格执行中央八项规定"],"answer":["A"],"explanation":{"reason":"党的作风建设的核心问题是保持党同人民群众的血肉联系，体现党的根本宗旨与执政基础，故选A项。B项反对形式主义、官僚主义是解决作风突出问题的重要举措；C项艰苦奋斗体现党的优良传统和工作作风；D项落实中央八项规定精神是改进作风的制度化实践。后三项都服务于密切党群关系，但属于具体要求、传统或抓手，不是对“核心问题”的完整概括。教材对应「党的作风建设的核心问题」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-10","type":"single","number":10,"originalNumber":"10","stem":"习近平党建思想中，党的纪律建设的首要纪律是（ ）","options":["廉洁纪律","组织纪律","政治纪律","群众纪律"],"answer":["C"],"explanation":{"reason":"政治纪律关系党的政治方向、立场和党中央集中统一领导，是党的纪律中最根本、最重要的纪律，因此首要纪律为C项。A项廉洁纪律规范党员干部廉洁用权、廉洁自律；B项组织纪律保障组织原则和组织决定得到遵守；D项群众纪律约束损害群众利益和脱离群众的行为。后三类纪律各有规范对象，但严明政治纪律在党的纪律建设中居于首要位置。教材对应「党的政治纪律的首要地位」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-11","type":"single","number":11,"originalNumber":"11","stem":"习近平指出，要把（ ）作为党的建设的永恒课题和全体党员、干部的终身课题。","options":["不忘初心、牢记使命","全面从严治党","党的政治建设","党的思想建设"],"answer":["A"],"explanation":{"reason":"不忘初心、牢记使命被明确要求作为加强党的建设的永恒课题和全体党员、干部的终身课题，对应A项，强调始终坚守党的初心使命。B项全面从严治党是推进党的自我革命的重要要求，必须长期坚持；C项政治建设决定党的建设方向和效果；D项思想建设承担理论武装与理想信念教育任务。后三项同样需要持续推进，但题干引述的“永恒课题、终身课题”特指不忘初心、牢记使命。教材对应「不忘初心牢记使命的长期要求」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-12","type":"single","number":12,"originalNumber":"12","stem":"习近平党建思想中，新时代党的建设总目标是把党建设成为（ ）","options":["始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党","世界第一大政党","社会主义现代化强国","中国特色社会主义事业的领导核心"],"answer":["A"],"explanation":{"reason":"新时代党的建设总目标，是把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党，故选A项。B项世界第一大政党是规模描述，不是党的建设总目标；C项社会主义现代化强国是国家建设的奋斗目标，不是对执政党自身建设形态的定义；D项中国特色社会主义事业的领导核心说明党的领导地位，但未完整概括总目标的要求。教材对应「新时代党的建设总目标」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-13","type":"single","number":13,"originalNumber":"13","stem":"习近平强调，党的（ ）是党的根本性建设，决定党的建设方向和效果。","options":["政治建设","组织建设","作风建设","纪律建设"],"answer":["A"],"explanation":{"reason":"党的政治建设被定位为党的根本性建设，决定党的建设方向和效果，A项与题干直接对应。B项组织建设重点在健全组织体系、建设干部和人才队伍；C项作风建设着眼党群关系和纠治不正之风；D项纪律建设通过严明纪律维护党的团结统一。B、C、D项均有重要作用，但它们的具体职能不同于政治建设对整个党的建设的根本性和统领性作用。教材对应「党的政治建设的根本性地位」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-14","type":"single","number":14,"originalNumber":"14","stem":"习近平指出，全面从严治党，关键是要抓住（ ）这个“关键少数”。","options":["领导干部","党员","基层干部","青年党员"],"answer":["A"],"explanation":{"reason":"全面从严治党要抓住领导干部这个“关键少数”，因为其掌握重要职责和权力，带头履责、接受监督具有示范和带动作用，故选A项。B项普通党员同样属于全面从严治党的对象，但不等同于专门所指的关键少数；C项基层干部是干部队伍的一部分，范围比领导干部这一要求所针对的群体更窄；D项青年党员体现党员群体的年龄特征，并非“关键少数”的界定标准。教材对应「全面从严治党与关键少数」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-15","type":"single","number":15,"originalNumber":"15","stem":"（ ）是党的根本大法，是全面从严治党的总依据和总遵循。","options":["党章","宪法","党内法规","党的纪律"],"answer":["A"],"explanation":{"reason":"党章是党的总章程，也是党内法规体系中具有根本地位的行为规范，通常称为党的根本大法，故选A项。B项宪法是国家根本法，不能同党内根本规范混同；C项党内法规包括准则、条例、规定等多种制度，其制定实施必须以党章为根本依据，不能整体等同于党章；D项党的纪律规定党员和党组织必须遵守的行为边界，是党内规范体系的重要组成部分，但不是这一根本大法本身。教材对应「党章的地位和作用」。"},"note":"原网站“党的党章是党长期执政的根本大法”表述不规范，已按党章地位修订题干。","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-16","type":"single","number":16,"originalNumber":"16","stem":"习近平强调，要把（ ）作为党的思想建设的首要任务。","options":["坚定理想信念","学习马克思主义理论","践行社会主义核心价值观","弘扬爱国主义精神"],"answer":["A"],"explanation":{"reason":"坚定理想信念是党的思想建设的首要任务，为党员干部提供精神支柱和政治灵魂，所以选A项。B项学习马克思主义理论是坚定信念、加强理论武装的重要途径，但不等于首要任务的完整表述；C项践行社会主义核心价值观是价值培育与社会道德建设的重要内容；D项弘扬爱国主义精神是思想教育的重要方面。后三项均可服务思想建设，但不能取代理想信念这一核心要求。教材对应「党的思想建设的首要任务」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-17","type":"single","number":17,"originalNumber":"17","stem":"习近平党建思想中，党的（ ）是党最根本、最重要的纪律。","options":["政治纪律","组织纪律","廉洁纪律","工作纪律"],"answer":["A"],"explanation":{"reason":"政治纪律是党最根本、最重要的纪律，遵守政治纪律是遵守党的全部纪律的基础，因此选A项。B项组织纪律着重执行民主集中制、组织决定和请示报告等组织规范；C项廉洁纪律着重防止以权谋私等问题；D项工作纪律涉及履职尽责和工作秩序。后三种纪律分别规范组织活动、廉洁用权和岗位行为，均需严格执行，但政治纪律具有统领性的首要地位。教材对应「党的政治纪律与其他纪律」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-18","type":"single","number":18,"originalNumber":"18","stem":"习近平党建思想强调，要持之以恒正风肃纪，重点强化（ ）","options":["政治纪律和组织纪律","廉洁纪律和群众纪律","工作纪律和生活纪律","以上都是"],"answer":["A"],"explanation":{"reason":"持之以恒正风肃纪要求重点强化政治纪律和组织纪律，以此带动其他纪律严起来，所以选A项。B项廉洁纪律和群众纪律分别约束廉洁用权、损害群众利益等行为，是被带动强化的内容；C项工作纪律和生活纪律分别约束履职行为及日常生活作风，也需要严肃执行；D项“以上都是”把重点对象与其他应严格执行的纪律混作同一层级。题干问的是“重点强化”，不是哪些纪律需要遵守。教材对应「正风肃纪与纪律建设重点」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-single-19","type":"single","number":19,"originalNumber":"19","stem":"新时代党的组织路线对高素质干部队伍提出的三个品格要求是（ ）。","options":["忠诚干净担当","德才兼备","以德为先","以上都是"],"answer":["A"],"explanation":{"reason":"新时代党的组织路线明确提出着力培养忠诚干净担当的高素质干部队伍，A项是这一培养目标的完整表述。B项德才兼备、C项以德为先属于选人用人的原则和标准，同在组织路线中，但不是“着力培养……的高素质干部”所要求填入的固定表述；D项“以上都是”混合了培养目标与选拔任用原则，不能完整替换该词组。应区分干部队伍建设目标和干部选用标准的不同位置。教材对应「新时代党的组织路线与干部队伍建设」。"},"note":"明确考查“忠诚干净担当”三项品格；“德才兼备、以德为先”是选人用人的相关标准。","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-01","type":"multiple","number":20,"originalNumber":"1","stem":"习近平党建思想产生的时代背景包括（ ）","options":["世界百年未有之大变局加速演进","中国特色社会主义进入新时代","党面临的“四大考验”“四种危险”长期存在","中华民族伟大复兴进入关键时期"],"answer":["A","B","C","D"],"explanation":{"reason":"习近平党建思想形成于深刻变化的世情、国情、党情之中。A项世界百年未有之大变局加速演进，说明外部环境更加复杂；B项中国特色社会主义进入新时代，明确思想形成的国内历史方位；C项长期存在的“四大考验”“四种危险”，体现党的自身建设面临的风险；D项民族复兴进入关键时期，提出增强党的领导力和执政能力的新要求。四项分别从国际形势、发展阶段、党内挑战和历史任务构成时代背景。教材对应「习近平党建思想的时代背景」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-02","type":"multiple","number":21,"originalNumber":"2","stem":"习近平党建思想的理论渊源包括（ ）","options":["马克思列宁主义建党学说","毛泽东思想建党理论","中国特色社会主义理论体系中的党建思想","中华优秀传统文化中的治国理政智慧"],"answer":["A","B","C","D"],"explanation":{"reason":"习近平党建思想继承和发展马克思主义政党建设理论，也立足中国共产党长期实践并汲取中华优秀传统文化智慧。A项马克思列宁主义建党学说提供基本理论基础；B项毛泽东思想建党理论是马克思主义党建理论中国化的重要成果；C项中国特色社会主义理论体系中的党建思想体现改革开放以来的理论积累；D项传统文化中的修身、为政、选贤任能等思想提供可转化的文化资源。四项具有不同历史层次，均可归入题干所问的理论渊源。教材对应「习近平党建思想的理论来源」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-03","type":"multiple","number":22,"originalNumber":"3","stem":"新时代党的建设总要求中，党的建设的总体布局包括（ ）","options":["政治建设","思想建设、组织建设、作风建设、纪律建设","把制度建设贯穿其中","深入推进反腐败斗争"],"answer":["A","B","C","D"],"explanation":{"reason":"新时代党的建设总体布局要求全面推进政治建设、思想建设、组织建设、作风建设、纪律建设，A项列出政治建设，B项列出其余四项；C项把制度建设贯穿其中，说明制度规范必须覆盖党的各方面建设；D项深入推进反腐败斗争，是这一布局明确包含的重要任务。A、B两项构成五个建设领域，C项体现制度保障，D项体现反腐败斗争的持续推进，四者共同构成题干所指的总体布局。教材对应「新时代党的建设总体布局」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-04","type":"multiple","number":23,"originalNumber":"4","stem":"习近平党建思想中，党的政治建设的基本内容包括（ ）","options":["坚持和加强党的全面领导","保证全党服从中央，维护党中央权威和集中统一领导","严肃党内政治生活","发展积极健康的党内政治文化"],"answer":["A","B","C","D"],"explanation":{"reason":"党的政治建设要确保正确政治方向、维护党中央权威，并形成严肃健康的党内政治生态。A项坚持和加强党的全面领导，明确政治领导方向；B项保证全党服从中央、维护党中央权威和集中统一领导，是政治建设的首要任务；C项严肃党内政治生活，有利于落实政治原则、严明政治规矩；D项发展积极健康的党内政治文化，有助于涵养风清气正的政治生态。四项分别涉及领导要求、核心任务、政治生活与政治文化，均属政治建设内容。教材对应「党的政治建设的基本内容」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-05","type":"multiple","number":24,"originalNumber":"5","stem":"习近平强调，全面从严治党要（ ）","options":["真管真严","敢管敢严","长管长严","时管时严"],"answer":["A","B","C"],"explanation":{"reason":"全面从严治党必须把严的要求长期落实到管党治党的各方面，强调真管真严、敢管敢严、长管长严。A项要求动真格、落实责任，而不是口头从严；B项要求面对问题敢抓敢管、不回避矛盾；C项要求常抓不懈，建立长期有效的监督管理机制。D项“时管时严”意味着只在特定时段加强管理，容易出现时紧时松，与全面从严治党的常态化要求相背离。教材对应「全面从严治党的严字当头要求」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-06","type":"multiple","number":25,"originalNumber":"6","stem":"新时代党的组织路线强调的重点内容包括（ ）","options":["以组织体系建设为重点","着力培养忠诚干净担当的高素质干部队伍","着力集聚爱国奉献的各方面优秀人才","坚持德才兼备、以德为先、任人唯贤"],"answer":["A","B","C","D"],"explanation":{"reason":"新时代党的组织路线把组织体系、干部、人才和选人用人原则贯通起来。A项以组织体系建设为重点，强调形成上下贯通、执行有力的组织网络；B项培养忠诚干净担当的高素质干部，明确干部队伍建设目标；C项集聚爱国奉献的各方面优秀人才，体现人才队伍建设要求；D项德才兼备、以德为先、任人唯贤，是干部选拔任用的原则。四项分别回答组织怎样建、干部怎样育、人才怎样聚以及选人遵循什么标准。教材对应「新时代党的组织路线」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-07","type":"multiple","number":26,"originalNumber":"7","stem":"习近平党建思想中，党的作风建设的主要内容包括（ ）","options":["保持党同人民群众的血肉联系","坚决反对形式主义、官僚主义、享乐主义和奢靡之风","严格执行中央八项规定精神","弘扬艰苦奋斗、勤俭节约的优良作风"],"answer":["A","B","C","D"],"explanation":{"reason":"党的作风建设要保持党同人民群众的血肉联系，并通过具体措施纠治不正之风。A项密切党群关系是作风建设的核心问题；B项反对形式主义、官僚主义、享乐主义和奢靡之风，针对突出的“四风”问题；C项严格落实中央八项规定精神，以具体制度要求促进作风改进；D项弘扬艰苦奋斗、勤俭节约的优良作风，体现长期坚持的价值取向。四项分别涉及核心目标、整治对象、制度抓手和优良传统。教材对应「党的作风建设」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-08","type":"multiple","number":27,"originalNumber":"8","stem":"习近平党建思想中，推进反腐败斗争的基本要求包括（ ）","options":["坚持无禁区、全覆盖、零容忍","坚持重遏制、强高压、长震慑","一体推进不敢腐、不能腐、不想腐","深化标本兼治，加强反腐败国际合作"],"answer":["A","B","C","D"],"explanation":{"reason":"推进反腐败斗争必须保持惩治腐败的高压态势，并从制度和思想上深化治理。A项无禁区、全覆盖、零容忍，明确惩治腐败的范围和态度；B项重遏制、强高压、长震慑，强调惩治和警示力度；C项一体推进不敢腐、不能腐、不想腐，分别从震慑、制度和思想教育协同发力；D项深化标本兼治、加强反腐败国际合作，涉及治理根源与跨境协作。四项从惩治原则、执行力度、治理机制和合作路径说明反腐败要求。教材对应「反腐败斗争的基本要求」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-09","type":"multiple","number":28,"originalNumber":"9","stem":"习近平党建思想中，坚持和加强党的全面领导的具体体现包括（ ）","options":["党对一切工作的领导","完善坚持党的领导的体制机制","提高党科学执政、民主执政、依法执政水平","确保党始终总揽全局、协调各方"],"answer":["A","B","C","D"],"explanation":{"reason":"坚持和加强党的全面领导，既要求领导覆盖各领域，也要求完善制度机制和执政方式。A项党对一切工作的领导，体现领导范围的全面性；B项完善坚持党的领导的体制机制，为领导落实提供制度保障；C项提高科学执政、民主执政、依法执政水平，强调执政方式和能力；D项确保党始终总揽全局、协调各方，概括领导核心的统筹作用。四项分别从领导范围、制度安排、履职方式与全局协调说明全面领导的具体体现。教材对应「坚持和加强党的全面领导」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-10","type":"multiple","number":29,"originalNumber":"10","stem":"习近平党建思想强调，全党要增强“四个意识”，具体包括（ ）","options":["政治意识","大局意识","核心意识","看齐意识"],"answer":["A","B","C","D"],"explanation":{"reason":"“四个意识”指政治意识、大局意识、核心意识、看齐意识，四项均属规范表述。A项政治意识要求把握政治方向和政治原则；B项大局意识要求从党和国家事业全局认识、处理问题；C项核心意识强调维护党中央权威和集中统一领导；D项看齐意识强调在思想上政治上行动上同党中央保持高度一致。四种意识相互联系，不能用其中一项代替其他三项。教材对应「四个意识的基本内涵」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-11","type":"multiple","number":30,"originalNumber":"11","stem":"习近平党建思想强调，要建设（ ）的马克思主义执政党。","options":["始终走在时代前列","人民衷心拥护","勇于自我革命","经得起各种风浪考验、朝气蓬勃"],"answer":["A","B","C","D"],"explanation":{"reason":"新时代党的建设总目标规定了马克思主义执政党应具备的完整特征。A项始终走在时代前列，体现理论与实践创新的要求；B项人民衷心拥护，体现执政基础和人民立场；C项勇于自我革命，体现保持先进性和纯洁性的内在动力；D项经得起各种风浪考验、朝气蓬勃，体现抵御风险和持续发展能力。四项共同构成党的建设总目标的规范内容，缺少其中任何一项都不能完整表达该目标。教材对应「新时代党的建设总目标」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-12","type":"multiple","number":31,"originalNumber":"12","stem":"习近平党建思想中，党内政治生活的基本规范包括（ ）","options":["实事求是","理论联系实际","密切联系群众","批评和自我批评、民主集中制"],"answer":["A","B","C","D"],"explanation":{"reason":"严肃党内政治生活需要长期坚持已经形成的基本规范。A项实事求是要求从实际出发认识和解决问题；B项理论联系实际要求把理论学习和实践结合；C项密切联系群众要求坚持党的群众路线、接受群众监督；D项批评和自我批评有助于纠正问题，民主集中制规范党内议事决策与组织运行。四项均属于党内政治生活的主要规范内容，此外还包括严明党的纪律等要求。教材对应「党内政治生活的基本规范」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-13","type":"multiple","number":32,"originalNumber":"13","stem":"习近平党建思想中，新时代党的组织体系建设的要求包括（ ）","options":["党中央是大脑和中枢","党的地方组织是中间环节","党的基层组织是战斗堡垒","确保党的组织体系严密高效"],"answer":["A","B","C","D"],"explanation":{"reason":"严密党的组织体系要形成中央、地方、基层组织上下贯通、执行有力的结构。A项党中央作为大脑和中枢，在全党发挥集中统一领导作用；B项党的地方组织作为中间环节，承担贯彻决策部署、联系上下的职责；C项党的基层组织作为战斗堡垒，负责把党的工作落实到基层；D项严密高效概括对整个组织体系的运行要求。四项分别说明中央、地方、基层的定位以及整体运行目标，均符合题干范围。教材对应「新时代党的组织体系建设」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-14","type":"multiple","number":33,"originalNumber":"14","stem":"习近平党建思想强调，要培养（ ）的高素质干部队伍。","options":["忠诚","干净","担当","创新"],"answer":["A","B","C"],"explanation":{"reason":"培养高素质干部队伍，明确要求干部做到忠诚、干净、担当，所以A、B、C三项均应选。A项忠诚强调坚定政治立场、忠于党和人民；B项干净强调廉洁自律、正确行使权力；C项担当强调履职尽责、敢于负责作为。D项创新是干部适应新任务、改进工作的积极能力要求，但不属于题目所问“忠诚干净担当”这一固定的三方面表述，不能因为它本身有积极意义就列入答案。教材对应「高素质干部队伍的基本要求」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"},{"id":"xx-ch3-multi-15","type":"multiple","number":34,"originalNumber":"15","stem":"习近平党建思想中，党的群众路线的基本内容包括（ ）","options":["一切为了群众","一切依靠群众","从群众中来","到群众中去"],"answer":["A","B","C","D"],"explanation":{"reason":"党的群众路线完整表述为一切为了群众、一切依靠群众，从群众中来、到群众中去。A项一切为了群众，说明党的工作的根本目的；B项一切依靠群众，明确人民群众在实践中的主体作用；C项从群众中来，强调听取群众意见、集中群众智慧；D项到群众中去，强调把形成的正确意见贯彻到群众实践并接受检验。四项分别涉及工作目的、依靠力量与领导方法的两个环节，共同构成群众路线。教材对应「党的群众路线的基本内容」。"},"note":"","origin":"原网站习思想题库 · 第3章","topicId":"topic-3"}]},{"id":"topic-4","label":"专题4","chapter":4,"title":"坚持以人民为中心","kind":"main","source":"maogai.szhopc.cn · 习思想课程","questions":[{"id":"xx-ch4-single-01","type":"single","number":1,"originalNumber":"1","stem":"人民是历史的创造者，是决定党和国家前途命运的（ ）。","options":["根本力量","重要力量","领导力量","辅助力量"],"answer":["A"],"explanation":{"reason":"人民群众创造物质财富和精神财富，是推动历史发展的主体力量，因此人民是决定党和国家前途命运的根本力量，选A项。B项“重要力量”虽然肯定人民的作用，却弱化了“根本”这一决定性定位；C项“领导力量”属于组织领导层面的描述，不能替代人民的历史主体地位；D项“辅助力量”更与人民创造历史的观点相背离。教材对应「人民是历史的创造者」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-02","type":"single","number":2,"originalNumber":"2","stem":"中国共产党的根本政治立场是（ ）。","options":["阶级立场","人民立场","国家立场","民族立场"],"answer":["B"],"explanation":{"reason":"人民立场是中国共产党的根本政治立场，体现党来自人民、依靠人民、服务人民的政治本色，故选B项。A项阶级立场是分析阶级关系的理论视角，不能取代这里的规范表述；C项国家立场强调国家利益和主权，但并非题干所问的党的根本政治立场；D项民族立场涉及民族利益与共同体认同，也不能替代人民立场。教材对应「人民立场是党的根本政治立场」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-03","type":"single","number":3,"originalNumber":"3","stem":"“以人民为中心”的发展思想，其核心是（ ）。","options":["经济发展","社会和谐","人民利益","生态保护"],"answer":["C"],"explanation":{"reason":"以人民为中心的发展思想坚持把人民利益摆在重要位置，以人民的需要和福祉作为发展的根本价值取向，故选C项。A项经济发展是增进人民福祉的重要物质基础，不是这一思想的价值核心；B项社会和谐是发展的重要目标和社会条件；D项生态保护关系人民的环境权益与长远利益。后三项各有积极作用，但都应服从和服务于人民利益这一根本取向。教材对应「以人民为中心的发展思想」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-04","type":"single","number":4,"originalNumber":"4","stem":"检验一个政党、一个政权性质的试金石是（ ）。","options":["经济发展速度","国际地位高低","为什么人服务","军队力量强弱"],"answer":["C"],"explanation":{"reason":"为什么人的问题关系政党和政权的根本立场，是检验其性质的试金石，所以选C项“为什么人服务”。A项经济发展速度可反映经济运行状况，却不能单独判定政权性质；B项国际地位高低体现对外影响力，与服务对象不同；D项军队力量强弱属于国防实力指标，也不能回答政治权力为谁服务。判断政党和政权性质必须看其根本宗旨及代表谁的利益。教材对应「政党和政权性质的人民标准」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-05","type":"single","number":5,"originalNumber":"5","stem":"坚持人民主体地位，必须坚持（ ）这一根本政治制度。","options":["中国共产党领导的多党合作和政治协商制度","民族区域自治制度","人民代表大会制度","基层群众自治制度"],"answer":["C"],"explanation":{"reason":"人民代表大会制度是我国的根本政治制度，是实现人民当家作主的重要制度载体，故选C项。A项中国共产党领导的多党合作和政治协商制度是基本政治制度，发挥协商与合作作用；B项民族区域自治制度是保障民族地区依法行使自治权的基本政治制度；D项基层群众自治制度是人民依法直接行使民主权利的重要基本政治制度。应区分根本政治制度与基本政治制度。教材对应「人民代表大会制度与人民当家作主」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-06","type":"single","number":6,"originalNumber":"6","stem":"党的一切工作必须以（ ）为最高标准。","options":["经济发展","社会稳定","最广大人民根本利益","国际影响力"],"answer":["C"],"explanation":{"reason":"党的一切工作必须以最广大人民根本利益为最高标准，判断工作成效要看是否实现好、维护好、发展好人民利益，故选C项。A项经济发展是改善民生的重要基础，不能以增长替代利益判断；B项社会稳定是人民安居乐业的重要条件，但不是最高标准的完整表述；D项国际影响力涉及国家对外地位，也应服务于人民和国家的根本利益。教材对应「最广大人民根本利益的最高标准」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-07","type":"single","number":7,"originalNumber":"7","stem":"群众路线是党的（ ）。","options":["根本工作路线","基本领导方法","根本组织原则","重要指导思想"],"answer":["A"],"explanation":{"reason":"群众路线是党的生命线和根本工作路线，要求一切为了群众、一切依靠群众，从群众中来、到群众中去，故选A项。B项“基本领导方法”只能部分说明群众路线的工作方法层面，未体现其根本工作路线地位；C项根本组织原则指民主集中制，不是群众路线；D项“重要指导思想”属于更宽泛的理论层次，不是题干所问的组织工作定位。教材对应「党的群众路线的地位」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-08","type":"single","number":8,"originalNumber":"8","stem":"“一切为了群众，一切依靠群众，从群众中来，到群众中去”是党的（ ）。","options":["思想路线","政治路线","组织路线","群众路线"],"answer":["D"],"explanation":{"reason":"“一切为了群众，一切依靠群众，从群众中来，到群众中去”完整表述党的群众路线，故选D项。A项思想路线强调解放思想、实事求是、与时俱进、求真务实，是认识和处理问题的思想方法；B项政治路线涉及党在一定历史阶段的政治任务和奋斗方向；C项组织路线侧重组织体系、干部和人才建设。题干既回答为了谁、依靠谁，也说明如何集中和贯彻群众意见。教材对应「党的群众路线的基本内容」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-09","type":"single","number":9,"originalNumber":"9","stem":"共同富裕是社会主义的（ ）。","options":["根本原则","本质要求","最终目标","重要特征"],"answer":["B"],"explanation":{"reason":"教材中的对应判断是“共同富裕是社会主义的本质要求，是中国式现代化的重要特征”。本题按这一规范搭配选B。共同富裕也与社会主义目标、原则相关，其他词语不能脱离题干语境一概否定。"},"note":"按2023版教材的对应表述作答。","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-10","type":"single","number":10,"originalNumber":"10","stem":"人民对（ ）的向往，就是我们的奋斗目标。","options":["美好生活","物质丰富","社会公平","政治民主"],"answer":["A"],"explanation":{"reason":"人民对美好生活的向往，就是中国共产党的奋斗目标，A项是这一重要论述的规范表述。B项物质丰富是美好生活的重要内容，但不能涵盖精神文化、公共服务和环境需求；C项社会公平是人民追求的重要价值，却只是美好生活的一个维度；D项政治民主关系人民当家作主，同样不能单独概括全部向往。应把美好生活理解为多方面需要的综合提升。教材对应「人民对美好生活的向往与党的奋斗目标」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-11","type":"single","number":11,"originalNumber":"11","stem":"发展为了人民，这是马克思主义政治经济学的（ ）。","options":["根本立场","研究方法","理论基石","政策导向"],"answer":["A"],"explanation":{"reason":"发展为了人民体现马克思主义政治经济学坚持人民立场的价值取向，强调经济发展以增进人民福祉为归宿，故选A项。B项研究方法指运用历史唯物主义等方法分析经济规律，回答怎样研究；C项理论基石涉及支撑理论体系的基本范畴和规律，不是这句话所强调的立场；D项政策导向是理论在实践中的运用层面，不能等同于根本立场。教材对应「马克思主义政治经济学的人民立场」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-12","type":"single","number":12,"originalNumber":"12","stem":"衡量发展成效的最终标准是（ ）。","options":["GDP增长速度","财政收入规模","人民生活改善程度","科技创新数量"],"answer":["C"],"explanation":{"reason":"衡量发展成效最终要看人民是否得到实惠、生活是否得到改善，故选C项人民生活改善程度。A项GDP增长速度反映经济总量增长快慢，但增长不必然等于民生改善；B项财政收入规模体现公共财力，必须转化为民生服务才有实际价值；D项科技创新数量反映创新活动的一部分，成果还需转化为人民可享有的福祉。教材对应「以人民生活改善衡量发展成效」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-13","type":"single","number":13,"originalNumber":"13","stem":"“以人民为中心”的发展思想，要求我们在发展中保障和改善民生，这体现了（ ）。","options":["发展的目的与动力的统一","发展的速度与效益的统一","发展的内需与外需的统一","发展的宏观与微观的统一"],"answer":["A"],"explanation":{"reason":"以人民为中心既要求发展成果用于保障和改善民生，又要求尊重人民的主体地位和创造作用，体现发展目的与动力的统一，因此选A项。B项速度与效益讨论经济增长的质量和效率；C项内需与外需涉及经济循环和市场需求结构；D项宏观与微观涉及经济分析和治理层次。后三组关系均有现实意义，但不能直接概括发展为了谁、依靠谁这一根本问题。教材对应「发展的目的与动力相统一」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-14","type":"single","number":14,"originalNumber":"14","stem":"精准扶贫中，先深入群众调查致贫原因，再将有针对性的帮扶措施落实到群众实践中。这主要体现群众路线的哪种工作方法（ ）？","options":["一切为了群众","一切依靠群众","从群众中来，到群众中去","以上都是"],"answer":["C"],"explanation":{"reason":"“从群众中来”是调查实际、集中群众经验；“到群众中去”是把形成的政策付诸群众实践并接受检验。题干突出调查—施策—实践的工作方法，对应C。"},"note":"原题笼统地只写“精准扶贫”，易与D混淆；已明确所考查的工作方法。","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-15","type":"single","number":15,"originalNumber":"15","stem":"“人民是阅卷人”这一表述，深刻揭示了（ ）。","options":["党与人民是领导与被领导的关系","人民是党和国家一切工作的最终评判者","人民是历史的创造者","党要接受人民的监督"],"answer":["B"],"explanation":{"reason":"“人民是阅卷人”强调党的工作答卷最终要由人民评判，故选B项人民是党和国家一切工作的最终评判者。A项领导与被领导关系只能描述组织关系的部分侧面，忽略人民监督评价作用；C项人民创造历史是这一判断的历史唯物主义基础，但并非“阅卷”比喻的直接含义；D项人民监督是人民评判的重要实现方式，含义较B项更窄。教材对应「人民评价党的工作成效」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-16","type":"single","number":16,"originalNumber":"16","stem":"坚持共享发展，首先要解决（ ）问题。","options":["公平正义","效率优先","经济增长","社会和谐"],"answer":["A"],"explanation":{"reason":"共享发展强调让发展成果更多更公平惠及全体人民，首先需要解决社会公平正义问题，故选A项。B项效率优先是特定分配讨论中的取向，不能代替共享发展的公平目标；C项经济增长能够扩大可分配的财富总量，却不自动保证共享；D项社会和谐是共享发展有助于实现的结果和条件，但题目所问的首要问题是公平正义。教材对应「共享发展与社会公平正义」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-17","type":"single","number":17,"originalNumber":"17","stem":"在新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和（ ）的发展之间的矛盾。","options":["不平衡不充分","不协调不可持续","低水平低质量","不全面不均衡"],"answer":["A"],"explanation":{"reason":"党的十九大报告指出，新时代我国社会主要矛盾转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，故选A项。B项“不协调不可持续”描述发展中可能出现的结构与持续性问题，不是主要矛盾的规范表述；C项“低水平低质量”概括部分发展质量问题，不能代替上述判断；D项“不全面不均衡”含义接近部分问题，却与报告的准确用语不同。教材对应「新时代我国社会主要矛盾」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-18","type":"single","number":18,"originalNumber":"18","stem":"坚持以人民为中心的发展思想，要求我们在处理发展问题时，首先要回答的问题是（ ）。","options":["如何实现经济快速增长","发展为了谁、依靠谁","如何提高国际竞争力","怎样实现技术自主创新"],"answer":["B"],"explanation":{"reason":"坚持以人民为中心首先要回答发展为了谁、发展依靠谁，以及发展成果由谁共享，因此B项直接对应发展工作的根本立场。A项经济快速增长涉及增长速度和效率，不能代替价值取向；C项提高国际竞争力关系国家发展能力与对外竞争环境；D项技术自主创新是提升发展动力的重要途径。后三者都是发展过程中可能需要解决的问题，但必须服从人民利益这一根本目的。教材对应「以人民为中心的发展根本问题」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-19","type":"single","number":19,"originalNumber":"19","stem":"“我将无我，不负人民”体现了中国共产党人（ ）。","options":["全心全意为人民服务的宗旨","艰苦奋斗的优良作风","实事求是的思想路线","批评与自我批评的品格"],"answer":["A"],"explanation":{"reason":"“我将无我，不负人民”体现把人民利益放在首位、无私奉献的精神境界，直接反映全心全意为人民服务的宗旨，故选A项。B项艰苦奋斗是党的优良作风，可成为服务人民的实践品质，但不是这句话的主要指向；C项实事求是是党的思想路线，强调从实际出发；D项批评与自我批评是党内政治生活和自我修养的重要方法。后三项不能替代为民宗旨。教材对应「全心全意为人民服务的根本宗旨」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-20","type":"single","number":20,"originalNumber":"20","stem":"保障和改善民生，必须坚持的基本原则是（ ）。","options":["效率优先、兼顾公平","尽力而为、量力而行","全面覆盖、平均分配","政府主导、市场辅助"],"answer":["B"],"explanation":{"reason":"保障和改善民生既要积极回应群众急难愁盼，也要立足发展阶段和财力条件，遵循尽力而为、量力而行原则，故选B项。A项“效率优先、兼顾公平”是较早的分配取向表述，不能概括新时代民生工作的完整原则；C项全面覆盖可能体现保障范围的追求，但“平均分配”忽视需求差异和可持续性；D项政府与市场的分工属于治理机制问题，并非题干所问的基本原则。教材对应「保障和改善民生的基本原则」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-21","type":"single","number":21,"originalNumber":"21","stem":"建设（ ）是坚持以人民为中心的发展思想在国家安全领域的生动体现。","options":["平安中国","法治中国","健康中国","美丽中国"],"answer":["A"],"explanation":{"reason":"平安是人民幸福安康的基本要求，建设平安中国直接服务于维护人民安全和社会安定，故选A项。B项法治中国着重建设法治国家、法治政府、法治社会，是维护安全的重要制度保障；C项健康中国侧重公共卫生和人民健康；D项美丽中国侧重生态环境与宜居家园。后三项同样体现人民利益，但分别属于法治、健康和生态建设领域，并非本题指定的国家安全领域概括。教材对应「平安中国建设与人民安全」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-22","type":"single","number":22,"originalNumber":"22","stem":"“人民至上、生命至上”的理念，在抗击新冠疫情中得到了充分体现，这反映了（ ）。","options":["中国共产党的领导是中国特色社会主义最本质的特征","以人民为中心的价值追求","社会主义制度的优越性","以上都是"],"answer":["D"],"explanation":{"reason":"抗击新冠疫情中坚持人民至上、生命至上，既体现以人民为中心的价值立场，也体现党的领导和制度组织动员能力，因此D项“以上都是”涵盖前三项。A项党的领导提供统筹决策和组织保障；B项把人民生命安全和身体健康放在重要位置，直接体现人民中心；C项社会主义制度的组织协调与资源调配能力，是相关实践的制度条件。三项分别涉及政治领导、价值取向和制度支撑。教材对应「人民至上生命至上的实践体现」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-23","type":"single","number":23,"originalNumber":"23","stem":"坚持人民主体地位，必须发展（ ）民主。","options":["全过程人民","选举","协商","基层"],"answer":["A"],"explanation":{"reason":"全过程人民民主是社会主义民主政治的本质属性，贯穿民主选举、协商、决策、管理、监督等环节，因此A项填入后构成规范表述。B项选举民主通过选举实现人民政治参与，是全过程人民民主的一种形式；C项协商民主强调充分商量与广泛协商，是其重要实现方式；D项基层民主侧重基层治理中的直接参与，属于实现民主的具体领域。后三项不能替代对全过程的整体概括。教材对应「全过程人民民主的内涵」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-24","type":"single","number":24,"originalNumber":"24","stem":"走好新时代群众路线，要求党员干部要（ ）。","options":["深入基层、深入群众","坐在办公室听汇报","依靠网络了解民意","召开大会传达精神"],"answer":["A"],"explanation":{"reason":"走好新时代群众路线必须深入基层、深入群众，面对面了解实际需求并推动解决问题，所以选A项。B项仅坐在办公室听汇报，容易脱离基层真实情况；C项运用网络了解民意是有益的补充渠道，但只靠网络难以替代实地调查和直接联系群众；D项召开大会传达精神属于组织宣传的方式，也不能代替深入群众、回应诉求。教材对应「新时代群众路线的实践要求」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-25","type":"single","number":25,"originalNumber":"25","stem":"习近平总书记指出：“江山就是人民，人民就是江山。”这一论断深刻揭示了（ ）。","options":["党与人民生死与共、休戚与共的血肉联系","国家政权与人民利益的一致性","党的执政基础在人民","以上都是"],"answer":["D"],"explanation":{"reason":"“江山就是人民，人民就是江山”阐明党执政与人民利益不可分割的关系，因此D项“以上都是”概括前三项。A项强调党同人民生死与共、休戚与共的血肉联系，是这一论断的政治情感基础；B项强调政权建设和维护必须体现人民利益，而非把政权当作少数人的私产；C项说明党的执政基础在人民，守住民心关系长期执政。三项分别从党群关系、政权价值和执政根基解释这一论断。教材对应「江山就是人民人民就是江山」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-26","type":"single","number":26,"originalNumber":"26","stem":"从“脱贫攻坚”到“乡村振兴”，党始终把（ ）作为工作的重中之重。","options":["解决“三农”问题","城市发展","工业现代化","科技创新"],"answer":["A"],"explanation":{"reason":"解决好农业、农村、农民问题始终是全党工作重中之重，脱贫攻坚与乡村振兴衔接体现了这一战略重视，故选A项。B项城市发展关系城镇化与公共服务建设，但不能替代“三农”工作的特殊地位；C项工业现代化是推进现代化的重要内容，属于产业发展的另一领域；D项科技创新是推动高质量发展的关键动力，也可赋能农业农村，却不是题干所问的工作对象。教材对应「三农工作与乡村振兴」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-27","type":"single","number":27,"originalNumber":"27","stem":"坚持以人民为中心的发展思想，要求我们在推动高质量发展中（ ）。","options":["更加注重共同富裕","更加注重效率优先","更加注重资本扩张","更加注重规模扩大"],"answer":["A"],"explanation":{"reason":"高质量发展要不断满足人民日益增长的美好生活需要，并推动发展成果更加公平惠及全体人民，因此A项更加注重共同富裕符合题意。B项效率提升具有意义，但只讲“效率优先”难以完整回应公平与共享；C项资本扩张是可能的经济活动，不应成为以人民为中心的发展目的；D项规模扩大重视数量而非质量、效益和人民获得感。应以共同富裕衡量高质量发展的价值取向。教材对应「高质量发展与共同富裕」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-28","type":"single","number":28,"originalNumber":"28","stem":"在推进共同富裕的过程中，要正确处理（ ）的关系。","options":["效率和公平","发展和安全","政府和市场","城市和乡村"],"answer":["A"],"explanation":{"reason":"正确答案为A。推进共同富裕需要兼顾发展效率与分配公平，在提高发展质量的同时维护社会公平；B项发展和安全、C项政府和市场、D项城市和乡村都是重要关系，但不是本题所问共同富裕进程中的这一核心关系。教材对应「共同富裕中的效率与公平」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-29","type":"single","number":29,"originalNumber":"29","stem":"新时代坚持以人民为中心，必须把（ ）作为根本目的。","options":["促进人的全面发展","实现经济增长","维护社会稳定","增强国际竞争力"],"answer":["A"],"explanation":{"reason":"以人民为中心的发展思想把促进人的全面发展作为根本目的，强调人的生活、能力、权利和精神世界的全面提升，因此选A项。B项实现经济增长是促进全面发展的重要条件，并非最终目的；C项维护社会稳定为人民生活与发展提供必要环境；D项增强国际竞争力关系国家发展能力与外部地位。后三项均可服务于人的全面发展，但不能取代这一价值目标。教材对应「人的全面发展与以人民为中心」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-single-30","type":"single","number":30,"originalNumber":"30","stem":"从“物质文化需要”到“美好生活需要”，这一表述的变化反映了（ ）。","options":["我国经济社会发展水平的显著提高","人民需求层次的不断提升","党对人民需求认识的深化","以上都是"],"answer":["D"],"explanation":{"reason":"从“物质文化需要”到“美好生活需要”的表述变化，反映经济社会发展、人民需求拓展与党对主要矛盾认识深化，因此选D项“以上都是”。A项发展水平提高，为需求升级创造现实条件；B项人民需求从基本物质文化领域扩展到民主、法治、公平、环境等方面；C项党的理论认识根据社会实际变化作出新的概括。三项分别说明客观基础、需求变化和理论认识，相互补充。教材对应「社会主要矛盾变化与人民美好生活需要」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-01","type":"multiple","number":31,"originalNumber":"31","stem":"坚持以人民为中心的发展思想，必须坚持（ ）。","options":["人民主体地位","人民利益至上","人民当家作主","人民共享发展成果"],"answer":["A","B","C","D"],"explanation":{"reason":"以人民为中心要求人民成为发展的主体、价值尺度、政治生活主体和成果分享者。A项人民主体地位强调依靠人民创造历史；B项人民利益至上要求发展决策维护根本利益；C项人民当家作主体现人民依法参与国家和社会治理的政治权利；D项人民共享发展成果体现发展的归宿。四项分别对应主体、利益、民主和共享维度，均属于以人民为中心的发展思想。教材对应「以人民为中心的发展思想的基本要求」。"},"note":"","origin":"原网站习思想题库 · 第4章","topicId":"topic-4"},{"id":"xx-ch4-multi-02","type":"multiple","number":32,"originalNumber":"32","stem":"群众路线的基本内容包括（ ）。","options":["一切为了群众","一切依靠群众","从群众中来","到群众中去"],"answer":["A","B","C","D"],"explanation":{"reason":"
